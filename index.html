    menuBtn(g,back,VW/2+(PORT?110:120)*s,VH-22*s,Math.min(120*s,VW*.28),34*s,()=>{
      G.faceOffer=0; G.packSel=null;
      G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
    });
  } else if(canEquip){
    menuBtn(g,'Equip',VW/2-(PORT?70:80)*s,VH-22*s,Math.min(150*s,VW*.34),34*s,()=>{
      if(wornSlotOf(G.packSel)) unequipPackSlot(wornSlotOf(G.packSel));
      else equipPackItem(G.packSel);
      G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
      G.faceOffer=0;
    });
    menuBtn(g,back,VW/2+(PORT?70:80)*s,VH-22*s,Math.min(150*s,VW*.34),34*s,()=>{
      G.faceOffer=0; G.packSel=null;
      G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
    });
  } else if(canTake){
    menuBtn(g,'Take kit',VW/2-(PORT?70:80)*s,VH-22*s,Math.min(150*s,VW*.34),34*s,()=>takeGhostKitToMacar());
    menuBtn(g,back,VW/2+(PORT?70:80)*s,VH-22*s,Math.min(150*s,VW*.34),34*s,()=>{
      G.faceOffer=0; G.packSel=null;
      G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
    });
  } else {
    menuBtn(g,back,VW/2,VH-22*s,Math.min(230*s,VW*.56),34*s,()=>{
      G.faceOffer=0; G.packSel=null;
      G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
    });
  }
}

function wareCostGp(r){
  if(r.gp!=null) return r.gp;
  const c=r.cost||{};
  return (c.gp||0)+(c.sp||0)*0.1+(c.cp||0)*0.01+(c.ep||0)*0.5+(c.pp||0)*5;
}
function warePriceText(r){
  if(r.price) return r.price;
  const c=r.cost||{};
  if(c.cp) return c.cp+' CP';
  if(c.sp) return c.sp+' SP';
  if(c.gp) return c.gp+' GP';
  if(r.gp!=null) return r.gp+' GP';
  return '';
}
function gnomeWares(){
  return [
    {t:'Torch',info:'Pitch and pine. Five copper.',cost:{cp:5},price:'5 CP',fn:()=>addToPack('macar','torches',1)},
    {t:'Rations',info:'Travel bread and hard cheese. Ten gold.',cost:{gp:10},price:'10 GP',fn:()=>addToPack('macar','rations',1)},
    {t:'10 Crossbow bolts',info:'Ten quarrels. Ten silver for the bundle.',cost:{sp:10},price:'10 SP',fn:()=>addToPack('macar','ammo',10)}
  ];
}

  menuBtn(g,'Back',VW/2,VH-22*s,Math.min(220*s,VW*.56),34*s,()=>leaveCraft());

function drawPause(g){

  const maxW=VW*0.92; let ky=VH*.255;

    if(g.measureText(next).width>maxW && line){ g.fillText(line,VW/2,ky); ky+=14*s; line=w; }
    else line=next;
    if(i===words.length-1 && line){ g.fillText(line,VW/2,ky); ky+=14*s; }
  });
  g.font='600 '+(10*s)+'px "Trebuchet MS",sans-serif';
  g.fillStyle='rgba(160,140,110,0.7)';
  g.fillText(musicNowLabel(),VW/2, ky+8*s);
  g.textAlign='left';
  const top=Math.min(VH*.42, ky+24*s);
  const gap=PORT?0.075:0.078;
  menuBtn(g,'Resume',VW/2,top,Math.min(230*s,VW*.66),36*s,()=>{G.paused=false;});
  menuBtn(g,'Save game',VW/2,top+VH*gap,Math.min(230*s,VW*.66),36*s,()=>writeGameSave(), false, SPR.icon_save);
  menuBtn(g,'Effects: '+gfxLabel(),VW/2,top+VH*gap*2,Math.min(230*s,VW*.66),34*s,()=>{cycleGfx();});
  menuBtn(g,'Render passes',VW/2,top+VH*gap*3,Math.min(230*s,VW*.66),34*s,()=>{ if(typeof toggleDiagPanel==='function') toggleDiagPanel(); });
  menuBtn(g,'Restart chapter',VW/2,top+VH*gap*4,Math.min(230*s,VW*.66),34*s,()=>{G.paused=false;startChapter(G.ch);});
  menuBtn(g,'Chapters',VW/2,top+VH*gap*5,Math.min(230*s,VW*.66),34*s,()=>{G.paused=false;G.scene='chapters';});
  menuBtn(g,'Credits',VW/2,top+VH*gap*6,Math.min(230*s,VW*.66),34*s,()=>openCredits('pause'));
}

/* ---------------------------- tap resolution ---------------------------- */
function resolveTaps(){
  while(IN.taps.length){
    const t=IN.taps.shift();
    if(G.sleepShow) continue;
    if(G.scene==='play'&&!G.paused){
      if(promptBtn&&t.x>=promptBtn.x&&t.x<=promptBtn.x+promptBtn.w&&t.y>=promptBtn.y&&t.y<=promptBtn.y+promptBtn.h){
        fire('use'); continue; }
      const p=player(); if(!p) continue;
      if(throwBtn&&t.x>throwBtn.x&&t.x<throwBtn.x+throwBtn.w&&t.y>throwBtn.y&&t.y<throwBtn.y+throwBtn.h){
        if(refuseAttack(p)) continue;
        cds.bomb=ABIL.find(a=>a.key==='bomb').cd; throwBomb(); continue; }
      const w=s2w(t.x,t.y+22*ZOOM);
      if(G.aim){ const d=dist(p,w), R=8;
        G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y};
        continue; }
      const bound=G.ents.find(e=>e.name==='Noz'&&e.tied&&!e.dead);
      if(bound && dist(p,bound)<2.2 && dist(bound,w)<1.6){ fire('use'); continue; }
      const foe=G.ents.find(e=>e.team==='foe'&&!e.dead&&dist(e,w)<1.1);
      const pile=(G.loot||[]).find(q=>!q.gone&&dist(q,w)<0.95);
      const body=G.ents.find(e=>isLootableBody(e)&&!e.looted&&dist(e,w)<1.85);
      if(pile && (!foe || dist(pile,w)<=dist(foe,w)) && (!body || dist(pile,w)<=dist(body,w))){
        if(dist(p,pile)<1.5) takeLoot(pile);
        else { p.dest={x:pile.x,y:pile.y,loot:pile.id}; p.stuck=0; p.lastD=undefined; }
        continue;
      }
      if(body && (!foe || dist(body,w)<=dist(foe,w))){
        if(dist(p,body)<1.85) lootNearbyCorpses(p,1.85);
        else { p.dest={x:body.x,y:body.y,corpse:body.id}; p.stuck=0; p.lastD=undefined; }
        continue;
      }
      if(foe){ p.dest={x:foe.x,y:foe.y,foe:foe.id}; p.stuck=0; p.lastD=undefined; continue; }
      const dst=nearestWalk(w.x,w.y,p);
      if(dst){ p.dest={x:dst.x,y:dst.y}; p.stuck=0; p.lastD=undefined; }
      continue;
    }
    if(G.talk){
      const hit=(UI.talkHits||[]).find(z=>t.x>=z.x&&t.x<=z.x+z.w&&t.y>=z.y&&t.y<=z.y+z.h);
      if(hit) pickTalk(hit.i);
      continue;
    }
    for(const h of menuHits) if(t.x>h.x&&t.x<h.x+h.w&&t.y>h.y&&t.y<h.y+h.h){ h.fn(); break; }
  }
}

/* ---------------------------- loop ---------------------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05); G.t+=dt;
  tickGfx(dt);
  const holdingWorld=G.scene==='play' && !worldArtReady(G.ch);
  if(G.hitstop>0) G.hitstop-=dt; else if(!holdingWorld) update(dt);
  tryEnterPlay();
  syncMusic();
  render(); resolveTaps();
  requestAnimationFrame(loop);
}
resize();
bakeTextures(PAL.mine);
loadSprites(()=>{});
if(window.CraftingEngine) CraftingEngine.load('src/crafting/recipes.json');
try{
  if(/play/.test((location.hash||'')+(location.search||''))) {
    startChapter(1);
    G._wantPlay=1;
    if(!tryEnterPlay()) G.introT=99;
    const fallen=(G.ents||[]).filter(e=>e.crushed).map(e=>e.name);
    document.title='KIN '+fallen.length+': '+fallen.join(', ');
  }
}catch(e){ console.error(e); document.title='START ERR '+e; }
render();
requestAnimationFrame(loop);

/* ===================== DIAGNOSTIC OVERLAY (pause / ?diag=1) ===============
   Pure DOM, composited by the browser OUTSIDE the canvas. The old ⚑ button
   lived at bottom-left on top of the movement stick; it is not drawn in play.
   Open from Pause → Render passes, or load with ?diag=1. */
let toggleDiagPanel=function(){};
(function(){
  const PASSES=[
    ['world','World tiles'],['lighting','Lighting (multiply)'],
    ['godrays','God rays'],['bloom','Bloom (lighter x2)'],
    ['memshade','Memory shade'],['beyond','Beyond mask'],
    ['atmos','Atmosphere'],['floaters','Floaters'],
    ['grain','Film grain (overlay)'],['hurt','Hurt vignette'],
    ['flash','Flash'],['shake','Screen shake'],['hud','HUD']
  ];
  const css=document.createElement('style');
  css.textContent=
  '#dgPanel{position:fixed;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));'+
  'bottom:max(8px,env(safe-area-inset-bottom));z-index:99999;display:none;'+
  'background:rgba(13,10,8,.95);border:2px solid #6b4d28;border-radius:10px;padding:10px;'+
  'color:#e8d9bd;font:12px/1.35 ui-monospace,monospace;max-height:70vh;overflow:auto;'+
  'pointer-events:auto}'+
  '#dgPanel h4{margin:0 0 6px;color:#ffcf7a;font-size:12px;letter-spacing:.08em}'+
  '#dgRead{white-space:pre;color:#9fd6a0;margin-bottom:8px;font-size:11px}'+
  '#dgPanel label{display:flex;align-items:center;gap:8px;padding:5px 2px;'+
  'border-bottom:1px solid #2a1f15}'+
  '#dgPanel input{width:18px;height:18px;accent-color:#c8912f}'+
  '#dgRow{display:flex;gap:6px;margin-top:8px}'+
  '#dgPanel button{flex:1;background:#241a12;color:#ffcf7a;border:1px solid #6b4d28;'+
  'border-radius:6px;padding:8px;font:600 12px sans-serif;min-height:44px}';
  document.head.appendChild(css);

  const pan=document.createElement('div'); pan.id='dgPanel';
  pan.innerHTML='<h4>RENDER PASS DIAGNOSTIC</h4><div id="dgRead"></div>';
  document.body.appendChild(pan);

  const KEYS=PASSES.map(p=>p[0]).concat(['smooth','dpr2']);
  const mk=(key,label,after)=>{
    const l=document.createElement('label');
    const i=document.createElement('input'); i.type='checkbox'; i.checked=!!DIAG[key];
    i.addEventListener('change',()=>{ DIAG[key]=i.checked?1:0; if(after) after(); });
    l.appendChild(i); l.appendChild(document.createTextNode(label));
    pan.appendChild(l);
  };
  PASSES.forEach(p=>mk(p[0],p[1]));
  mk('smooth','Image smoothing',function(){resize(true);});
  mk('dpr2','DPR 2 (sharper, slower)',function(){resize(true);});

  const row=document.createElement('div'); row.id='dgRow';
  const bAll=document.createElement('button'); bAll.textContent='All on';
  const bMin=document.createElement('button'); bMin.textContent='World only';
  const bClose=document.createElement('button'); bClose.textContent='Close';
  row.appendChild(bAll); row.appendChild(bMin); row.appendChild(bClose); pan.appendChild(row);
  const sync=function(){
    const ins=pan.querySelectorAll('input');
    for(let n=0;n<ins.length;n++) ins[n].checked=!!DIAG[KEYS[n]];
  };
  bAll.addEventListener('click',function(){
    PASSES.forEach(function(p){DIAG[p[0]]=1;}); DIAG.smooth=1; sync(); resize(true);});
  bMin.addEventListener('click',function(){
    PASSES.forEach(function(p){DIAG[p[0]]=0;}); DIAG.world=1; DIAG.hud=1; sync();});
  toggleDiagPanel=function(force){
    const on=force===true?true:force===false?false:pan.style.display!=='block';
    pan.style.display=on?'block':'none';
  };
  bClose.addEventListener('click',function(){ toggleDiagPanel(false); });

  const wantDiag=/[?&#]diag=1\b/.test((location.search||'')+(location.hash||''));
  if(wantDiag) toggleDiagPanel(true);

  const read=document.getElementById('dgRead');
  setInterval(function(){
    if(pan.style.display!=='block') return;
    read.textContent=
      'device dpr '+(window.devicePixelRatio||1).toFixed(3)+'  using '+DPR+'\n'+
      'css    '+VW+' x '+VH+'\n'+
      'canvas '+cv.width+' x '+cv.height+'\n'+
      'mode   '+GFX_MODE+'   quality '+QUALITY+'\n'+
      'frame  '+FRAME_MS.toFixed(1)+' ms  ~'+(1000/Math.max(1,FRAME_MS)).toFixed(0)+' fps\n'+
      'tile   '+TW+' x '+TH+'\n'+
      (PHONE_GFX?'phone-safe: HD tiles + 1:1 light, no tear/bloom/grain':'desktop full fx');
  },250);
})();
</script>
