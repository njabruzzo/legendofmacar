function rollDmgScroll(){ const r=pickRange(DMG_SCROLL); return magItem({cat:'Scroll',n:r.n,d:r.d,k:r.k,cursed:r.cursed}); }
function rollDmgRing(){ const r=pickRange(DMG_RING); return magItem({cat:'Ring',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed,charges:r.charges}); }
function rollDmgWand(){ const r=pickRange(DMG_WAND); return magItem({cat:'Rod/Staff/Wand',n:r.n,d:r.d,k:r.k,plus:r.plus,charges:r.charges||20,cursed:r.cursed}); }
function rollDmgArmor(){ const r=pickRange(DMG_ARMOR); return magItem({cat:'Armor/Shield',n:r.n,d:r.d,k:r.k,plus:r.plus,missilePlus:r.missilePlus,cursed:r.cursed}); }
function rollDmgSword(){ const r=pickRange(DMG_SWORD); return magItem({cat:'Sword',n:r.n,d:r.d,k:r.k,plus:r.plus,vs:r.vs,vsPlus:r.vsPlus,cursed:r.cursed}); }
function rollDmgWeapon(){ const r=pickRange(DMG_WEAP); return magItem({cat:'Weapon',n:r.n,d:r.d,k:r.k,plus:r.plus,vs:r.vs,vsPlus:r.vsPlus,cursed:r.cursed}); }
function rollDmgMisc(){
  const map=d100();
  const table=map<=15?DMG_MISC_A:map<=30?DMG_MISC_B:map<=45?DMG_MISC_C:map<=60?DMG_MISC_D:DMG_MISC_E;
  const r=pickRange(table);
  return magItem({cat:'Miscellaneous',n:r.n,d:r.d,k:r.k,plus:r.plus,charges:r.charges,cursed:r.cursed});
}

function magicCategory(kind){
  if(kind==='potion') return 'potion';
  if(kind==='scroll') return 'scroll';
  if(kind==='saw'){
    const r=d100();
    if(r<=40) return 'sword';
    if(r<=70) return 'armor';
    return 'weapon';
  }
  if(kind==='anynos'){
    const r=d100();
    if(r<=25) return 'potion';
    if(r<=45) return 'scroll';
    if(r<=55) return 'ring';
    if(r<=65) return 'wand';
    if(r<=72) return 'misc';
    if(r<=85) return 'armor';
    return 'weapon';
  }
  const r=d100();
  if(r<=20) return 'potion';
  if(r<=35) return 'scroll';
  if(r<=40) return 'ring';
  if(r<=45) return 'wand';
  if(r<=48) return 'misc';
  if(r<=55) return 'armor';
  if(r<=75) return 'sword';
  return 'weapon';
}
function rollMagicItem(kind){
  const cat=magicCategory(kind);
  if(cat==='potion'){
    const p=rollPotion();
    return {kind:'potion', potion:p, n:p.n, d:p.d, cat:'Potion'};
  }
  let it;
  if(cat==='scroll') it=rollDmgScroll();
  else if(cat==='ring') it=rollDmgRing();
  else if(cat==='wand') it=rollDmgWand();
  else if(cat==='misc') it=rollDmgMisc();
  else if(cat==='armor') it=rollDmgArmor();
  else if(cat==='sword') it=rollDmgSword();
  else it=rollDmgWeapon();
  return {kind:'magic', item:it, n:it.n, d:it.d, cat:it.cat};
}
function extraMagicForKind(kind){
  const extra=[];
  if(kind==='anyp'||kind==='anyps') extra.push('potion');
  if(kind==='anys'||kind==='anyps') extra.push('scroll');
  return extra;
}

function applyEquipped(){
  ensureEquippedShape();
  const eq=G.equipped;
  eq.weapon=eq.primary||eq.weapon;
  eq.armor=eq.chest||eq.armor;
  Object.values(G.gear||{}).forEach(g=>{ g.magicAtk=0; g.magicAc=0; });
  const mac=G.gear&&G.gear.macar;
  const wep=eq.primary||eq.weapon;
  if(wep&&mac){
    mac.magicAtk=wep.plus||0;
    if(wep.cursed) mac.magicAtk=wep.plus|| -1;
  }
  const ES=typeof EquipmentSlots!=='undefined'?EquipmentSlots:null;
  const acPlus=ES&&ES.magicAcBonus?ES.magicAcBonus(eq):
    ((eq.armor&&eq.armor.plus)||0)+((eq.ring&&eq.ring.plus)||0);
  Object.values(G.gear||{}).forEach(g=>{ g.magicAc=acPlus; });
  const macE=(G.ents||[]).find(e=>e&&e.hero);
  if(macE){
    macE.dice=(wep&&wep.dice)||'1d8';
    macE.ac=partyAC(macE);
    if(wep && /flame tongue/i.test(wep.n||'')) macE.glow=macE.glow||'#ffb45c';
    if(macE.baseCd==null) macE.baseCd=macE.cd;
    if(!(macE.buff>0) && typeof wornAttackCd==='function') macE.cd=wornAttackCd(macE);
    if(typeof applyHoverFlags==='function') applyHoverFlags(macE);
  }
}
function cancelOneMagicItem(e){
  const t=typeof nearestFoe==='function'?nearestFoe(e,2):null;
  if(t && t.gear && (t.gear.magicAtk||t.gear.magicAc)){
    t.gear.magicAtk=0; t.gear.magicAc=0;
    say('The rod drinks the foe\'s enchantment.','#7ad0ff');
    return;
  }
  const eq=G.equipped||{};
  const bag=(typeof packOf==='function'&&packOf('macar')||{}).magic||[];
  let worst=null, worstPlus=99;
  const pool=[];
  Object.keys(eq).forEach(k=>{ if(eq[k] && typeof eq[k]==='object') pool.push(eq[k]); });
  bag.forEach(it=>pool.push(it));
  pool.forEach(it=>{
    if(!it||!it.cursed) return;
    const p=it.plus!=null?it.plus:0;
    if(!worst || p<worstPlus){ worst=it; worstPlus=p; }
  });
  if(worst){
    worst.plus=0;
    if(worst.dexPlus) worst.dexPlus=0;
    worst.charges=0;
    say('The rod drains '+worst.n+'.','#7ad0ff');
    return;
  }
  say('The rod finds no magic to drink.','#c9b895');
}
function useWandByName(it, e){
  const n=String((it&&it.n)||'');
  if(/Staff of Curing/i.test(n)){
    applyHeal(e, 18);
    clearPoison(e);
    return 'cure';
  }
  if(/Rod of Cancellation/i.test(n)){
    cancelOneMagicItem(e);
    return 'cancel';
  }
  if(/Enemy Detection/i.test(n)){
    const t=typeof nearestFoe==='function'?nearestFoe(e,8):null;
    say(t?('The wand points: '+(t.name||'a foe')+'.'):'The wand finds no hostile mind nearby.','#7ad0ff');
    return 'detect';
  }
  if(/Magic Detection/i.test(n)){
    const pile=(G.loot||[]).find(p=>p&&!p.gone&&((p.items||[]).some(x=>x&&(x.plus||x.k==='misc'||x.k==='ring'||x.cat==='Ring'))));
    say(pile?'The wand glows near magic.':'The wand is dark. No magic nearby.','#7ad0ff');
    return 'detect';
  }
  if(/Secret Door|Trap Detection/i.test(n)){
    const L=G.lvl||{};
    const sec=(L.secrets||[]).find(s=>s&&!s.open);
    const trap=(G.props||[]).find(p=>p&&p.k==='trap');
    if(sec){ sec.hinted=1; say('The wand pulses at a hidden seam.','#7ad0ff'); }
    else if(trap) say('The wand pulses at a trap.','#7ad0ff');
    else say('The wand is still. No secret or trap nearby.','#7ad0ff');
    return 'detect';
  }
  if(/Paralyzation|Wand of Fear/i.test(n)){
    const t=typeof nearestFoe==='function'?nearestFoe(e,8):null;
    if(t){ t.stun=Math.max(t.stun||0, 3.2); say(it.n+' stuns '+(t.name||'a foe')+'.','#7ad0ff'); }
    else say(it.n+' finds no foe in reach.','#7ad0ff');
    return 'stun';
  }
  if(/Illumination/i.test(n)){
    if(e){ e.trueSee=Math.max(e.trueSee||0, 20); e.glow=e.glow||'#fff4c8'; }
    say(it.n+' sheds light.','#7ad0ff');
    return 'light';
  }
  return 'zap';
}
function useMagicItem(it, e){
  e=e||player();
  if(!it) return;
  say(it.n+': '+it.d, '#ffd27a');
  if(it.cursed){
    const ES=typeof EquipmentSlots!=='undefined'?EquipmentSlots:null;
    if((it.k==='cursed'&&/Armor|Shield|Sword|Weapon/.test(it.cat||'')) || (ES&&ES.isEquippable&&ES.isEquippable(it))){
      equipPackItem(it, {silent:true});
      say('The curse binds. It will not be set aside.','#ff6a5a');
      return;
    }
    if(e){ e.stun=Math.max(e.stun||0,2.2); damage(e, ADD_SCALE*4, '#ff6a5a'); }
    return;
  }
  if(isEquipWeapon(it) || it.k==='weapon'||it.cat==='Sword'||it.cat==='Weapon'){
    wieldWeapon(it); return;
  }
  if(!(it.k==='wand'||it.cat==='Rod/Staff/Wand') && (isEquipArmor(it) || it.k==='armor'||it.cat==='Armor/Shield' || (typeof EquipmentSlots!=='undefined' && EquipmentSlots.isEquippable(it)))){
    const slot=equipPackItem(it, {silent:true});
    say((slot==='primary'||slot==='secondary'?'Wielded: ':'Donned: ')+it.n+'.','#cfe3ff'); return;
  }
  if(it.k==='ring'||it.k==='dex'||it.cat==='Ring'){
    equipPackItem(it, {silent:true});
    G.equipped.ring=it;
    applyEquipped();
    if(it.k==='regen'&&e) e.potionRegen=Math.max(e.potionRegen||0, 999);
    if(it.k==='invis'&&e){ e.invis=30; e.aggro=2; }
    say('Worn: '+it.n+'.','#e0d2ff'); return;
  }
  if(it.k==='wand'||it.cat==='Rod/Staff/Wand'){
    G.equipped.wand=it;
    if(e&&it.charges){
      const mode=typeof useWandByName==='function'?useWandByName(it, e):'zap';
      if(mode==='zap'){
        const t=nearestFoe(e,8);
        const dmg=rollDice(6,6,0)*ADD_SCALE;
        if(t){ damage(t, dmg, '#7ad0ff', {magic:1,kind:'wand',n:it.n}); burst(t.x,t.y,'#7ad0ff',16,3); }
      }
      it.charges=Math.max(0,(it.charges||1)-1);
      say(it.n+' ('+it.charges+' charges left).','#7ad0ff');
    }
    return;
  }
  if(it.k==='heal'){
    if(e){ applyHeal(e, 18); clearPoison(e); }
    return 'spent';
  }
  if(/Ointment|Curing/.test(it.n)){
    if(e){ applyHeal(e, 18); clearPoison(e); }
    return;
  }
  if(it.k==='scroll'||it.k==='prot'){
    if(e){
      if(/heal|cure/i.test(String(it.n||'')+' '+String(it.d||''))){
        applyHeal(e, 18); clearPoison(e);
      } else {
        e.guardT=Math.max(e.guardT||0, 8); e.mr=1; applyHeal(e, 8);
      }
    }
    say('The scroll is read and the ink fades.','#e0d2ff');
    return 'spent';
  }
  if(it.k==='ammo'){
    if(/javelin of lightning/i.test(it.n||'')){
      const t=e?nearestFoe(e,8):null;
      const dmg=rollDice(6,6,0)*ADD_SCALE;
      if(t){ damage(t, dmg, '#7ad0ff', {magic:1,kind:'wand',n:it.n}); burst(t.x,t.y,'#7ad0ff',16,3); }
      say(it.n+' becomes a lightning bolt.','#7ad0ff');
      return 'spent';
    }
    if(/slaying/i.test(it.n||'')){
      const t=e?nearestFoe(e,8):null;
      if(!t){ say(it.n+' finds no foe.','#c9b895'); return; }
      const type=typeof slayingTypeFromName==='function'?slayingTypeFromName(it.n):'';
      if(type && typeof foeMatchesSlayingType==='function' && foeMatchesSlayingType(t, type)){
        t.hp=0;
        say(it.n+' slays the '+type+'.','#ff6a5a');
        damage(t, 1, '#ff6a5a', {magic:1,kind:'ammo',n:it.n});
      } else {
        const dmg=6*ADD_SCALE;
        damage(t, dmg, '#cfe3ff', {kind:'ammo',n:it.n});
        say(it.n+' flies as +6 vs '+(t.name||'the foe')+'.','#cfe3ff');
      }
      return 'spent';
    }
    if(typeof isPlusShotAmmo==='function' && isPlusShotAmmo(it)){
      say(it.n+' — nocked. The plus waits on the next shot.','#cfe3ff');
      return;
    }
    say(it.n+' stays packed.','#c9b895');
    return;
  }
  if(/bag of holding/i.test(it.n||'')){
    say('The bag opens extra room in the pack. Weight is a fraction of what it holds.','#cfe3ff');
    return;
  }
  if(it.k==='sense'){ if(e) e.trueSee=40; return; }
  if(e){ e.buff=Math.max(e.buff||0, 10); applyHeal(e, 6); }
}

function forageChance(){ return 40+(skillLvl('forage')-1)*8; }
function nearestShroom(e,r){ return nearestPlant(e,r); }
function nearestPlant(e,r){
  let best=null, bd=r||1.6;
  for(const pr of (G.props||[])){
    if(!isPlantKind(pr.k)) continue;
    const d=dist(e,pr);
    if(d<bd){ bd=d; best=pr; }
  }
  return best;
}
function forageHerbs(src){
  ensurePacks();
  const p=player();
  const patch=src&&isPlantKind(src.k)?src:null;
  const ch=forageChance()+(patch?25:0);
  const notice=d100();
  learn('forage',3);
  if(patch) patch.picked=(patch.picked||0)+1;
  const at=patch||src||p||{x:0,y:0};
  if(notice>ch){
    say('Herb Lore '+notice+' vs '+ch+'% — no plants worth taking.','#9a8a78');
    hint('Notice '+ch+'%. Then the herb table, then recover that herb.',3.4);
    return false;
  }
  const tbl=d30();
  const herb=HERBS[tbl-1]||HERBS[0];
  const find=d100();
  if(find>herb.diff){
    say(herb.n+' (table '+tbl+'/'+HERBS.length+'). Recover '+find+' vs '+herb.diff+'% — Macar cannot take this sample.','#c9a070');
    hint(herb.n+' was there, but the recover roll failed.',3.2);
    ftext(at.x,at.y,'no good','#c9a070');
    return false;
  }
  const pk=packOf('macar');
  pk.herbs[herb.n]=(pk.herbs[herb.n]||0)+1;
  syncPackTotals();
  say(herb.n+' (table '+tbl+'/'+HERBS.length+'). Recover '+find+' vs '+herb.diff+'%. You take it.','#6aff8a');
  ftext(at.x,at.y,herb.n,'#6aff8a');
  return true;
}

function chanceOk(pct){ return d100()<=pct; }
function rngAmt(a,b){ return a+ri(0,Math.max(0,b-a)); }
function addCoin(k,n){
  if(!G.coin) G.coin={cp:0,sp:0,ep:0,gp:0,pp:0};
  G.coin[k]=(G.coin[k]||0)+n;
}
function convertHoard(coins, gems, jew, magN, magKind, where, quiet){
  const notes=[];
  if(coins.cp){ addCoin('cp',coins.cp); const n=Math.min(6,Math.max(1,Math.round(coins.cp/1500))); gain('ironstone',n); notes.push(coins.cp+' cp'); }
  if(coins.sp){ addCoin('sp',coins.sp); const n=Math.min(6,Math.max(1,Math.round(coins.sp/1000))); gain('ironstone',n); notes.push(coins.sp+' sp'); }
  if(coins.ep){ addCoin('ep',coins.ep); const n=Math.min(5,Math.max(1,Math.round(coins.ep/600))); gain('deepsilver',n); notes.push(coins.ep+' ep'); }
  if(coins.gp){ addCoin('gp',coins.gp); const n=Math.min(6,Math.max(1,Math.round(coins.gp/700))); gain('deepsilver',n); notes.push(coins.gp+' gp'); }
  if(coins.pp){ addCoin('pp',coins.pp); const n=Math.min(4,Math.max(1,Math.round(coins.pp/200))); gain('starmetal',n); notes.push(coins.pp+' pp'); }
  if(gems){ gain(gems>=8?'starmetal':'deepsilver', Math.min(4,Math.max(1,Math.round(gems/8)))); notes.push(gems+' gems');
    giveGem({n:gems===1?'Gemstone':(gems+' gemstones'), gp:gems*50, d:'Cut stones from the take.'}, 1); }
  if(jew){ gain('silk', Math.min(4,Math.max(1,Math.round(jew/3)))); notes.push(jew+' jewelry');
    giveGem({n:jew===1?'Jewelry':(jew+' pieces of jewelry'), gp:jew*80, d:'Worked gold and silver.'}, 1); }
  const extras=extraMagicForKind(magKind);
  const rolls=magN+extras.length;
  let magGp=0;
  for(let i=0;i<rolls;i++){
    const kind=i<magN?(magKind||'any'):extras[i-magN];
    const got=rollMagicItem(kind);
    if(got.kind==='potion'){ givePotion(got.potion,1); notes.push('Potion: '+got.n); magGp+=got.potion.gp||got.potion.xp||0; }
    else { giveMagic(got.item,1); notes.push(got.cat+': '+got.n); magGp+=got.item.gp||got.item.xp||0; }
  }
  if(notes.length && !quiet){
    say(((where&&where.name)?where.name+' drops':'Treasure')+': '+notes.join(', ')+'.','#ffd27a');
    if(where&&where.x!=null) ftext(where.x, where.y-0.4, notes[0], '#ffd27a');
  }
  const gp=treasureGp(coins, gems, jew)+Math.round(magGp||0);
  if(gp) awardPartyXp(gp, 'Treasure ('+gp+' gp)', where);
  return notes;
}
function rollLair(letter){
  const T=LAIR[letter]; if(!T) return null;
  const coins={}; let gems=0,jew=0,magN=0,magKind='any';
  const coin= (key,row)=>{
    if(!row) return;
    if(chanceOk(row[0])) coins[key]=rngAmt(row[1],row[2])*(row[3]||1);
  };
  coin('cp',T.cp); coin('sp',T.sp); coin('ep',T.ep); coin('gp',T.gp); coin('pp',T.pp);
  if(T.gem&&chanceOk(T.gem[0])) gems=rngAmt(T.gem[1],T.gem[2]);
  if(T.jew&&chanceOk(T.jew[0])) jew=rngAmt(T.jew[1],T.jew[2]);
  if(T.mag&&chanceOk(T.mag[0])){ magN=T.mag[2]||1; magKind=T.mag[1]; }
  return {coins,gems,jew,magN,magKind};
}
function rollIndividual(letter){
  const coins={};
  if(letter==='J') coins.cp=rollDice(3,8,0);
  else if(letter==='K') coins.sp=rollDice(3,6,0);
  else if(letter==='L') coins.ep=rollDice(2,6,0);
  else if(letter==='M') coins.gp=rollDice(2,4,0);
  else if(letter==='N') coins.pp=rollDice(1,6,0);
  else if(letter==='O'){ coins.cp=rngAmt(10,40); coins.sp=rngAmt(10,30); }
  else if(letter==='P') coins.pp=rngAmt(1,20);
  else if(letter==='Q') return {coins:{},gems:chanceOk(50)?ri(1,4):0,jew:0,magN:0};
  else if(letter==='R') return {coins:{},gems:0,jew:chanceOk(50)?ri(2,8):0,magN:0};
  else if(letter==='S') return {coins:{},gems:0,jew:0,magN:chanceOk(40)?ri(1,8):0,magKind:'potion'};
  else if(letter==='T') return {coins:{},gems:0,jew:0,magN:chanceOk(50)?ri(1,4):0,magKind:'scroll'};
  else if(letter==='U'){
    let u=null;
    if(typeof SpiderLair!=='undefined'&&SpiderLair.rollTypeU)
      u=SpiderLair.rollTypeU({chanceOk:chanceOk, rngAmt:rngAmt});
    if(!u) u={coins:{}, gems:chanceOk(90)?rngAmt(2,16):0, jew:chanceOk(80)?rngAmt(1,6):0,
      magN:chanceOk(55)?1:0, magKind:'any'};
    u.coins=Object.assign({}, u.coins||{});
    /* DMG U coins — never an empty purse, even if a helper omitted them. */
    if(!(u.coins.cp>0)) u.coins.cp=rngAmt(10,80);
    if(!(u.coins.sp>0)) u.coins.sp=rngAmt(10,60);
    if(!(u.coins.gp>0)) u.coins.gp=rngAmt(5,30);
    return u;
  }
  else if(letter==='V'){
    return {coins:{}, gems:chanceOk(90)?rngAmt(10,80):0, jew:chanceOk(90)?rngAmt(5,40):0,
      magN:chanceOk(70)?3:0, magKind:'any'};
  }
  else if(letter==='X') return {coins:{},gems:0,jew:0,magN:chanceOk(60)?2:0,magKind:'potion'};
  else if(letter==='Y'){ if(chanceOk(70)) coins.gp=rollDice(2,6,0)*100; }
  else if(letter==='Z'){
    if(chanceOk(55)) coins.cp=rngAmt(300,1800);
    if(chanceOk(55)) coins.sp=rngAmt(300,1800);
    if(chanceOk(55)) coins.ep=rngAmt(200,1200);
    if(chanceOk(55)) coins.gp=rngAmt(300,2000);
    if(chanceOk(30)) coins.pp=rngAmt(100,600);
    return {coins, gems:chanceOk(50)?rngAmt(1,6):0, jew:chanceOk(50)?rngAmt(5,30):0,
      magN:chanceOk(50)?3:0, magKind:'any'};
  }
  else return null;
  return {coins,gems:0,jew:0,magN:0,magKind:'any'};
}
function hoardHasCoins(h){
  const c=(h&&h.coins)||{};
  return ['cp','sp','ep','gp','pp'].some(k=>(c[k]||0)>0);
}
function ensureKillCoins(h){
  if(hoardHasCoins(h)) return h;
  return mergeHoards(h, rollIndividual('J'));
}
function mergeHoards(a,b){
  if(!a) return b; if(!b) return a;
  const coins={};
  ['cp','sp','ep','gp','pp'].forEach(k=>{
    const n=(a.coins&&a.coins[k]||0)+(b.coins&&b.coins[k]||0);
    if(n) coins[k]=n;
  });
  return {coins, gems:(a.gems||0)+(b.gems||0), jew:(a.jew||0)+(b.jew||0),
    magN:(a.magN||0)+(b.magN||0), magKind:(a.magN?a.magKind:b.magKind)||'any'};
}
function treasureLetters(raw){
  return String(raw||'').split(/[,;\s+/]+/).map(s=>s.trim().toUpperCase())
    .filter(c=>c.length===1 && /[A-Z]/.test(c));
}
function rollTreasureSpec(raw){
  let hoard=null;
  treasureLetters(raw).forEach(c=>{
    const part=/[A-I]/.test(c)?rollLair(c):rollIndividual(c);
    if(part) hoard=mergeHoards(hoard, part);
  });
  return hoard;
}

function rollDungeonTreasure(level){
  const lv=Math.max(1, Math.min(8, (level|0)||1));
  const T=DUNGEON_TREASURE[lv]||DUNGEON_TREASURE[1];
  const coins={}; let gems=0,jew=0,magN=0,magKind='any';
  const coin=(key,row)=>{
    if(!row) return;
    if(chanceOk(row[0])) coins[key]=rngAmt(row[1],row[2])*(row[3]||1);
  };
  coin('cp',T.cp); coin('sp',T.sp); coin('ep',T.ep); coin('gp',T.gp); coin('pp',T.pp);
  if(T.gem&&chanceOk(T.gem[0])) gems=rngAmt(T.gem[1],T.gem[2]);
  if(T.jew&&chanceOk(T.jew[0])) jew=rngAmt(T.jew[1],T.jew[2]);
  if(T.mag&&chanceOk(T.mag[0])){ magN=T.mag[1]||1; magKind=T.mag[2]||'any'; }
  return {coins,gems,jew,magN,magKind};
}
function placeDungeonCache(x, y, level){
  const lv=level||((G.lvl&&G.lvl.n)||1);
  const pile=hoardToPile(rollDungeonTreasure(lv));
  if(!pile) return null;
  pile.label='Dungeon cache (level '+lv+')';
  pile.glow=pile.glow||'#ffd27a';
  spawnLoot(x, y, pile);
  return pile;
}
function applyHeal(e, n){
  if(!e||e.dead) return 0;
  const amt=Math.round(n*ADD_SCALE);
  e.hp=Math.min(e.maxhp, e.hp+amt);
  ftext(e.x,e.y,'+'+amt,'#e0c169',e.hero);
  burst(e.x,e.y,'#c9a24a',10,2);
  return amt;
}
function clearPoison(e){ e.poisonT=0; e._pt=0; e.slowT=0; }
function drinkPotion(p, e){
  e=e||player(); if(!e||!p) return;
  const k=p.k, lv=e.lvl||partyLevel();
  say(e.name+' drinks '+p.n+'.','#e0d2ff');
  if(k==='heal10') applyHeal(e,10);
  else if(k==='heal20') applyHeal(e,20);
  else if(k==='heal40') applyHeal(e,40);
  else if(k==='healall'){ e.hp=e.maxhp; applyHeal(e,1); say('Wounds close.','#ffe08a'); }
  else if(k==='antidote'){ clearPoison(e); say('The poison leaves.','#6aff8a'); }
  else if(k==='haste'){ e.buff=Math.max(e.buff||0, lv*0.6); e.cd=Math.max(.28,(e.cd||1)*0.5); e.sp=(e.baseSp||e.sp||3)*1.35; }
  else if(k==='invis'){ e.invis=lv*0.6; e.aggro=2; }
  else if(k==='invuln'){ e.guardT=Math.max(e.guardT||0, lv*0.6); }
  else if(k==='fly'){ e.sp=Math.max(e.sp,5.2); e.buff=Math.max(e.buff||0,8); e.fly=1; e.hover=1; e.flyPotion=1; }
  else if(k==='regen'||k==='fast'){ e.potionRegen=60; }
  else if(k==='str2'){ e.strMul=2; e.buff=Math.max(e.buff||0, lv*0.6); }
  else if(k==='str3'){ e.strMul=3; e.buff=Math.max(e.buff||0, lv*0.6); }
  else if(k==='vital'){ e.hp=Math.min(e.maxhp*2, e.hp+e.maxhp); e.maxhp=Math.round(e.maxhp*1.35); }
  else if(k==='stoneskin'){ e.stoneskin=4+ri(1,4); }
  else if(k==='guard'){ e.guardT=Math.max(e.guardT||0, lv); }
  else if(k==='mr'){ e.mr=1; }
  else if(k==='prot0'){ e.prot0=1; }
  else if(k==='life'){ G.ents.forEach(x=>{ if(x.team==='party'&&x.dead){ x.dead=0; x.crushed=0; x.prone=0; x.hp=Math.round(x.maxhp*.5); }}); say('The dead kin draw breath.','#ffe08a'); }
  else if(k==='gear'){
    if(e.gear){ e.gear.wd=e.gear.wmax; e.gear.ad=e.gear.amax; e.gear.wt=(e.gear.wt||0)+1; }
    say('The oil takes on the kit.','#cfe3ff');
  }
  else if(k==='atk'){
    const t=nearestFoe(e,7);
    if(t){ const dmg=rollExpr(k==='unused'?'1d20':'1d20')*ADD_SCALE; damage(t,dmg,'#ff8a3a'); }
    else applyHeal(e,8);
  }
  else if(k==='juice'){ e.juice=(e.juice||0)+1; }
  else if(k==='sense'||k==='see'){ e.trueSee=30; }
  else { e.buff=Math.max(e.buff||0,6); applyHeal(e,6); }
}
function useHerb(name, e){
  e=e||player(); const h=HERBS.find(x=>x.n===name); if(!h||!e) return;
  const pk=packOf(packOwner(e));
  if(!pk.herbs[name]) return;
  pk.herbs[name]--; if(pk.herbs[name]<=0) delete pk.herbs[name];
  syncPackTotals();
  say(e.name+' uses '+name+'.','#6aff8a');
  const k=h.k;
  if(k==='heal2') applyHeal(e,2);
  else if(k==='heal4') applyHeal(e,4);
  else if(k==='heal10') applyHeal(e,10);
  else if(k==='heal20') applyHeal(e,20);
  else if(k==='heal40') applyHeal(e,40);
  else if(k==='healall'){ e.hp=e.maxhp; applyHeal(e,1); }
  else if(k==='antidote'){ clearPoison(e); say('The toxin fades.','#6aff8a'); }
  else if(k==='haste'){ e.buff=3; e.cd=Math.max(.3,(e.cd||1)*0.5); e.sp=(e.baseSp||e.sp||3)*1.3; e.stun=Math.max(e.stun||0,0); e.afterHaste=5; }
  else if(k==='regen'||k==='tickheal'){ e.potionRegen=8; }
  else if(k==='light'){ e.glow='#c8fff0'; }

function resistSrcHay(src){

function isMagicalFireSrc(src){
  if(!isFireishSrc(src)) return false;

function isColdishSrc(src){
  return /cold|frost|ice/i.test(resistSrcHay(src));

function tryFindSecret(p, mode){

    // Active search: 1–4 in 6 (PHB dwarf sliding walls ~2/3). Focused wall search: 1–5.
    const need=mode==='focus'?5:4;

function foesVisible(){
  return G.ents.some(e=>e.team==='foe'&&!e.dead&&!e.npc&&tileVisible(e.x,e.y));
}
function kinCanAutoFight(e){
  /* Up party kin — including Book I ghosts — close on their own.
     Ghosts stay ghosts (sprite / rules). Crushed, sleeping, tied, dead do not fight. */
  return !!(e && e.team==='party' && !e.hero && !e.dead
    && !e.crushed && !e.sleeping && !e.tied && !e.hidden);
}
/* A foe is in the fight: visible in radius, fight already on, or adjacent to the party. */
function foeInTheFight(){
  const ents=G.ents||[];
  const party=ents.filter(z=>z.team==='party'&&!z.dead&&!z.crushed&&!z.sleeping);
  if(!party.length) return false;
  for(const o of ents){
    if(o.team!=='foe'||o.dead||o.npc) continue;
    let adj=false, near=false;
    for(const k of party){
      const d=dist(k,o);
      if(d<1.45) adj=true;
      if(d<7.2) near=true;
    }
    if(adj) return true;
    if(near && (G.fightOn || tileVisible(o.x,o.y))) return true;
  }
  return false;
}
function nearestFoe(e,maxd){ let b=null,bd=maxd||99;
  const party=e&&e.team==='party';
  for(const o of G.ents){
    if(o.team!=='foe'||o.dead) continue;
    if(party && !tileVisible(o.x,o.y)) continue;
    const d=dist(e,o); if(d<bd){bd=d;b=o;}
  } return b; }
function nearestAlly(e,maxd,hurt){ let b=null,bd=maxd||99;
  for(const o of G.ents){ if(o.team!=='party'||o.dead) continue; if(hurt&&o.hp>=o.maxhp*.7) continue;
    const d=dist(e,o); if(d<bd){bd=d;b=o;} } return b; }

/* ---------------------------- movement ---------------------------- */
function walk(x,y,e){ const L=G.lvl; if(!L) return false;
  if(startCaveInBlocks(x,y)) return false;
  const i=x|0,j=y|0; if(j<0||j>=L.h||i<0||i>=L.w) return false;
  const t=L.grid[j][i];
  if(t===0||t===3) return true;
  if(t===4) return !!(e && e.kind==='gnome');
  return false; }
/* South / SE / SW masonry: tan coping hangs ~0.10 onto the floor and the
   face billboard covers more. Living party boots stay this far off that
   edge. Not applied to N/W-only faces — halls stay full width on those sides. */
const WALL_FACE_CLEAR=0.72;
function needsWallFaceClear(e){
  return !!(e && (e.hero || e.team==='party') && !e.dead && !e.crushed && !e.hidden);
}
function wallFaceClear(x,y,e){
  if(!needsWallFaceClear(e)) return true;
  const L=G.lvl; if(!L||!L.grid) return true;
  const m=WALL_FACE_CLEAR;
  const ix=Math.floor(x), iy=Math.floor(y);
  const solid=(i,j)=>!!(L.grid[j]&&L.grid[j][i]===1);
  const south=solid(ix,iy+1), east=solid(ix+1,iy), west=solid(ix-1,iy);
  const se=solid(ix+1,iy+1), sw=solid(ix-1,iy+1);
  if(south && y>iy+1-m) return false;
  if(east && x>ix+1-m) return false;
  if(se && y>iy+1-m && x>ix+1-m) return false;
  if(sw && y>iy+1-m && x<ix+m) return false;
  if(west && south && x<ix+m) return false;
  return true;
}
function canBe(x,y,r,e){
  if(!walk(x,y,e)) return false;
  return walk(x+r,y,e)&&walk(x-r,y,e)&&walk(x,y+r,e)&&walk(x,y-r,e)&&
         walk(x+r*.7,y+r*.7,e)&&walk(x-r*.7,y-r*.7,e)&&walk(x+r*.7,y-r*.7,e)&&walk(x-r*.7,y+r*.7,e)&&
         wallFaceClear(x,y,e);
}
function moveStep(e,dx,dy,dt){
  const mul=typeof wornMoveMul==='function'?wornMoveMul(e):1;
  return {x:e.x+dx*dt*mul, y:e.y+dy*dt*mul};
}
function move(e,dx,dy,dt){
  const n=moveStep(e,dx,dy,dt); let moved=0;
  if(canBe(n.x,e.y,e.r,e)){ e.x=n.x; moved=1; }
  if(canBe(e.x,n.y,e.r,e)){ e.y=n.y; moved=1; }
  return moved;
}

const IN={stick:null,keys:{},taps:[]};
const UIBTN=[];
const UI={};

const HUDSKILLS=[

  {key:'wall', ico:'defend', label:'Defend'},

/* Rally is not a HUD verb (bar or More). Key 5 still fires the war-horn if remembered. */
const HUD_TAP=44;

function hitRect(h,x,y){ return !!(h && x>=h.x && x<=h.x+h.w && y>=h.y && y<=h.y+h.h); }

function safeInsets(){
  const cs=getComputedStyle(document.documentElement);
  const px=n=>{ const f=parseFloat(cs.getPropertyValue(n)); return Number.isFinite(f)?f:0; };
  return {t:px('--sat'), r:px('--sar'), b:px('--sab'), l:px('--sal')};
}

function layoutSpecialtyCluster(ax, belowY, belowR, specSlot, specGap){
  /* 2×2 I II / III IV parked above the combat button. Not in HUDSKILLS. */
  const slot=Math.max(specSlot||44, 44);
  const gap=Math.max(specGap||8, 8);
  const bottomY=belowY - belowR - gap - slot/2;
  const topY=bottomY - slot - gap;
  let leftX=ax - (slot+gap)/2;
  let rightX=ax + (slot+gap)/2;
  const overflowR=(rightX+slot/2)-(VW-6);
  if(overflowR>0){ leftX-=overflowR; rightX-=overflowR; ax-=overflowR; }
  const plates=[
    {kind:1, key:'spec1', ico:'specialtyI', x:leftX, y:topY},
    {kind:2, key:'spec2', ico:'specialtyII', x:rightX, y:topY},
    {kind:3, key:'spec3', ico:'specialtyIII', x:leftX, y:bottomY},
    {kind:4, key:'spec4', ico:'specialtyIV', x:rightX, y:bottomY}
  ];
  plates.forEach(p=>{
    UIBTN.push({x:p.x, y:p.y, r:slot/2, key:p.key, ico:p.ico, spec:p.kind, slot:1});
  });
  UI.specialty={
    titleX:ax, titleY:topY - slot/2 - 11,
    top:topY - slot/2 - 22, slot, gap,
    plates:plates.map(p=>({x:p.x,y:p.y,r:slot/2,kind:p.kind,key:p.key}))
  };
}
function layoutUI(){
  UIBTN.length=0;
  const s=UIS;
  const inset=safeInsets();
  UI.inset=inset;
  const mobile = PORT || IS_TOUCH;
  const padL=Math.max(inset.l, 8);
  const padR=Math.max(inset.r, 8);
  const padB=Math.max(inset.b, mobile?(PORT?10:8):8);
  const padT=Math.max(inset.t, 8);
  UI.pad={l:padL,r:padR,b:padB,t:padT};

  if(mobile){
    /* Left thumb: stick. Right thumb: Attack / Defend. Center: 44px verbs.
       Any verb that will not fit goes in the More tray. */
    const TAP=HUD_TAP;
    const gap=5;
    const rowGap=PORT?16:12;
    const combatKeys={attack:1, wall:1};
    const combat=HUDSKILLS.filter(b=>combatKeys[b.key]);
    const rest=HUD_MOBILE_ORDER.map(k=>HUDSKILLS.find(b=>b.key===k)).filter(Boolean)
      .filter(b=>!combatKeys[b.key] && !HUD_OVERFLOW[b.key]);
    const overflowSkills=HUDSKILLS.filter(b=>HUD_OVERFLOW[b.key]);

    const cSlot=Math.max(TAP, Math.min(PORT?64:56, Math.min(VW,VH)*0.125));
    const cx=VW - padR - 8 - cSlot/2;
    const attackY=VH - padB - 8 - cSlot/2;
    const defendY=attackY - (cSlot + rowGap);
    UI.attack={x:cx,y:attackY,r:cSlot/2};
    combat.forEach(b=>{
      const y = b.key==='attack' ? attackY : defendY;
      const btn={x:cx, y, r:cSlot/2, key:b.key, ico:b.ico, label:b.label, slot:1};
      if(b.key==='attack') UI.attack=btn;
      UIBTN.push(btn);
    });
    layoutSpecialtyCluster(cx, defendY, cSlot/2, Math.max(44, Math.min(cSlot, 52)), 8);

    const stickR=Math.max(TAP/2, PORT?26*s:28*s);
    const stickX=padL + 6 + stickR;
    const stickReserve=stickX + stickR + 16;
    const rightReserve=(VW-cx) + cSlot/2 + 8;
    const availW=Math.max(TAP, VW - stickReserve - rightReserve);
    const fit=Math.floor((availW+gap)/(TAP+gap));
    const perRow=Math.max(1, Math.min(5, fit||1));
    const raw=(availW-(perRow-1)*gap)/perRow;
    const slot=Math.min(Math.max(TAP, Math.min(PORT?52:48, raw)), raw);

    const maxPrimary=perRow*2;
    const needMore=overflowSkills.length>0 || rest.length>maxPrimary;
    const primaryCap=needMore?Math.max(1, maxPrimary-1):maxPrimary;
    const primary=rest.slice(0, primaryCap);
    const extra=rest.slice(primaryCap);
    const overflow=overflowSkills.concat(extra);

    const rows=[];
    for(let i=0;i<primary.length;i+=perRow) rows.push(primary.slice(i,i+perRow));
    if(overflow.length){
      if(!rows.length) rows.push([]);
      const last=rows[rows.length-1];
      if(last.length>=perRow) rows.push([{key:'more', ico:'more', label:'More'}]);
      else last.push({key:'more', ico:'more', label:'More'});
    }

    const nRows=Math.max(1, rows.length);
    const by=VH - padB - 8 - slot/2;
    const topY=by - (nRows-1)*(slot+rowGap);
    const left=stickReserve;
    /* Stick in the left thumb corner, aligned with the bottom row, with a
       real gap so it cannot eat Camp / PACK. Not vertically centered on the grid. */
    const stickY=by;
    UI.orb={ r:slot/2, x:left+slot/2, y:nRows>1?topY:by };
    UI.more=null;
    rows.forEach((row,ri)=>{
      const y=topY + ri*(slot+rowGap);
      row.forEach((b,i)=>{
        const x=left + i*(slot+gap) + slot/2;
        const btn={x, y, r:slot/2, key:b.key, ico:b.ico, label:b.label, slot:1};
        if(b.key==='pack') UI.orb={r:slot/2, x, y};
        if(b.key==='more') UI.more=btn;
        UIBTN.push(btn);
      });
    });

    UI.overflow=[];
    overflow.forEach((b,i)=>{
      const cols=Math.min(overflow.length, Math.max(3, perRow));
      const n=Math.min(overflow.length, cols);
      const ox=VW/2 - ((n-1)*(slot+gap))/2;
      const row=(i/cols)|0;
      const col=i%cols;
      const x=ox + col*(slot+gap);
      const y=topY - 18 - slot/2 - row*(slot+rowGap);
      const btn={x, y, r:slot/2, key:b.key, ico:b.ico, label:b.label, slot:1, overflow:1};
      UI.overflow.push(btn);
      UIBTN.push(btn);
    });
    UI.overflowBox=UI.overflow.length?{
      x:Math.min.apply(null, UI.overflow.map(b=>b.x-b.r))-12,
      y:Math.min.apply(null, UI.overflow.map(b=>b.y-b.r))-24,
      w:Math.max.apply(null, UI.overflow.map(b=>b.x+b.r))-Math.min.apply(null, UI.overflow.map(b=>b.x-b.r))+24,
      h:Math.max.apply(null, UI.overflow.map(b=>b.y+b.r))-Math.min.apply(null, UI.overflow.map(b=>b.y-b.r))+40
    }:null;

    UI.hudTop=Math.min(topY, (UI.specialty&&UI.specialty.top)||defendY) - Math.max(slot,cSlot)/2 - 18;
    UIBTN.push({x: padL + 20*s, y: padT + 20*s, r: Math.max(18, 16*s), key:'pause'});
    UI.stickHome={ x: stickX, y: stickY, r: stickR };
    return;
  }

  const deskWide = VW >= HUD_DESK_WIDE;
  const stickR = (deskWide?42:34)*s;
  const stickX = padL + 14*s + stickR;
  const gap = 5*s;
  const rowGap = 8*s;
  const rows = [HUDSKILLS];
  const perRow = HUDSKILLS.length;
  const rightReserve = padR + 10*s;
  const stickReserve = stickX + stickR + 12*s;
  const availW = Math.max(180, VW - stickReserve - rightReserve);
  const slotMin = deskWide ? HUD_DESK_SLOT_MIN : 46;
  const slotMax = deskWide ? HUD_DESK_SLOT_MAX : 56;
  const slot = Math.min(slotMax, Math.max(slotMin, (availW - (perRow-1)*gap)/perRow));
  const skillsW = perRow*slot + (perRow-1)*gap;
  const by = VH - padB - 16*s - slot/2;
  const topY = by;
  const midY = by;
  let left = stickReserve;
  const extra = VW - stickReserve - rightReserve - skillsW;
  if(extra>0) left = stickReserve + extra*0.15;

  UI.orb = { r:slot/2, x:left+slot/2, y:midY };
  UI.attack={x:0,y:0,r:slot/2};
  UI.more=null; UI.overflow=[]; UI.overflowBox=null;
  rows.forEach((row,ri)=>{
    const y = topY + ri*(slot+rowGap);
    const rowW = row.length*slot + (row.length-1)*gap;
    const rowLeft = left + (skillsW-rowW)/2;
    row.forEach((b,i)=>{
      const x = rowLeft + i*(slot+gap) + slot/2;
      const btn={x, y, r:slot/2, key:b.key, ico:b.ico, label:b.label, slot:1};
      if(b.key==='attack') UI.attack=btn;
      if(b.key==='pack') UI.orb={r:slot/2, x, y};
      UIBTN.push(btn);
    });
  });
  layoutSpecialtyCluster(UI.attack.x, UI.attack.y, UI.attack.r, Math.max(48, Math.min(slot, 56)), 8);
  UI.hudTop = Math.min(topY - slot/2, (UI.specialty&&UI.specialty.top)||topY) - 18*s;
  UIBTN.push({x: padL + 20*s, y: padT + 20*s, r: 16*s, key:'pause'});
  UI.stickHome={ x: stickX, y: midY, r: stickR };
}
function btnAt(x,y){
  for(const b of UIBTN){
    if(b.overflow && !G.hudMore) continue;
    if(Math.hypot(x-b.x,y-b.y)<b.r*1.25) return b;
  }
  return null;
}

const pressed={};
function onDown(id,x,y,ptr){
  if(G.sleepShow){

    return;
  }
  if(G.scene!=='play'||G.paused){ IN.taps.push({x,y}); return; }
  if(G.talk){
    const hit=(UI.talkHits||[]).find(z=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h);

  if(b){ pressed[id]={btn:b}; b.hold=1; fire(b.key); return; }

  if(ph){

  }
  if(hitRect(UI.logHit,x,y)){ G.showLog=!G.showLog; return; }
  if(G.showLog && hitRect(UI.logPanel,x,y)) return;
  if(G.showObjs){
    if(hitRect(UI.objHit,x,y)){ G.showObjs=0; return; }
    if(hitRect(UI.objPanel,x,y)) return;
    G.showObjs=0; return;
  }
  if(hitRect(UI.objHit,x,y)){ G.showObjs=1; return; }
  const nearHome = Math.hypot(x-UI.stickHome.x,y-UI.stickHome.y) < UI.stickHome.r*2.2;
  if(G.aim && !(x<VW*0.5||nearHome)){ aimDrag=id; }
  const touchStick = ptr!=='mouse' && (x < VW*0.5 || nearHome);
  if(touchStick){ IN.stick={id,ox:x,oy:y,x,y,moved:0}; return; }
  IN.taps.push({x,y});
}
function onMove(id,x,y){ const k=IN.stick; if(k&&k.id===id){ k.x=x;k.y=y;
  if(Math.hypot(x-k.ox,y-k.oy)>10) k.moved=1; return; }
  if(G.aim&&aimDrag===id){ const p=player(); if(p){ const w=s2w(x,y+22*ZOOM), d=dist(p,w), R=8;
    G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y}; } } }
let aimDrag=null;
function onUp(id,x,y){
  if(aimDrag===id) aimDrag=null;
  const k=IN.stick;
  if(k&&k.id===id){ if(!k.moved) IN.taps.push({x:k.ox,y:k.oy}); IN.stick=null; }
  if(pressed[id]){ pressed[id].btn.hold=0; delete pressed[id]; }
}

window.addEventListener('keydown',e=>{

  }

  if(e.key==='1') fire('attack');

  if(e.key==='3'||k==='c') fire('camp');
  if(e.key==='4'||k==='i'||k==='p') fire('pack');
  if(e.key==='5') fire('rally');
  if(k==='v') fire('wall');
  if(k==='q') fire('attack');
  if(k==='r') fire('throw');
  if(k==='b') fire('bomb');
  if(k==='x') fire('bow');
  if(k==='f') fire('search');
  if(k==='t') fire('secret');
  if(k==='g') fire('shovel');
  if(k==='k') fire('craft');
  if(e.key==='6') fire('spec1');
  if(e.key==='7') fire('spec2');
  if(e.key==='8') fire('spec3');

  if(e.key==='Escape'){
    if(G.talk){ dismissTalkWalkOff(); return; }

    if(G.hudMore){ G.hudMore=0; return; }

  }

});

/* ---------------------------- abilities ---------------------------- */
function debugKillOnScreen(){
  if(G.scene!=='play'||G.paused||G.sleepShow) return;
  let n=0;
  for(const e of G.ents){
    if(!e||e.dead||e.team!=='foe'||e.npc||e.sleeping||e.hidden) continue;
    const s=w2s(e.x,e.y);
    if(s.x<-48||s.x>VW+48||s.y<-90||s.y>VH+90) continue;
    e.stoneskin=0; e.guard=0; e.guardT=0;
    damage(e, Math.max(1,e.hp)+99999, '#ff3a3a');
    n++;
  }
  if(n){ shake(10); hint('Slain on screen: '+n+'.',2.2); say(n+' foe'+(n===1?'':'s')+' fall.','#ff6a5a'); }
  else hint('No foes on screen.',1.6);
}
function refuseAttack(p){
  if(!p||!p.defending) return false;
  hint('Defend is up. Lower the shield to attack.',2.6);
  say('Macar holds. No attacks while the shield is raised.','#cfe3ff');
  return true;
}
function fire(key){
  if(G.scene!=='play') return;
  if(key==='pause'){ G.paused=!G.paused; G.hudMore=0; return; }
  if(key==='objectives'){ G.showObjs=!G.showObjs; return; }
  if(key==='more'){
    if(G.sleepShow||G.paused) return;
    G.hudMore=!G.hudMore;
    return;
  }
  if(G.hudMore) G.hudMore=0;
  if(G.sleepShow) return;
  if(G.paused) return;
  if(G.talk){
    if(G.mercyTalk && (key==='attack'||key==='swing')) tryStrikeMercyGoblin();
    if(G.talk && G.talk.key==='shaman_chant' && (key==='attack'||key==='swing')){
      closeTalk(); shamanStrikeNow();
    }
    return;
  }
  const p=player(); if(!p) return;
  if(key==='spec1'||key==='spec2'||key==='spec3'||key==='spec4'){
    armSpecialty(+key.slice(4));
    return;
  }
  if(key==='attack'||key==='swing'){
    if(refuseAttack(p)) return;
    ensureShadowCleaverWielded();
    p.dest=null; p.moving=0; p.ix=0; p.iy=0;
    p.atkKind='melee';
    const foe=nearestFoe(p, p.range+2.8)||(p.aim&&!p.aim.dead?p.aim:null);
    if(foe){ faceToward(p, foe.x, foe.y); p.aim=foe; }
    if(p.atk<=0){
      p.atk=p.atkMax;
      if(p.ct<=0){ p.ct=p.cd; p.swung=0; }
      else p.swung=1;
    }
    return;
  }
  if(key==='use'){ if(PROMPT){ const f=PROMPT.fn; PROMPT=null; f(); } return; }
  if(key==='wall'){
    p.defending=!p.defending;
    if(p.defending){
      p.atk=0; p.swung=0; p.aim=null; p.dest=null; G.aim=null;
      p.fdx=-0.72; p.fdy=-0.72;
      G.ents.forEach(e=>{
        if(e.team!=='party'||e.dead||e===p) return;
        if(e.ghost){
          e.defending=1; e.fdx=-0.72; e.fdy=-0.72; e.guard=1; e.atk=0; e.swung=0;
        }
      });
      burst(p.x,p.y,'#cfe3ff',18,2.4);
      ftext(p.x,p.y-.5,'DEFEND','#cfe3ff');
      say('Macar walls up. The kin ghosts brace with him. Armor class 4 better. No attacks.','#cfe3ff');
      hint('Defend: AC +4. You and the ghost kin show your backs. Attack is blocked until you lower it.',3.8);
    } else {
      G.ents.forEach(e=>{ if(e.team==='party' && e.ghost) e.defending=0; });
      ftext(p.x,p.y-.5,'SHIELD DOWN','#c9b895');
      hint('Shield lowered. You can attack again.',2.2);
    }
    return;
  }
  if(key==='search'){
    if(G.searching){ G.searching=0; hint('Stopped searching.',1.8); return; }
    G.searching=1; G.secretSearch=0; G.digging=0; G.dig=null;
    const patch=nearestShroom(p,1.6);
    forageHerbs(patch||p);
    p.searchCd=5;
    say('Eyes on the floor. Herb Lore '+forageChance()+'% notice, then the table, then recover.','#6aff8a');
    hint('Search on. Walk is slow. Leaf icon or F to search again or stop.',3.8);
    return;
  }
  if(key==='secret'){
    if(G.secretSearch){ G.secretSearch=0; hint('Stopped searching for doors.',1.8); return; }
    G.secretSearch=1; G.searching=0; G.digging=0; G.dig=null;
    p.secretCd=1.6;
    tryFindSecret(p,'search');
    say('Fingers on the stone. Dwarves notice seams on 1–2 in 6; search is 1–4.','#c9b895');
    hint('Search for secret doors. Wall-door icon or T to stop.',3.8);
    return;
  }
  if(key==='climb'){
    const L=G.lvl;
    if(L&&L.stair&&dist(p,L.stair)<2.5){
      if(L.objs&&L.objs[4]) L.objs[4].d=1;
      say('Macar climbs down. Old ruin-stone waits below.','#c9b895');
      endChapter(); return;
    }
    const cl=(L&&L.climbs||[]).find(c=>dist(p,c)<1.9);
    if(cl){ cl.fn(); return; }
    hint('Nothing to climb here.',2.2);
    say('No handhold. Face a shaft or a stair.','#c9b895');
    return;
  }
  if(key==='shovel'){
    if(G.digging){ G.digging=0; G.dig=null; hint('Put the shovel up.',1.8); return; }
    G.searching=0; G.secretSearch=0; G.digging=1;
    const t=digTarget(p);
    if(!t){
      G.dig=null;
      hint('Face solid rock. Dwarves excavate one square foot per 10 minutes.',4.4);
      say('Shovel out. Face the stone.','#d8c49a');
    } else {
      G.dig={i:t.i,j:t.j,min:0};
      say('Digging. One square foot per 10 minutes.','#d8c49a');
      hint('Solid rock — 10 dungeon minutes a square (1 second = 1 minute).',4);
    }
    return;
  }
  if(key==='camp'){ campRest(); return; }
  if(key==='craft'){
    const station=nearestCraftStation(p,1.7);
    if(!station){
      const far=nearestCraftStation(p,99);
      if(far){ G.craftGuide=far; G.craftGuideT=8; }
    } else { G.craftGuide=null; G.craftGuideT=0; }
    openCraftBench(station||undefined);
    return;
  }
  if(key==='pack'){
    G.inspect=null;
    G.packWho=G.packWho||'macar';
    openPackMenu('play');
    return;
  }
  if(key==='bomb'){
    if(refuseAttack(p)) return;
    syncPackTotals();
    if(!nextThrowKind()){
      hint(partyCount('bombKit')?'No bombs in any pack. Craft more at the station.':'No bombs. Loot the red hat — he carries a bomb-making kit.',2.8);
      return;
    }
    if(cds.bomb>0) return;
    const t=nearestFoe(p,8);
    G.aim = t? {x:t.x,y:t.y} : {x:p.x+(p.fdx||0)*4.5, y:p.y+(p.fdy||1)*4.5};
    cds.bomb=ABIL.find(a=>a.key==='bomb').cd;
    p.dest=null;
    throwBomb();
    return;
  }
  if(key==='bow'){
    if(refuseAttack(p)) return;
    syncPackTotals();
    if(cds.bow>0) return;
    const magAmmo=typeof takeMagicShotAmmo==='function'?takeMagicShotAmmo():null;
    if(!magAmmo){
      if(partyCount('ammo')<=0){ hint('No bolts. Buy from Noz, or pick quarrels that save.',3); return; }
      takeFromPacks('ammo', G.packPrefer);
    }
    const t=nearestFoe(p,9);
    const tx=t?t.x:p.x+p.fdx*7, ty=t?t.y:p.y+p.fdy*7;
    cds.bow=1.4;
    p.dest=null;
    const a=ang(tx-p.x,ty-p.y); p.fdx=Math.cos(a); p.fdy=Math.sin(a);
    // Pose only. swung=1 up front so the melee tick never fires off this timer.
    p.atkKind='bow'; p.atk=p.atkMax; p.swung=1;
    const shot=shoot(p, tx, ty, 0, 'bolt', '#d8c49a', 14);
    if(shot && magAmmo) shot.ammoPlus=magAmmo.plus;
    say(magAmmo?('MACAR looses '+magAmmo.n+'.'):'MACAR looses a quarrel.','#ffb45c');
    return;
  }
  const a=ABIL.find(z=>z.key===key); if(!a||cds[key]>0) return;
  if(key==='throw' && refuseAttack(p)) return;
  cds[key]=a.cd; p.dest=null;
  if(key==='ale'){
    const ch=takeHealCharge();
    if(!ch){ cds[key]=0; hint('No beer draughts in the packs. Brew more at camp.',2.6); return; }
    if(ch.kind==='potion'){
      drinkPotion(ch.p, p);
      learn('ale',3);
    } else {
      const heal=ri(1,10);
      applyHeal(p, heal);
      learn('ale',3);
      say('A draught of beer. Heals '+heal+' (d10).','#d2bd63');
    }
  }
  if(key==='throw'){ const t=nearestFoe(p,10); const tx=t?t.x:p.x+p.fdx*6, ty=t?t.y:p.y+p.fdy*6;
    const thrower=G.ents.find(z=>z.role==='pick'&&!z.dead)||p;
    thrower.fdx=Math.cos(ang(tx-thrower.x,ty-thrower.y)); thrower.fdy=Math.sin(ang(tx-thrower.x,ty-thrower.y));
    shoot(thrower, tx, ty, 0, 'pick', '#cfd6de', 12);
    say((thrower.name||'PICK')+' hurls a pick. d20 vs AC.','#ffb45c'); }
  if(key==='rally'){ G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead){ e.buff=8; e.hp=Math.min(e.maxhp,e.hp+30);
      burst(e.x,e.y,'#ffd27a',10,2);} }); ftext(p.x,p.y-.8,'RALLY','#ffd27a',1);
    say('MACAR sounds Rally. Living kin heal 30 and hit harder for 8s.','#ffd27a');
    hint('Rally: heal 30, +2 to hit, 1.5× damage for 8s.',3.4); }
}

   UPDATE

function update(dt){
  if(G.sleepShow && G.scene==='play' && !G.paused){
    G.sleepShow.t+=dt;
    if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
    if(G.flash){ G.flash.a-=dt*1.8; if(G.flash.a<=0) G.flash=null; }
    if(G.sleepShow.t>=G.sleepShow.dur) endSleepShow();
    return;
  }
  if(G.scene==='camp'){
    if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
    return;
  }
  if(G.scene!=='play'||G.paused) return;
  if(G.talk){
    if(talkWalkOffKey(G.talk.key) && IN.stick && IN.stick.moved){
      const ox=IN.stick.x-IN.stick.ox, oy=IN.stick.y-IN.stick.oy;
      if(Math.hypot(ox,oy)>12*(UIS||1)) dismissTalkWalkOff();
    }
    return;
  }
  G.elapsed+=dt;
  G.dayClock=(G.dayClock||0)+dt;
  if(G.dayClock>=GHOST_DAY_SECS){
    G.dayClock=0; G.day=(G.day||1)+1; tryPordoomGifts();
  }
  const L=G.lvl; if(!L) return;
  PROMPT=null;
  runSystems(dt, { ents:G.ents, abilities:ABIL, cds:cds });
  if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
  if((G.craftGuideT||0)>0){ G.craftGuideT-=dt; if(G.craftGuideT<=0){ G.craftGuideT=0; G.craftGuide=null; } }
  G.hurt=Math.max(0,G.hurt-dt*1.4);

  const p=player();
  if(p){
    let dx=0,dy=0, analog=0;
    if(IN.stick && IN.stick.moved){
      const ox=IN.stick.x-IN.stick.ox, oy=IN.stick.y-IN.stick.oy, m=Math.hypot(ox,oy);
      const dead=6*UIS;
      if(m>dead){
        const f=clamp((m-dead)/(46*UIS),0,1);
        const sx=ox/m, sy=oy/m;
        let wx=sy/(TH/2)+sx/(TW/2), wy=sy/(TH/2)-sx/(TW/2);
        const wm=Math.hypot(wx,wy)||1; dx=wx/wm; dy=wy/wm; analog=f; p.dest=null;
      }
    }
    const K=IN.keys; let kx=0,ky=0;
    if(K['w']||K['arrowup']){kx-=1;ky-=1;} if(K['s']||K['arrowdown']){kx+=1;ky+=1;}
    if(K['a']||K['arrowleft']){kx-=1;ky+=1;} if(K['d']||K['arrowright']){kx+=1;ky-=1;}
    if(kx||ky){ const m=Math.hypot(kx,ky); dx=kx/m; dy=ky/m; analog=1; p.dest=null; }

    if((p.webbed||0)>0){
      p.webbed-=dt;
      p.webChk=(p.webChk||0)+dt;
      dx=0; dy=0; analog=0; p.dest=null; p.moving=0;
      if(p.webChk>=0.85){
        p.webChk=0;
        const r=strengthCheck(p);
        if(r.ok){ p.webbed=0; ftext(p.x,p.y,'broke free','#ffe08a'); }
        else ftext(p.x,p.y,'str '+r.roll,'#c9b895');
      }
    }

    if(!dx&&!dy&&p.dest){
      if(p.dest.foe){
        const foe=G.ents.find(z=>z.id===p.dest.foe&&!z.dead);
        if(!foe) p.dest=null;
        else { p.dest.x=foe.x; p.dest.y=foe.y; }
      } else if(p.dest.loot){
        const pile=(G.loot||[]).find(z=>z.id===p.dest.loot&&!z.gone);
        if(!pile) p.dest=null;
        else { p.dest.x=pile.x; p.dest.y=pile.y; }
      } else if(p.dest.corpse){
        const body=G.ents.find(z=>z.id===p.dest.corpse&&isLootableBody(z));
        if(!body) p.dest=null;
        else { p.dest.x=body.x; p.dest.y=body.y; }
      }
    }
    if(!dx&&!dy&&p.dest){
      const d=dist(p,p.dest);
      const arrive=p.dest.foe?(p.range+.2):(p.dest.loot||p.dest.corpse)?1.12:0.26;
      if(d<=arrive){
        if(p.dest.loot){ const pile=(G.loot||[]).find(z=>z.id===p.dest.loot&&!z.gone); if(pile) takeLoot(pile); }
        if(p.dest.corpse){ const body=G.ents.find(z=>z.id===p.dest.corpse&&isLootableBody(z)); if(body) lootNearbyCorpses(p,1.85); }
        if(!p.dest.foe && !p.dest.loot && !p.dest.corpse && canBe(p.dest.x,p.dest.y,p.r,p)){ p.x=p.dest.x; p.y=p.dest.y; }
        p.dest=null; p.stuck=0;
      }
      else {
        dx=p.dest.x-p.x; dy=p.dest.y-p.y; analog=1;
        p.stuck=(p.stuck||0)+dt;
        if(p.lastD!==undefined && p.lastD-d>0.008) p.stuck=0;
        p.lastD=d; if(p.stuck>1.4){ p.dest=null; p.stuck=0; }
      }
    }

    let sp=p.sp;
    if((p.slowT||0)>0){ p.slowT=Math.max(0,p.slowT-dt); sp*=0.4; }
    if(G.searching) sp*=0.16;
    if(G.secretSearch) sp*=0.18;
    if(G.digging) sp*=0.14;
    if(analog && analog<1) sp*=analog;
    steerWalk(p, dx, dy, sp, dt);
    if(p.moving) recordTrail(p);
    p.guardT=Math.max(0,(p.guardT||0)-dt);
    p.guard = !!p.defending || p.guardT>0;
    const stepped=nearestLoot(p,0.7);
    if(stepped) takeLoot(stepped);

    // auto-attack while standing in reach (Baldur's Gate: never swing while walking)
    if(!G.digging && !p.defending){
      const t=nearestFoe(p,p.range+.75);
      if(t&&p.ct<=0&&!p.moving){
        ensureShadowCleaverWielded();
        faceToward(p, t.x, t.y);
        p.atkKind='melee'; p.atk=p.atkMax; p.ct=p.cd; p.swung=0; p.aim=t; }
      if(!t) p.aim=null;
    } else if(p.defending) p.aim=null;

    G.cam.x=lerp(G.cam.x,p.x,1-Math.pow(.0004,dt));
    G.cam.y=lerp(G.cam.y,p.y,1-Math.pow(.0004,dt));
    rebuildVision();
    p.searchCd=Math.max(0,(p.searchCd||0)-dt);
    if(G.searching && (p.searchCd||0)<=0){
      p.searchCd=5;
      forageHerbs(nearestShroom(p,1.6)||p);
    }
    p.secretCd=Math.max(0,(p.secretCd||0)-dt);
    maybeHintSecret(L, p);
    tryFindSecret(p,'pass');
    if(G.secretSearch && (p.secretCd||0)<=0){ p.secretCd=1.6; tryFindSecret(p,'search'); }
    if(G.digging){
      const t=digTarget(p);
      if(t){
        if(!G.dig || G.dig.i!==t.i || G.dig.j!==t.j) G.dig={i:t.i,j:t.j,min:0};
        else {
          const need=digNeedMinutes();
          G.dig.min+=dt;
          if(G.dig.min>=need){
            breakRock(L,G.dig.i,G.dig.j);
            if(G.digBoost>0) G.digBoost--;
            say('A square foot of stone comes away.','#d8c49a');
            G.dig=null;
          }
        }
      }
    }
    const body=nearestCorpse(p,corpseWalkReach(null));
    if(body){
      const reach=corpseWalkReach(body);
      if(dist(p,body)<reach) lootNearbyCorpses(p,reach);
    }
    if(!PROMPT){
      const more=nearestCorpse(p,2.15);
      if(more) interact((more.crushed&&more.team==='party'?'Rouse ':'Loot ')+(more.name||'the fallen'),()=>lootCorpse(more));
    }
    const pile=nearestLoot(p,1.12);
    if(pile) takeLoot(pile, true);
    if(!PROMPT){
      const sh=nearestShroom(p,1.35);
      if(sh) interact('Search for herbs',()=>{ p.searchCd=5; forageHerbs(sh); });
    }
    if(!PROMPT){
      const station=nearestCraftStation(p,1.55);
      if(station) interact('Craft at the station',()=>openCraftStation(station));
    }
    if(!PROMPT){
      const craft=nearestCraftProp(p,1.35);
      if(craft) interact(craftPropLabel(craft),()=>scavengeCraft(craft));
    }
    if(!PROMPT && G.secretSearch && L.secrets){
      const sec=L.secrets.find(s=>!s.open && Math.hypot(p.x-(s.x||s.i),p.y-(s.y||s.j))<1.9);
      if(sec) interact('Search the wall',()=>tryFindSecret(p,'focus'));
    }
    for(const pr of G.props){
      if(pr.sprung>0) pr.sprung=Math.max(0,pr.sprung-dt);
      if(pr.k!=='trap') continue;
      pr.cd=(pr.cd||0)-dt;
      if(pr.cd>0) continue;
      for(const e of G.ents){
        if(e.dead||e.team!=='party') continue;
        if(dist(e,pr)<0.72){
          const pit=pr.trap==='trap_pit', rune=pr.trap==='trap_runes';
          if(pit && typeof isHovering==='function' && isHovering(e)){
            say((e.name||'Kin')+' hovers over the pit.','#cfe3ff');
            pr.cd=2.8; continue;
          }
          const trapSrc=rune?{magic:1,kind:'rune'}:pit?{kind:'pit',fall:1}:{kind:'trap'};
          damage(e, pit?fallDamageAmt(e,16):rune?13:11, rune?'#c07bff':'#ff6a4a', trapSrc);
          burst(pr.x,pr.y, rune?'#c07bff':'#c2452e', 12, 2.4);
          say((e.name||'Kin')+' hits a trap.','#ff6a6a');
          pr.cd=pit?2.8:rune?1.6:2.2; pr.sprung=0.55; shake(8); break;
        }
      }
    }
  }

  if(typeof tickSpellZones==='function') tickSpellZones(dt);
  for(const e of G.ents){
    if(e.dead){
      if(e.ghost){
        e.ghostReturn=(e.ghostReturn||0)-dt;
        if(e.ghostReturn<=0) returnGhost(e);
      }
      if(!e.crushed) e.deadT=(e.deadT||0)+dt;
      continue;
    }
    e.anim+=dt*(e.moving?1:.35);
    if(e.flash>0) e.flash-=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    if(e.regen && e.hp<e.maxhp) e.hp=Math.min(e.maxhp, e.hp+0.5*dt);
    if(e.potionRegen>0){ e.potionRegen-=dt; e.hp=Math.min(e.maxhp, e.hp+2.2*dt); }
    if(typeof tickWoundClosure==='function') tickWoundClosure(e, dt);
    if(typeof clearWornDisease==='function') clearWornDisease(e);
    if(typeof applyFreeAction==='function') applyFreeAction(e);
    if(e.afterHaste>0 && (e.buff||0)<=0){ e.afterHaste-=dt; e.sp=Math.max(1.2,(e.sp||3)*0.985); }
    if(e.invis>0){ e.invis-=dt; if(e.invis<=0) e.aggro=7.5; }
    if(e.poisonT>0){
      e.poisonT-=dt; e._pt=(e._pt||0)+dt;
      if(e._pt>=0.7){ e._pt=0; damage(e,2,'#6aff8a'); }
    }
    if(e.webbed>0 && !e.hero){
      e.webbed-=dt;
      e.webChk=(e.webChk||0)+dt;
      e.dest=null; e.moving=0; e.ix=0; e.iy=0;
      if(e.webChk>=0.9){
        e.webChk=0;
        const r=strengthCheck(e);
        if(r.ok){ e.webbed=0; ftext(e.x,e.y,'broke free','#ffe08a'); }
      }
    }
    if((e.slowT||0)>0 && e!==p) e.slowT=Math.max(0,e.slowT-dt);
    if(e.buff>0) e.buff-=dt;
    skillSystem.tickAttack(e, dt);
    if(e.atk>0){
      if(e.defending){ e.atk=0; e.swung=0; }
      else {
        e.atk-=dt;
        if(!e.swung&&e.atk<e.atkMax*.55){ e.swung=1; const bo=e.buff>0?1.5:1;
          const spec=beginSpecialtySwing(e);
          if(spec){
            meleeSwing(e,e.hero?2.3:1.9,e.range+.35,e.dmg*bo);
            endSpecialtySwing(e);
          } else if(e.web && e.team==='foe'){
            const t=player();
            if(t&&!t.dead){
              e._webFlip=!e._webFlip;
              if(e._webFlip && !(t.webbed>0)) shoot(e,t.x,t.y,0,'web','#e8e0d0',6.5);
              else meleeSwing(e,1.9,e.range+.35,e.dmg*bo);
            }
          } else if(e.ranged){ const t=e.team==='party'?nearestFoe(e,e.range+2):player();
            if(t){ const st=shotStyle(e); shoot(e,t.x,t.y,e.dmg*bo, st[0], st[1], st[2]); }
          } else meleeSwing(e,e.hero?2.3:1.9,e.range+.35,e.dmg*bo); }
        if(e.atk<=0) e.swung=0;
      }
    }
    if(e.kx||e.ky){ move(e,e.kx*6,e.ky*6,dt); e.kx*=Math.pow(.02,dt); e.ky*=Math.pow(.02,dt);
      if(Math.abs(e.kx)<.01)e.kx=0; if(Math.abs(e.ky)<.01)e.ky=0; }
    if(e.hero) continue;
    if(e.hidden){ e.moving=0; e.ix=0; e.iy=0; continue; }
    if(e.sleeping||e.crushed||e.tied){ e.moving=0; e.ix=0; e.iy=0; continue; }
    if(e.fleeTo){
      const t=e.fleeTo, d=dist(e,t);
      e.fleeStuck=(e.fleeStuck||0)+dt;
      if(d>0.55 && e.fleeStuck<3.2){
        const run=Math.max(e.sp||4, 5.8);
        steerWalk(e, t.x-e.x, t.y-e.y, run, dt);
      } else {
        e.fleeStuck=0;
        e.x=t.x; e.y=t.y;
        if(e.fleePath && e.fleePath.length){
          e.fleeTo=e.fleePath.shift();
        } else {
          e.moving=0; e.ix=0; e.iy=0; e.fleeTo=null;
          if(e.onArrive){ const fn=e.onArrive; e.onArrive=null; fn(); }
        }
      }
      continue;
    }
    if(e.npc && e.team!=='party'){ e.moving=0; e.ix=0; e.iy=0; continue; }

    let tgt=null, want=e.range, form=0;
    if(e.team==='party'){
      if(e.heals && !((e.silenced||0)>0) && !(typeof inSilenceZone==='function' && inSilenceZone(e))){ const hu=nearestAlly(e,12,1);
        if(hu&&hu.hp<hu.maxhp*.6&&e.ct<=0){ hu.hp=Math.min(hu.maxhp,hu.hp+24);
          burst(hu.x,hu.y,'#ffe9a8',10,2); ftext(hu.x,hu.y,'+24','#ffe9a8'); e.ct=4.5; } }
      const kin=G.ents.filter(x=>x.team==='party'&&!x.dead&&!x.hero);
      const idx=kin.indexOf(e);
      const fight=kinCanAutoFight(e)&&foeInTheFight();
      const foe=fight?nearestFoe(e, e.ranged?9:6.2):null;
      if(fight&&foe){ tgt=foe; want=e.ranged?e.range*.7:e.range; e.aim=foe; }
      else if(p){
        e.aim=null;
        if(p.moving) tgt=trailSlot(idx<0?0:idx)||partyForm(idx<0?1:idx+1, p);
        else tgt=partyForm(idx<0?1:idx+1, p);
        want=.38; form=1;
      }
    } else {
      tgt=nearestAlly(e,999);
      if(tgt){ const d=dist(e,tgt);
        if(d>e.aggro&&!e.boss&&!e.engaged) tgt=null; else e.engaged=1; }
      want=e.ranged?e.range*.75:e.range;
    }
    if(tgt){
      const d=dist(e,tgt);
      if(d>want){
        let vx=tgt.x-e.x, vy=tgt.y-e.y;
        const go=e.sp*((e.slowT||0)>0?0.4:1)*((e.webbed||0)>0?0:1);
        if(go<=0){ e.moving=0; e.ix=0; e.iy=0; }
        else {
        for(const o of G.ents){ if(o===e||o.dead) continue; const dd=dist(e,o);
          if(dd<(e.r+o.r)*1.15&&dd>.001){ vx+=(e.x-o.x)/dd*.35; vy+=(e.y-o.y)/dd*.35; } }
        steerWalk(e, vx, vy, go, dt);
        if(form&&p){ e.fdx=p.fdx; e.fdy=p.fdy; }
        }
      } else {
        e.ix=0; e.iy=0; e.moving=0;
        if(form&&p){ e.fdx=p.fdx; e.fdy=p.fdy; }
        else faceToward(e, tgt.x, tgt.y);
        if(!form&&!e.defending&&e.ct<=0&&tgt.hp!==undefined){
          e.atk=e.atkMax; e.ct=(typeof wornAttackCd==='function'?wornAttackCd(e):e.cd); e.swung=0; e.aim=tgt;
          if(e.team==='foe' && !e.specialty && chanceOk(18)) e.specialty=pickMonsterSpecialty();
        }
      }
    } else { e.moving=0; e.ix=0; e.iy=0; }
    ghostSapperBomb(e, dt);
  }
  if(p){
    const threat=foeInTheFight();
    for(const e of G.ents){
      if(e.team!=='party'||e.hero||e.dead||e.crushed||e.sleeping||e.tied) continue;
      if(e.defending||(e.atk>0)) continue;
      if(threat && kinCanAutoFight(e)) continue;
      if(!p.moving && (p.aim||p.atk>0)) continue;
      e.fdx=p.fdx; e.fdy=p.fdy;
    }
  }

  for(const s of G.shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; s.spin+=dt*14;
    if(!walk(s.x,s.y)){ s.life=0; burst(s.x,s.y,s.col,8,2); tryRetrieveBolt(s); continue; }
    for(const o of G.ents){ if(o.dead||o.team===s.team||o.npc||o.sleeping) continue;
      if(dist(s,o)<o.r+.45){
        if(s.kind==='web'){
          applyWeb(o);
          s.life=0; burst(s.x,s.y,'#e8e0d0',14,2.4); break;
        }
        let rolled;
        if(s.kind==='bolt'&&s.from){
          const prevD=s.from.dice, prevR=s.from.ranged;
          s.from.dice='1d4'; s.from.ranged=1;
          s.from._shotAmmoPlus=s.ammoPlus||0;
          rolled=addAttack(s.from,o);
          s.from.dice=prevD; s.from.ranged=prevR;
          s.from._shotAmmoPlus=0;
        } else rolled=s.from?addAttack(s.from,o):(s.dmg||8);
        if(rolled) damage(o,onHitFx(s.from||s,o,rolled),s.col,s.from||s);
        s.life=0; burst(s.x,s.y,s.col,9,2.5); tryRetrieveBolt(s); break; } }
  }
  G.shots.forEach(s=>{ if(s.life<=0) tryRetrieveBolt(s); });
  G.shots=G.shots.filter(s=>s.life>0);
  for(const q of G.parts){ q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=11*dt;
    if(q.z<0){q.z=0;q.vz*=-.35;q.vx*=.6;q.vy*=.6;} q.life-=dt; }
  G.parts=G.parts.filter(q=>q.life>0);
  const pcap=QUALITY?48:12;
  if(G.parts.length>pcap) G.parts.splice(0, G.parts.length-pcap);
  for(const t of G.texts){ t.y-=dt*.9; t.life-=dt; }
  G.texts=G.texts.filter(t=>t.life>0);
  for(const l of G.log) l.a=Math.max(.35,l.a-dt*.03);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*46);
  if(G.flash){ G.flash.a-=dt*1.8; if(G.flash.a<=0) G.flash=null; }
  /* No free-floating light motes around the party. Held lanterns / Orbo's
     lantern and baked cave lighting stay; DIAG.floaters is damage text only. */
  updateBombs(dt);
  if(G.songBuff>0 && p){ const rg=G.songBuff*0.5*dt;
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead) e.hp=Math.min(e.maxhp,e.hp+rg); }); }
  if(L.tick) L.tick(dt);
  endFightIfClear();
  if(G.ents.length>80) G.ents=G.ents.filter(e=>!(e.dead&&e.team==='foe'&&e.looted&&(e.deadT||0)>12));
}


/* ---------------------------- projection ---------------------------- */
function w2s(x,y){ return {
  x:(x-y)*(TW/2)+CAMSX,
  y:(x+y)*(TH/2)+CAMSY }; }
function s2w(sx,sy){
  const ix=sx-CAMSX, iy=sy-CAMSY;
  return {x:(iy/(TH/2)+ix/(TW/2))/2, y:(iy/(TH/2)-ix/(TW/2))/2}; }

/* emissive registrations, consumed by the bloom pass each frame */
let EMIT=[], RAYS=[];
function emit(sx,sy,r,c,i){ if(QUALITY&&EMIT.length<40) EMIT.push({x:sx,y:sy,r,c,i:i===undefined?1:i}); }
function ray(sx,sy,r,c,i){ if(QUALITY) RAYS.push({x:sx,y:sy,r,c,i}); }

/* ==========================================================================
   RENDER
   ========================================================================== */
function render(){
  const g=ctx; EMIT=[]; RAYS=[];
  syncCamProj();
  try{
  g.save();
  if(DIAG.shake && QUALITY && !PHONE_GFX && G.shake>0) g.translate(rnd(G.shake,-G.shake)*.3,rnd(G.shake,-G.shake)*.3);
  const L=G.lvl;
  g.fillStyle='#000000'; g.fillRect(-40,-40,VW+80,VH+80);
  const inWorld = L && G.scene!=='title' && G.scene!=='chapters' && G.scene!=='credits'
    && !(G.scene==='intro' && chapterSplashImg(G.ch))
    && !(G.scene==='play' && !worldArtReady(G.ch));
  if(inWorld){
    if(DIAG.world) drawWorld(g,L);
    if(DIAG.lighting) applyLighting(g,L);
    if(QUALITY && !PHONE_GFX){ if(DIAG.godrays) drawGodRays(g); if(DIAG.bloom) drawBloom(g); }
    if(DIAG.memshade) drawMemoryShade(g,L);
    if(DIAG.beyond) drawBeyondMask(g,L);
    if(DIAG.atmos) drawAtmosphere(g,L);
    if(DIAG.floaters) drawFloaters(g);
  }
  g.restore();
  if(inWorld && DIAG.world){
    ctx.globalCompositeOperation='source-over';
    ctx.globalAlpha=1;
    drawFallenKin(ctx);
    drawCrushCover(ctx);
    drawFallenKinLabels(ctx);
  }
  if(DIAG.flash && G.flash){ g.globalAlpha=clamp(G.flash.a,0,1); g.fillStyle=G.flash.c; g.fillRect(0,0,VW,VH); g.globalAlpha=1; }
  if(DIAG.hurt && G.hurt>0.02){
    if(!QUALITY || PHONE_GFX){
      g.globalAlpha=G.hurt*0.25; g.fillStyle='#6a0000'; g.fillRect(0,0,VW,VH); g.globalAlpha=1;
    } else {
      const v=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.25,VW/2,VH/2,Math.max(VW,VH)*.62);
      v.addColorStop(0,'rgba(160,0,0,0)'); v.addColorStop(1,'rgba(150,0,0,'+(G.hurt*.55)+')');
      g.fillStyle=v; g.fillRect(0,0,VW,VH);
    }
  }
  if(DIAG.grain && inWorld && QUALITY && !PHONE_GFX) drawGrain(g);
  /* Living Macar after multiply / haze / grain so he stays a solid dwarf.
     Living party kin use the same after-grain slot so a south/SE/SW face
     cannot cover them. Foes / dead / crushed stay in actorDrawDepth. */
  if(inWorld && DIAG.world){
    const mac=player();
    if(mac && !mac.dead && !mac.ghost){
      g.globalAlpha=1; g.globalCompositeOperation='source-over';
      drawLivingMacar(g,mac);
    }
    for(const e of G.ents){
      if(!e || e.hero || e.dead || e.crushed || e.hidden) continue;
      if(e.kind!=='dwarf' || e.team!=='party') continue;
      g.globalAlpha=1; g.globalCompositeOperation='source-over';
      drawEnt(g,e);
    }
  }
  if(DIAG.hud && G.scene==='play' && worldArtReady(G.ch)) drawHUD(g);
  if(G.sleepShow && G.scene==='play' && worldArtReady(G.ch)) drawSleepRest(g);
  if(G.scene==='title') drawTitle(g);
  if(G.scene==='chapters') drawChapterSelect(g);
  if(G.scene==='credits') drawCredits(g);
  if(G.scene==='intro') drawIntro(g);
  if(G.scene==='play' && !worldArtReady(G.ch)){
    /* Hold the title card (or a black frame) until Ch1 sprites are decoded.
       Painting the world early is the old-graphics flash. */
    if(L) drawIntro(g);
    else { g.fillStyle='#050308'; g.fillRect(0,0,VW,VH); }
  }
  if(G.scene==='camp') drawCamp(g);
  if(G.scene==='craft') drawCraft(g);
  if(G.scene==='pack') drawPack(g);
  if(G.scene==='trade') drawTrade(g);
  if(G.scene==='dead') drawDead(g);
  if(G.scene==='win') drawWin(g);
  if(G.paused&&G.scene==='play' && worldArtReady(G.ch)) drawPause(g);
  /* Highest UI layer: talk / hint / inspect / prompt after every wall pass. */
  drawPlayPlates(g);
  }catch(err){
    try{
      g.setTransform(DPR,0,0,DPR,0,0);
      g.fillStyle='#1a0808'; g.fillRect(0,0,VW,VH);
      g.fillStyle='#ffd27a'; g.font='14px sans-serif'; g.textAlign='left';
      String(err&&err.stack||err).split('\n').slice(0,12).forEach((ln,i)=>g.fillText(ln,16,28+i*18));
    }catch(_){}
  }
}

let DIGT=null;
function drawWorld(g,L){
  const pal=L.pal;
  { const pl=player(); DIGT = pl? digTarget(pl) : null; }
  ensureTileBlit(L);
  const padT=QUALITY?5:2;
  const c=[s2w(-TW,-TH*padT),s2w(VW+TW,-TH*padT),s2w(-TW,VH+TH*padT),s2w(VW+TW,VH+TH*padT)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-1);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+1);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-1);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+1);

  const B={}, push=(k,f)=>{(B[k]||(B[k]=[])).push(f);};
  const isoX=G.cam.x-G.cam.y, isoY=G.cam.x+G.cam.y;
  const limX=(VW*0.5+TW*2)/(TW*0.5), limY=(VH*0.5+TH*5)/(TH*0.5);
  const near=o=>{ const dx=(o.x-o.y)-isoX, dy=(o.x+o.y)-isoY; return dx>-limX&&dx<limX&&dy>-limY&&dy<limY; };
  const seenAt=o=>tileExplored(o.x,o.y);
  const visAt=o=>tileVisible(o.x,o.y);
  const showEnt=e=>{
    if(!near(e)) return false;
    if(e.ghost && e.dead) return false;
    if(e.team==='foe' && !e.dead && !visAt(e)) return false;
    if((e.dead||e.corpse||e.crushed) && !seenAt(e)) return false;
    return true;
  };
  for(const d of G.decals) if(near(d)&&seenAt(d)) push(actorDrawDepth(d),()=>drawDecal(g,d));
  for(const p of G.props) if(near(p)&&seenAt(p)&&!p.pin&&!p.cover) push(actorDrawDepth(p),()=>drawProp(g,p,pal));
  for(const q of (G.loot||[])) if(!q.gone&&near(q)&&seenAt(q)) push(actorDrawDepth(q),()=>drawLoot(g,q));
  for(const e of G.ents){
    if(e.crushed||!showEnt(e)) continue;
    // Living Macar and living party paint after grain so a south/SE/SW face
    // cannot eat them. Dead / crushed / foes stay in the wall sort.
    if(e.hero && !e.dead && !e.ghost) continue;
    if(e.kind==='dwarf' && e.team==='party' && !e.dead && !e.crushed) continue;
    push(actorDrawDepth(e),()=>drawEnt(g,e));
  }
  for(const s of G.shots) if(near(s)&&seenAt(s)) push((s.x+s.y)|0,()=>drawShot(g,s));
  if(QUALITY) for(const q of G.parts) if(near(q)) push((q.x+q.y)|0,()=>drawPart(g,q));
  for(const b of G.thrown) if(near(b)) push((b.x+b.y)|0,()=>drawThrown(g,b));
  if(G.aim) push(((G.aim.x+G.aim.y)|0)-1,()=>drawAim(g));
  if(L.plug&&!L.flags.broke) push((L.plug.x+L.plug.y)|0,()=>drawPlug(g,L));

  const WH=RWH*(TW/RTW);
  const p=player();
  const wallBlit=TILEBLIT.wall, floorBlit=TILEBLIT.floor, wallAtk=SPR[palWallKey(L)+'_atk']||SPR.wall_cave_atk;
  const pack=tilesetPack(L);
  const {sx,sy}=tilesetScale();
  if(p&&p.dest) push((p.dest.x+p.dest.y)|0,()=>drawMoveMark(g,p.dest));

  function drawFloorCell(x,y,t){
    const s=w2s(x,y);
    const m=pack.floor;
    const key=palFloorKey(pal);
    const variants=[SPR[key], SPR[key+'_w1'], SPR[key+'_w2'], SPR[key+'_atk']].filter(Boolean);
    const fl=floorBlit||(variants.length?variants[(h2(x,y)*variants.length)|0]:null);
    if(fl){
      g.drawImage(fl, s.x-m.ox*sx, s.y-m.oy*sy, m.w*sx, m.h*sy);
    }
  }

  function drawWallCell(x,y){
    if(isStartBackWall(L,x,y)){ drawStartCaveInCell(g,L,x,y); return; }
    const oS=L.grid[y+1]&&isWalkTile(L.grid[y+1][x]);
    const oE=L.grid[y]&&isWalkTile(L.grid[y][x+1]);
    const oN=L.grid[y-1]&&isWalkTile(L.grid[y-1][x]);
    const oW=L.grid[y]&&isWalkTile(L.grid[y][x-1]);
    if(!oS&&!oE&&!oN&&!oW) return;
    const s=w2s(x,y);
    const rk=L.wallHP[x+','+y];
    const wallImg=(rk&&rk.hp<rk.max&&wallAtk)?wallAtk:wallBlit;
    const H=hallWallH(L);
    const faceH=isRubyNorthWall(L,x,y)?rubyNorthWallH(L):H;
    if(useWallFaces(L)){
      const faceL=TILEBLIT.faceL||TILEBLIT.face;
      const faceR=TILEBLIT.faceR||faceL;
      const fadeL=TILEBLIT.faceFadeL||faceL;
      const fadeR=TILEBLIT.faceFadeR||faceR;
      const sec=secretSeamAt(L,x,y);
      const sf=sec&&secretFaceOk(sec.face||'n')?(sec.face||'n'):'';
      const sid=x*31+y*17;
      const secN=secretWallSprite('n')||fadeL, secE=secretWallSprite('e')||fadeR, secW=secretWallSprite('w')||fadeR;
      if(oS) drawMasonryFace(g, sf==='n'?secN:faceL, x, y+1, x+1.14, y+1, faceH, 0, -1, sid);
      if(oE) drawMasonryFace(g, sf==='e'?secE:faceR, x+1, y, x+1, y+1.14, faceH, -1, 0, sid+3);
      if(oN) drawMasonryFace(g, faceL, x, y, x+1.14, y, faceH, 0, 1, sid+7);
      if(oW) drawMasonryFace(g, sf==='w'?secW:faceR, x, y, x, y+1.14, faceH, 1, 0, sid+11);
      drawMasonryCoping(g, x, y, faceH, oN, oE, oS, oW);
    } else if(wallImg){
      const m=oE&&!oS?pack.wallR:pack.wall;
      if(wallImg===wallBlit) drawTilesetSprite(g, wallImg, s, m);
      else g.drawImage(wallImg, s.x-m.ox*sx, s.y-m.oy*sy, m.w*sx, m.h*sy);
    }
    /* No QUALITY discs on bare masonry — those were the leftover wall globes. */
    if(rk && rk.hp<rk.max) drawCracks(g,s.x,s.y,faceH,1-rk.hp/rk.max);
    if(DIGT && DIGT.i===x && DIGT.j===y) drawDigMark(g,s.x,s.y,faceH);
    if(G.dig && G.dig.i===x && G.dig.j===y) drawDigProgress(g,s.x,s.y,faceH,G.dig.min/digNeedMinutes());
    drawSecretFadedFace(g, L, x, y, faceH, TILEBLIT.faceL||TILEBLIT.face, TILEBLIT.faceR||TILEBLIT.face);
  }

  // Flare background layer: floors always sit under the party and foes.
  for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
    const t=L.grid[y][x];
    if(t===1||t===2||!L.seen[y][x]) continue;
    drawFloorCell(x,y,t);
  }

  // Flare object layer: masonry / cavern walls interleaved with actors.
  for(let d=minx+miny; d<=maxx+maxy; d++){
    const x0=Math.max(minx,d-maxy), x1=Math.min(maxx,d-miny);
    for(let x=x0;x<=x1;x++){
      const y=d-x, t=L.grid[y][x];
      if(t!==1||!L.seen[y][x]) continue;
      drawWallCell(x,y);
    }
    const b=B[d]; if(b) for(const f of b) f();
  }
  // Pinning slabs only. Cover rubble is drawn after fallen kin so stones sit on the bodies.
  for(const p of G.props) if(p.pin && near(p) && seenAt(p)) drawProp(g,p,pal);
}
function drawCracks(g,sx,sy,WH,f){
  g.save(); g.globalAlpha=clamp(f*1.15,0,1);
  g.strokeStyle='rgba(14,9,6,0.95)'; g.lineCap='round';
  for(let k=0;k<3;k++){
    if(k/3>f) break;
    g.lineWidth=(1.4+f*2.6)*ZOOM;
    let px=sx+(h2(k,7)-0.5)*TW*0.34, py=sy-WH*(0.25+h2(k,3)*0.5);
    g.beginPath(); g.moveTo(px,py);
    for(let i=0;i<3;i++){ px+=(h2(k*5+i,9)-0.5)*TW*0.26; py+=(h2(k*3+i,4)-0.2)*WH*0.30; g.lineTo(px,py); }
    g.stroke();
  }
  if(f>0.55){ g.fillStyle='rgba(255,150,80,'+((f-0.55)*0.5)+')';

}

function drawAim(g){

/* ---------------------------- lighting ---------------------------- */
function gatherLights(L){
  const seen=(x,y)=>{ if(!L||!L.seen) return true; const i=x|0, j=y|0; return !!(L.seen[j]&&L.seen[j][i]); };
  const out=[];
  for(const l of (L.lights||[])){
    if(!seen(l.x,l.y)) continue;
    out.push({x:l.x,y:l.y,c:l.c,r:l.r,f:l.f||1,fl:1});
  }
  const p=player();
  if(p) out.push({x:p.x,y:p.y,c:'#ffd6a0',r:6.6,f:1.05,fl:0});
  for(const e of G.ents) if(!e.dead&&e.boss&&e.glow) out.push({x:e.x,y:e.y,c:e.glow,r:7,f:1.3,fl:1});
  for(const s of G.shots) out.push({x:s.x,y:s.y,c:s.col,r:2.6,f:1.1,fl:0});
  for(const pr of G.props){
    if(!seen(pr.x,pr.y)) continue;
    if(pr.k==='lantern') out.push({x:pr.x,y:pr.y,c:'#ffb45c',r:5.2,f:1.0,fl:1});
    if(pr.k==='rubywall'||pr.k==='rubydoor') out.push({x:pr.x,y:pr.y,c:'#ff2a3c',r:5.2,f:1.15,fl:1});
    if(pr.k==='brazier') out.push({x:pr.x,y:pr.y,c:'#ff8a3a',r:5.5,f:1.1,fl:1});
    if(pr.k==='bronzedoor') out.push({x:pr.x,y:pr.y,c:'#d4a04a',r:5.8,f:1.05,fl:1});
    if(pr.k==='bell') out.push({x:pr.x,y:pr.y,c:'#d4a04a',r:2.2,f:0.55,fl:1});
  }
  return out;
}
function gatherLightsCapped(L){
  const out=gatherLights(L);
  const cap=QUALITY?16:8;
  if(out.length<=cap) return out;
  const p=player();
  if(!p){ out.length=cap; return out; }
  out.sort((a,b)=>((a.x-p.x)**2+(a.y-p.y)**2)-((b.x-p.x)**2+(b.y-p.y)**2));
  out.length=cap;
  return out;
}
/* Revealed tiles stay readable. Fog of war is the unseen rock mask, not a cave gloom
   multiply. Lanterns still add a warm punch on top of a bright fill. */
function applyLighting(g,L){
  /* Phones keep the same painted lightmap. The buffer is 1:1 so this is
     a copy, not an upscale — scaling was what drew coloured scanlines. */
  const x=lmx, w=LM.width, h=LM.height;
  x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='source-over';
  x.fillStyle='#e6d8c4'; x.fillRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  const scx=w/Math.max(1,VW), scy=h/Math.max(1,VH);
  for(const li of gatherLightsCapped(L)){
    const s=w2s(li.x,li.y), cx=s.x*scx, cy=(s.y-TH*.8)*scy;
    const flick = (QUALITY && li.fl && !PHONE_GFX)? (0.90+Math.sin(G.elapsed*7.3+li.x*3.1)*0.06+Math.sin(G.elapsed*17+li.y)*0.035) : 1;
    const rad=li.r*TW*0.27*li.f*flick*(w/Math.max(1,VW*0.5));
    if(cx<-rad||cy<-rad||cx>w+rad||cy>h+rad) continue;
    const c=rgbOf(li.c);
    const gr=x.createRadialGradient(cx,cy,1,cx,cy,rad);
    gr.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',0.55)');
    gr.addColorStop(0.34,'rgba('+c[0]+','+c[1]+','+c[2]+',0.28)');
    gr.addColorStop(0.68,'rgba('+Math.round(c[0]*0.6)+','+Math.round(c[1]*0.5)+','+Math.round(c[2]*0.5)+',0.10)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';
  g.globalCompositeOperation='multiply';
  blitScreen(g, LM);
  g.globalCompositeOperation='source-over';
}

/* cone of dust hanging under each lantern */
function drawGodRays(g){

}

function drawBloom(g){

}

function drawMemoryShade(g,L){
  if(!L||!L.grid||!L.seen) return;
  const c=[s2w(-TW,-TH*5),s2w(VW+TW,-TH*5),s2w(-TW,VH+TH*5),s2w(VW+TW,VH+TH*5)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-1);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+1);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-1);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+1);
  g.save();
  g.fillStyle='rgba(0,0,0,0.78)';
  for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
    if(!L.seen[y]||!L.seen[y][x]) continue;
    if(L.vis&&L.vis[y]&&L.vis[y][x]) continue;
    const s=w2s(x,y);
    const t=L.grid[y][x];
    if(isWalkTile(t)){
      g.beginPath();
      g.moveTo(s.x, s.y-TH/2); g.lineTo(s.x+TW/2, s.y);
      g.lineTo(s.x, s.y+TH/2); g.lineTo(s.x-TW/2, s.y);
      g.closePath(); g.fill();
    } else if(t===1||t===2){
      const H=useWallFaces(L)?wallFaceH(L):TH;
      g.beginPath();
      g.ellipse(s.x, s.y-H*0.38, TW*0.62, TH*0.9+H*0.28, 0, 0, TAU);
      g.fill();
    }
  }
  g.restore();
}

function drawBeyondMask(g,L){
  if(!L||!L.grid) return;
  const c=[s2w(-TW,-TH*5),s2w(VW+TW,-TH*5),s2w(-TW,VH+TH*5),s2w(VW+TW,VH+TH*5)];

  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+2);

  const open=isWalkTile;

  const mg=bxx;
  if(key!==BX_KEY){
    BX_KEY=key;
    mg.setTransform(1,0,0,1,0,0);
    mg.clearRect(0,0,BX.width,BX.height);
    mg.fillStyle=rock;
    mg.fillRect(0,0,BX.width,BX.height);
    mg.setTransform(BX.width/Math.max(1,VW),0,0,BX.height/Math.max(1,VH),0,0);
    mg.globalCompositeOperation='destination-out';
    mg.fillStyle='#fff';
    const pad=QUALITY?1.12:1.22;
    for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
      if(!L.seen[y]||!L.seen[y][x]) continue;
      const t=L.grid[y][x];
      const s=w2s(x,y);
      if(isStartBackWall(L,x,y)){
        const oE=L.grid[y]&&open(L.grid[y][x+1])&&L.seen[y][x+1];
        if(!oE) continue;
        const tall=startCaveInH(L);
        punchMasonryCoping(mg, x, y, tall, 0, 1, 0, 0);
        const face=w2s(x+1, y+0.5);
        mg.beginPath();
        mg.ellipse(Math.round(face.x), Math.round(face.y-tall*0.52), TW*1.35*pad, TH*0.95*pad+tall*0.72, 0, 0, TAU);
        mg.fill();
        continue;
      }
      if(open(t)){
        mg.beginPath();
        mg.ellipse(Math.round(s.x), Math.round(s.y), TW*0.92*pad, TH*0.92*pad, 0, 0, TAU);
        mg.fill();
      } else if(t===1){
        if(isStartBackWall(L,x,y)) continue;
        const oS=L.grid[y+1]&&open(L.grid[y+1][x]);
        const oE=L.grid[y]&&open(L.grid[y][x+1]);
        const oN=L.grid[y-1]&&open(L.grid[y-1][x]);
        const oW=L.grid[y]&&open(L.grid[y][x-1]);
        if(oS||oE||oN||oW){
          const tall=isRubyNorthWall(L,x,y)?rubyNorthWallH(L):(useWallFaces(L)?wallFaceH(L):TH);
          punchMasonryCoping(mg, x, y, tall, oN, oE, oS, oW);
          mg.beginPath();
          mg.ellipse(Math.round(s.x), Math.round(s.y-tall*0.48), TW*1.15*pad, TH*0.85*pad+tall*0.62, 0, 0, TAU);
          mg.fill();
        }
      }
    }
    if(L.rubyDoor){
      const ds=w2s(L.rubyDoor.x, rubyDoorPlaneY(L.rubyDoor));
      const prop=(G.props||[]).find(p=>p.k==='rubydoor' && Math.hypot(p.x-L.rubyDoor.x, p.y-L.rubyDoor.y)<0.6);
      const H=rubyDoorH();
      mg.beginPath();
      mg.ellipse(Math.round(ds.x), Math.round(ds.y-H*0.52), Math.max(TW*1.15, H*0.42), H*0.62, 0, 0, TAU);
      mg.fill();
    }
    mg.setTransform(1,0,0,1,0,0);
    mg.globalCompositeOperation='source-over';
  }
  blitScreen(g, BX);
}

function drawAtmosphere(g,L){
  g.fillStyle=hexA(L.pal.fogTop, QUALITY?0.10:0.05);
  g.fillRect(0,0,VW,VH*0.05);
  g.fillStyle=hexA(L.pal.fogTop, QUALITY?0.08:0.04);
  g.fillRect(0,VH*0.95,VW,VH*0.05);
  if(!QUALITY || PHONE_GFX) return;
  const haze=g.createRadialGradient(VW*0.62,VH*0.36,20,VW/2,VH/2,Math.max(VW,VH)*0.72);
  haze.addColorStop(0,hexA(L.pal.key,0.04)); haze.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=haze; g.fillRect(0,0,VW,VH);
}

function drawGrain(g){
  if(PHONE_GFX||!TEX.grain) return;
  g.save(); g.globalCompositeOperation='overlay'; g.globalAlpha=0.35;
  const ox=(G.t*37)%140, oy=(G.t*23)%140;
  const pt=g.createPattern(TEX.grain,'repeat');
  if(pt){ g.translate(-ox,-oy); g.fillStyle=pt; g.fillRect(0,0,VW+140,VH+140); }
  g.restore(); g.globalAlpha=1; g.globalCompositeOperation='source-over';
}

function drawFloaters(g){
  for(const t of G.texts){
    const s=w2s(t.x,t.y); g.globalAlpha=clamp(t.life/(t.kind==='dmg'?1.65:t.kind==='miss'?1.35:.95),0,1);

    g.font='800 '+(px*ZOOM)+'px "Trebuchet MS",sans-serif'; g.textAlign='center';
