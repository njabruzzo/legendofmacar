function tryFindSecret(p, mode){
  const L=G.lvl; if(!p||!L||!L.secrets) return;
  mode=mode||'search';
  L.secrets.forEach(sec=>{
    if(sec.open) return;
    const sx=sec.x||sec.i, sy=sec.y||sec.j;
    const d=Math.hypot(p.x-sx, p.y-sy);
    // AD&D 1e: dwarves detect sliding/shifting stone within 10' (~2 tiles).
    if(d>(mode==='pass'?2.05:1.9)) return;
    if(mode==='pass'){
      if(sec.passTried) return;
      sec.passTried=1;
      const roll=d6();
      if(roll<=2){
        openSecret(sec);
        say('Macar\'s eye catches a seam in the stone. (d6 '+roll+' \u2264 2)','#ffe08a');
      }
      return;
    }
    // Active search: 1–4 in 6 (PHB dwarf sliding walls ~2/3). Focused wall search: 1–5.
    const need=mode==='focus'?5:4;
    const roll=d6();
    if(roll<=need){
      openSecret(sec);
      say('A hidden door in the brick. Search d6 '+roll+' \u2264 '+need+'.','#ffe08a');
    } else {
      ftext(sx, sy-0.25, 'd6 '+roll, '#9a8a78');
      if(mode==='focus' || !sec.searchNoted){
        sec.searchNoted=1;
        say('No seam this turn. Search d6 '+roll+' vs '+need+' in 6.','#9a8a78');
        hint('Keep searching. Dwarves find secret stonework on 1\u20134 in 6.',3.4);
      }
    }
  });
}
function openSecret(sec){
  if(!sec||sec.open) return;
  sec.open=1;
  const L=G.lvl, g=L.grid;
  const i=sec.i||(sec.x|0), j=sec.j||(sec.y|0);
  rect(g, i, j, sec.w||2, Math.max(1,sec.h||1), 0);
  if(sec.face==='n') rect(g, i, j+1, sec.w||3, 1, 0);
  burst(sec.x||sec.i, sec.y||sec.j, '#d4a04a', 16, 2.6);
  if(sec.kind==='warrens'){
    buildGoblinWarrens(L, sec);
    return;
  }
  if(sec.path) carvePath(g, sec.path, 2.1, 0);
  caveDisk(g, L.dungeon?L.dungeon.x:44, L.dungeon?L.dungeon.y:11, 5.2, 4.2, 0);
  say('A hidden door in the brick. A tunnel beyond.','#ffe08a');
  hint('Secret door. Goblin dens wait down the tunnel.',4.4);
  if(!L.flags.dungeon){
    L.flags.dungeon=1;
    const dx=L.dungeon?L.dungeon.x:44, dy=L.dungeon?L.dungeon.y:11;
    wave([['goblin',dx-1.4,dy-0.8],['goblin',dx+1.6,dy+0.6],['goblin',dx-0.4,dy+1.5],['goblin',dx,dy]]);
  }
}
function seedRng(s){
  let x=(s>>>0)||1;
  return ()=>{ x=(Math.imul(x,1664525)+1013904223)>>>0; return (x>>>8)/16777215; };
}
function buildGoblinWarrens(L, sec){
  const g=L.grid, rnd=seedRng(L.warrenSeed||((Math.random()*1e9)|0)+7);
  const sx=sec.x||sec.i, sy=sec.y||sec.j;
  const stair={x:sx+6.2, y:sy+4.4};
  carvePath(g, [[sx+1.2,sy],[sx+3.8,sy+1.6],[stair.x,stair.y]], 2.85, 0);
  caveDisk(g, stair.x, stair.y, 2.8, 2.4, 3);
  G.props.push({x:stair.x,y:stair.y,k:'stairs',s:1.28,label:'Goblin Warrens'});
  L.lights.push({x:stair.x,y:stair.y,c:'#7dff9a',r:6.4,f:1.15});
  L.lights.push({x:stair.x,y:stair.y-1.2,c:'#ffb45c',r:4.2,f:0.9});
  L.warrenStair={x:stair.x,y:stair.y};
  say('A hidden door. Stairs drop toward goblin-work.','#ffe08a');
  hint('Goblin Warrens. The stair leads into a random den.',4.6);
  const rooms=[];
  let cx=stair.x+3.5, cy=stair.y+5.5;
  const n=5+(rnd()*3)|0;
  for(let i=0;i<n;i++){
    cx += 2.4+rnd()*5.5;
    cy += (rnd()<0.45?-1:1)*(1.8+rnd()*4.5);
    cx=clamp(cx, 48, L.w-7);
    cy=clamp(cy, 38, L.h-7);
    const rw=3.1+rnd()*2.3, rh=2.6+rnd()*2.0;
    caveDisk(g, cx, cy, rw, rh, 0);
    const prev=rooms.length?rooms[rooms.length-1]:stair;
    carvePath(g, [[prev.x,prev.y],[cx,cy]], 1.85, 0);
    rooms.push({x:cx,y:cy,rw,rh});
    L.lights.push({x:cx,y:cy,c:'#6a8a4a',r:3.5,f:0.55});
    if(rnd()<0.45) G.props.push({x:cx+(rnd()-0.5)*1.6,y:cy+(rnd()-0.5)*1.2,k:rnd()<0.5?'bones':'crate'});
  }
  L.dungeon=rooms[rooms.length-1]||stair;
  L.flags.dungeon=1;
  const denizens=['goblin','goblin','kobold','rat','beetle','orc','gibberling'];
  const list=[];
  rooms.forEach(r=>{
    const k=denizens[(rnd()*denizens.length)|0];
    list.push([k, r.x+(rnd()-0.5)*1.8, r.y+(rnd()-0.5)*1.4]);
    if(rnd()<0.6) list.push(['goblin', r.x+1.1, r.y-0.5]);
  });
  const last=rooms[rooms.length-1];
  if(last) list.push(['goblin', last.x, last.y]);
  wave(list);
  G.ents.forEach(e=>{
    if(e.team==='foe' && (e.kind==='goblin'||e.kind==='kobold'||e.kind==='orc'||e.kind==='bugbear'||e.kind==='gibberling')){
      if(!e.aggro) e.aggro=3.4;
    }
  });
}
function nearestFoe(e,maxd){ let b=null,bd=maxd||99;
  const party=e&&e.team==='party';
  for(const o of G.ents){
    if(o.team!=='foe'||o.dead) continue;
    if(party && !tileVisible(o.x,o.y)) continue;
    const d=dist(e,o); if(d<bd){bd=d;b=o;}
  } return b; }
function nearestAlly(e,maxd,hurt){ let b=null,bd=maxd||99;
  for(const o of G.ents){ if(o.team!=='party'||o.dead) continue; if(hurt&&o.hp>=o.maxhp*.7) continue;
    const d=dist(e,o); if(d<bd){bd=d;b=o;} } return b; }

/* ---------------------------- movement ---------------------------- */
function walk(x,y,e){ const L=G.lvl; if(!L) return false;
  const i=x|0,j=y|0; if(j<0||j>=L.h||i<0||i>=L.w) return false;
  const t=L.grid[j][i];
  if(t===0||t===3) return true;
  if(t===4) return !!(e && e.kind==='gnome');
  return false; }
function canBe(x,y,r,e){
  return walk(x+r,y,e)&&walk(x-r,y,e)&&walk(x,y+r,e)&&walk(x,y-r,e)&&
         walk(x+r*.7,y+r*.7,e)&&walk(x-r*.7,y-r*.7,e)&&walk(x+r*.7,y-r*.7,e)&&walk(x-r*.7,y+r*.7,e); }
function move(e,dx,dy,dt){
  const nx=e.x+dx*dt, ny=e.y+dy*dt; let moved=0;
  if(canBe(nx,e.y,e.r,e)){ e.x=nx; moved=1; }
  if(canBe(e.x,ny,e.r,e)){ e.y=ny; moved=1; }
  return moved;
}

function hitRect(h,x,y){ return !!(h && x>=h.x && x<=h.x+h.w && y>=h.y && y<=h.y+h.h); }

function layoutUI(){
  UIBTN.length=0;
  const s=UIS;
  const oneLine = !PORT;
  const rows = oneLine ? [HUD_ROW] : [HUD_ROW.slice(0,5), HUD_ROW.slice(5)];
  const perRow = Math.max(...rows.map(r=>r.length));
  const stickR = PORT?32*s:34*s;
  const stickX = PORT?48*s: 14*s+stickR;
  const gap = PORT? 4*s : 5*s;
  const rowGap = PORT? 14*s : 8*s;
  const pinReserve = HUD_PINNED.length ? (PORT?58*s:52*s) : 0;
  const rightReserve = 10*s + pinReserve;
  const stickReserve = stickX + stickR + (PORT?10*s:12*s);
  const availW = Math.max(180, VW - stickReserve - rightReserve);
  const slot = Math.min(PORT?54:46, Math.max(32, (availW - (perRow-1)*gap)/perRow));
  const skillsW = perRow*slot + (perRow-1)*gap;
  const by = VH - (PORT? 26*s : 16*s) - slot/2;
  const topY = by - (rows.length-1)*(slot+rowGap);
  const midY = (topY+by)/2;
  let left = stickReserve;
  const extra = VW - stickReserve - rightReserve - skillsW;
  if(extra>0) left = stickReserve + extra*0.15;

  UI.orb = { r:slot/2, x:left+slot/2, y:midY };
  UI.attack={x:0,y:0,r:slot/2};
  rows.forEach((row,ri)=>{
    const y = topY + ri*(slot+rowGap);
    const rowW = row.length*slot + (row.length-1)*gap;
    const rowLeft = left + (skillsW-rowW)/2;
    row.forEach((b,i)=>{
      const x = rowLeft + i*(slot+gap) + slot/2;
      const btn={x, y, r:slot/2, key:b.key, ico:b.ico, label:b.label, slot:1};
      if(b.key==='attack') UI.attack=btn;
      if(b.key==='pack') UI.orb={r:slot/2, x, y};
      UIBTN.push(btn);
    });
  });
  HUD_PINNED.forEach(b=>{
    const x=VW-rightReserve+pinReserve/2, y=midY;
    UIBTN.push({x, y, r:slot/2, key:b.key, ico:b.ico, label:b.label, slot:1, pinned:1});
  });
  UI.hudTop = topY - slot/2 - (PORT?14:10)*s;
  UIBTN.push({x: 20*s, y: 20*s, r: 16*s, key:'pause'});
  UI.stickHome={ x: stickX, y: midY, r: stickR };
}
function btnAt(x,y){ for(const b of UIBTN) if(Math.hypot(x-b.x,y-b.y)<b.r*1.25) return b; return null; }

const pressed={};
function onDown(id,x,y,ptr){

  if(G.talk){

  }
  const b=btnAt(x,y);

  if(G.inspect){ G.inspect=null; return; }
  const ph=(UI.portraitHits||[]).find(z=>x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h);
  if(ph){ G.inspect=ph.key; return; }
  if(G.showObjs){

  if(G.aim && !(x<VW*0.5||nearHome)){ aimDrag=id; }

function onMove(id,x,y){ const k=IN.stick; if(k&&k.id===id){ k.x=x;k.y=y;
  if(Math.hypot(x-k.ox,y-k.oy)>10) k.moved=1; return; }
  if(G.aim&&aimDrag===id){ const p=player(); if(p){ const w=s2w(x,y+22*ZOOM), d=dist(p,w), R=8;
    G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y}; } } }
let aimDrag=null;
function onUp(id,x,y){

    const t=digTarget(p);
    if(!t){
      G.dig=null;
      hint('Face solid rock. Dwarves excavate one square foot per 10 minutes.',4.4);
      say('Shovel out. Face the stone.','#d8c49a');
    } else {
      G.dig={i:t.i,j:t.j,min:0};
      say('Digging. One square foot per 10 minutes.','#d8c49a');
      hint('Solid rock — 10 dungeon minutes a square (1 second = 1 minute).',4);
    }
    return;
  }
  if(key==='camp'){ campRest(); return; }
  if(key==='craft'){ openCraftBench(); return; }
  if(key==='pack'){
    G.packFrom='play'; G.packWho=G.packWho||'macar';
    ensurePacks(); syncPackTotals();
    G.scene='pack';
    return;
  }
  if(key==='bomb'){
    if(refuseAttack(p)) return;
    syncPackTotals();
    if(partyCount('bombs')<=0){
      hint(partyCount('bombKit')?'No bombs in any pack. Craft more at the bench.':'No bombs. Loot the red hat — he carries a bomb-making kit.',2.8);
      return;
    }
    if(cds.bomb>0) return;
    const t=nearestFoe(p,8);
    G.aim = t? {x:t.x,y:t.y} : {x:p.x+(p.fdx||0)*4.5, y:p.y+(p.fdy||1)*4.5};
    cds.bomb=ABIL.find(a=>a.key==='bomb').cd;
    p.dest=null;
    throwBomb();
    return;
  }
  if(key==='bow'){
    if(refuseAttack(p)) return;
    syncPackTotals();
    if(partyCount('ammo')<=0){ hint('No bolts. Buy from Noz, or pick quarrels that save.',3); return; }
    if(cds.bow>0) return;
    const t=nearestFoe(p,9);
    const tx=t?t.x:p.x+p.fdx*7, ty=t?t.y:p.y+p.fdy*7;
    takeFromPacks('ammo');
    cds.bow=1.4;
    p.dest=null;
    const a=ang(tx-p.x,ty-p.y); p.fdx=Math.cos(a); p.fdy=Math.sin(a);
    // Pose only. swung=1 up front so the melee tick never fires off this timer.
    p.atkKind='bow'; p.atk=p.atkMax; p.swung=1;
    shoot(p, tx, ty, 0, 'bolt', '#d8c49a', 14);
    say('MACAR looses a quarrel.','#ffb45c');
    return;
  }
  const a=ABIL.find(z=>z.key===key); if(!a||cds[key]>0) return;
  if(key==='throw' && refuseAttack(p)) return;
  cds[key]=a.cd; p.dest=null;
  if(key==='ale'){
    const ch=takeHealCharge();
    if(!ch){ cds[key]=0; hint('No beer draughts in the packs. Brew more at camp.',2.6); return; }
    if(ch.kind==='potion'){
      drinkPotion(ch.p, p);
      learn('ale',3);
    } else {
      const heal=ri(1,10);
      applyHeal(p, heal);
      learn('ale',3);
      say('A draught of beer. Heals '+heal+' (d10).','#d2bd63');
    }
  }
  if(key==='throw'){ const t=nearestFoe(p,10); const tx=t?t.x:p.x+p.fdx*6, ty=t?t.y:p.y+p.fdy*6;
    const thrower=G.ents.find(z=>z.role==='pick'&&!z.dead)||p;
    thrower.fdx=Math.cos(ang(tx-thrower.x,ty-thrower.y)); thrower.fdy=Math.sin(ang(tx-thrower.x,ty-thrower.y));
    shoot(thrower, tx, ty, 0, 'pick', '#cfd6de', 12);
    say((thrower.name||'PICK')+' hurls a pick. d20 vs AC.','#ffb45c'); }
  if(key==='rally'){ G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead){ e.buff=8; e.hp=Math.min(e.maxhp,e.hp+30);
      burst(e.x,e.y,'#ffd27a',10,2);} }); ftext(p.x,p.y-.8,'RALLY','#ffd27a',1);
    say('MACAR raises the hammer. The kin answer.','#ffd27a'); }
}

/* ==========================================================================
   UPDATE
   ========================================================================== */
function update(dt){
  if(G.sleepShow && G.scene==='play' && !G.paused){
    G.sleepShow.t+=dt;
    if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
    if(G.flash){ G.flash.a-=dt*1.8; if(G.flash.a<=0) G.flash=null; }
    if(G.sleepShow.t>=G.sleepShow.dur) endSleepShow();
    return;
  }
  if(G.scene!=='play'||G.paused||G.talk) return;
  G.elapsed+=dt;
  G.dayClock=(G.dayClock||0)+dt;
  if(G.dayClock>=GHOST_DAY_SECS){
    G.dayClock=0; G.day=(G.day||1)+1; tryPordoomGifts();
  }
  const L=G.lvl; if(!L) return;
  PROMPT=null;
  runSystems(dt, { ents:G.ents, abilities:ABIL, cds:cds });
  if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
  G.hurt=Math.max(0,G.hurt-dt*1.4);

  const p=player();
  if(p){
    let dx=0,dy=0, analog=0;
    if(IN.stick && IN.stick.moved){
      const ox=IN.stick.x-IN.stick.ox, oy=IN.stick.y-IN.stick.oy, m=Math.hypot(ox,oy);
      const dead=6*UIS;
      if(m>dead){
        const f=clamp((m-dead)/(46*UIS),0,1);
        const sx=ox/m, sy=oy/m;
        let wx=sy/(TH/2)+sx/(TW/2), wy=sy/(TH/2)-sx/(TW/2);
        const wm=Math.hypot(wx,wy)||1; dx=wx/wm; dy=wy/wm; analog=f; p.dest=null;
      }
    }
    const K=IN.keys; let kx=0,ky=0;
    if(K['w']||K['arrowup']){kx-=1;ky-=1;} if(K['s']||K['arrowdown']){kx+=1;ky+=1;}
    if(K['a']||K['arrowleft']){kx-=1;ky+=1;} if(K['d']||K['arrowright']){kx+=1;ky-=1;}
    if(kx||ky){ const m=Math.hypot(kx,ky); dx=kx/m; dy=ky/m; analog=1; p.dest=null; }

    if((p.webbed||0)>0){
      p.webbed-=dt;
      p.webChk=(p.webChk||0)+dt;
      dx=0; dy=0; analog=0; p.dest=null; p.moving=0;
      if(p.webChk>=0.85){
        p.webChk=0;
        const r=strengthCheck(p);
        if(r.ok){ p.webbed=0; ftext(p.x,p.y,'broke free','#ffe08a'); }
        else ftext(p.x,p.y,'str '+r.roll,'#c9b895');
      }
    }

    if(!dx&&!dy&&p.dest){
      if(p.dest.foe){
        const foe=G.ents.find(z=>z.id===p.dest.foe&&!z.dead);
        if(!foe) p.dest=null;
        else { p.dest.x=foe.x; p.dest.y=foe.y; }
      } else if(p.dest.loot){
        const pile=(G.loot||[]).find(z=>z.id===p.dest.loot&&!z.gone);
        if(!pile) p.dest=null;
        else { p.dest.x=pile.x; p.dest.y=pile.y; }
      } else if(p.dest.corpse){
        const body=G.ents.find(z=>z.id===p.dest.corpse&&isLootableBody(z));
        if(!body) p.dest=null;
        else { p.dest.x=body.x; p.dest.y=body.y; }
      }
    }
    if(!dx&&!dy&&p.dest){
      const d=dist(p,p.dest);
      const arrive=p.dest.foe?(p.range+.2):(p.dest.loot||p.dest.corpse)?1.12:0.26;
      if(d<=arrive){
        if(p.dest.loot){ const pile=(G.loot||[]).find(z=>z.id===p.dest.loot&&!z.gone); if(pile) takeLoot(pile); }
        if(p.dest.corpse){ const body=G.ents.find(z=>z.id===p.dest.corpse&&isLootableBody(z)); if(body) lootNearbyCorpses(p,1.85); }
        if(!p.dest.foe && !p.dest.loot && !p.dest.corpse && canBe(p.dest.x,p.dest.y,p.r,p)){ p.x=p.dest.x; p.y=p.dest.y; }
        p.dest=null; p.stuck=0;
      }
      else {
        dx=p.dest.x-p.x; dy=p.dest.y-p.y; analog=1;
        p.stuck=(p.stuck||0)+dt;
        if(p.lastD!==undefined && p.lastD-d>0.008) p.stuck=0;
        p.lastD=d; if(p.stuck>1.4){ p.dest=null; p.stuck=0; }
      }
    }

    let sp=p.sp;
    if((p.slowT||0)>0){ p.slowT=Math.max(0,p.slowT-dt); sp*=0.4; }
    if(G.searching) sp*=0.16;
    if(G.secretSearch) sp*=0.18;
    if(G.digging) sp*=0.14;
    if(analog && analog<1) sp*=analog;
    steerWalk(p, dx, dy, sp, dt);
    if(p.moving) recordTrail(p);
    p.guardT=Math.max(0,(p.guardT||0)-dt);
    p.guard = !!p.defending || p.guardT>0;
    const stepped=nearestLoot(p,0.7);
    if(stepped) takeLoot(stepped);

    // auto-attack while standing in reach (Baldur's Gate: never swing while walking)
    if(!G.digging && !p.defending){
      const t=nearestFoe(p,p.range+.75);
      if(t&&p.ct<=0&&!p.moving){
        turnToward(p, t.x-p.x, t.y-p.y, dt, 18);
        p.atkKind='melee'; p.atk=p.atkMax; p.ct=p.cd; p.swung=0; p.aim=t; }
      if(!t) p.aim=null;
    } else if(p.defending) p.aim=null;

    G.cam.x=lerp(G.cam.x,p.x,1-Math.pow(.0004,dt));
    G.cam.y=lerp(G.cam.y,p.y,1-Math.pow(.0004,dt));
    rebuildVision();
    p.searchCd=Math.max(0,(p.searchCd||0)-dt);
    if(G.searching && (p.searchCd||0)<=0){
      p.searchCd=5;
      forageHerbs(nearestShroom(p,1.6)||p);
    }
    p.secretCd=Math.max(0,(p.secretCd||0)-dt);
    tryFindSecret(p,'pass');
    if(G.secretSearch && (p.secretCd||0)<=0){ p.secretCd=1.6; tryFindSecret(p,'search'); }
    if(G.digging){
      const t=digTarget(p);
      if(t){
        if(!G.dig || G.dig.i!==t.i || G.dig.j!==t.j) G.dig={i:t.i,j:t.j,min:0};
        else {
          const need=digNeedMinutes();
          G.dig.min+=dt;
          if(G.dig.min>=need){
            breakRock(L,G.dig.i,G.dig.j);
            if(G.digBoost>0) G.digBoost--;
            say('A square foot of stone comes away.','#d8c49a');
            G.dig=null;
          }
        }
      }
    }
    const body=nearestCorpse(p,1.72);
    if(body) lootNearbyCorpses(p,1.72);
    if(!PROMPT){
      const more=nearestCorpse(p,2.15);
      if(more) interact((more.crushed&&more.team==='party'?'Rouse ':'Loot ')+(more.name||'the fallen'),()=>lootCorpse(more));
    }
    const pile=nearestLoot(p,1.12);
    if(pile) takeLoot(pile, true);
    if(!PROMPT){
      const sh=nearestShroom(p,1.35);
      if(sh) interact('Search for herbs',()=>{ p.searchCd=5; forageHerbs(sh); });
    }
    if(!PROMPT){
      const craft=nearestCraftProp(p,1.35);
      if(craft) interact(craftPropLabel(craft),()=>scavengeCraft(craft));
    }
    if(!PROMPT && G.secretSearch && L.secrets){
      const sec=L.secrets.find(s=>!s.open && Math.hypot(p.x-(s.x||s.i),p.y-(s.y||s.j))<1.9);
      if(sec) interact('Search the wall',()=>tryFindSecret(p,'focus'));
    }
    for(const pr of G.props){
      if(pr.sprung>0) pr.sprung=Math.max(0,pr.sprung-dt);
      if(pr.k!=='trap') continue;
      pr.cd=(pr.cd||0)-dt;
      if(pr.cd>0) continue;
      for(const e of G.ents){
        if(e.dead||e.team!=='party') continue;
        if(dist(e,pr)<0.72){
          const pit=pr.trap==='trap_pit', rune=pr.trap==='trap_runes';
          damage(e, pit?16:rune?13:11, rune?'#c07bff':'#ff6a4a', rune?{magic:1,kind:'rune'}:{kind:'trap'});
          burst(pr.x,pr.y, rune?'#c07bff':'#c2452e', 12, 2.4);
          say((e.name||'Kin')+' hits a trap.','#ff6a6a');
          pr.cd=pit?2.8:rune?1.6:2.2; pr.sprung=0.55; shake(8); break;
        }
      }
    }
  }

  for(const e of G.ents){
    if(e.dead){
      if(e.ghost){
        e.ghostReturn=(e.ghostReturn||0)-dt;
        if(e.ghostReturn<=0) returnGhost(e);
      }
      if(!e.crushed) e.deadT=(e.deadT||0)+dt;
      continue;
    }
    e.anim+=dt*(e.moving?1:.35);
    if(e.flash>0) e.flash-=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    if(e.regen && e.hp<e.maxhp) e.hp=Math.min(e.maxhp, e.hp+0.5*dt);
    if(e.potionRegen>0){ e.potionRegen-=dt; e.hp=Math.min(e.maxhp, e.hp+2.2*dt); }
    if(e.afterHaste>0 && (e.buff||0)<=0){ e.afterHaste-=dt; e.sp=Math.max(1.2,(e.sp||3)*0.985); }
    if(e.invis>0){ e.invis-=dt; if(e.invis<=0) e.aggro=7.5; }
    if(e.poisonT>0){
      e.poisonT-=dt; e._pt=(e._pt||0)+dt;
      if(e._pt>=0.7){ e._pt=0; damage(e,2,'#6aff8a'); }
    }
    if(e.webbed>0 && !e.hero){
      e.webbed-=dt;
      e.webChk=(e.webChk||0)+dt;
      e.dest=null; e.moving=0; e.ix=0; e.iy=0;
      if(e.webChk>=0.9){
        e.webChk=0;
        const r=strengthCheck(e);
        if(r.ok){ e.webbed=0; ftext(e.x,e.y,'broke free','#ffe08a'); }
      }
    }
    if((e.slowT||0)>0 && e!==p) e.slowT=Math.max(0,e.slowT-dt);
    if(e.buff>0) e.buff-=dt;
    skillSystem.tickAttack(e, dt);
    if(e.atk>0){
      if(e.defending){ e.atk=0; e.swung=0; }
      else {
        e.atk-=dt;
        if(!e.swung&&e.atk<e.atkMax*.55){ e.swung=1; const bo=e.buff>0?1.5:1;
          if(e.web && e.team==='foe'){
            const t=player();
            if(t&&!t.dead){
              e._webFlip=!e._webFlip;
              if(e._webFlip && !(t.webbed>0)) shoot(e,t.x,t.y,0,'web','#e8e0d0',6.5);
              else meleeSwing(e,1.9,e.range+.35,e.dmg*bo);
            }
          } else if(e.ranged){ const t=e.team==='party'?nearestFoe(e,e.range+2):player();
            if(t){ const st=shotStyle(e); shoot(e,t.x,t.y,e.dmg*bo, st[0], st[1], st[2]); }
          } else meleeSwing(e,e.hero?2.3:1.9,e.range+.35,e.dmg*bo); }
        if(e.atk<=0) e.swung=0;
      }
    }
    if(e.kx||e.ky){ move(e,e.kx*6,e.ky*6,dt); e.kx*=Math.pow(.02,dt); e.ky*=Math.pow(.02,dt);
      if(Math.abs(e.kx)<.01)e.kx=0; if(Math.abs(e.ky)<.01)e.ky=0; }
    if(e.hero) continue;
    if(e.hidden){ e.moving=0; e.ix=0; e.iy=0; continue; }
    if(e.sleeping){ e.moving=0; e.ix=0; e.iy=0; continue; }
    if(e.fleeTo){
      const t=e.fleeTo, d=dist(e,t);
      e.fleeStuck=(e.fleeStuck||0)+dt;
      if(d>0.55 && e.fleeStuck<3.2){
        const run=Math.max(e.sp||4, 5.8);
        steerWalk(e, t.x-e.x, t.y-e.y, run, dt);
      } else {
        e.fleeStuck=0;
        e.x=t.x; e.y=t.y;
        if(e.fleePath && e.fleePath.length){
          e.fleeTo=e.fleePath.shift();
        } else {
          e.moving=0; e.ix=0; e.iy=0; e.fleeTo=null;
          if(e.onArrive){ const fn=e.onArrive; e.onArrive=null; fn(); }
        }
      }
      continue;
    }
    if(e.npc && e.team!=='party'){ e.moving=0; e.ix=0; e.iy=0; continue; }

    let tgt=null, want=e.range, form=0;
    if(e.team==='party'){
      if(e.heals){ const hu=nearestAlly(e,12,1);
        if(hu&&hu.hp<hu.maxhp*.6&&e.ct<=0){ hu.hp=Math.min(hu.maxhp,hu.hp+24);
          burst(hu.x,hu.y,'#ffe9a8',10,2); ftext(hu.x,hu.y,'+24','#ffe9a8'); e.ct=4.5; } }
      const kin=G.ents.filter(x=>x.team==='party'&&!x.dead&&!x.hero);
      const idx=kin.indexOf(e);
      const macarFighting=p&&!p.moving&&(p.aim||p.atk>0)&&!p.dest;
      const foe=nearestFoe(e, e.ranged?8:4.6);
      if(macarFighting&&foe&&p&&dist(e,p)<6.5){ tgt=foe; want=e.ranged?e.range*.7:e.range; }
      else if(p){
        if(p.moving) tgt=trailSlot(idx<0?0:idx)||partyForm(idx<0?1:idx+1, p);
        else tgt=partyForm(idx<0?1:idx+1, p);
        want=.38; form=1;
      }
    } else {
      tgt=nearestAlly(e,999);
      if(tgt){ const d=dist(e,tgt);
        if(d>e.aggro&&!e.boss&&!e.engaged) tgt=null; else e.engaged=1; }
      want=e.ranged?e.range*.75:e.range;
    }
    if(tgt){
      const d=dist(e,tgt);
      if(d>want){
        let vx=tgt.x-e.x, vy=tgt.y-e.y;
        const go=e.sp*((e.slowT||0)>0?0.4:1)*((e.webbed||0)>0?0:1);
        if(go<=0){ e.moving=0; e.ix=0; e.iy=0; }
        else {
        for(const o of G.ents){ if(o===e||o.dead) continue; const dd=dist(e,o);
          if(dd<(e.r+o.r)*1.15&&dd>.001){ vx+=(e.x-o.x)/dd*.35; vy+=(e.y-o.y)/dd*.35; } }
        steerWalk(e, vx, vy, go, dt);
        }
      } else {
        e.ix=0; e.iy=0; e.moving=0;
        if(form&&p) turnToward(e, p.fdx, p.fdy, dt, 8);
        else turnToward(e, tgt.x-e.x, tgt.y-e.y, dt, 14);
        if(!form&&!e.defending&&e.ct<=0&&tgt.hp!==undefined){ e.atk=e.atkMax; e.ct=e.cd; e.swung=0; }
      }
    } else { e.moving=0; e.ix=0; e.iy=0; }
    ghostSapperBomb(e, dt);
  }

  for(const s of G.shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; s.spin+=dt*14;
    if(!walk(s.x,s.y)){ s.life=0; burst(s.x,s.y,s.col,8,2); tryRetrieveBolt(s); continue; }
    for(const o of G.ents){ if(o.dead||o.team===s.team||o.npc||o.sleeping) continue;
      if(dist(s,o)<o.r+.45){
        if(s.kind==='web'){
          applyWeb(o);
          s.life=0; burst(s.x,s.y,'#e8e0d0',14,2.4); break;
        }
        let rolled;
        if(s.kind==='bolt'&&s.from){
          const prevD=s.from.dice, prevR=s.from.ranged;
          s.from.dice='1d4'; s.from.ranged=1;
          rolled=addAttack(s.from,o);
          s.from.dice=prevD; s.from.ranged=prevR;
        } else rolled=s.from?addAttack(s.from,o):(s.dmg||8);
        if(rolled) damage(o,onHitFx(s.from||s,o,rolled),s.col,s.from||s);
        s.life=0; burst(s.x,s.y,s.col,9,2.5); tryRetrieveBolt(s); break; } }
  }
  G.shots.forEach(s=>{ if(s.life<=0) tryRetrieveBolt(s); });
  G.shots=G.shots.filter(s=>s.life>0);
  for(const q of G.parts){ q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=11*dt;
    if(q.z<0){q.z=0;q.vz*=-.35;q.vx*=.6;q.vy*=.6;} q.life-=dt; }
  G.parts=G.parts.filter(q=>q.life>0);
  const pcap=QUALITY?48:12;
  if(G.parts.length>pcap) G.parts.splice(0, G.parts.length-pcap);
  for(const t of G.texts){ t.y-=dt*.9; t.life-=dt; }
  G.texts=G.texts.filter(t=>t.life>0);
  for(const l of G.log) l.a=Math.max(.35,l.a-dt*.03);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*46);
  if(G.flash){ G.flash.a-=dt*1.8; if(G.flash.a<=0) G.flash=null; }
  if(QUALITY && Math.random()<dt*6&&p){ const a=rnd(TAU),r=rnd(12,3);
    G.parts.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,z:rnd(2.8,.3),vx:rnd(.16,-.16),vy:rnd(.16,-.16),
      vz:rnd(.3,-.05),life:rnd(3.6,1.8),max:3.6,c:L.pal.dust,s:rnd(2.3,.9),amb:1}); }
  updateBombs(dt);
  if(G.songBuff>0 && p){ const rg=G.songBuff*0.5*dt;
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead) e.hp=Math.min(e.maxhp,e.hp+rg); }); }
  if(L.tick) L.tick(dt);
  endFightIfClear();
  if(G.ents.length>80) G.ents=G.ents.filter(e=>!(e.dead&&e.team==='foe'&&e.looted&&(e.deadT||0)>12));
}


/* ---------------------------- projection ---------------------------- */
function w2s(x,y){ return {
  x:(x-y)*(TW/2)+CAMSX,
  y:(x+y)*(TH/2)+CAMSY }; }
function s2w(sx,sy){
  const ix=sx-CAMSX, iy=sy-CAMSY;
  return {x:(iy/(TH/2)+ix/(TW/2))/2, y:(iy/(TH/2)-ix/(TW/2))/2}; }

/* emissive registrations, consumed by the bloom pass each frame */
let EMIT=[], RAYS=[];
function emit(sx,sy,r,c,i){ if(QUALITY&&EMIT.length<40) EMIT.push({x:sx,y:sy,r,c,i:i===undefined?1:i}); }
function ray(sx,sy,r,c,i){ if(QUALITY) RAYS.push({x:sx,y:sy,r,c,i}); }

/* ==========================================================================
   RENDER
   ========================================================================== */
function render(){
  const g=ctx; EMIT=[]; RAYS=[];
  syncCamProj();
  try{
  g.save();
  if(DIAG.shake && QUALITY && !PHONE_GFX && G.shake>0) g.translate(rnd(G.shake,-G.shake)*.3,rnd(G.shake,-G.shake)*.3);
  const L=G.lvl;
  g.fillStyle='#000000'; g.fillRect(-40,-40,VW+80,VH+80);
  const inWorld = L && G.scene!=='title' && G.scene!=='chapters' && G.scene!=='credits'
    && !(G.scene==='intro' && G.ch===1 && SPR.intro_cavein);
  if(inWorld){
    if(DIAG.world) drawWorld(g,L);
    if(DIAG.lighting) applyLighting(g,L);
    if(QUALITY && !PHONE_GFX){ if(DIAG.godrays) drawGodRays(g); if(DIAG.bloom) drawBloom(g); }
    if(DIAG.memshade) drawMemoryShade(g,L);
    if(DIAG.beyond) drawBeyondMask(g,L);
    if(DIAG.atmos) drawAtmosphere(g,L);
    if(DIAG.floaters) drawFloaters(g);
  }
  g.restore();
  if(DIAG.flash && G.flash){ g.globalAlpha=clamp(G.flash.a,0,1); g.fillStyle=G.flash.c; g.fillRect(0,0,VW,VH); g.globalAlpha=1; }
  if(DIAG.hurt && G.hurt>0.02){
    if(!QUALITY || PHONE_GFX){
      g.globalAlpha=G.hurt*0.25; g.fillStyle='#6a0000'; g.fillRect(0,0,VW,VH); g.globalAlpha=1;
    } else {
      const v=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.25,VW/2,VH/2,Math.max(VW,VH)*.62);
      v.addColorStop(0,'rgba(160,0,0,0)'); v.addColorStop(1,'rgba(150,0,0,'+(G.hurt*.55)+')');
      g.fillStyle=v; g.fillRect(0,0,VW,VH);
    }
  }
  if(DIAG.grain && inWorld && QUALITY && !PHONE_GFX) drawGrain(g);
  if(DIAG.hud && G.scene==='play') drawHUD(g);
  if(G.sleepShow && G.scene==='play') drawSleepRest(g);
  if(G.scene==='title') drawTitle(g);
  if(G.scene==='chapters') drawChapterSelect(g);
  if(G.scene==='credits') drawCredits(g);
  if(G.scene==='intro') drawIntro(g);
  if(G.scene==='camp') drawCamp(g);
  if(G.scene==='craft') drawCraft(g);
  if(G.scene==='pack') drawPack(g);
  if(G.scene==='trade') drawTrade(g);
  if(G.scene==='dead') drawDead(g);
  if(G.scene==='win') drawWin(g);
  if(G.paused&&G.scene==='play') drawPause(g);
  }catch(err){
    try{
      g.setTransform(DPR,0,0,DPR,0,0);
      g.fillStyle='#1a0808'; g.fillRect(0,0,VW,VH);
      g.fillStyle='#ffd27a'; g.font='14px sans-serif'; g.textAlign='left';
      String(err&&err.stack||err).split('\n').slice(0,12).forEach((ln,i)=>g.fillText(ln,16,28+i*18));
    }catch(_){}
  }
}

let DIGT=null;
function drawWorld(g,L){
  const pal=L.pal;
  { const pl=player(); DIGT = pl? digTarget(pl) : null; }
  ensureTileBlit(L);
  const padT=QUALITY?5:2;
  const c=[s2w(-TW,-TH*padT),s2w(VW+TW,-TH*padT),s2w(-TW,VH+TH*padT),s2w(VW+TW,VH+TH*padT)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-1);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+1);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-1);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+1);

  const B={}, push=(k,f)=>{(B[k]||(B[k]=[])).push(f);};
  const isoX=G.cam.x-G.cam.y, isoY=G.cam.x+G.cam.y;
  const limX=(VW*0.5+TW*2)/(TW*0.5), limY=(VH*0.5+TH*5)/(TH*0.5);
  const near=o=>{ const dx=(o.x-o.y)-isoX, dy=(o.x+o.y)-isoY; return dx>-limX&&dx<limX&&dy>-limY&&dy<limY; };
  const seenAt=o=>tileExplored(o.x,o.y);
  const visAt=o=>tileVisible(o.x,o.y);
  const showEnt=e=>{
    if(!near(e)) return false;
    if(e.ghost && e.dead) return false;
    if(e.team==='foe' && !e.dead && !visAt(e)) return false;
    if((e.dead||e.corpse||e.crushed) && !seenAt(e)) return false;
    return true;
  };
  for(const d of G.decals) if(near(d)&&seenAt(d)) push((d.x+d.y)|0,()=>drawDecal(g,d));
  for(const p of G.props) if(near(p)&&seenAt(p)&&!p.pin&&!p.cover) push((p.x+p.y)|0,()=>drawProp(g,p,pal));
  for(const q of (G.loot||[])) if(!q.gone&&near(q)&&seenAt(q)) push((q.x+q.y)|0,()=>drawLoot(g,q));
  for(const e of G.ents)  if(!e.crushed&&showEnt(e)) push((e.x+e.y)|0,()=>drawEnt(g,e));
  for(const s of G.shots) if(near(s)&&seenAt(s)) push((s.x+s.y)|0,()=>drawShot(g,s));
  if(QUALITY) for(const q of G.parts) if(near(q)) push((q.x+q.y)|0,()=>drawPart(g,q));
  for(const b of G.thrown) if(near(b)) push((b.x+b.y)|0,()=>drawThrown(g,b));
  if(G.aim) push(((G.aim.x+G.aim.y)|0)-1,()=>drawAim(g));
  if(L.plug&&!L.flags.broke) push((L.plug.x+L.plug.y)|0,()=>drawPlug(g,L));

  const WH=RWH*(TW/RTW);
  const p=player();
  const okTex=TEX.ready;
  const wallBlit=TILEBLIT.wall, floorBlit=TILEBLIT.floor, wallAtk=SPR[palWallKey(L)+'_atk']||SPR.wall_cave_atk;
  const pack=tilesetPack(L);
  const {sx,sy}=tilesetScale();
  if(p&&p.dest) push((p.dest.x+p.dest.y)|0,()=>drawMoveMark(g,p.dest));

  function drawFloorCell(x,y,t){
    const s=w2s(x,y);
    const m=pack.floor;
    const key=palFloorKey(pal);
    const variants=[SPR[key], SPR[key+'_w1'], SPR[key+'_w2'], SPR[key+'_atk']].filter(Boolean);
    const fl=floorBlit||(variants.length?variants[(h2(x,y)*variants.length)|0]:null);
    if(fl){
      g.drawImage(fl, s.x-m.ox*sx, s.y-m.oy*sy, m.w*sx, m.h*sy);
    } else if(okTex){
      const arr=t===3?TEX.floorA:TEX.floor;
      g.drawImage(arr[(h2(x,y)*arr.length)|0], s.x-m.ox*sx, s.y-m.oy*sy, m.w*sx, m.h*sy);
    } else { g.fillStyle=pal.fA; diamondPath(g,s.x,s.y); g.fill(); }
  }

  function drawWallCell(x,y){
    if(isStartBackWall(L,x,y)) return;
    const oS=L.grid[y+1]&&isWalkTile(L.grid[y+1][x]);
    const oE=L.grid[y]&&isWalkTile(L.grid[y][x+1]);
    const oN=L.grid[y-1]&&isWalkTile(L.grid[y-1][x]);
    const oW=L.grid[y]&&isWalkTile(L.grid[y][x-1]);
    if(!oS&&!oE&&!oN&&!oW) return;
    const s=w2s(x,y);
    const rk=L.wallHP[x+','+y];
    const wallImg=(rk&&rk.hp<rk.max&&wallAtk)?wallAtk:wallBlit;
    const H=wallFaceH(L);
    if(useWallFaces(L)){
      const faceL=TILEBLIT.faceL||TILEBLIT.face;
      const faceR=TILEBLIT.faceR||faceL;
      const sid=x*31+y*17;
      if(oS) drawMasonryFace(g, faceL, x, y+1, x+1.14, y+1, H, 0, -1, sid);
      if(oE) drawMasonryFace(g, faceR, x+1, y, x+1, y+1.14, H, -1, 0, sid+3);
      if(oN) drawMasonryFace(g, faceL, x, y, x+1.14, y, H, 0, 1, sid+7);
      if(oW) drawMasonryFace(g, faceR, x, y, x, y+1.14, H, 1, 0, sid+11);
      drawMasonryCoping(g, x, y, H, oN, oE, oS, oW);
    } else if(wallImg){
      const m=oE&&!oS?pack.wallR:pack.wall;
      if(wallImg===wallBlit) drawTilesetSprite(g, wallImg, s, m);
      else g.drawImage(wallImg, s.x-m.ox*sx, s.y-m.oy*sy, m.w*sx, m.h*sy);
    } else if(okTex){
      const vein=h2(x*3,y*7)>0.86;
      const arr=vein?TEX.wallVein:TEX.wall;
      const m=pack.wall;
      g.drawImage(arr[(h2(x,y)*arr.length)|0], s.x-m.ox*sx, s.y-m.oy*sy, m.w*sx, m.h*sy);
    } else { g.fillStyle=pal.wT; g.fillRect(s.x-TW/2,s.y-WH,TW,WH); }
    if(QUALITY && h2(x*3,y*7)>0.86) emit(s.x, s.y-H*0.35, TW*0.30, pal.key, 0.5);
    if(rk && rk.hp<rk.max) drawCracks(g,s.x,s.y,H,1-rk.hp/rk.max);
    if(DIGT && DIGT.i===x && DIGT.j===y) drawDigMark(g,s.x,s.y,H);
    if(G.dig && G.dig.i===x && G.dig.j===y) drawDigProgress(g,s.x,s.y,H,G.dig.min/digNeedMinutes());
    if(L.secrets){
      for(const sec of L.secrets){
        if(sec.open) continue;
        const si=sec.i||(sec.x|0), sj=sec.j||(sec.y|0);
        const sw=sec.w||2, sh=Math.max(1,sec.h||1);
        if(x<si||x>=si+sw||y<sj||y>=sj+sh) continue;
        // Cooler grey-blue face so the north secret reads as "wrong stone."
        g.save();
        g.globalAlpha=0.34;
        g.fillStyle='#6f8498';
        if(useWallFaces(L) && oS){
          const a=w2s(x,y+1), b=w2s(x+1,y+1);
          g.beginPath(); g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(b.x,b.y-H); g.lineTo(a.x,a.y-H); g.closePath(); g.fill();
        } else {
          g.fillRect(s.x-TW*0.42, s.y-H*0.92, TW*0.84, H*0.86);
        }
        g.restore();
      }
    }
  }

  // Flare background layer: floors always sit under the party and foes.
  for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
    const t=L.grid[y][x];
    if(t===1||t===2||!L.seen[y][x]) continue;
    drawFloorCell(x,y,t);
  }

  // Flare object layer: masonry / cavern walls interleaved with actors.
  for(let d=minx+miny; d<=maxx+maxy; d++){
    const x0=Math.max(minx,d-maxy), x1=Math.min(maxx,d-miny);
    for(let x=x0;x<=x1;x++){
      const y=d-x, t=L.grid[y][x];
      if(t!==1||!L.seen[y][x]) continue;
      drawWallCell(x,y);
    }
    const b=B[d]; if(b) for(const f of b) f();
  }
  // Pinning slabs first, then the kin (lit outlines), then small limb-cover rocks.
  for(const p of G.props) if(p.pin && near(p) && seenAt(p)) drawProp(g,p,pal);
  for(const e of G.ents) if(e.crushed && showEnt(e)) drawEnt(g,e);
  for(const p of G.props) if(p.cover && !p.pin && near(p) && seenAt(p)) drawProp(g,p,pal);
}
function drawCracks(g,sx,sy,WH,f){
  g.save(); g.globalAlpha=clamp(f*1.15,0,1);
  g.strokeStyle='rgba(14,9,6,0.95)'; g.lineCap='round';
  for(let k=0;k<3;k++){
    if(k/3>f) break;
    g.lineWidth=(1.4+f*2.6)*ZOOM;
    let px=sx+(h2(k,7)-0.5)*TW*0.34, py=sy-WH*(0.25+h2(k,3)*0.5);
    g.beginPath(); g.moveTo(px,py);
    for(let i=0;i<3;i++){ px+=(h2(k*5+i,9)-0.5)*TW*0.26; py+=(h2(k*3+i,4)-0.2)*WH*0.30; g.lineTo(px,py); }
    g.stroke();
  }
  if(f>0.55){ g.fillStyle='rgba(255,150,80,'+((f-0.55)*0.5)+')';
    g.beginPath(); g.ellipse(sx,sy-WH*0.5,TW*0.20,WH*0.28,0,0,TAU); g.fill(); }
  g.restore(); g.globalAlpha=1;
}
function drawDigMark(g,sx,sy,WH){
  const b=0.5+Math.sin(G.elapsed*8)*0.25;
  g.strokeStyle='rgba(255,214,140,'+b+')'; g.lineWidth=2.4*ZOOM;
  g.beginPath();
  g.moveTo(sx-TW*0.30,sy-WH*0.62); g.lineTo(sx-TW*0.30,sy-WH*0.80); g.lineTo(sx-TW*0.12,sy-WH*0.80);
  g.moveTo(sx+TW*0.30,sy-WH*0.62); g.lineTo(sx+TW*0.30,sy-WH*0.80); g.lineTo(sx+TW*0.12,sy-WH*0.80);
  g.stroke();
}
function drawDigProgress(g,sx,sy,WH,pct){
  const need=digNeedMinutes();
  const left=Math.max(0,need*(1-clamp(pct,0,1)));
  const w=TW*0.58, h=5*ZOOM, x=sx-w/2, y=sy-WH*0.96;
  g.fillStyle='rgba(0,0,0,0.72)'; g.fillRect(x-1.5,y-1.5,w+3,h+3);
  g.fillStyle='#c9a24a'; g.fillRect(x,y,w*clamp(pct,0,1),h);
  g.strokeStyle='rgba(255,220,180,0.45)'; g.lineWidth=1; g.strokeRect(x,y,w,h);
  g.font='800 '+(10*ZOOM)+'px '+FONT_UI; g.textAlign='center';
  g.lineWidth=3*ZOOM; g.strokeStyle='rgba(0,0,0,0.75)';
  g.strokeText(Math.ceil(left)+' min', sx, y-5*ZOOM);
  g.fillStyle='#f2dfb6'; g.fillText(Math.ceil(left)+' min', sx, y-5*ZOOM);
  g.textAlign='left';
}
function drawMoveMark(g,dest){
  const s=w2s(dest.x,dest.y), z=ZOOM;
  const pulse=.55+Math.sin(G.elapsed*9)*.45;
  g.save(); g.translate(s.x,s.y);
  g.strokeStyle='rgba(255,214,90,'+(0.9*pulse)+')'; g.lineWidth=2.2*z;
  g.beginPath(); g.ellipse(0,0,11*z,5.5*z,0,0,TAU); g.stroke();
  g.strokeStyle='rgba(255,236,160,'+(0.55*pulse)+')'; g.lineWidth=1.2*z;
  g.beginPath(); g.ellipse(0,0,16*z,8*z,0,0,TAU); g.stroke();
  g.fillStyle='rgba(255,220,110,'+(0.42*pulse)+')';
  g.beginPath(); g.ellipse(0,0,3.4*z,1.7*z,0,0,TAU); g.fill();
  const spark=6+pulse*4;
  g.strokeStyle='rgba(255,240,170,'+pulse+')'; g.lineWidth=1.4*z;
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+G.elapsed*2.4;
    g.beginPath();
    g.moveTo(Math.cos(a)*spark*z, Math.sin(a)*spark*z*0.5);
    g.lineTo(Math.cos(a)*(spark+5)*z, Math.sin(a)*(spark+5)*z*0.5);
    g.stroke();
  }
  g.restore();
  emit(s.x,s.y,22*z,'#ffd24a',0.35*pulse);
}
function drawAim(g){
  const p=player(); if(!p||!G.aim) return;
  const a=w2s(G.aim.x,G.aim.y), ps=w2s(p.x,p.y);
  const R=bombRadius();
  const b=0.55+Math.sin(G.elapsed*5)*0.2;
  // lobbed trajectory
  g.strokeStyle='rgba(255,200,120,0.4)'; g.lineWidth=2*ZOOM; g.setLineDash([6*ZOOM,7*ZOOM]);
  g.beginPath();
  for(let i=0;i<=16;i++){ const f=i/16;
    const wx=lerp(p.x,G.aim.x,f), wy=lerp(p.y,G.aim.y,f);
    const sp=w2s(wx,wy); const yy=sp.y-30*ZOOM-Math.sin(f*Math.PI)*54*ZOOM;
    i?g.lineTo(sp.x,yy):g.moveTo(sp.x,yy); }
  g.stroke(); g.setLineDash([]);
  // blast footprint
  g.save(); g.translate(a.x,a.y); g.scale(1,TH/TW);
  g.fillStyle='rgba(255,120,60,'+(0.10+b*0.06)+')';
  g.beginPath(); g.arc(0,0,R*TW/2,0,TAU); g.fill();
  g.strokeStyle='rgba(255,170,90,'+b+')'; g.lineWidth=3*ZOOM;
  g.beginPath(); g.arc(0,0,R*TW/2,0,TAU); g.stroke();
  g.strokeStyle='rgba(255,220,160,'+(b*0.6)+')'; g.lineWidth=1.6*ZOOM;
  g.beginPath(); g.arc(0,0,R*TW/2*0.55,0,TAU); g.stroke();
  g.restore();
  g.strokeStyle='rgba(255,220,160,'+b+')'; g.lineWidth=2.4*ZOOM;
  for(let i=0;i<4;i++){ const th=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(a.x+Math.cos(th)*10*ZOOM,a.y+Math.sin(th)*5*ZOOM);
    g.lineTo(a.x+Math.cos(th)*20*ZOOM,a.y+Math.sin(th)*10*ZOOM); g.stroke(); }
  emit(a.x,a.y,60*ZOOM,'#ff9a44',0.5);
}
function drawThrown(g,b){
  const s=w2s(b.x,b.y), z=ZOOM;
  const yy=s.y-30*z-(b.arc||0)*20*z;
  softShadow(g,s.x,s.y,13*z,6*z,0.45);
  g.save(); g.translate(s.x,yy); g.rotate(b.spin);
  g.beginPath(); g.arc(0,0,9*z,0,TAU); sc(g,'#2f3138',-9*z,9*z,1.8);
  g.fillStyle='rgba(255,255,255,0.18)'; g.beginPath(); g.arc(-3*z,-3.4*z,3*z,0,TAU); g.fill();
  g.strokeStyle='#6b5a3a'; g.lineWidth=2.2*z;
  g.beginPath(); g.moveTo(4*z,-6*z); g.quadraticCurveTo(9*z,-12*z,6*z,-15*z); g.stroke();
  const sp=b.state? (0.55+Math.sin(G.elapsed*30)*0.45) : 0.7;
  g.fillStyle='rgba(255,'+Math.round(190+60*sp)+',90,'+(0.7+sp*0.3)+')';
  g.beginPath(); g.arc(6*z,-16*z,(2.4+sp*1.8)*z,0,TAU); g.fill();
  g.restore();
  emit(s.x,yy-16*z,(26+(b.state?14*Math.sin(G.elapsed*30):0))*z,'#ffab52',1);
  if(Math.random()<0.6) G.parts.push({x:b.x,y:b.y,z:1.4+(b.arc||0),vx:rnd(.4,-.4),vy:rnd(.4,-.4),
    vz:rnd(1.4,.3),life:rnd(.6,.25),max:.6,c:'#ffc06a',s:rnd(2.2,.9),amb:1});
}
function diamondPath(g,sx,sy){ g.beginPath(); g.moveTo(sx,sy-TH/2); g.lineTo(sx+TW/2,sy);
  g.lineTo(sx,sy+TH/2); g.lineTo(sx-TW/2,sy); g.closePath(); }

function drawDecal(g,d){
  if(!TEX.blood.length) return;
  const s=w2s(d.x,d.y), img=TEX.blood[d.i], w=TW*d.sc, h=TH*d.sc;
  g.save(); g.translate(s.x,s.y); g.rotate(d.rot); g.globalAlpha=d.a;
  g.drawImage(img,-w/2,-h/2,w,h); g.restore(); g.globalAlpha=1;
}
function addDecal(x,y,scale){
  G.decals.push({x,y,i:(Math.random()*TEX.blood.length)|0,a:rnd(.85,.5),rot:rnd(TAU),sc:scale||rnd(1.5,.9)});
  if(G.decals.length>230) G.decals.splice(0,40);
}

/* ---------------------------- lighting ---------------------------- */
function gatherLights(L){
  const seen=(x,y)=>{ if(!L||!L.seen) return true; const i=x|0, j=y|0; return !!(L.seen[j]&&L.seen[j][i]); };
  const out=[];
  for(const l of (L.lights||[])){
    if(!seen(l.x,l.y)) continue;
    out.push({x:l.x,y:l.y,c:l.c,r:l.r,f:l.f||1,fl:1});
  }
  const p=player();
  if(p) out.push({x:p.x,y:p.y,c:'#ffd6a0',r:6.6,f:1.05,fl:0});
  for(const e of G.ents) if(!e.dead&&e.boss&&e.glow) out.push({x:e.x,y:e.y,c:e.glow,r:7,f:1.3,fl:1});
  for(const s of G.shots) out.push({x:s.x,y:s.y,c:s.col,r:2.6,f:1.1,fl:0});
  for(const pr of G.props){
    if(!seen(pr.x,pr.y)) continue;
    if(pr.k==='shroom') out.push({x:pr.x,y:pr.y,c:'#b06cff',r:3.4,f:0.72,fl:1});
    if(pr.k==='glowcap') out.push({x:pr.x,y:pr.y,c:'#4ce0ff',r:3.8,f:0.85,fl:1});

    if(pr.k==='moss') out.push({x:pr.x,y:pr.y,c:'#6aff8a',r:2.1,f:0.38,fl:1});
    if(pr.k==='slime') out.push({x:pr.x,y:pr.y,c:'#8aff4a',r:1.9,f:0.32,fl:1});
    if(pr.k==='eggs') out.push({x:pr.x,y:pr.y,c:'#e8e0d0',r:1.6,f:0.22,fl:0});

    if(pr.k==='brazier') out.push({x:pr.x,y:pr.y,c:'#ff8a3a',r:5.5,f:1.1,fl:1});

    if(pr.k==='gate') out.push({x:pr.x,y:pr.y,c:'#6fd0ff',r:4.2,f:0.8,fl:1});
    if(pr.k==='bronzedoor') out.push({x:pr.x,y:pr.y,c:'#d4a04a',r:5.8,f:1.05,fl:1});
    if(pr.k==='bell') out.push({x:pr.x,y:pr.y,c:'#d4a04a',r:2.2,f:0.55,fl:1});
  }

}
function gatherLightsCapped(L){
  const out=gatherLights(L);
  const cap=QUALITY?16:8;
  if(out.length<=cap) return out;
  const p=player();
  if(!p){ out.length=cap; return out; }
  out.sort((a,b)=>((a.x-p.x)**2+(a.y-p.y)**2)-((b.x-p.x)**2+(b.y-p.y)**2));
  out.length=cap;
  return out;
}
/* Revealed tiles stay readable. Fog of war is the unseen rock mask, not a cave gloom
   multiply. Lanterns still add a warm punch on top of a bright fill. */
function applyLighting(g,L){
  /* Phones keep the same painted lightmap. The buffer is 1:1 so this is
     a copy, not an upscale — scaling was what drew coloured scanlines. */
  const x=lmx, w=LM.width, h=LM.height;
  x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='source-over';
  x.fillStyle='#e6d8c4'; x.fillRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  const scx=w/Math.max(1,VW), scy=h/Math.max(1,VH);
  for(const li of gatherLightsCapped(L)){
    const s=w2s(li.x,li.y), cx=s.x*scx, cy=(s.y-TH*.8)*scy;
    const flick = (QUALITY && li.fl && !PHONE_GFX)? (0.90+Math.sin(G.elapsed*7.3+li.x*3.1)*0.06+Math.sin(G.elapsed*17+li.y)*0.035) : 1;
    const rad=li.r*TW*0.27*li.f*flick*(w/Math.max(1,VW*0.5));
    if(cx<-rad||cy<-rad||cx>w+rad||cy>h+rad) continue;
    const c=rgbOf(li.c);
    const gr=x.createRadialGradient(cx,cy,1,cx,cy,rad);
    gr.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',0.55)');
    gr.addColorStop(0.34,'rgba('+c[0]+','+c[1]+','+c[2]+',0.28)');
    gr.addColorStop(0.68,'rgba('+Math.round(c[0]*0.6)+','+Math.round(c[1]*0.5)+','+Math.round(c[2]*0.5)+',0.10)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';
  g.globalCompositeOperation='multiply';
  blitScreen(g, LM);
  g.globalCompositeOperation='source-over';
}

function drawBloom(g){

function drawMemoryShade(g,L){
  if(!L||!L.grid||!L.seen) return;
  const c=[s2w(-TW,-TH*5),s2w(VW+TW,-TH*5),s2w(-TW,VH+TH*5),s2w(VW+TW,VH+TH*5)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-1);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+1);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-1);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+1);
  g.save();
  g.fillStyle='rgba(0,0,0,0.78)';
  for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
    if(!L.seen[y]||!L.seen[y][x]) continue;
    if(L.vis&&L.vis[y]&&L.vis[y][x]) continue;
    const s=w2s(x,y);
    const t=L.grid[y][x];
    if(isWalkTile(t)){
      g.beginPath();
      g.moveTo(s.x, s.y-TH/2); g.lineTo(s.x+TW/2, s.y);
      g.lineTo(s.x, s.y+TH/2); g.lineTo(s.x-TW/2, s.y);
      g.closePath(); g.fill();
    } else if(t===1||t===2){
      const H=useWallFaces(L)?wallFaceH(L):TH;
      g.beginPath();
      g.ellipse(s.x, s.y-H*0.38, TW*0.62, TH*0.9+H*0.28, 0, 0, TAU);
      g.fill();
    }
  }
  g.restore();
}

function drawBeyondMask(g,L){
  if(!L||!L.grid) return;
  const c=[s2w(-TW,-TH*5),s2w(VW+TW,-TH*5),s2w(-TW,VH+TH*5),s2w(VW+TW,VH+TH*5)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-2);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+2);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-2);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+2);
  const rock='#000000';
  const open=isWalkTile;
  const key=Math.round(CAMSX)+','+Math.round(CAMSY)+','+G.ch+','+QUALITY+','+BX.width+','+(G.seenRev||0);
  const mg=bxx;
  if(key!==BX_KEY){
    BX_KEY=key;
    mg.setTransform(1,0,0,1,0,0);
    mg.clearRect(0,0,BX.width,BX.height);
    mg.fillStyle=rock;
    mg.fillRect(0,0,BX.width,BX.height);
    mg.setTransform(BX.width/Math.max(1,VW),0,0,BX.height/Math.max(1,VH),0,0);
    mg.globalCompositeOperation='destination-out';
    mg.fillStyle='#fff';
    const pad=QUALITY?1.12:1.22;
    for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
      if(!L.seen[y]||!L.seen[y][x]) continue;

        const oW=L.grid[y]&&open(L.grid[y][x-1]);
        if(oS||oE||oN||oW){
          const tall=useWallFaces(L)?wallFaceH(L):TH;

      mg.fill();
    }
    mg.setTransform(1,0,0,1,0,0);
    mg.globalCompositeOperation='source-over';
  }
  blitScreen(g, BX);
}

function drawRubbleLocal(g,z,n,seed,dmg){
  dmg=dmg||0; n=n||14; seed=seed||0;
  softShadow(g,0,0,58*z,26*z,0.58);
  for(let i=0;i<n;i++){
    const hx=(h2(i+seed,3)-.5)*88*z, hy=-h2(i+seed,7)*64*z-6*z, sz=(14+h2(i+seed,11)*18)*z*(1-dmg*.45);
    g.beginPath(); g.moveTo(hx,hy-sz*.6); g.lineTo(hx+sz,hy); g.lineTo(hx+sz*.2,hy+sz*.7); g.lineTo(hx-sz,hy+sz*.1); g.closePath();
    const gr=g.createLinearGradient(hx-sz,hy-sz,hx+sz,hy+sz);
    gr.addColorStop(0,i%2?'#8a6f4c':'#6d5537'); gr.addColorStop(1,i%2?'#3f3020':'#2c2116');
    g.fillStyle=gr; g.fill(); g.strokeStyle=OL; g.lineWidth=1.3*z; g.stroke();

/* ---------------------------- shading helpers ---------------------------- */
function softShadow(g,x,y,rx,ry,a){
  if(!QUALITY) return;
  const gr=g.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
  gr.addColorStop(0,'rgba(0,0,0,'+(a||0.5)+')');
  gr.addColorStop(0.55,'rgba(0,0,0,'+((a||0.5)*0.55)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.save(); g.translate(x,y); g.scale(1,ry/Math.max(rx,ry)); g.translate(-x,-y);
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,Math.max(rx,ry),0,TAU); g.fill(); g.restore();
}
/* fill current path with vertical form-shading + ink outline (+ optional rim) */
function sc(g,base,y0,y1,lw,rim){
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,shade(base,0.26)); gr.addColorStop(0.48,base); gr.addColorStop(1,shade(base,-0.34));
  g.fillStyle=gr; g.fill();
  g.strokeStyle=OL; g.lineWidth=(lw||1.7)*ZOOM; g.stroke();
  if(rim){ g.save(); g.clip(); g.strokeStyle='rgba(255,236,198,'+(rim)+')'; g.lineWidth=2.2*ZOOM;
    g.stroke(); g.restore(); }
}
function flat(g,base,lw){ g.fillStyle=base; g.fill(); g.strokeStyle=OL; g.lineWidth=(lw||1.6)*ZOOM; g.stroke(); }
function drawFacetGem(g,x,y,w,h,on,z){
  const b=on?(.72+Math.sin(G.elapsed*2.8+x*0.01)*.28):.08;
  g.beginPath();
  g.moveTo(x, y-h);
  g.lineTo(x+w*0.62, y-h*0.42);
  g.lineTo(x+w*0.38, y+h*0.08);
  g.lineTo(x, y+h);
  g.lineTo(x-w*0.38, y+h*0.08);
  g.lineTo(x-w*0.62, y-h*0.42);
  g.closePath();
  const gr=g.createLinearGradient(x-w,y-h,x+w,y+h);
  gr.addColorStop(0,on?'#ff8a96':'#4a1a20');
  gr.addColorStop(0.35,on?'#e01828':'#3a1218');
  gr.addColorStop(0.7,on?'#8a0c18':'#2a0c12');
  gr.addColorStop(1,on?'#ff4050':'#3a1218');
  g.fillStyle=gr; g.fill();
  g.strokeStyle=on?'rgba(255,200,210,0.85)':'rgba(80,30,36,0.7)'; g.lineWidth=1.8*z; g.stroke();
  // inner facets
  g.strokeStyle=on?'rgba(255,230,235,0.35)':'rgba(255,255,255,0.06)'; g.lineWidth=1.1*z;
  g.beginPath(); g.moveTo(x,y-h); g.lineTo(x,y+h); g.moveTo(x-w*0.62,y-h*0.42); g.lineTo(x+w*0.38,y+h*0.08);
  g.moveTo(x+w*0.62,y-h*0.42); g.lineTo(x-w*0.38,y+h*0.08); g.stroke();
  if(on){
    g.fillStyle='rgba(255,210,220,'+(0.35+b*0.25)+')';
    g.beginPath(); g.moveTo(x-w*0.12,y-h*0.72); g.lineTo(x+w*0.22,y-h*0.28); g.lineTo(x-w*0.04,y-h*0.12); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(x-w*0.14,y-h*0.42,w*0.10,h*0.08, -0.5,0,TAU); g.fill();
  }
  return b;
}

function drawCarvedArch(g,z,W,H,stone){
  // stepped stone doorway: outer, mid, inner
  const tiers=[{w:W,h:H,c:stone},{w:W*0.82,h:H*0.86,c:shade(stone,-0.08)},{w:W*0.64,h:H*0.72,c:shade(stone,-0.16)}];
  for(const t of tiers){
    g.beginPath();
    g.moveTo(-t.w,-8*z); g.lineTo(-t.w,-t.h*0.62); g.quadraticCurveTo(-t.w*0.15,-t.h*1.08,0,-t.h);
    g.quadraticCurveTo(t.w*0.15,-t.h*1.08,t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath();
    sc(g,t.c,-t.h,-8*z,2.4);
    g.fillStyle='rgba(0,0,0,0.22)';
    g.beginPath(); g.moveTo(2*z,-8*z); g.lineTo(2*z,-t.h*0.9); g.lineTo(t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath(); g.fill();
  }
  // block courses
  g.strokeStyle='rgba(12,8,6,0.45)'; g.lineWidth=1.5*z;
  for(let i=1;i<6;i++){
    const yy=-8*z-i*(H/7);
    g.beginPath(); g.moveTo(-W*0.92,yy); g.lineTo(W*0.92,yy); g.stroke();
  }
  // carved runes along the inner arch
  g.strokeStyle='rgba(220,190,140,0.22)'; g.lineWidth=1.3*z;
  for(let i=0;i<9;i++){
    const a=Math.PI+ i/8*Math.PI, rx=W*0.52, ry=H*0.72;
    const px=Math.cos(a)*rx, py=-H*0.28+Math.sin(a)*ry;
    g.beginPath(); g.arc(px,py,2.4*z,0,TAU); g.stroke();
  }
  // rim light on the crown of the arch
  g.strokeStyle='rgba(255,236,200,0.22)'; g.lineWidth=2.6*z;
  g.beginPath(); g.moveTo(-W,-H*0.62); g.quadraticCurveTo(0,-H*1.08,W,-H*0.62); g.stroke();
}

/* ---------------------------- props ---------------------------- */
function drawProp(g,p,pal){

    const img=propAnimImg(p);
    const H=rubyDoorH();

    emit(sx.x,sx.y-H*0.42,28*z,'#ff2a3c',0.95);
    ray(sx.x,sx.y-H*0.55,34*z,'#ff4058',0.48);

  }
  g.save(); g.translate(s.x,s.y);
  if(p.k==='web'){
    const img=TEX.web;
    if(img){
      const w=86*z, h=70*z;

      g.drawImage(img, -w/2, -h*0.72, w, h);

    }
    g.strokeStyle='rgba(236,228,214,0.55)'; g.lineWidth=1.2*z; g.lineCap='round';

      g.beginPath(); g.moveTo(0,-8*z); g.lineTo(Math.cos(a)*r, Math.sin(a)*r*0.58-10*z); g.stroke();

    g.restore(); return;

function drawLoot(g,pile){
  const s=w2s(pile.x,pile.y), z=ZOOM;
  const pulse=.62+Math.sin(G.elapsed*4.2+(pile.x||0)*3)*.28;
  g.save(); g.translate(s.x,s.y);
  softShadow(g,0,2*z,14*z,7*z,.5);
  let img=null, h=46*z;
  if(pile.kind==='ruby'){ img=SPR.loot_ruby_shard||SPR.loot_ruby; h=28*z; }
  else if(pile.kind==='ore'){ img=SPR.loot_ore; h=38*z; }
  else if(pile.kind==='herb' || (pile.herbs && Object.keys(pile.herbs).length)){ img=SPR.loot_herbs||SPR.loot_potion; h=48*z; }
  else if(pile.kind==='potion' || ((pile.potions||[]).length && !(pile.coins&&((pile.coins.gp||0)+(pile.coins.pp||0)+(pile.coins.sp||0))))){ img=SPR.loot_potion||SPR.loot_chest; h=48*z; }
  else if(pile.kind==='jewels' || pile.jew || ((pile.items||[]).some(it=>/ring|amulet|jewel|necklace|torque/i.test(it.n||it.k||'')))){ img=SPR.loot_jewelry||SPR.loot_gems; h=44*z; }
  else if((pile.gems||((pile.items||[]).some(it=>it.k==='gem'))) && SPR.loot_gems){ img=SPR.loot_gems; h=46*z; }
  else if(SPR.loot_chest && pile.coins && ((pile.coins.gp||0)+(pile.coins.pp||0)>8)){ img=SPR.loot_chest; h=56*z; }
  else if(SPR.loot_coins){ img=SPR.loot_coins; h=46*z; }
  else img=SPR.sack;
  if(img && img.width && drawBillboard(g, img, h)){
    const glow=pile.kind==='ruby'?'#ff2a3c':(pile.glow||'#ffd27a');
    emit(s.x,s.y-h*0.35,12*z*pulse,glow, pile.kind==='ruby'?0.85:0.75);
    if(pile.kind==='ruby') ray(s.x,s.y-h*0.4,12*z,'#ff4058',0.4);
  } else if(pile.kind==='ruby'){
    drawFacetGem(g,0,-6*z,8*z,10*z,1,z);
    emit(s.x,s.y-6*z,12*z*pulse,'#ff2a3c',0.85);
  } else if(pile.kind==='ore'){
    g.fillStyle=RESMETA.ironstone.c;
    g.beginPath(); g.moveTo(-6*z,-4*z); g.lineTo(0,-12*z); g.lineTo(7*z,-3*z); g.lineTo(3*z,4*z); g.lineTo(-5*z,3*z); g.closePath(); g.fill();
  } else {
    g.fillStyle='#e0c169';
    g.beginPath(); g.ellipse(0,0,10*z,6*z,0,0,TAU); g.fill();
  }
  g.restore();
}

function drawEnt(g,e){
  if(e.hidden) return;
  if(e.ghost && e.dead) return;
  const s=w2s(e.x,e.y), z=ZOOM*e.scale;
  g.save(); g.translate(s.x,s.y);
  const deadSpr=e.crushed && SPR[(e.col&&e.col.key)+'_dead'];
  if(e.sleeping){ g.translate(8*z, 6*z); g.rotate(1.18); }
  if(e.crushed && !deadSpr){ g.translate(6*z, 26*z); g.rotate(1.22); }
  g.globalAlpha=1;
  const deadImg = (e.dead||e.crushed) ? (deadSpr || SPR[entSpriteKey(e)+'_dead']) : null;
  if(e.dead && !e.crushed && !deadImg){
    g.translate(0,8); g.rotate(0.9);
  }
  const p=player();
  if(!e.dead&&p&&p.aim===e){
    const b=.45+Math.sin(G.elapsed*7)*.2;
    g.strokeStyle='rgba(255,90,70,'+b+')'; g.lineWidth=2.6*ZOOM;
    g.beginPath(); g.ellipse(0,0,20*z,10*z,0,0,TAU); g.stroke();
    g.strokeStyle='rgba(255,140,110,'+(b*0.5)+')'; g.lineWidth=1.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,24*z,12*z,0,0,TAU); g.stroke();
  }
  if(!e.dead&&e.hero){
    g.strokeStyle='rgba(255,214,140,0.55)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,18*z,9*z,0,0,TAU); g.stroke();
    if(QUALITY){
      const gr=g.createRadialGradient(0,0,1,0,0,26*z);
      gr.addColorStop(0,'rgba(255,206,130,0.14)'); gr.addColorStop(1,'rgba(255,180,90,0)');
      g.save(); g.scale(1,0.5); g.fillStyle=gr; g.beginPath(); g.arc(0,0,26*z,0,TAU); g.fill(); g.restore();
    }
  }
  const img=entAnimImg(e);
  const bob0=(img && e.moving && !e.dead)?Math.sin((e.gait||0)*TAU)*1.6*z:0;
  if(!e.dead && !e.crushed){
    softShadow(g,2.5*z,1*z,17*z,8*z,0.52);
  } else {
    softShadow(g,1*z,3*z,22*z,10*z,0.55);
  }

  const heading=(e.moving&&((e.ix||0)||(e.iy||0)))?((e.ix||0)-(e.iy||0)):(e.fdx-e.fdy);
  const flip=!e.crushed && !e.dead && heading>0;
  const sw=e.atk>0?Math.sin((1-e.atk/e.atkMax)*Math.PI):0;
  const squash=img?1:(1+sw*0.06);
  if(e.hero && !e.dead){ g.globalAlpha=1; g.globalCompositeOperation='source-over'; }
  if(e.ghost && !e.dead) g.globalAlpha=0.84;
  g.save(); g.translate(0,-bob0); g.scale(flip?-1:1,1); g.scale(1/squash,squash);
  if(deadImg && drawDeadBillboard(g,e,deadImg,z)){
    /* prone corpse sprite */
  } else if(!(img && drawEntBillboard(g,e,img,z))){
    if(e.kind==='dwarf') drawDwarf(g,e,z,sw);
    else if(e.kind==='statue') drawStatue(g,e,z,sw);
    else if(e.kind==='spider') drawSpider(g,e,z,sw);
    else if(e.kind==='fungi') drawFungi(g,e,z,sw);
    else if(e.kind==='undead') drawUndead(g,e,z,sw,null);
    else if(e.kind==='warden') drawWarden(g,e,z,sw);
    else if(e.kind==='goblin') drawGoblin(g,e,z,sw);
    else if(e.kind==='gnome') drawGnome(g,e,z,sw);
    else if(e.kind==='king') drawKing(g,e,z,sw);
    else drawStatue(g,e,z,sw);
  }
  g.restore();
  if(e.ghost) g.globalAlpha=1;

  if(e.hero && e.atk>0 && !e.dead){
    const t=1-e.atk/Math.max(0.01,e.atkMax);
    const ang=-1.25+t*2.55, rad=26*z;
    emit(s.x+Math.cos(ang)*rad*(flip?-1:1), s.y-30*z+Math.sin(ang)*10*z, 18*z, '#ffd27a', 0.55);
  }

  if(e.flash>0 && !e.dead){ g.globalCompositeOperation='lighter'; g.globalAlpha=clamp(e.flash*3,0,1);
    g.fillStyle='#ffb894'; g.beginPath(); g.ellipse(0,-27*z,19*z,29*z,0,0,TAU); g.fill();
    g.globalCompositeOperation='source-over'; g.globalAlpha=1; }
  if((e.webbed||0)>0){
    const webImg=TEX.web;
    if(webImg){
      const ww=54*z, hh=48*z;
      g.globalAlpha=0.72;
      g.drawImage(webImg, -ww/2, -hh*0.95, ww, hh);
      g.globalAlpha=1;
    }
    g.strokeStyle='rgba(236,228,214,0.7)'; g.lineWidth=1.3*ZOOM;
    for(let i=0;i<5;i++){
      const a=i/5*TAU+G.elapsed;
      g.beginPath(); g.moveTo(Math.cos(a)*6*z,-18*z); g.lineTo(Math.cos(a)*22*z, Math.sin(a)*10*z-8*z); g.stroke();
    }
  }
  if(e.guard){ const b=.4+Math.sin(G.elapsed*8)*.2;
    g.strokeStyle='rgba(180,215,255,'+b+')'; g.lineWidth=2.8*ZOOM;
    g.beginPath(); g.ellipse(0,-27*z,24*z,32*z,0,0,TAU); g.stroke();
    emit(s.x,s.y-27*z,48*z,'#9fd0ff',0.5); }
  if(e.buff>0){ g.strokeStyle='rgba(255,205,110,0.6)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,19*z,9*z,0,0,TAU); g.stroke(); }
  g.restore();

  if(!e.dead&&e.glow&&(e.ghost||e.team==='foe'||e.boss||e.npc||e.kind==='undead'||e.kind==='statue'||e.kind==='wraith'||e.kind==='fungi'||e.kind==='horror'||e.kind==='drake'||e.kind==='spider'||e.kind==='golem'||e.kind==='drow'||e.kind==='duergar'||e.kind==='gnome'||e.kind==='umberhulk'||e.kind==='hookedhorror'||e.kind==='beholder'))
    emit(s.x,s.y-(e.boss||e.kind==='golem'||e.kind==='beholder'?76:56)*z, (e.ghost?22:e.boss?34:14)*z, e.glow, e.ghost?0.62:e.boss?0.75:0.35);

  if(!e.dead&&(e.ally||e.ghost)&&e.hp<e.maxhp){
    const w=32*ZOOM,h=3.6*ZOOM, yy=s.y-48*ZOOM*e.scale;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(s.x-w/2-1,yy-1,w+2,h+2);
    ctx.fillStyle='#6ecf6a'; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
  }

  if(!e.dead&&e.team==='foe'&&(e.hp<e.maxhp||e.boss)){
    const w=(e.boss?122:38)*ZOOM,h=(e.boss?8:4.4)*ZOOM, yy=s.y-(e.boss?106:62)*ZOOM*e.scale;
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(s.x-w/2-1.5,yy-1.5,w+3,h+3);
    const bg=ctx.createLinearGradient(0,yy,0,yy+h);
    bg.addColorStop(0,e.boss?'#f04a42':'#c9382c'); bg.addColorStop(1,e.boss?'#8d1512':'#6d1712');
    ctx.fillStyle=bg; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
    ctx.strokeStyle='rgba(255,220,180,0.4)'; ctx.lineWidth=1; ctx.strokeRect(s.x-w/2,yy,w,h);

  }
  if(e.crushed){
    emit(s.x, s.y-10*ZOOM, 26*ZOOM, '#ffe2b0', 0.72);

    ctx.fillStyle='#ffe7b8'; ctx.fillText(tag,s.x,s.y-26*ZOOM); ctx.textAlign='left';
  }
  if(!e.dead&&e.npc&&e.name){
    ctx.font='700 '+(10*ZOOM)+'px "Trebuchet MS",sans-serif'; ctx.textAlign='center';

    ctx.fillStyle='#ffe08a'; ctx.fillText(label,s.x,s.y-52*ZOOM*e.scale); ctx.textAlign='left';

}

function craftPropLabel(pr){
  const spec=CRAFT_PROP[pr.k];
  return (spec&&spec.label)||('Scavenge '+pr.k);
}
function nearestCraftProp(e,maxd){
  let best=null, bd=maxd||1.35;
  for(const pr of (G.props||[])){
    if(pr.gone||pr.taken) continue;
    if(!CRAFT_PROP[pr.k] && !pr.craft) continue;
    if(!CRAFT_PROP[pr.k]) continue;
    const d=Math.hypot(e.x-pr.x,e.y-pr.y);
    if(d<bd){ bd=d; best=pr; }
  }
  return best;
}
function scavengeCraft(pr){
  if(!pr||pr.taken||pr.gone) return;
  const spec=CRAFT_PROP[pr.k]; if(!spec) return;
  const roll=spec.rolls[(Math.random()*spec.rolls.length)|0];
  const [res,n]=roll;
  const bonus=Math.max(0, skillLvl(spec.skill)-1);
  const got=n+(bonus&&Math.random()<0.28?1:0);
  gain(res, got);
  learn(spec.skill, 2+((got>1)?1:0));
  pr.taken=1; pr.gone=1;
  ftext(pr.x,pr.y,'+'+got+' '+(RESMETA[res]?RESMETA[res].n:res), RESMETA[res]?RESMETA[res].c:'#ffd27a');
  say((RESMETA[res]?RESMETA[res].n:res)+' for the craft — '+SKILLS.find(s=>s.k===spec.skill).n+'.','#cfe0ea');
  burst(pr.x,pr.y, RESMETA[res]?RESMETA[res].c:'#ffd27a', 10, 1.8);
}
function placeCraftCaches(L){
  if(!L||!L.grid) return;
  G.props=G.props||[];
  const seed=L.dressSeed||1;
  const kits={
    1:[['orepile',3],['timber',2],['pickpile',1],['bones',1]],
    2:[['web',3],['eggs',2],['orepile',1],['timber',1],['bones',1]],
    3:[['bones',2],['hidepile',2],['timber',1],['orepile',1],['crystal',1]],
    4:[['slime',2],['bones',2],['hidepile',1]],
    5:[['crystal',2],['bones',1],['hidepile',1],['roots',1]]
  };
  const want=(kits[L.n]||kits[1]).filter(x=>x[1]>0);
  const floors=[];
  for(let y=2;y<L.h-2;y++) for(let x=2;x<L.w-2;x++){
    const t=L.grid[y][x];
    if(t!==0 && t!==3) continue;
    floors.push({x:x+0.5,y:y+0.5});
  }
  if(!floors.length) return;
  const keep=[];
  G.props.forEach(p=>keep.push({x:p.x,y:p.y,r:1.15}));
  if(L.spawn) keep.push({x:L.spawn.x,y:L.spawn.y,r:2.0});
  want.forEach((pair,wi)=>{
    const [k,n]=pair;
    for(let i=0;i<n;i++){
      let placed=0, tries=0;
      while(!placed && tries<40){
        tries++;
        const f=floors[((h3(wi*17+i*9, tries*5, seed)*floors.length)|0)];
        if(!f) continue;
        let ok=1;
        for(let j=0;j<keep.length;j++){
          if(Math.hypot(keep[j].x-f.x,keep[j].y-f.y)<keep[j].r){ ok=0; break; }
        }
        if(!ok) continue;
        if(L.n===1 && nearCrush(f.x,f.y,1.2)) continue;
        G.props.push({x:f.x,y:f.y,k,s:0.9+h3(f.x,f.y,seed)*0.25,seed:seed+wi*30+i,dress:1,craft:1});
        keep.push({x:f.x,y:f.y,r:1.35});
        placed=1;
      }
    }
  });
}
const SKILLS=[
  {k:'weapon',n:'Weapon Smithing',who:'MACAR'},
  {k:'armour',n:'Armour Smithing',who:'ORBO'},

function skillLvl(k){ return clamp(1+Math.floor(Math.sqrt((G.xp[k]||0)/7)),1,10); }
function skillNext(k){ const l=skillLvl(k); return l>=10?1:clamp(((G.xp[k]||0)-7*(l-1)*(l-1))/(7*(l*l-(l-1)*(l-1))),0,1); }
function learn(k,n){ G.xp[k]=(G.xp[k]||0)+n;
  const before=G.skillSnap[k]||1, now=skillLvl(k);
  if(now>before){ G.skillSnap[k]=now;
    say(SKILLS.find(s=>s.k===k).n+' is now rank '+now+'.','#ffd27a'); } }
function gain(r,n){ G.res[r]=(G.res[r]||0)+n; }
function gpTotal(){
  const c=G.coin||{};
  let n=(c.pp||0)*5+(c.gp||0)+Math.floor((c.ep||0)/2)+Math.floor((c.sp||0)/10)+Math.floor((c.cp||0)/100);
  ensurePacks();
  ROSTER.forEach(r=>{(packOf(r.key).gems||[]).forEach(g=>n+=g.gp||0);});
  return n;
}
function spendGp(n){
  if(!G.coin) G.coin={cp:0,sp:0,ep:0,gp:0,pp:0};
  const c=G.coin; let left=n;
  const take=(k,rate)=>{
    if(left<=0) return;
    const have=c[k]||0, need=Math.ceil(left/rate), use=Math.min(have,need);
    if(!use) return;
    c[k]-=use; left-=use*rate;
  };
  take('gp',1); take('pp',5); take('ep',0.5); take('sp',0.1); take('cp',0.01);
  if(left>0.01){
    ensurePacks();
    ROSTER.forEach(r=>{
      const pk=packOf(r.key); if(!pk.gems||left<=0) return;
      pk.gems=pk.gems.filter(gm=>{
        if(left<=0) return true;
        const v=gm.gp||0;
        if(v<=left){ left-=v; return false; }
        gm.gp=v-Math.ceil(left); left=0; return true;
      });
    });
    syncPackTotals();
  }
  if(left>0.01) c.gp=Math.max(0,(c.gp||0)-Math.ceil(left));
}
function giveGnomeThanks(){

function afford(cost){ for(const k in cost) if((G.res[k]||0)<cost[k]) return false; return true; }
function spend(cost){ for(const k in cost) G.res[k]-=cost[k]; }
function costText(cost){ const p=[]; for(const k in cost) p.push(cost[k]+' '+RESMETA[k].n); return p.length?p.join(' + '):'free'; }

function giveGem(it, silent){

function lootLabel(pile){
  if(pile.label) return pile.label;

    const it=pile.items[0];

function nearestLoot(e, r){

function takeLoot(pile, quiet){
  if(!pile||pile.gone) return;
  pile.gone=1;
  G.loot=(G.loot||[]).filter(x=>x!==pile);
  const bits=[];
  convertHoard(pile.coins||{}, pile.gems||0, pile.jew||0, 0, 'none', pile, true);
  const c=pile.coins||{};
  Object.keys(c).forEach(k=>{ if(c[k]) bits.push(c[k]+' '+k); });
  if(pile.gems) bits.push(pile.gems+' gems');
  if(pile.jew) bits.push(pile.jew+' jewelry');
  (pile.potions||[]).forEach(p=>{ const n=givePotion(p,1); if(n) bits.push(n); });
  let extra=0;
  (pile.items||[]).forEach(it=>{

    if(it.k==='pack'||it.field){ addToPack('macar', it.field||'ammo', it.count||1); bits.push((it.n||it.field||'kit')+' \u00d7'+(it.count||1)); return; }
    if(it.k==='gem'){ giveGem(it,1); bits.push(it.n||'gem'); }
    else { const n=giveMagic(it,1); if(n) bits.push(n); }
  });

    Object.keys(pile.res).forEach(k=>{
      gain(k, pile.res[k]);
    });
  }

}
function hoardToPile(hoard){
  if(!hoard) return null;
  const potions=[], items=[];
  const magN=hoard.magN||0;
  const extras=extraMagicForKind(hoard.magKind||'any');
  const rolls=magN+extras.length;
  for(let i=0;i<rolls;i++){
    const kind=i<magN?(hoard.magKind||'any'):extras[i-magN];
    const got=rollMagicItem(kind);
    if(got.kind==='potion') potions.push(got.potion);
    else items.push(got.item);
  }
  const coins=hoard.coins||{};
  const hasCoin=Object.keys(coins).some(k=>coins[k]>0);
  if(!hasCoin && !hoard.gems && !hoard.jew && !potions.length && !items.length) return null;
  let kind='pile';
  if((hoard.jew||0)>0) kind='jewels';
  else if((hoard.gems||0)>0 || items.some(it=>it.k==='gem')) kind='gems';
  else if(((coins.gp||0)+(coins.pp||0))>8) kind='chest';
  else if(hasCoin) kind='coins';
  else if(potions.length) kind='potion';
  return {kind, coins, gems:hoard.gems||0, jew:hoard.jew||0, potions, items, glow:'#ffd27a'};
}
function foeDrop(e){

/* ==========================================================================
   MINING  -  shovel excavates solid rock; 1 sq ft per 10 dungeon minutes
   (1 real second = 1 dungeon minute). Bombs still blow rock. Combat does not.
   ========================================================================== */
const DIG_MINUTES=10;
function digNeedMinutes(){ return Math.max(3.5, DIG_MINUTES-(G.digBoost||0)*1.5); }
function isVein(i,j){ return h2(i*3,j*7)>0.86; }
function rockAt(L,i,j){
  const k=i+','+j;
  if(!L.wallHP[k]) L.wallHP[k]={hp:isVein(i,j)?48:120, max:isVein(i,j)?48:120};
  return L.wallHP[k];
}
function diggable(L,i,j){
  if(L.n===1 && i<14) return false;
  return i>=1 && j>=1 && i<L.w-1 && j<L.h-1 && L.grid[j] && L.grid[j][i]===1;
}
function digTarget(e){
  const L=G.lvl; if(!L) return null;
  for(const reach of [0.85,1.15]){
    const i=(e.x+e.fdx*reach)|0, j=(e.y+e.fdy*reach)|0;
    if(diggable(L,i,j)) return {i,j};
  }
  return null;
}
function oreDrop(i,j,vein){
  const got={};
  const add=(r,n)=>{ got[r]=(got[r]||0)+n; gain(r,n); };
  add('ironstone', 1+ri(0,1)+(vein?2:0));
  if(Math.random() < (vein?0.12:0.05)) add(Math.random()<0.62?'deepsilver':'starmetal',1);
  if(Math.random() < 0.10) add('powder',1);
  if(Math.random() < 0.14) add('bone',1);
  if(Math.random() < 0.12) add('timber',1);
  if(Math.random() < 0.08) add('resin',1);
  if(G.lvl && G.lvl.n===2 && Math.random()<0.20) add('barley',1);
  const keys=Object.keys(got);
  let off=0;
  for(const r of keys){
    ftext(i+0.5,j+0.5-off*0.35,'+'+got[r]+' '+RESMETA[r].n, RESMETA[r].c, r==='starmetal'||r==='deepsilver');
    off++;
    if(r==='starmetal'||r==='deepsilver'){ shake(9); burst(i+0.5,j+0.5,RESMETA[r].c,22,3.4);
      say('A rare seam! '+RESMETA[r].n+'.', RESMETA[r].c); }
  }
  return got;
}
function breakRock(L,i,j){
  if(!diggable(L,i,j)) return false;
  const vein=isVein(i,j);
  L.grid[j][i]=0; L.seen[j][i]=1; delete L.wallHP[i+','+j];
  BX_KEY=''; G.seenRev=(G.seenRev||0)+1;
  burst(i+0.5,j+0.5, vein?'#d8b46a':'#9a8163', 22, 3.6);
  addDecal(i+0.5,j+0.5,rnd(1.4,0.8));
  oreDrop(i,j,vein);
  if(L.collapse && i>=L.collapse.x0 && i<=L.collapse.x1 && j>=L.collapse.y0 && j<=L.collapse.y1){
    L.flags.collapseDigs=(L.flags.collapseDigs||0)+1;
    if((L.flags.collapseFinds||0)<3 && (Math.random()<0.42 || L.flags.collapseDigs===2)){
      L.flags.collapseFinds=(L.flags.collapseFinds||0)+1;
      const rich=Math.random()<0.4;
      spawnLoot(i+0.5, j+0.5, {
        kind:rich?'chest':'coins',
        coins:{gp:ri(10,36), sp:ri(12,50), cp:ri(20,90), pp:rich?1:0},
        gems:rich?ri(1,2):0,
        jew:Math.random()<0.35?1:0,
        label:'Cache in the fall'
      });
      say('The collapse hid a cache.','#ffd27a');
      burst(i+0.5,j+0.5,'#ffd27a',16,3);
    } else {
      say('Only dust and broken stone.','#c9b895');
    }
  }
  learn('mining', vein?6:3);
  shake(7);
  return true;
}
/* returns true if the swing was spent on rock */
function digSwing(e,dmg){
  const L=G.lvl; if(!L||!e.hero) return false;
  const t=digTarget(e); if(!t) return false;
  const r=rockAt(L,t.i,t.j);
  const power=dmg*(1+skillLvl('mining')*0.14);
  r.hp-=power;
  burst(t.i+0.5,t.j+0.5,'#8f7757',7,2.2);
  ftext(t.i+0.5,t.j+0.5,'-'+Math.round(power),'#d8c49a');
  wear(e.gear,0.5,0);
  if(r.hp<=0) breakRock(L,t.i,t.j);
  return true;
}

/* ==========================================================================
   BOMBS  -  select, aim, throw. 10d10 in a radius, and it opens rock.
   ========================================================================== */
function bombDamage(){ let d=0; for(let i=0;i<10;i++) d+=ri(1,10);
  return Math.round(d*(1+skillLvl('bomb')*0.10)); }
function bombRadius(){ return 2.7+skillLvl('bomb')*0.06; }
function throwBomb(){
  const p=player(); if(!p||!G.aim) return;
  if(!takeFromPacks('bombs')){
    hint(partyCount('bombKit')?'No bombs in the packs.':'No bombs. Rouse the red hat — the ghost sapper packs two a day.',2.2);
    return;
  }
  const a=ang(G.aim.x-p.x, G.aim.y-p.y);
  p.fdx=Math.cos(a); p.fdy=Math.sin(a);
  G.thrown.push({sx:p.x,sy:p.y,tx:G.aim.x,ty:G.aim.y,x:p.x,y:p.y,t:0,dur:0.62,fuse:0.55,state:0,spin:0});
  say('A bomb from the packs. Fuse lit.','#ffb45c');
  G.aim=null;
  learn('bomb',2);
}
function explode(x,y){
  const dmg=bombDamage(), R=bombRadius();
  shake(30); G.flash={c:'#ffd9a0',a:0.55};
  burst(x,y,'#ffd27a',60,7); burst(x,y,'#ff7a3a',44,5);
  for(let i=0;i<8;i++) addDecal(x+rnd(1.8,-1.8),y+rnd(1.8,-1.8),rnd(1.8,1));
  ftext(x,y-0.6,'10d10 = '+dmg,'#ffd27a',1);
  for(const e of G.ents){
    if(e.dead) continue;
    const d=dist(e,{x,y}); if(d>R+e.r) continue;
    const f=clamp(1-(d/R)*0.5,0.5,1);
    const own=e.team==='party'?0.5:1;
    damage(e, dmg*f*own, '#ffcf7a');
    const a=ang(e.x-x,e.y-y); e.kx+=Math.cos(a)*3.2; e.ky+=Math.sin(a)*3.2;
  }
  const L=G.lvl;
  if(L){ const R2=Math.ceil(R)-0.4;
    for(let j=(y-R2)|0;j<=(y+R2);j++) for(let i=(x-R2)|0;i<=(x+R2);i++){
      if(Math.hypot(i+0.5-x,j+0.5-y)>R2) continue;
      if(diggable(L,i,j)){ const r=rockAt(L,i,j); r.hp-=dmg*0.9; if(r.hp<=0) breakRock(L,i,j); } } }
}
function updateBombs(dt){
  for(const b of G.thrown){
    b.spin+=dt*9;
    if(b.state===0){
      b.t+=dt/b.dur;
      const f=clamp(b.t,0,1);
      b.x=lerp(b.sx,b.tx,f); b.y=lerp(b.sy,b.ty,f);
      b.arc=Math.sin(f*Math.PI)*2.6;
      if(b.t>=1){ b.state=1; b.arc=0; }
    } else { b.fuse-=dt;
      if(b.fuse<=0 && !b.done){ b.done=1; explode(b.x,b.y); } }
  }
  G.thrown=G.thrown.filter(b=>!b.done);
}

   MODULAR CRAFTING  -  src/crafting (CraftingEngine + recipes.json)
   ========================================================================== */
function makeCraftingBridge(){
  return {
    getResource(id){ return (G.res&&G.res[id])||0; },
    spendResources(cost){
      if(!afford(cost)) return false;
      spend(cost);
      return true;
    },
    applyOutput(recipe){
      const out=recipe.output;
      if(!out) return;
      if(out.kind==='potion' && out.item) givePotion(out.item, true);
      else if((out.kind==='weapon'||out.kind==='armor'||out.kind==='magic') && out.item)
        giveMagic(magItem(out.item), true);
      else if(out.kind==='pack' && out.field)
        addToPack(out.packKey||'macar', out.field, out.count||1);
      syncPackTotals();
    },
    skillLevel(k){ return skillLvl(k); },
    learnSkill(k,n){ learn(k,n); }
  };
}
function campActionReady(a){
  if(a.craftRecipeId && window.CraftingEngine)
    return CraftingEngine.canCraft(a.craftRecipeId, makeCraftingBridge()).ok;
  return afford(a.cost);
}
function runCampAction(a){
  if(a.craftRecipeId && window.CraftingEngine){

    if(r.ok) say(r.message, a.grp==='FORGE'?'#ffd27a':'#d2bd63');
    else say(r.message, '#ff6a6a');

}

function roundPath(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }
function carveFrame(g,x,y,w,h,r,a){
  r=Math.min(r||7,w/2,h/2);
  g.fillStyle='rgba(8,6,5,'+(a===undefined?0.84:a)+')'; roundPath(g,x,y,w,h,r); g.fill();
  if(!QUALITY){
    g.strokeStyle='rgba(214,176,112,0.5)'; g.lineWidth=1.5; roundPath(g,x+1,y+1,w-2,h-2,r); g.stroke();
    return;
  }
  const ig=g.createLinearGradient(x,y,x,y+h);
  ig.addColorStop(0,'rgba(48,36,24,0.55)'); ig.addColorStop(1,'rgba(14,10,8,0.35)');
  g.fillStyle=ig; roundPath(g,x+3,y+3,w-6,h-6,Math.max(2,r-2)); g.fill();
  g.strokeStyle='rgba(214,176,112,0.62)'; g.lineWidth=1.8; roundPath(g,x+1,y+1,w-2,h-2,r); g.stroke();
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1.15; roundPath(g,x+4.5,y+4.5,w-9,h-9,Math.max(1,r-3)); g.stroke();
  g.fillStyle='rgba(196,158,88,0.75)';
  const d=5.5;
  [[x+d,y+d],[x+w-d,y+d],[x+d,y+h-d],[x+w-d,y+h-d]].forEach(p=>{
    g.beginPath(); g.arc(p[0],p[1],2.05,0,TAU); g.fill();
  });
}
function plate(g,x,y,w,h,r,a){ carveFrame(g,x,y,w,h,r,a); }
function banner(g,x,y,w,h){ g.beginPath(); g.moveTo(x,y); g.lineTo(x+w,y);
  g.lineTo(x+w-h*.55,y+h); g.lineTo(x,y+h); g.closePath(); }
function face(g,cx,cy,rr,c,dead,ghost){
  const img=(ghost&&c&&SPR[c.key+'_ghost'])||(c&&SPR[c.key]);
  g.save();
  roundPath(g,cx-rr,cy-rr,rr*2,rr*2,3); g.clip();
  g.fillStyle=dead?'#1a120c':'#2a1c14'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2);
  if(img){
    const h=rr*3.15, w=h*(img.width/Math.max(1,img.height));
    g.drawImage(img, cx-w/2, cy-rr*0.55, w, h);
  } else {
  const u=rr/20;
  g.fillStyle=c.skin; g.beginPath(); g.ellipse(cx,cy+2*u,12.4*u,13.4*u,0,0,TAU); g.fill();
  g.fillStyle=c.beard; g.beginPath(); g.moveTo(cx-11*u,cy+1*u);
  g.quadraticCurveTo(cx-14*u,cy+17*u,cx,cy+22*u); g.quadraticCurveTo(cx+14*u,cy+17*u,cx+11*u,cy+1*u); g.closePath(); g.fill();
  g.fillStyle=c.beardD; g.fillRect(cx-1.3*u,cy+2*u,2.6*u,18*u);
  g.fillStyle=c.trim;
  g.beginPath(); g.ellipse(cx-6.4*u,cy+16*u,2.4*u,1.5*u,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(cx+6.4*u,cy+16*u,2.4*u,1.5*u,0,0,TAU); g.fill();
  g.fillStyle='#1d1410'; g.beginPath(); g.arc(cx-4.6*u,cy-1.6*u,2*u,0,TAU); g.fill();
  g.beginPath(); g.arc(cx+4.6*u,cy-1.6*u,2*u,0,TAU); g.fill();
  g.fillStyle='rgba(255,255,255,0.45)';
  g.beginPath(); g.arc(cx-5.2*u,cy-2.4*u,0.7*u,0,TAU); g.fill();
  g.beginPath(); g.arc(cx+4*u,cy-2.4*u,0.7*u,0,TAU); g.fill();
  g.fillStyle=c.hair; g.fillRect(cx-12*u,cy-12*u,24*u,5.5*u);
  if(c.cap){ g.fillStyle=c.cap; g.beginPath(); g.moveTo(cx-13*u,cy-8*u);
    g.quadraticCurveTo(cx,cy-21*u,cx+13*u,cy-8*u); g.closePath(); g.fill(); }
  else { g.fillStyle=c.metal; g.beginPath(); g.arc(cx,cy-8*u,12.4*u,Math.PI,0); g.fill();
    g.fillStyle=c.trim; g.fillRect(cx-2.1*u,cy-19*u,4.2*u,12*u);
    g.fillStyle='rgba(255,246,220,0.28)'; g.fillRect(cx-10*u,cy-14*u,6*u,3*u); }
  }
  if(ghost && !dead){ g.fillStyle='rgba(90,190,255,0.16)'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2); }
  if(dead){ g.fillStyle='rgba(0,0,0,0.65)'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2); }
  g.restore();
  g.strokeStyle='rgba(40,28,16,0.9)'; g.lineWidth=1.6;
  roundPath(g,cx-rr,cy-rr,rr*2,rr*2,3); g.stroke();
}
