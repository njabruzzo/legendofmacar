function drawPortraitStack(g,s){
  const party=ROSTER.map(r=>G.ents.find(e=>e.team==='party'&&e.col&&e.col.key===r.key))
    .filter(e=>e && (e.hero || e.ghost));
  const x=8*s, y=8*s, w=PORT?152*s:188*s, gap=3*s;
  const avail=Math.max(160, VH-(PORT?130*s:110*s));
  const h=Math.min(PORT?46*s:50*s, (avail-y)/Math.max(1,party.length)-gap);
  UI.portraitHits=[];
  party.forEach((e,i)=>{
    const yy=y+i*(h+gap);
    UI.portraitHits.push({x,y:yy,w,h,key:e.col.key});
    carveFrame(g,x,yy,w,h,6,.88);
    if(e.hero){ g.strokeStyle='rgba(255,210,130,0.7)'; g.lineWidth=1.6; roundPath(g,x+1,yy+1,w-2,h-2,6); g.stroke(); }
    if(e.ghost){ g.strokeStyle='rgba(120,210,255,0.75)'; g.lineWidth=1.5; roundPath(g,x+1,yy+1,w-2,h-2,6); g.stroke(); }
    if(G.inspect===e.col.key){ g.strokeStyle='rgba(255,220,140,0.95)'; g.lineWidth=2; roundPath(g,x+1,yy+1,w-2,h-2,6); g.stroke(); }
    const rr=PORT?15*s:17*s, cx=x+rr+8*s, cy=yy+h/2;
    face(g,cx,cy,rr,e.col,e.dead,e.ghost);
    const tx=cx+rr+8*s;
    g.font='800 '+(PORT?11*s:12.5*s)+'px '+FONT_UI;
    g.fillStyle=e.dead?'#6b5b48':(e.ghost?'#cfefff':'#f2e0b6');
    g.fillText(e.col.name+(e.ghost?'  GHOST':'')+'  '+clsLabel(e.cls)+e.lvl, tx, yy+16*s);
    g.font='700 '+(PORT?8*s:8.5*s)+'px '+FONT_UI;
    g.fillStyle='rgba(200,170,120,0.78)';
    const ab=entityAbil(e);
    if(e.ghost && e.dead){
      const sec=Math.max(0, e.ghostReturn||0);
      const mm=(sec/60)|0, ss=(sec%60)|0;
      g.fillStyle='#8ec8ff';
      g.fillText('Returns in '+mm+':'+(ss<10?'0':'')+ss, tx, yy+27*s);
    } else {
      g.fillText(sheetHpNow(e)+'/'+sheetHpMax(e)+' hp  AC '+effectiveAC(e)+(ab?'  CON '+ab.con:''), tx, yy+27*s);
    }
    const bx=tx, by=yy+h-14*s, bw=w-(tx-x)-12*s, bh=7*s, f=clamp(e.hp/e.maxhp,0,1);
    g.fillStyle='rgba(0,0,0,0.72)'; g.fillRect(bx,by,bw,bh);
    const gr=g.createLinearGradient(bx,by,bx,by+bh);
    gr.addColorStop(0,e.dead?'#4a4a4a':(e.ghost?'#6ec8ff':(f<.3?'#e0644a':'#7ad45a')));
    gr.addColorStop(1,e.dead?'#2a2a2a':(e.ghost?'#2a6a9a':(f<.3?'#8a1f14':'#2f7a28')));
    g.fillStyle=gr; g.fillRect(bx,by,bw*(e.dead&&e.ghost?0:f),bh);
    g.strokeStyle='rgba(220,190,130,0.4)'; g.lineWidth=1; g.strokeRect(bx,by,bw,bh);
  });
}

let MINI=null, MINI_KEY='';
function drawMinimap(g,s){
  const L=G.lvl; if(!L) return;
  const sz=PORT?88*s:96*s, x=VW-sz-10*s, y=8*s;
  carveFrame(g,x,y,sz,sz,6,.88);
  const p=player(); if(!p) return;
  const pad=7*s, inner=sz-pad*2, cell=inner/28, ox=x+sz/2-p.x*cell, oy=y+sz/2-p.y*cell;
  const key=((p.x*8)|0)+','+((p.y*8)|0)+','+(G.seenRev||0)+','+(inner|0)+','+G.ch;
  if(!MINI || MINI_KEY!==key){
    MINI_KEY=key;
    if(!MINI) MINI=document.createElement('canvas');
    MINI.width=Math.max(2,inner|0); MINI.height=Math.max(2,inner|0);
    const m=MINI.getContext('2d');
    const mx=MINI.width/2-p.x*cell, my=MINI.height/2-p.y*cell;
    m.fillStyle='#000000'; m.fillRect(0,0,MINI.width,MINI.height);
    for(let j=Math.max(0,(p.y-16)|0);j<Math.min(L.h,p.y+16);j++)
      for(let i=Math.max(0,(p.x-16)|0);i<Math.min(L.w,p.x+16);i++){
        if(!L.seen[j]||!L.seen[j][i]) continue;
        const t=L.grid[j][i];
        if(t===1||t===2){
          m.fillStyle='#1a140f';
          m.fillRect(mx+i*cell,my+j*cell,cell+.7,cell+.7);
          continue;
        }
        const lit=L.vis&&L.vis[j]&&L.vis[j][i];
        m.fillStyle=t===4?(lit?'rgba(212,160,74,0.9)':'rgba(90,68,28,0.7)')
          :t===3?(lit?'rgba(200,168,104,0.82)':'rgba(86,70,48,0.62)')
          :(lit?'rgba(128,112,92,0.7)':'rgba(58,50,42,0.55)');
        m.fillRect(mx+i*cell,my+j*cell,cell+.7,cell+.7); }
  }
  g.save(); g.beginPath(); g.rect(x+pad,y+pad,inner,inner); g.clip();
  g.drawImage(MINI, x+pad, y+pad, inner, inner);
  const MAPC={macar:'#ffe08a',pordoom:'#ff8a4a',fendur:'#8ec8ff',orbo:'#d4b06a',talpor:'#d0d4e8'};
  g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='center';
  for(const e of G.ents){
    if(e.team==='foe'){
      if(e.dead || !tileVisible(e.x,e.y)) continue;
      const mx=ox+e.x*cell, my=oy+e.y*cell;
      g.fillStyle=e.boss?'#ff3a3a':'#e04840';
      g.fillText('E', mx, my+3.2*s);
    } else {
      if(e.dead && !tileExplored(e.x,e.y)) continue;
      const mx=ox+e.x*cell, my=oy+e.y*cell;
      g.fillStyle=MAPC[e.col&&e.col.key]||'#fff2cf';
      g.fillText((e.col&&e.col.name||'M')[0], mx, my+3.2*s);
    }
  }
  const gd=L.guide&&L.guide();
  if(gd && tileExplored(gd.x,gd.y)){ g.fillStyle='#ffd24a'; g.beginPath();
    g.moveTo(ox+gd.x*cell,oy+gd.y*cell-4); g.lineTo(ox+gd.x*cell+3.4,oy+gd.y*cell+2);
    g.lineTo(ox+gd.x*cell-3.4,oy+gd.y*cell+2); g.closePath(); g.fill(); }
  g.textAlign='left';
  g.restore();
}

function drawObjectives(g,s){
  const L=G.lvl; if(!L) return;
  UI.objHit=null; UI.objPanel=null;
  const w=PORT?132*s:160*s;
  const x=VW-w-10*s;
  const miniH=PORT?88*s:96*s;
  const y=8*s+miniH+6*s;
  const linkH=28*s;
  const open=!!G.showObjs;
  const row=PORT?18*s:20*s;
  const listH = 10*s + L.objs.length*row + 8*s;
  const h = open ? (linkH + listH) : linkH;
  if(open){
    carveFrame(g,x,y,w,h,6,.9);
    UI.objPanel={x,y:y+linkH,w,h:listH};
  } else {
    g.fillStyle='rgba(8,6,5,0.55)';
    roundPath(g,x,y,w,linkH,6); g.fill();
  }
  UI.objHit={x,y,w,h:linkH};
  const pulse=open?1:(0.72+Math.sin(G.elapsed*3.2)*0.12);
  g.fillStyle='#e8c36a';
  g.beginPath(); g.moveTo(x+14*s,y+14*s); g.lineTo(x+19*s,y+9*s); g.lineTo(x+24*s,y+14*s); g.lineTo(x+19*s,y+19*s); g.closePath(); g.fill();
  g.font='800 '+(PORT?10*s:11.5*s)+'px '+FONT_TITLE;
  g.fillStyle='rgba(255,226,170,'+pulse+')';
  const title='OBJECTIVES '+(open?'▾':'▸');
  g.fillText(title, x+30*s, y+19*s);
  const tw=g.measureText(title).width;
  g.strokeStyle='rgba(255,214,140,'+(open?0.35:0.85)+')'; g.lineWidth=1.3;
  g.beginPath(); g.moveTo(x+30*s, y+22*s); g.lineTo(x+30*s+tw, y+22*s); g.stroke();
  if(open){
    g.font='700 '+(PORT?10*s:11.5*s)+'px '+FONT_UI;
    L.objs.forEach((o,i)=>{
      const yy=y+linkH+16*s+i*row;
      const active = !o.d && L.objs.slice(0,i).every(z=>z.d);
      g.fillStyle=o.d?'rgba(140,180,120,0.7)':(active?'#f4e2b8':'rgba(210,193,158,0.7)');
      g.fillText(o.t, x+14*s, yy);
      if(o.d){ const m=g.measureText(o.t).width; g.strokeStyle='rgba(140,180,120,0.55)'; g.lineWidth=1.4;
        g.beginPath(); g.moveTo(x+14*s,yy-4*s); g.lineTo(x+14*s+m,yy-4*s); g.stroke(); }
    });
  }
  UI.questBottom = y+h;
}

function drawLog(g,s){
  const w=236*s,h=108*s,x=VW-w-10*s,y=VH-h-(PORT?96*s:94*s);
  carveFrame(g,x,y,w,h,6,.8);
  g.font='800 '+(10*s)+'px '+FONT_TITLE; g.fillStyle='rgba(232,217,184,0.9)';
  g.fillText('COMBAT LOG',x+12*s,y+16*s);
  g.strokeStyle='rgba(190,150,90,0.3)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x+10*s,y+22*s); g.lineTo(x+w-10*s,y+22*s); g.stroke();
  g.font='600 '+(10*s)+'px '+FONT_UI;
  const lines=[];
  for(const l of G.log){
    const tag=l.k==='combat'?'[COMBAT] ':'[LOG] ';
    const words=(tag+l.t).split(' '); let cur='';
    for(const wd of words){ const t=cur?cur+' '+wd:wd;
      if(g.measureText(t).width>w-22*s){ lines.push({t:cur,c:l.c,a:l.a,k:l.k}); cur=wd; } else cur=t; }
    if(cur) lines.push({t:cur,c:l.c,a:l.a,k:l.k}); }
  lines.slice(-6).forEach((l,i)=>{
    g.globalAlpha=l.a;
    const combat=l.t.indexOf('[COMBAT]')===0 || l.k==='combat';
    g.fillStyle=combat?'#ff6a5a':(l.t.indexOf('[LOG]')===0?'#ffb45c':l.c);
    g.fillText(l.t,x+12*s,y+38*s+i*12.2*s);
  });
  g.globalAlpha=1;
}

// on-screen compass to the next objective - the single biggest nav win
function drawGuideArrow(g,s){
  const L=G.lvl,p=player(); if(!L||!p||!L.guide) return;
  const gd=L.guide(); if(!gd) return;
  if(dist(p,gd)<3.2) return;
  const ps=w2s(p.x,p.y), ts=w2s(gd.x,gd.y);
  const a=Math.atan2(ts.y-ps.y,ts.x-ps.x);
  const rad=(PORT?64:78)*s;
  const cx=ps.x+Math.cos(a)*rad, cy=ps.y-46*ZOOM+Math.sin(a)*rad*.85;
  const pulse=.55+Math.sin(G.elapsed*3.4)*.25;
  g.save(); g.translate(cx,cy); g.rotate(a);
  g.fillStyle='rgba(255,206,110,'+pulse+')';
  g.beginPath(); g.moveTo(15*s,0); g.lineTo(-7*s,-9*s); g.lineTo(-3*s,0); g.lineTo(-7*s,9*s); g.closePath(); g.fill();
  g.strokeStyle='rgba(60,36,10,0.7)'; g.lineWidth=1.4; g.stroke();
  g.restore();
}

function drawBackpack(g,s){
  const r=UI.orb.r, cx=UI.orb.x, cy=UI.orb.y;
  carveFrame(g, cx-r, cy-r, r*2, r*2, 6, .92);
  const img=SPR.icon_pack;
  if(img&&img.width){
    g.save();
    roundPath(g,cx-r+3*s,cy-r+3*s,r*2-6*s,r*2-6*s,4); g.clip();
    const dw=r*2-6*s, dh=r*2-6*s;
    const sc=Math.max(dw/img.width, dh/img.height);

function drawStickBase(g,s){
  const home=UI.stickHome;
  const k=IN.stick;
  const ox=(k&&k.moved)?k.ox:home.x, oy=(k&&k.moved)?k.oy:home.y, R=home.r;
  const active=!!(k&&k.moved);
  g.globalAlpha=active?1:.42;
  g.fillStyle='rgba(16,11,7,0.45)'; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.fill();
  g.strokeStyle='rgba(214,180,120,0.55)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.stroke();
  // 4 iso direction ticks
  g.strokeStyle='rgba(214,180,120,0.30)'; g.lineWidth=2*s;
  for(let i=0;i<4;i++){ const a=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(ox+Math.cos(a)*R*.6,oy+Math.sin(a)*R*.6);
    g.lineTo(ox+Math.cos(a)*R*.85,oy+Math.sin(a)*R*.85); g.stroke(); }
  let dx=0,dy=0;
  if(active){ dx=k.x-k.ox; dy=k.y-k.oy; const m=Math.hypot(dx,dy);
    if(m>R*.72){ dx=dx/m*R*.72; dy=dy/m*R*.72; } }
  g.fillStyle='rgba(236,214,168,0.62)'; g.beginPath(); g.arc(ox+dx,oy+dy,R*.42,0,TAU); g.fill();
  g.strokeStyle='rgba(255,236,192,0.85)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox+dx,oy+dy,R*.42,0,TAU); g.stroke();
  g.globalAlpha=1;
}

function slotAnimImg(b){
  const ico=b.ico||(b.key==='attack'?'sword':((ABIL.find(a=>a.key===b.key)||{}).ico));
  const k=ICON_SPR[ico];
  if(!k) return null;
  const ab=ABIL.find(a=>a.key===b.key);
  if(b.hold && SPR[k+'_atk']) return SPR[k+'_atk'];
  if((b.key==='search'&&G.searching)||(b.key==='shovel'&&G.digging)||(b.key==='wall'&&player()&&player().defending)||(b.key==='craft'&&G.scene==='craft')) return SPR[k+'_atk']||SPR[k]||null;
  if(ab && cds[ab.key]>0 && cds[ab.key]>ab.cd-0.22 && SPR[k+'_atk']) return SPR[k+'_atk'];
  if(QUALITY && !(ab && cds[ab.key]>0)){
    const a=SPR[k+'_w1'], c=SPR[k+'_w2']||SPR[k];
    if(a) return ((G.elapsed*5)|0)%2 ? (c||a) : a;
  }
  return SPR[k]||null;
}
function drawSlot(g,b,s){
  const R=b.r, x=b.x-R, y=b.y-R, w=R*2, h=R*2;
  const ab=ABIL.find(a=>a.key===b.key);
  const ready=!ab || !(ab.cd>0) || (cds[ab.key]||0)<=0;
  const ico=b.ico||(b.key==='attack'?'attack':(ab&&ab.ico));
  carveFrame(g,x,y,w,h,5,.92);
  if(b.hold){ g.strokeStyle='rgba(255,220,150,0.95)'; g.lineWidth=2.2*s; roundPath(g,x+1,y+1,w-2,h-2,5); g.stroke(); }
  if((b.key==='search'&&G.searching)||(b.key==='secret'&&G.secretSearch)||(b.key==='shovel'&&G.digging)||(b.key==='wall'&&player()&&player().defending)||(b.key==='craft'&&G.scene==='craft')){
    g.strokeStyle='rgba(255,214,140,'+(0.5+Math.sin(G.elapsed*6)*0.4)+')'; g.lineWidth=2.4*s;
    roundPath(g,x-2.5*s,y-2.5*s,w+5*s,h+5*s,6); g.stroke(); }
  const col=ready?(b.key==='rally'?'#ff8a7a':'#e9d5a6'):'rgba(160,140,110,0.42)';

    g.save();
    roundPath(g,x+3*s,y+3*s,w-6*s,h-6*s,3); g.clip();
    g.globalAlpha=ready?1:0.42;
    const iw=Math.max(1,simg.width), ih=Math.max(1,simg.height);
    const dw=w-6*s, dh=h-6*s;
    const sc=Math.max(dw/iw, dh/ih);
    const rw=iw*sc, rh=ih*sc;
    g.drawImage(simg, x+3*s+(dw-rw)/2, y+3*s+(dh-rh)/2, rw, rh);
    g.globalAlpha=1; g.restore();
  } else {
    icon(g, ico, b.x, b.y-(b.num?2*s:0), b.small?0.78*s:1.05*s, col);
  }
  if(b.num){
    g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='left';

  }

    syncPackTotals();

    if(!n){ g.fillStyle='rgba(8,5,3,0.5)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill(); }
    const px=b.x+R*0.72, py=b.y-R*0.72;
    g.fillStyle=n?'rgba(20,14,8,0.92)':'rgba(50,14,8,0.92)';
    g.beginPath(); g.arc(px,py,8.4*s,0,TAU); g.fill();
    g.strokeStyle=n?'rgba(214,176,104,0.85)':'rgba(190,80,60,0.8)'; g.lineWidth=1.4*s; g.stroke();
    g.font='800 '+(9.5*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle=n?'#f2dfb6':'#ff9a86'; g.fillText(String(n),px,py+3.4*s); g.textAlign='left';
  }
  if(ab&&ab.key==='bomb'&&G.aim){
    g.strokeStyle='rgba(255,170,90,'+(0.6+Math.sin(G.elapsed*6)*0.3)+')'; g.lineWidth=2.4*s;

  if(b.key==='shovel'&&G.digging){
    const left=G.dig?Math.max(0,digNeedMinutes()-G.dig.min):digNeedMinutes();

    g.lineWidth=3*s; g.strokeStyle='rgba(0,0,0,0.75)';

    g.fillStyle='#f2dfb6'; g.fillText(b.label, b.x, b.y-R-3*s); g.textAlign='left'; }
}

function drawTitleCavern(g){
  const cx=VW/2, cy=VH*0.44, z=Math.min(VW,VH)/620;
  g.save(); g.translate(cx, cy+52*z);
  for(let i=-8;i<=8;i++) for(let j=-5;j<=7;j++){
    const x=(i-j)*40*z, y=(i+j)*20*z;
    g.strokeStyle='rgba(90,70,50,0.22)'; g.lineWidth=1.3;
    g.beginPath(); g.moveTo(x,y-20*z); g.lineTo(x+40*z,y); g.lineTo(x,y+20*z); g.lineTo(x-40*z,y); g.closePath(); g.stroke();
  }
  g.restore();
  g.save(); g.translate(cx, cy-28*z);
  if(SPR.rubydoor){
    drawBillboard(g, SPR.rubydoor, 340*z);
    const pulse=.7+Math.sin(G.t*2.4)*.3;
    const glow=g.createRadialGradient(0,-120*z,8,0,-120*z,170*z);
    glow.addColorStop(0,'rgba(255,40,50,'+(0.38*pulse)+')'); glow.addColorStop(1,'rgba(255,40,50,0)');
    g.fillStyle=glow; g.beginPath(); g.arc(0,-120*z,170*z,0,TAU); g.fill();
  }
  g.restore();
  function mush(mx,my,sc){
    g.save(); g.translate(mx,my); g.scale(sc,sc);
    if(SPR.shroom) drawBillboard(g, SPR.shroom, 56);
    g.restore();
  }
  mush(cx-250*z, cy+90*z, 1.7); mush(cx-190*z, cy+114*z, 1.1);
  mush(cx+230*z, cy+84*z, 1.8); mush(cx+170*z, cy+118*z, 1.2);
  const keys=['pordoom','fendur','macar','orbo','talpor'];
  for(let i=0;i<5;i++){
    const dx=(i-2)*42*z, dy=cy+148*z + Math.abs(i-2)*10*z;
    g.save(); g.translate(cx+dx, dy);
    g.fillStyle='rgba(8,6,5,0.55)';
    g.beginPath(); g.ellipse(0, 4*z, 14*z, 7*z, 0,0,TAU); g.fill();
    if(SPR[keys[i]]) drawBillboard(g, SPR[keys[i]], 64*z);
    g.restore();
  }
}
function drawSplashCover(g, img){

function wareCostGp(r){
  if(r.gp!=null) return r.gp;
  const c=r.cost||{};
  return (c.gp||0)+(c.sp||0)*0.1+(c.cp||0)*0.01+(c.ep||0)*0.5+(c.pp||0)*5;
}
function warePriceText(r){
  if(r.price) return r.price;
  const c=r.cost||{};
  if(c.cp) return c.cp+' CP';
  if(c.sp) return c.sp+' SP';
  if(c.gp) return c.gp+' GP';
  if(r.gp!=null) return r.gp+' GP';
  return '';
}

/* ---------------------------- tap resolution ---------------------------- */
function resolveTaps(){
  while(IN.taps.length){
    const t=IN.taps.shift();
    if(G.sleepShow) continue;
    if(G.scene==='play'&&!G.paused){
      if(promptBtn&&t.x>promptBtn.x&&t.x<promptBtn.x+promptBtn.w&&t.y>promptBtn.y&&t.y<promptBtn.y+promptBtn.h){
        fire('use'); continue; }
      const p=player(); if(!p) continue;
      if(throwBtn&&t.x>throwBtn.x&&t.x<throwBtn.x+throwBtn.w&&t.y>throwBtn.y&&t.y<throwBtn.y+throwBtn.h){
        if(refuseAttack(p)) continue;
        cds.bomb=ABIL.find(a=>a.key==='bomb').cd; throwBomb(); continue; }
      const w=s2w(t.x,t.y+22*ZOOM);
      if(G.aim){ const d=dist(p,w), R=8;
        G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y};
        continue; }
      const foe=G.ents.find(e=>e.team==='foe'&&!e.dead&&dist(e,w)<1.1);
      const pile=(G.loot||[]).find(q=>!q.gone&&dist(q,w)<0.95);
      const body=G.ents.find(e=>isLootableBody(e)&&!e.looted&&dist(e,w)<1.85);
      if(pile && (!foe || dist(pile,w)<=dist(foe,w)) && (!body || dist(pile,w)<=dist(body,w))){
        if(dist(p,pile)<1.5) takeLoot(pile);
        else { p.dest={x:pile.x,y:pile.y,loot:pile.id}; p.stuck=0; p.lastD=undefined; }
        continue;
      }
      if(body && (!foe || dist(body,w)<=dist(foe,w))){
        if(dist(p,body)<1.85) lootNearbyCorpses(p,1.85);
        else { p.dest={x:body.x,y:body.y,corpse:body.id}; p.stuck=0; p.lastD=undefined; }
        continue;
      }
      if(foe){ p.dest={x:foe.x,y:foe.y,foe:foe.id}; p.stuck=0; p.lastD=undefined; continue; }
      const dst=nearestWalk(w.x,w.y,p);
      if(dst){ p.dest={x:dst.x,y:dst.y}; p.stuck=0; p.lastD=undefined; }
      continue;
    }
    for(const h of menuHits) if(t.x>h.x&&t.x<h.x+h.w&&t.y>h.y&&t.y<h.y+h.h){ h.fn(); break; }
  }
}

/* ---------------------------- loop ---------------------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05); G.t+=dt;
  tickGfx(dt);
  /* SkillSystem is registered on ENGINE.systems (after ABIL/cds).
     update() → runSystems(dt) ticks it every unpaused play frame, before
     movement (steerWalk / move) and the entity position loop. */
  if(G.hitstop>0) G.hitstop-=dt; else update(dt);
  syncMusic();
  render(); resolveTaps();
  requestAnimationFrame(loop);
}
resize();
bakeTextures(PAL.mine);
loadSprites(()=>{});
if(window.CraftingEngine) CraftingEngine.load('src/crafting/recipes.json');
try{
  if(/play/.test((location.hash||'')+(location.search||''))) { startChapter(1); G.scene='play'; }
}catch(e){ console.error(e); }
render();
requestAnimationFrame(loop);

/* ===================== DIAGNOSTIC OVERLAY (⚑) =========================
   Pure DOM, composited by the browser OUTSIDE the canvas. If the colour
   lines appear across this panel too, the fault is not in the canvas
   render code at all — it's the compositor or the GPU driver. */
(function(){
  const PASSES=[
    ['world','World tiles'],['lighting','Lighting (multiply)'],
    ['godrays','God rays'],['bloom','Bloom (lighter x2)'],
    ['memshade','Memory shade'],['beyond','Beyond mask'],
    ['atmos','Atmosphere'],['floaters','Floaters'],
    ['grain','Film grain (overlay)'],['hurt','Hurt vignette'],
    ['flash','Flash'],['shake','Screen shake'],['hud','HUD']
  ];
  const css=document.createElement('style');
  css.textContent=
  '#dgBtn{position:fixed;left:8px;bottom:8px;z-index:99999;width:44px;height:44px;'+
  'border-radius:22px;background:#1b1410;color:#ffcf7a;border:2px solid #6b4d28;'+
  'font:700 20px/1 sans-serif;display:flex;align-items:center;justify-content:center;'+
  'opacity:.55;-webkit-tap-highlight-color:transparent}'+
  '#dgPanel{position:fixed;left:8px;right:8px;bottom:60px;z-index:99999;display:none;'+
  'background:rgba(13,10,8,.95);border:2px solid #6b4d28;border-radius:10px;padding:10px;'+
  'color:#e8d9bd;font:12px/1.35 ui-monospace,monospace;max-height:70vh;overflow:auto}'+
  '#dgPanel h4{margin:0 0 6px;color:#ffcf7a;font-size:12px;letter-spacing:.08em}'+
  '#dgRead{white-space:pre;color:#9fd6a0;margin-bottom:8px;font-size:11px}'+
  '#dgPanel label{display:flex;align-items:center;gap:8px;padding:5px 2px;'+
  'border-bottom:1px solid #2a1f15}'+
  '#dgPanel input{width:18px;height:18px;accent-color:#c8912f}'+
  '#dgRow{display:flex;gap:6px;margin-top:8px}'+
  '#dgPanel button{flex:1;background:#241a12;color:#ffcf7a;border:1px solid #6b4d28;'+
  'border-radius:6px;padding:8px;font:600 12px sans-serif}';
  document.head.appendChild(css);

  const btn=document.createElement('div'); btn.id='dgBtn'; btn.textContent='\u2691';
  const pan=document.createElement('div'); pan.id='dgPanel';
  pan.innerHTML='<h4>RENDER PASS DIAGNOSTIC</h4><div id="dgRead"></div>';
  document.body.appendChild(btn); document.body.appendChild(pan);

  const KEYS=PASSES.map(p=>p[0]).concat(['smooth','dpr2']);
  const mk=(key,label,after)=>{
    const l=document.createElement('label');
    const i=document.createElement('input'); i.type='checkbox'; i.checked=!!DIAG[key];
    i.addEventListener('change',()=>{ DIAG[key]=i.checked?1:0; if(after) after(); });
    l.appendChild(i); l.appendChild(document.createTextNode(label));
    pan.appendChild(l);
  };
  PASSES.forEach(p=>mk(p[0],p[1]));
  mk('smooth','Image smoothing',function(){resize(true);});
  mk('dpr2','DPR 2 (sharper, slower)',function(){resize(true);});

  const row=document.createElement('div'); row.id='dgRow';
  const bAll=document.createElement('button'); bAll.textContent='All on';
  const bMin=document.createElement('button'); bMin.textContent='World only';
  row.appendChild(bAll); row.appendChild(bMin); pan.appendChild(row);
  const sync=function(){
    const ins=pan.querySelectorAll('input');
    for(let n=0;n<ins.length;n++) ins[n].checked=!!DIAG[KEYS[n]];
  };
  bAll.addEventListener('click',function(){
    PASSES.forEach(function(p){DIAG[p[0]]=1;}); DIAG.smooth=1; sync(); resize(true);});
  bMin.addEventListener('click',function(){
    PASSES.forEach(function(p){DIAG[p[0]]=0;}); DIAG.world=1; DIAG.hud=1; sync();});
  btn.addEventListener('click',function(){
    pan.style.display = (pan.style.display==='block') ? 'none' : 'block';});

  const read=document.getElementById('dgRead');
  setInterval(function(){
    if(pan.style.display!=='block') return;
    read.textContent=
      'device dpr '+(window.devicePixelRatio||1).toFixed(3)+'  using '+DPR+'\n'+
      'css    '+VW+' x '+VH+'\n'+
      'canvas '+cv.width+' x '+cv.height+'\n'+
      'mode   '+GFX_MODE+'   quality '+QUALITY+'\n'+
      'frame  '+FRAME_MS.toFixed(1)+' ms  ~'+(1000/Math.max(1,FRAME_MS)).toFixed(0)+' fps\n'+
      'tile   '+TW+' x '+TH+'\n'+
      (PHONE_GFX?'phone-safe: HD tiles + 1:1 light, no tear/bloom/grain':'desktop full fx');
  },250);
})();
</script>
