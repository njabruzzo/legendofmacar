<script>
"use strict";
/* ==========================================================================
   THE LEGEND OF MACAR - Book I: From the Deep Seam
   Renderer: baked rock textures + colour lightmap (multiply) + additive bloom
   + persistent decals + sculpted characters. Canvas 2D, portrait & landscape.
   ========================================================================== */

const cv  = document.getElementById('c');
/* desynchronized:true lets Android Chrome present a half-drawn frame.
   That tear is horizontal bands of clear / floors / lights — the
   coloured scanlines. Full-frame games must stay double-buffered. */
const IS_ANDROID = /Android/i.test(navigator.userAgent||'');
const IS_TOUCH = (navigator.maxTouchPoints||0) > 0 || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent||'');
const PHONE_GFX = IS_ANDROID || IS_TOUCH;
const ctx = cv.getContext('2d', { alpha:false, desynchronized:false });
const LM  = document.createElement('canvas'), lmx = LM.getContext('2d');   // lightmap
const BL  = document.createElement('canvas'), blx = BL.getContext('2d');   // bloom
const BX  = document.createElement('canvas'), bxx = BX.getContext('2d');   // beyond-rock mask
let VW=0, VH=0, DPR=1, UIS=1, ZOOM=1, TW=80, TH=40, PORT=false;
let QUALITY = 1;           // 0 = Fast. 1 = High (default) — albedo is painted bright for the lightmap.
let GFX_MODE = IS_TOUCH ? 'auto' : 'high';   // fast | auto | high — phones start adaptive
let FRAME_MS = 16.6;
let CAN_BLUR = false;
let GRAINPAT = null;
/* ---- DIAGNOSTIC PASS TOGGLES (⚑ button, bottom-left) -------------------
   Every entry starts true = normal rendering. Flip one off at a time on the
   real device to bisect which pass is producing the colour-line artifact.
   Phone GPUs still force the safe implementations inside those passes. */
const DIAG = { world:1, lighting:1, godrays:1, bloom:1, memshade:1, beyond:1,
               atmos:1, floaters:1, grain:1, hurt:1, flash:1, shake:1, hud:1,
               smooth: 1, dpr2:0 };
let BX_KEY = '';
const TILEBLIT={key:'',floor:null,wall:null,face:null,faceL:null,faceR:null};
let CAMSX=0, CAMSY=0;
let LAST_LAYOUT={w:0,h:0,dpr:0};

/* DPR must stay a whole number. At 1.25 every drawImage lands on a fractional
   device pixel, so smoothed edges bleed and produce shimmering hairline seams
   that read as flashing lines. Integer scale = clean edges, and it's faster. */
function gfxDprCap(){ return (DIAG.dpr2 && !PHONE_GFX) ? 2 : 1; }
/* Assigning canvas.width to the same value still clears the bitmap on
   Chromium. Only write when the size actually changed. */
function setCanvasSize(c, w, h){
  w=Math.max(2, w|0); h=Math.max(2, h|0);
  if(c.width!==w) c.width=w;
  if(c.height!==h) c.height=h;
}
function applyGfxBuffers(keepTiles){
  BX_KEY='';
  if(!keepTiles) TILEBLIT.key='';
  /* Phones: 1:1 offscreen passes. Any non-integer upscale plus nearest-
     neighbor duplicates some rows more than others = coloured scanlines. */
  const bx = PHONE_GFX ? 1 : (QUALITY?0.45:0.28);
  const lmDiv = PHONE_GFX ? 1 : (QUALITY?2:4);
  const blDiv = PHONE_GFX ? 2 : 5;
  setCanvasSize(BX, Math.floor(VW*bx), Math.floor(VH*bx));
  setCanvasSize(LM, Math.floor(VW/lmDiv), Math.floor(VH/lmDiv));
  setCanvasSize(BL, Math.floor(VW/blDiv), Math.floor(VH/blDiv));
}
function viewSize(){
  /* Android Chrome's visualViewport / innerHeight tracks the URL bar
     every frame. Resizing the bitmap that often flashes torn bands. */
  if(IS_ANDROID){
    const de=document.documentElement;
    const w=de.clientWidth||window.innerWidth;
    let h=de.clientHeight||window.innerHeight;
    if(LAST_LAYOUT.h>0 && LAST_LAYOUT.w===Math.round(w)){
      const dh=Math.abs(Math.round(h)-LAST_LAYOUT.h);
      if(dh>0 && dh<96) h=LAST_LAYOUT.h;
      else h=Math.round(h);
    } else h=Math.round(h);
    return {w:Math.max(240, Math.round(w)), h:Math.max(240, h)};
  }
  const vv=window.visualViewport;
  const w=vv&&vv.width?vv.width:window.innerWidth;
  const h=vv&&vv.height?vv.height:window.innerHeight;
  return {w:Math.max(240, Math.round(w)), h:Math.max(240, Math.round(h))};
}
function blitScreen(g, src){
  if(src.width===VW && src.height===VH){ g.drawImage(src, 0, 0); return; }
  const smooth=!PHONE_GFX && !!DIAG.smooth;
  const prev=g.imageSmoothingEnabled;
  g.imageSmoothingEnabled=smooth;
  if(g.imageSmoothingQuality) g.imageSmoothingQuality=smooth?'medium':'low';
  g.drawImage(src, 0, 0, VW, VH);
  g.imageSmoothingEnabled=prev;
}
function drawPhoto(g, img, dx, dy, dw, dh){
  if(!img) return;
  const prev=g.imageSmoothingEnabled;
  g.imageSmoothingEnabled=true;
  if(g.imageSmoothingQuality) g.imageSmoothingQuality='medium';
  g.drawImage(img, dx, dy, dw, dh);
  g.imageSmoothingEnabled=prev;
}
function syncCamProj(){
  const cam=G&&G.cam;
  if(!cam){ CAMSX=VW/2; CAMSY=VH*0.5; return; }
  CAMSX = Math.round(VW/2 - (cam.x-cam.y)*(TW/2));
  CAMSY = Math.round(VH*(PORT?.46:.52) - (cam.x+cam.y)*(TH/2));
}
let GFX_SLOW=0, GFX_FAST=0;
function tickGfx(dt){
  FRAME_MS = FRAME_MS*0.9 + (dt*1000)*0.1;
  if(GFX_MODE!=='auto' || IS_ANDROID) return;
  /* Hysteresis: act on sustained trends, never a single spike, and allow
     recovery back to High if the device turns out to have headroom. */
  if(FRAME_MS>21.5){ GFX_SLOW++; GFX_FAST=0; }
  else if(FRAME_MS<14.5){ GFX_FAST++; GFX_SLOW=0; }
  else { GFX_SLOW=0; GFX_FAST=0; }
  if(QUALITY && GFX_SLOW>30){        // ~0.5s of sustained slow frames
    QUALITY=0; GFX_SLOW=0; GFX_FAST=0; resize(true);
  } else if(!QUALITY && GFX_FAST>420){ // ~7s of comfortable headroom
    QUALITY=1; GFX_SLOW=0; GFX_FAST=0; resize(true);
  }
}
function gfxLabel(){ return GFX_MODE==='high'?'High':GFX_MODE==='auto'?'Auto':'Fast'; }
function cycleGfx(){
  GFX_MODE = GFX_MODE==='fast'?'auto':GFX_MODE==='auto'?'high':'fast';
  QUALITY = GFX_MODE==='high'?1:0;
  GFX_SLOW=0; GFX_FAST=0;
  resize(true);
}

/* Mobile browsers fire `resize` every time the URL bar slides in or out during
   play. A full resize re-bakes the whole tileset (makeWorkedFace x2 + cap), which
   is a multi-frame hitch. When only the height moved by a bar-sized amount we take
   a soft path: keep ZOOM/TW/TH frozen, keep the tile cache, just re-fit the canvas. */
function resize(force){
  const nDPR = Math.min(window.devicePixelRatio||1, gfxDprCap());
  const vs=viewSize();
  const nVW  = vs.w, nVH = vs.h;
  if(!force && LAST_LAYOUT.w===nVW && LAST_LAYOUT.h===nVH && LAST_LAYOUT.dpr===nDPR) return;
  const soft = !force && LAST_LAYOUT.h>0 && LAST_LAYOUT.w===nVW && LAST_LAYOUT.dpr===nDPR
               && Math.abs(LAST_LAYOUT.h-nVH)<=140 && (nVH>nVW)===(LAST_LAYOUT.h>LAST_LAYOUT.w);
  DPR = nDPR; VW = nVW; VH = nVH;
  setCanvasSize(cv, Math.floor(VW*DPR), Math.floor(VH*DPR));
  const cssW=VW+'px', cssH=VH+'px';
  if(cv.style.width!==cssW) cv.style.width=cssW;
  if(cv.style.height!==cssH) cv.style.height=cssH;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled = !!DIAG.smooth;
  if(ctx.imageSmoothingQuality) ctx.imageSmoothingQuality = 'medium';
  PORT = VH > VW;
  if(!soft){
    GRAINPAT = null;
    UIS  = clamp(Math.min(VW,VH)/(PORT?430:700), 0.66, 1.30);
    ZOOM = clamp(Math.min(VW,VH*1.5)/780, 0.78, 1.55);
    TW = Math.round(84*ZOOM); TH = Math.round(42*ZOOM);
    if(TW&1) TW++; if(TH&1) TH++;
  }
  applyGfxBuffers(soft);
  syncCamProj();
  layoutUI();
  LAST_LAYOUT={w:VW,h:VH,dpr:DPR};
}
/* Coalesce bursts of resize events into one per frame. */
let RSZ_PENDING=0;
function requestResize(){
  if(RSZ_PENDING) return;
  RSZ_PENDING = requestAnimationFrame(()=>{ RSZ_PENDING=0; resize(); });
}
window.addEventListener('resize', requestResize);
window.addEventListener('orientationchange', ()=>setTimeout(()=>resize(true),200));
if(window.visualViewport){
  visualViewport.addEventListener('resize', requestResize, {passive:true});
  if(!IS_ANDROID) visualViewport.addEventListener('scroll', requestResize, {passive:true});
}
CAN_BLUR=false;

/* ---------------------------- utils ---------------------------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const ri=(a,b)=>Math.floor(rnd(b+1,a));
function h2(x,y){ let n=(x|0)*374761393+(y|0)*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
function h3(x,y,s){ let n=(x|0)*374761393+(y|0)*668265263+(s|0)*1442695041; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
function h01(x,y,s){ const t=h3(x,y,s)+h3(x+19,y+41,(s|0)+7); return t>1?t-1:t; }
const ang=(dx,dy)=>Math.atan2(dy,dx);
function approach(a,b,max){ const d=b-a; if(Math.abs(d)<=max) return b; return a+Math.sign(d)*max; }
function turnToward(e,dx,dy,dt,rate){
  if(!(dx||dy)) return 0;
  const ta=ang(dx,dy); let ca=ang(e.fdx,e.fdy);
  let d=((ta-ca+Math.PI*3)%TAU)-Math.PI;
  const max=(rate||16)*dt;
  if(Math.abs(d)<=max){ e.fdx=Math.cos(ta); e.fdy=Math.sin(ta); return 0; }
  ca+=Math.sign(d)*max; e.fdx=Math.cos(ca); e.fdy=Math.sin(ca);
  return Math.abs(d)-max;
}
function gaitAdvance(e,dt){ e.gait=(e.gait||0)+Math.max(0,dt)*2.55; }
function partyForm(i,p){
  const slots=[[-1.15,0.95],[-1.15,-0.95],[-2.15,0.55],[-2.15,-0.55]];
  const s=slots[(i-1)%4], fx=p.fdx, fy=p.fdy, rx=-fy, ry=fx;
  return {x:p.x+fx*s[0]+rx*s[1], y:p.y+fy*s[0]+ry*s[1]};
}
function bestSlide(e,dx,dy){
  let best=null, score=-1e9;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, sx=Math.cos(a), sy=Math.sin(a);
    if(sx*dx+sy*dy<0.12) continue;
    const nx=e.x+sx*0.5, ny=e.y+sy*0.5;
    if(!canBe(nx,e.y,e.r,e) && !canBe(e.x,ny,e.r,e)) continue;
    const along=sx*dx+sy*dy;
    if(along>score){ score=along; best={dx:sx,dy:sy}; }
  }
  return best;
}
function nearestWalk(x,y,e){
  if(walk(x,y,e)) return {x,y};
  let best=null, bd=99;
  for(let j=-3;j<=3;j++) for(let i=-3;i<=3;i++){
    const nx=(x|0)+i+0.5, ny=(y|0)+j+0.5;
    if(!walk(nx,ny,e)) continue;
    const d=Math.hypot(nx-x,ny-y);
    if(d<bd){ bd=d; best={x:nx,y:ny}; }
  }
  return best;
}
function recordTrail(p){
  G.trail=G.trail||[];
  const last=G.trail[G.trail.length-1];
  if(!last || Math.hypot(p.x-last.x,p.y-last.y)>0.16){
    G.trail.push({x:p.x,y:p.y,fdx:p.fdx,fdy:p.fdy});
    if(G.trail.length>140) G.trail.shift();
  }
}
function trailSlot(i){
  const t=G.trail||[];
  if(t.length<4) return null;
  const need=1.2*(i+1);
  let acc=0;
  for(let k=t.length-1;k>0;k--){
    acc+=Math.hypot(t[k].x-t[k-1].x, t[k].y-t[k-1].y);
    if(acc>=need) return t[k];
  }
  return t[0];
}
function steerWalk(e,dx,dy,sp,dt){
  if(!(dx||dy) || sp<=0){ e.ix=0; e.iy=0; e.moving=0; return 0; }
  const m=Math.hypot(dx,dy)||1;
  dx/=m; dy/=m;
  turnToward(e, dx, dy, dt, 22);
  const aligned=e.fdx*dx+e.fdy*dy;
  if(aligned<0.16){
    e.ix=0; e.iy=0; e.moving=1;
    gaitAdvance(e, dt);
    return 0;
  }
  const ox=e.x, oy=e.y;
  e.ix=e.fdx*sp; e.iy=e.fdy*sp;
  move(e, e.ix, e.iy, dt);
  let distMoved=Math.hypot(e.x-ox, e.y-oy);
  if(distMoved<0.002){
    const slide=bestSlide(e, dx, dy);
    if(slide){
      turnToward(e, slide.dx, slide.dy, dt, 20);
      e.ix=e.fdx*sp; e.iy=e.fdy*sp;
      move(e, e.ix, e.iy, dt);
      distMoved=Math.hypot(e.x-ox, e.y-oy);
    }
  }
  e.moving=1;
  gaitAdvance(e, dt);
  if(distMoved<0.002){ e.ix=0; e.iy=0; }
  return distMoved;
}
function shade(h,a){
  h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(clamp(a>0? v+(255-v)*a : v*(1+a),0,255));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgbOf(h){ h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hexA(h,a){ const c=rgbOf(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
const OL='rgba(11,8,6,0.9)';
const FONT_UI='"Trebuchet MS","Gill Sans",Optima,sans-serif';
const FONT_TITLE='Cinzel,Palatino,"Palatino Linotype",Georgia,serif';

/* ---------------------------- painted sprites (Baldur's Gate isometric) ---------------------------- */
const SPR={};
const ASSET_VER='41';
let SPLASH_STATE='loading';
function assetUrl(src){
  const u=src+(src.indexOf('?')>=0?'&':'?')+'v='+ASSET_VER;
  try{ return new URL(u, document.baseURI).href; }
  catch(_){ return u; }
}

/* ---------------------------- looping BGM ---------------------------- */
const MUSIC={
  title:'assets/music/SongOfTheForge.mp3',
  ch1:'assets/music/TheCave.mp3',
  ch2:'assets/music/Dungeon_1.mp3',
  battle:'assets/music/SongOfTheForge.mp3'
};
const MUSIC_CREDITS=[
  {use:'Title screen and battle', title:'Song of the Forge', owner:'Scott Buckley', extra:'www.scottbuckley.com.au', license:'CC BY 4.0'},
  {use:'Chapter I', title:'The Cave', owner:'HitCtrl', extra:'RPG \u2014 The Cave (Ambient)', license:'CC-BY (credit HitCtrl)'},
  {use:'Chapter II', title:'Dungeon_01', owner:'Beau Buckley', extra:'Emberstorm Music Collection', license:'CC BY-SA 4.0'}
];
function openCredits(from){ G.creditsFrom=from||'title'; G.scene='credits'; }
function leaveCredits(){
  const from=G.creditsFrom||'title';
  G.creditsFrom=null;
  if(from==='pause'){ G.scene='play'; G.paused=true; }
  else G.scene=from;
}
let musicEl=null, musicKey=null, musicUnlocked=true, musicRetryAt=0, musicPlayP=null;
function musicIsPlaying(){
  return !!(musicEl && !musicEl.paused && !musicEl.ended);
}
function ensureMusic(){
  if(musicEl) return musicEl;
  musicEl=document.getElementById('bgm')||new Audio();
  musicEl.loop=true;
  musicEl.preload='auto';
  musicEl.playsInline=true;
  musicEl.setAttribute('playsinline','');
  musicEl.setAttribute('webkit-playsinline','');
  musicEl.autoplay=true;
  musicEl.volume=0.55;
  musicEl.addEventListener('canplay', tryPlayMusic);
  musicEl.addEventListener('canplaythrough', tryPlayMusic);
  return musicEl;
}
function tryPlayMusic(){
  if(!musicUnlocked || !musicEl || !musicEl.src) return;
  if(musicIsPlaying() || musicPlayP) return;
  musicPlayP=musicEl.play();
  if(musicPlayP&&musicPlayP.then){
    musicPlayP.then(()=>{ musicPlayP=null; }).catch(()=>{ musicPlayP=null; });
  } else musicPlayP=null;
}
function unlockMusic(){
  musicUnlocked=true;
  ensureMusic();
  tryPlayMusic();
}
function playMusic(key){
  const src=MUSIC[key];
  if(!src) return;
  const el=ensureMusic();
  const name=src.split('/').pop();
  const already=el.currentSrc||el.src||'';
  const same=already.indexOf(name)>=0;
  if(musicKey===key && same){
    if(!musicIsPlaying()) tryPlayMusic();
    return;
  }
  musicKey=key;
  if(same){ tryPlayMusic(); return; }
  musicPlayP=null;
  el.loop=true;
  el.volume=0.55;
  el.src=assetUrl(src);
  try{ el.load(); }catch(_){}
}
function wantedMusic(){
  if(!G || !G.scene) return 'title';
  const sc=G.scene;
  if(sc==='title' || sc==='chapters' || sc==='credits' || sc==='intro') return 'title';
  if(sc==='play' && G.fightOn) return 'battle';
  return (G.ch===1 || (G.lvl && G.lvl.n===1)) ? 'ch1' : 'ch2';
}
function syncMusic(){
  playMusic(wantedMusic());
  if(musicUnlocked && musicEl && !musicIsPlaying() && G && G.t>=musicRetryAt){
    musicRetryAt=G.t+1.6;
    tryPlayMusic();
  }
}
['pointerdown','touchstart','mousedown','keydown','click'].forEach(ev=>{
  window.addEventListener(ev, unlockMusic, {capture:true});
});
playMusic('title');
tryPlayMusic();
const SPRITE_FILES={
  macar:'assets/creatures/dwarf_macar.png', pordoom:'assets/creatures/dwarf_pordoom.png', fendur:'assets/creatures/dwarf_fendur.png',
  orbo:'assets/creatures/dwarf_orbo.png', talpor:'assets/creatures/dwarf_talpor.png',
  pordoom_ghost:'assets/creatures/dwarf_pordoom_ghost.png', fendur_ghost:'assets/creatures/dwarf_fendur_ghost.png',
  orbo_ghost:'assets/creatures/dwarf_orbo_ghost.png', talpor_ghost:'assets/creatures/dwarf_talpor_ghost.png',
  macar_back:'assets/creatures/dwarf_macar_back.png',
  pordoom_ghost_back:'assets/creatures/dwarf_pordoom_ghost_back.png',
  fendur_ghost_back:'assets/creatures/dwarf_fendur_ghost_back.png',
  orbo_ghost_back:'assets/creatures/dwarf_orbo_ghost_back.png',
  talpor_ghost_back:'assets/creatures/dwarf_talpor_ghost_back.png',
  macar_sleep:'assets/creatures/dwarf_macar_sleep.png',

  rat:'assets/creatures/mon_rat.png', bat:'assets/creatures/mon_bat.png', spider:'assets/creatures/mon_spider.png', spitter:'assets/creatures/mon_spitter.png',

  crawler:'assets/creatures/mon_crawler.png', undead:'assets/creatures/mon_undead.png', elder:'assets/creatures/mon_elder.png',
  barrow:'assets/creatures/mon_barrow.png', troll:'assets/creatures/mon_troll.png', construct:'assets/creatures/mon_construct.png',
  wraith:'assets/creatures/mon_wraith.png', burrower:'assets/creatures/mon_burrower.png', champion:'assets/creatures/mon_champion.png',
  warden:'assets/creatures/mon_warden.png', horror:'assets/creatures/mon_horror.png', drake:'assets/creatures/mon_drake.png', king:'assets/creatures/mon_king.png',

   size in each. To make room for the raised hammer, Macar is rendered about a
   quarter smaller inside dwarf_macar_atk.png than in dwarf_macar.png, so
   scaling every canvas to one fixed height shrank him the moment he swung.
   Measuring the body automatically is not reliable here — the weapon is held
   directly above the torso — so the correction is a calibration table read off
   the art. FIT multiplies the frame's drawn height; 1.29 came from the helmet
   crown, 54px tall in the idle frame against 42px in the attack frame. */
const FRAME_FIT={
  macar_atk:1.29

function spriteBounds(img){
  if(!img||!img.width||!img.height) return null;
  if(SPRMETA){ const hit=SPRMETA.get(img); if(hit) return hit; }
  else if(img.__spm) return img.__spm;
  const miss={ok:false, botY:1, cx:0.5};
  const MAX=160;
  const sc=Math.min(1, MAX/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*sc)), h=Math.max(1,Math.round(img.height*sc));
  let d=null;
  try{
    const c=document.createElement('canvas');
    c.width=w; c.height=h;
    const x=c.getContext('2d',{willReadFrequently:true});
    x.clearRect(0,0,w,h); x.drawImage(img,0,0,w,h);
    d=x.getImageData(0,0,w,h).data;
  }catch(_){ d=null; }
  if(!d) return stampMetrics(img,miss);
  let lo=w, hi=-1, bot=-1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    if(d[(y*w+x)*4+3]<=30) continue;
    if(x<lo) lo=x;
    if(x>hi) hi=x;
    if(y>bot) bot=y;
  }
  if(bot<0) return stampMetrics(img,miss);
  return stampMetrics(img,{ok:true, botY:(bot+1)/h, cx:((lo+hi+1)/2)/w});

  for(const suffix of ['_atk_bow','_atk','_back','_w1','_w2','_sleep']){

function drawEntBillboard(g,e,img,z){
  if(!img||!img.width) return false;

    const aspect=img.width/Math.max(1,img.height);

  if(k==='pillar'||k==='names'||k==='stalagmite') return pack.pillar;
  if(k==='gate'||k==='bronzedoor'||k==='tunnel'||k==='altar'||k==='throne'||k==='stairs') return pack.arch;
  return null;
}
function wallFaceSprite(L, lit){
  const cave=palWallKey(L)==='wall_cave';
  if(cave){
    return lit
      ? (SPR.wall_cave_face||SPR.wall_cave_face_shade)
      : (SPR.wall_cave_face_shade||SPR.wall_cave_face);
  }
  return lit
    ? (SPR.wall_face||SPR.wall_face_shade)
    : (SPR.wall_face_shade||SPR.wall_face);
}
function useWallFaces(L){
  if(palWallKey(L)==='wall_cave'){
    const img=SPR.wall_cave_face||SPR.wall_cave_face_shade;
    return !!(img&&img.width);
  }
  return true;
}
function wallFaceH(L){
  const oy=tilesetPack(L||G.lvl).wall.oy;
  return oy*(TH/TILESET.srcH);
}
function rubyDoorH(L){
  return wallFaceH(L)*1.28;
}
function rubyDoorHalf(){
  const img=SPR.rubydoor_face||SPR.rubydoor;
  const H=rubyDoorH();
  const aspect=(img&&img.width)?img.width/Math.max(1,img.height):0.62;
  const perTile=Math.max(8, Math.hypot(TW*0.5, TH*0.5));
  return clamp(H*aspect/(2*perTile), 1.08, 1.38);
}
/** World Y of the iso plane that matches a north-wall masonry face (oS inset). */
function rubyDoorPlaneY(p){
  const L=G.lvl;
  const ix=Math.round(p.x)|0;
  const iy=Math.round(p.y)|0;
  if(L&&L.grid){
    for(let y=iy+1; y>=iy-4; y--){
      if(y<1||!L.grid[y]||!L.grid[y-1]) continue;
      if(L.grid[y-1][ix]===1 && isWalkTile(L.grid[y][ix])) return y-0.42;
    }
  }
  return Math.floor(p.y)-0.42;
}
function flattenIsoQuad(img, p0, p1, p3, dw, dh){
  if(!img||!img.width) return null;
  dw=Math.max(8,dw|0); dh=Math.max(8,dh|0);
  const c=document.createElement('canvas');
  c.width=dw; c.height=dh;
  const g=c.getContext('2d');
  g.imageSmoothingEnabled=true;
  const sx=p1.x-p0.x, sy=p1.y-p0.y, tx=p3.x-p0.x, ty=p3.y-p0.y;
  const det=sx*ty-sy*tx;
  if(Math.abs(det)<1e-4) return c;
  const inv00=ty/det, inv01=-tx/det, inv10=-sy/det, inv11=sx/det;
  const a=dw*inv00, cff=dw*inv01, b=dh*inv10, d=dh*inv11;
  g.setTransform(a, b, cff, d, -(a*p0.x+cff*p0.y), -(b*p0.x+d*p0.y));
  g.drawImage(img, 0, 0);
  g.setTransform(1,0,0,1,0,0);
  return c;
}
function paintWorkedBricks(x,w,h,lit){
  const light=lit?'#c6a67a':'#8d7358';
  const mid=lit?'#a07e58':'#6e5640';
  const dark=lit?'#6c5136':'#4a382a';
  x.fillStyle=lit?'#4a3828':'#2e241c';
  x.fillRect(0,0,w,h);
  const frieze=Math.max(10, h*0.18);
  const rows=5, cols=3;
  const bh=(h-frieze)/rows, bw=w/cols;
  for(let r=0;r<rows;r++){
    const off=(r%2)?bw*0.5:0;
    for(let col=-1;col<=cols;col++){
      const bx=col*bw+off+1.2, by=frieze+r*bh+1.2, rw=bw-2.4, rh=bh-2.4;
      const gr=x.createLinearGradient(bx,by,bx+rw,by+rh);
      gr.addColorStop(0,light); gr.addColorStop(0.4,mid); gr.addColorStop(1,dark);
      x.fillStyle=gr; x.fillRect(bx,by,rw,rh);
      x.strokeStyle='rgba(255,232,198,0.16)'; x.lineWidth=1;
      x.strokeRect(bx+0.6,by+0.6,rw-1.2,rh-1.2);
    }
  }
  x.fillStyle=mid; x.fillRect(0,0,w,frieze);
  x.fillStyle=dark; x.fillRect(0,frieze-3,w,3);
  const cell=w/4;
  x.strokeStyle=lit?'#dcc6a0':'#8a7260'; x.lineWidth=1.6;
  for(let i=0;i<4;i++){
    const cx=i*cell+cell*0.5, cy=frieze*0.42;
    x.strokeRect(cx-cell*0.28, cy-frieze*0.22, cell*0.56, frieze*0.44);
    x.strokeRect(cx-cell*0.12, cy-frieze*0.10, cell*0.24, frieze*0.20);
  }
}
function makeWorkedFace(L, lit, w, h){
  w=Math.max(8,w|0); h=Math.max(8,h|0);
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.imageSmoothingEnabled=true;
  const img=wallFaceSprite(L, lit);
  if(img&&img.width){
    x.drawImage(img, 0, 0, w, h);
    // baked grain + mortar shade so sheared faces keep depth when tiled
    x.globalCompositeOperation='multiply';
    const gr=x.createLinearGradient(0,0,0,h);
    gr.addColorStop(0,'rgb(255,248,230)');
    gr.addColorStop(0.55,'rgb(210,190,165)');
    gr.addColorStop(1,'rgb(118,92,70)');
    x.fillStyle=gr; x.fillRect(0,0,w,h);
    x.globalCompositeOperation='overlay';
    x.globalAlpha=0.28;
    for(let i=0;i<90;i++){
      const px=h3(i,w,3)*w, py=h3(i,h,8)*h, r=0.6+h3(i,7,2)*1.8;
      x.fillStyle=i%2?'rgba(255,230,190,0.8)':'rgba(40,24,12,0.7)';
      x.fillRect(px,py,r,r);
    }
    x.globalAlpha=1; x.globalCompositeOperation='source-over';
  } else {
    paintWorkedBricks(x,w,h,lit);
  }
  return c;
}
function makeWorkedCap(w,h){
  w=Math.max(24,w|0); h=Math.max(24,h|0);
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.fillStyle='#3a2a1c';
  x.fillRect(0,0,w,h);
  const rows=4, cols=4;
  const bw=w/cols, bh=h/rows;
  for(let r=0;r<rows;r++){
    const off=(r%2)?bw*0.5:0;
    for(let col=-1;col<=cols;col++){
      const bx=col*bw+off+1.6, by=r*bh+1.6, rw=bw-3.2, rh=bh-3.2;
      const gr=x.createLinearGradient(bx,by,bx+rw,by+rh);
      gr.addColorStop(0,'#e2c59a');
      gr.addColorStop(0.28,'#b89468');
      gr.addColorStop(0.62,'#8a6848');
      gr.addColorStop(1,'#4a3424');
      x.fillStyle=gr; x.fillRect(bx,by,rw,rh);
      x.strokeStyle='rgba(255,236,210,0.32)'; x.lineWidth=1.2;
      x.strokeRect(bx+1,by+1,rw-2,rh-2);
      x.strokeStyle='rgba(22,14,8,0.62)'; x.lineWidth=1.4;
      x.strokeRect(bx,by,rw,rh);
    }
  }
  const bevel=x.createLinearGradient(0,0,w,h);
  bevel.addColorStop(0,'rgba(255,240,214,0.28)');
  bevel.addColorStop(0.45,'rgba(0,0,0,0)');
  bevel.addColorStop(1,'rgba(20,12,8,0.35)');
  x.fillStyle=bevel; x.fillRect(0,0,w,h);
  return c;
}
function fillIsoCap(g, x0, y0, x1, y1, x2, y2, x3, y3, H, punch){
  const a=w2s(x0,y0), b=w2s(x1,y1), c=w2s(x2,y2), d=w2s(x3,y3);
  g.beginPath();
  g.moveTo(a.x, a.y-H); g.lineTo(b.x, b.y-H); g.lineTo(c.x, c.y-H); g.lineTo(d.x, d.y-H);
  g.closePath();
  if(punch){ g.fill(); return; }
  const gr=g.createLinearGradient(d.x, d.y-H, b.x, b.y-H);
  gr.addColorStop(0,'#e2c49a');
  gr.addColorStop(0.28,'#b08958');
  gr.addColorStop(0.62,'#7a5638');
  gr.addColorStop(1,'#3a2818');
  g.fillStyle=gr; g.fill();
  g.strokeStyle='rgba(22,14,8,0.55)'; g.lineWidth=1.25*ZOOM; g.stroke();
  g.strokeStyle='rgba(24,14,8,0.42)'; g.lineWidth=1.05*ZOOM;
  for(let i=1;i<3;i++){
    const t=i/3;
    g.beginPath();
    g.moveTo(a.x+(b.x-a.x)*t, a.y+(b.y-a.y)*t-H);
    g.lineTo(d.x+(c.x-d.x)*t, d.y+(c.y-d.y)*t-H);
    g.stroke();
  }
  g.beginPath();
  g.moveTo(a.x, a.y-H); g.lineTo(b.x, b.y-H);
  g.strokeStyle='rgba(255,236,210,0.38)'; g.lineWidth=1.7*ZOOM; g.stroke();
}
function drawMasonryCoping(g, x, y, H, oN, oE, oS, oW){
  const t=0.52, o=0.10;
  if(oS) fillIsoCap(g, x-o, y+1-t, x+1+o, y+1-t, x+1+o, y+1+o, x-o, y+1+o, H);
  if(oE) fillIsoCap(g, x+1-t, y-o, x+1+o, y-o, x+1+o, y+1+o, x+1-t, y+1+o, H);
  if(oN) fillIsoCap(g, x-o, y-o, x+1+o, y-o, x+1+o, y+t, x-o, y+t, H);
  if(oW) fillIsoCap(g, x-o, y-o, x+t, y-o, x+t, y+1+o, x-o, y+1+o, H);
}
function punchMasonryCoping(mg, x, y, H, oN, oE, oS, oW){
  const t=0.62, o=0.18;
  mg.fillStyle='#fff';
  if(oS) fillIsoCap(mg, x-o, y+1-t, x+1+o, y+1-t, x+1+o, y+1+o, x-o, y+1+o, H, 1);
  if(oE) fillIsoCap(mg, x+1-t, y-o, x+1+o, y-o, x+1+o, y+1+o, x+1-t, y+1+o, H, 1);
  if(oN) fillIsoCap(mg, x-o, y-o, x+1+o, y-o, x+1+o, y+t, x-o, y+t, H, 1);
  if(oW) fillIsoCap(mg, x-o, y-o, x+t, y-o, x+t, y+1+o, x-o, y+1+o, H, 1);
}
function drawIsoPlaneImg(g, img, x0, y0, x1, y1, H, opt){
  opt=opt||{};
  const a=w2s(x0,y0), b=w2s(x1,y1);
  const dx=b.x-a.x, dy=b.y-a.y;
  g.save();
  g.beginPath();
  g.moveTo(a.x,a.y); g.lineTo(b.x,b.y); g.lineTo(b.x,b.y-H); g.lineTo(a.x,a.y-H); g.closePath();
  if(!img||!img.width){
    g.fillStyle=opt.fill||'#6a5340'; g.fill();
  } else {
    g.save(); g.clip();
    g.imageSmoothingEnabled=true;
    g.translate(a.x, a.y-H);
    g.transform(dx/Math.max(1,img.width), dy/Math.max(1,img.width), 0, H/Math.max(1,img.height), 0, 0);
    const u=((opt.u||0)%1)*img.width;
    if(u>1){
      g.drawImage(img, u, 0, img.width-u, img.height, 0, 0, img.width-u, img.height);
      g.drawImage(img, 0, 0, u, img.height, img.width-u, 0, u, img.height);
    } else g.drawImage(img, 0, 0);
    g.restore();
  }
  if(opt.shade){
    const gr=g.createLinearGradient(a.x, a.y-H, a.x, a.y);
    gr.addColorStop(0, 'rgba(255,236,200,'+(0.10*opt.shade)+')');
    gr.addColorStop(0.38, 'rgba(0,0,0,0)');
    gr.addColorStop(1, 'rgba(0,0,0,'+(0.42*opt.shade)+')');
    g.fillStyle=gr; g.fill();
  }
  if(opt.stroke!==0){
    g.strokeStyle='rgba(12,8,5,0.28)'; g.lineWidth=1*ZOOM; g.stroke();
    g.beginPath(); g.moveTo(a.x,a.y-H); g.lineTo(b.x,b.y-H);
    g.strokeStyle='rgba(236,220,186,0.22)'; g.lineWidth=1.4*ZOOM; g.stroke();
  }
  g.restore();
}
function drawMasonryFace(g, img, x0, y0, x1, y1, H, inx, iny, seed){
  const t=0.42;
  const ix=inx*t, iy=iny*t;
  const u=h2((seed|0), 9);
  drawIsoPlaneImg(g, img, x0+ix, y0+iy, x1+ix, y1+iy, H, {u:u+0.21, shade:0.72, stroke:0});
  const a=w2s(x0,y0), b=w2s(x1,y1), c=w2s(x1+ix,y1+iy), d=w2s(x0+ix,y0+iy);
  g.save();
  g.beginPath();
  g.moveTo(a.x,a.y-H); g.lineTo(b.x,b.y-H); g.lineTo(c.x,c.y-H); g.lineTo(d.x,d.y-H); g.closePath();
  const cap=g.createLinearGradient(a.x, a.y-H, (c.x+d.x)*0.5, (c.y+d.y)*0.5-H+TH*0.2);
  cap.addColorStop(0,'rgba(236,214,176,0.55)');
  cap.addColorStop(0.4,'rgba(148,116,82,0.92)');
  cap.addColorStop(1,'rgba(38,26,16,0.96)');
  g.fillStyle=cap; g.fill();
  g.strokeStyle='rgba(255,236,210,0.32)'; g.lineWidth=1.3*ZOOM; g.stroke();
  g.restore();
  drawIsoPlaneImg(g, img, x0, y0, x1, y1, H, {u:u, shade:0.28});
  const fa=w2s(x0,y0), fb=w2s(x1,y1);
  g.save();
  g.fillStyle='rgba(0,0,0,0.38)';
  g.beginPath();
  g.moveTo(fa.x, fa.y);
  g.lineTo(fb.x, fb.y);
  g.lineTo(fb.x+(fb.x-fa.x)*0.04, fb.y+TH*0.22);
  g.lineTo(fa.x-(fb.x-fa.x)*0.04, fa.y+TH*0.22);
  g.closePath(); g.fill();
  g.restore();
}
function scaleBlit(img,w,h){
  if(!img||!img.width) return null;
  w=Math.max(1,w|0); h=Math.max(1,h|0);
  const c=document.createElement('canvas');
  c.width=w; c.height=h;
  const x=c.getContext('2d');
  x.imageSmoothingEnabled=true;
  x.drawImage(img,0,0,w,h);
  return c;
}
function ensureTileBlit(L){
  const palKey=L?palFloorKey(L.pal):'floor_mine';
  const wallKey=L?palWallKey(L):'wall_worked';
  const srcL=wallFaceSprite(L,1), srcR=wallFaceSprite(L,0);
  const faceId=(srcL&&srcL.width||0)+':'+(srcR&&srcR.width||0);
  const pack=tilesetPack(L);
  const k=TW+'|'+TH+'|'+palKey+'|'+wallKey+'|'+pack.wall.oy+'|'+faceId;
  if(TILEBLIT.key===k && TILEBLIT.floor && TILEBLIT.wall) return;
  const sc=TW/RTW, SH=(RWH+RTH)*sc;
  const wall=scaleBlit(SPR[wallKey]||SPR.wall_cave||SPR.wall_worked, TW, SH);
  const {sx,sy}=tilesetScale();
  const floor=scaleBlit(SPR[palKey], Math.max(1,(pack.floor.w*sx)|0), Math.max(1,(pack.floor.h*sy)|0));
  const faceL=makeWorkedFace(L, 1, Math.max(160,(TW*4)|0), Math.max(220,(wallFaceH(L)*3)|0));
  const faceR=makeWorkedFace(L, 0, Math.max(160,(TW*4)|0), Math.max(220,(wallFaceH(L)*3)|0));
  const cap=makeWorkedCap(Math.max(96,(TW*3)|0), Math.max(96,(TH*6)|0));
  if(wall&&floor){ TILEBLIT.key=k; TILEBLIT.wall=wall; TILEBLIT.floor=floor; TILEBLIT.face=faceL; TILEBLIT.faceL=faceL; TILEBLIT.faceR=faceR; TILEBLIT.cap=cap; TILEBLIT.pack=pack; }
  else { TILEBLIT.face=faceL; TILEBLIT.faceL=faceL; TILEBLIT.faceR=faceR; TILEBLIT.cap=cap; }
}
function entSpriteKey(e){
  if(e.kind==='dwarf'){
    const k=e.col && e.col.key;
    if(e.ghost && k) return k+'_ghost';
    return k;
  }
  if(e.sprite) return e.sprite;
  return e.kind;
}
function wantsBackView(e){
  if(!e||e.dead||e.crushed||e.sleeping) return false;
  if(e.defending) return true;
  const p=player();
  if(e.team==='party' && e.ghost && p && p.defending) return true;
  return ((e.fdx||0)+(e.fdy||0)) < -0.42;
}
function entAnimImg(e){
  const k=entSpriteKey(e);
  if(!k) return null;
  if(e.dead||e.crushed) return SPR[k+'_dead']||null;
  if(wantsBackView(e) && SPR[k+'_back']) return SPR[k+'_back'];
  if(e.atk>0 && e.atkKind==='bow'){
    // The melee frame is a two-handed hammer swing, which is plainly wrong for
    // a crossbow shot, so hold the standing frame until dwarf_macar_atk_bow.png
    // exists. The bolt and the shot line already sell the action.
    if(SPR[k+'_atk_bow']) return SPR[k+'_atk_bow'];
    return SPR[k]||null;
  }
  if(e.atk>0 && SPR[k+'_atk']) return SPR[k+'_atk'];
  if(QUALITY && e.moving){
    const a=SPR[k+'_w1'], b=SPR[k+'_w2'];
    if(a||b){
      const frames=[a,b].filter(Boolean);
      const phase=((e.gait||0)%1)<0.5?0:1;
      return frames[phase%frames.length];
    }
  }
  return SPR[k]||null;
}

  if(k==='glowcap') return 58*z*(p.s||1);

  if(k==='sporepuff') return 40*z*(p.s||1);
  if(k==='nightbloom') return 50*z*(p.s||1);
  if(k==='lichen') return 28*z*(p.s||1);
  if(k==='stalagmite'||k==='roots'||k==='banner'||k==='idol') return 86*z*(p.s||1);
  if(k==='crystal'||k==='urn') return 64*z*(p.s||1);
  if(k==='moss'||k==='slime'||k==='eggs') return 44*z*(p.s||1);
  if(k==='orepile'||k==='pickpile') return 48*z*(p.s||1);
  if(k==='brazier') return 60*z;
  if(k==='trap') return 36*z;
  return 62*z;
}
function shotStyle(e){
  if(e.kind==='spider'||e.sprite==='spitter'||e.kind==='phasespider') return ['spit','#b06bff',11];
  if(e.kind==='fungi'||e.kind==='shrieker'||e.kind==='violetfungus'||e.kind==='mustardjelly') return ['spore','#d07bff',7];
  if(e.kind==='wraith'||e.kind==='bat'||e.kind==='ghost'||e.kind==='ixzan') return ['wisp','#80d0ff',10];
  if(e.kind==='drake'||e.kind==='magmaelem'||e.kind==='deepdragon'||e.kind==='firegiant') return ['flame','#ff6a3a',10];
  if(e.kind==='shadowdragon') return ['wisp','#5a3a8a',12];
  if(e.sprite==='drow_mage'||(e.kind==='drow'&&e.ranged)||e.kind==='medusa'||e.kind==='lich'||e.kind==='mindflayer'||e.kind==='elderbrain') return ['hex','#c07bff',10];
  if(e.sprite==='gnome_sapper') return ['bomb','#ff8a3a',8];
  if(e.sprite==='gnome_tinker') return ['bolt','#ffd27a',11];
  if(e.kind==='giantslug'||e.kind==='greenslime'||e.kind==='grayooze'||e.kind==='ochrejelly'||e.kind==='blackpudding') return ['spit','#8aff6a',9];
  if(e.kind==='morkoth'||e.kind==='aboleth'||e.kind==='gauth'||e.kind==='deathtyrant'||e.kind==='beholder'){
    const rays=[['charm','#ff7ad9',9],['fear','#80d0ff',10],['death','#c07bff',11],['fire','#ff6a3a',10]];
    return rays[((G.elapsed*4)|0)%rays.length];
  }
  return ['bolt','#e8dcc0',11];
}

/* value noise + fBm, for the baked rock surfaces */
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(h3(xi,yi,s),h3(xi+1,yi,s),u), lerp(h3(xi,yi+1,s),h3(xi+1,yi+1,s),u), v);
}
function fbm(x,y,s,oct){ let v=0,a=.5,f=1,t=0;
  for(let o=0;o<(oct||3);o++){ v+=a*vnoise(x*f,y*f,s+o*17); t+=a; f*=2.03; a*=.5; } return v/t; }

   Albedo is painted BRIGHT; the lightmap multiplies it back down.     */

/* ---------------------------- grid helpers ---------------------------- */
function newGrid(w,h,f){ const g=[]; for(let y=0;y<h;y++){const r=new Uint8Array(w); r.fill(f); g.push(r);} return g; }
function isWalkTile(t){ return t===0||t===3||t===4; }
function rect(g,x,y,w,h,t){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) if(g[j]&&g[j][i]!==undefined) g[j][i]=t; }
function sealOuter(g){
  if(!g||!g.length||!g[0]) return;
  const h=g.length, w=g[0].length;
  for(let i=0;i<w;i++){ g[0][i]=1; g[h-1][i]=1; }
  for(let j=0;j<h;j++){ g[j][0]=1; g[j][w-1]=1; }
}
function paintSeenWalls(L){
  if(!L||!L.grid||!L.seen) return 0;
  let n=0;
  for(let j=0;j<L.h;j++) for(let i=0;i<L.w;i++){
    if(!L.seen[j][i] || !isWalkTile(L.grid[j][i])) continue;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){
      const y=j+dj, x=i+di;
      if(y<0||x<0||y>=L.h||x>=L.w) continue;
      const t=L.grid[y][x];
      if((t===1||t===2) && !L.seen[y][x]){ L.seen[y][x]=1; n++; }
    }
  }
  return n;
}

/* 5-foot squares: Macar sees 60 feet. */
const SIGHT_R=12;
function tileExplored(x,y){
  const L=G.lvl; if(!L||!L.seen) return false;
  const i=x|0, j=y|0;
  return !!(L.seen[j]&&L.seen[j][i]);
}
function tileVisible(x,y){
  const L=G.lvl; if(!L||!L.vis) return false;
  const i=x|0, j=y|0;
  return !!(L.vis[j]&&L.vis[j][i]);
}
function tileBlocksSight(L,i,j){
  if(!L||i<0||j<0||i>=L.w||j>=L.h) return true;
  const t=L.grid[j][i];
  return t===1||t===2;
}
function hasLOS(x0,y0,x1,y1){
  const L=G.lvl; if(!L) return false;
  let i0=Math.floor(x0), j0=Math.floor(y0);
  const i1=Math.floor(x1), j1=Math.floor(y1);
  if(i0===i1&&j0===j1) return true;
  const di=Math.abs(i1-i0), dj=Math.abs(j1-j0);
  const si=i0<i1?1:-1, sj=j0<j1?1:-1;
  let err=di-dj;
  while(i0!==i1||j0!==j1){
    const e2=err*2;
    let ni=i0, nj=j0;
    if(e2>-dj){ err-=dj; ni+=si; }
    if(e2<di){ err+=di; nj+=sj; }
    if(ni===i1&&nj===j1) return true;
    if(ni!==i0&&nj!==j0){
      if(tileBlocksSight(L,ni,j0)&&tileBlocksSight(L,i0,nj)) return false;
    }
    i0=ni; j0=nj;
    if((i0!==i1||j0!==j1)&&tileBlocksSight(L,i0,j0)) return false;
  }
  return true;
}
function rebuildVision(){
  const L=G.lvl, p=player();
  if(!L||!L.grid||!L.seen) return;
  if(!L.vis||L.vis.length!==L.h) L.vis=newGrid(L.w,L.h,0);
  else for(let j=0;j<L.h;j++) L.vis[j].fill(0);
  if(!p) return;
  const r=SIGHT_R, rr=r*r;
  const i0=Math.max(0,Math.floor(p.x-r));
  const i1=Math.min(L.w-1,Math.ceil(p.x+r));
  const j0=Math.max(0,Math.floor(p.y-r));
  const j1=Math.min(L.h-1,Math.ceil(p.y+r));
  let fresh=0;
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    const cx=i+0.5, cy=j+0.5;
    if((cx-p.x)*(cx-p.x)+(cy-p.y)*(cy-p.y)>rr) continue;
    if(!hasLOS(p.x,p.y,cx,cy)) continue;
    L.vis[j][i]=1;
    if(!L.seen[j][i]){ L.seen[j][i]=1; fresh++; }
  }
  for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
    if(!L.vis[j][i]||!isWalkTile(L.grid[j][i])) continue;
    for(let dj=-1;dj<=1;dj++) for(let di=-1;di<=1;di++){
      const y=j+dj, x=i+di;
      if(y<0||x<0||y>=L.h||x>=L.w) continue;
      const t=L.grid[y][x];
      if(t===1||t===2) L.vis[y][x]=1;
    }
  }
  if(paintSeenWalls(L)) fresh++;
  if(fresh){ G.seenRev=(G.seenRev||0)+1; BX_KEY=''; }
}
function corridor(g,x1,y1,x2,y2,wd,t){
  wd=wd||3; const hw=(wd/2)|0;
  const sx=Math.min(x1,x2),ex=Math.max(x1,x2),sy=Math.min(y1,y2),ey=Math.max(y1,y2);
  rect(g,sx,y1-hw,ex-sx+1,wd,t);
  rect(g,x2-hw,sy,wd,ey-sy+1,t);
}
function caveDisk(g,cx,cy,rx,ry,t){
  rx=Math.max(1.2,rx); ry=Math.max(1.2,ry);
  const j0=Math.floor(cy-ry-1), j1=Math.ceil(cy+ry+1), i0=Math.floor(cx-rx-1), i1=Math.ceil(cx+rx+1);
  for(let j=j0;j<=j1;j++){
    for(let i=i0;i<=i1;i++){
      if(!g[j]||g[j][i]===undefined) continue;
      const nx=(i+0.5-cx)/rx, ny=(j+0.5-cy)/ry;
      if(nx*nx+ny*ny < 0.72+h2(i,j)*0.32) g[j][i]=t;
    }
  }
}
function carvePath(g,pts,rad,t){
  rad=rad||2.2; t=t===undefined?0:t;
  for(let n=0;n<pts.length-1;n++){
    const a=pts[n], b=pts[n+1];
    const steps=Math.max(3, (Math.hypot(b[0]-a[0], b[1]-a[1])*2.2)|0);
    for(let s=0;s<=steps;s++){
      const u=s/steps;
      const wob=(h2((a[0]+s)|0,(a[1]+n)|0)-0.5)*1.15;
      const wob2=(h3((a[0]+s)|0,(a[1]+n)|0,4)-0.5)*1.15;
      caveDisk(g, a[0]+(b[0]-a[0])*u+wob, a[1]+(b[1]-a[1])*u+wob2, rad+(h2(s,n)-0.5)*0.55, rad*0.82, t);
    }
  }
}

/* ==========================================================================
   TEXTURE BAKE  -  per-pixel rock surfaces, generated once per chapter
   ========================================================================== */
const RS=2, RTW=84*RS, RTH=42*RS, RWH=50*RS;
const TEX={ floor:[], floorA:[], wall:[], wallVein:[], blood:[], scorch:null, grain:null, web:null, ready:false };

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function diamond(x,c,cx,cy,w,h){ x.beginPath(); x.moveTo(cx,cy-h/2); x.lineTo(cx+w/2,cy);
  x.lineTo(cx,cy+h/2); x.lineTo(cx-w/2,cy); x.closePath(); }

/* multiply every opaque pixel by an fBm field -> real grain, not speckles */
function grainPass(x,w,h,seed,amt,sc){
  let img; try{ img=x.getImageData(0,0,w,h); }catch(_){ return; }
  if(!img||!img.data) return;
  const d=img.data;
  for(let j=0;j<h;j++){
    for(let i=0;i<w;i++){
      const o=(j*w+i)*4; if(d[o+3]<8) continue;
      const n=fbm(i/sc,j/sc,seed,3);
      const fine=vnoise(i/2.1,j/2.1,seed+91);
      const m=(1-amt)+amt*(n*0.82+fine*0.34);
      d[o]=clamp(d[o]*m,0,255); d[o+1]=clamp(d[o+1]*m,0,255); d[o+2]=clamp(d[o+2]*m,0,255);
    }
  }
  x.putImageData(img,0,0);
}

function rockChunk(x,cx,cy,r,base,seed){
  const pts=6+((h3(seed,3,7)*3)|0);
  x.beginPath();
  for(let i=0;i<pts;i++){ const a=i/pts*TAU, rr=r*(0.62+h3(seed,i,11)*0.55);
    const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr*0.62;
    i?x.lineTo(px,py):x.moveTo(px,py); }
  x.closePath();
  const g=x.createLinearGradient(cx-r,cy-r*0.7,cx+r*0.6,cy+r*0.7);
  g.addColorStop(0,shade(base,0.30)); g.addColorStop(0.5,base); g.addColorStop(1,shade(base,-0.42));
  x.fillStyle=g; x.fill();
  x.strokeStyle='rgba(14,10,7,0.55)'; x.lineWidth=1.3*RS; x.stroke();
  // top facet catching the key light
  x.beginPath();
  for(let i=0;i<pts;i++){ const a=i/pts*TAU, rr=r*0.48*(0.7+h3(seed,i,11)*0.5);
    const px=cx-r*0.16+Math.cos(a)*rr, py=cy-r*0.20+Math.sin(a)*rr*0.6;
    i?x.lineTo(px,py):x.moveTo(px,py); }
  x.closePath(); x.fillStyle='rgba(255,238,205,0.14)'; x.fill();
  // contact shadow
  x.fillStyle='rgba(0,0,0,0.30)';
  x.beginPath(); x.ellipse(cx+r*0.28,cy+r*0.44,r*0.85,r*0.34,0,0,TAU); x.fill();
}

function bakeFloor(pal,seed,accent){
  const c=mk(RTW,RTH), x=c.getContext('2d');
  diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.save(); x.clip();
  x.fillStyle= accent? shade(pal.fA,0.10) : (seed%2?pal.fA:pal.fB);
  x.fillRect(0,0,RTW,RTH);
  grainPass(x,RTW,RTH,seed*31,0.62,9);
  // dirt pooling in the low corners
  const dg=x.createRadialGradient(RTW/2,RTH*0.22,3,RTW/2,RTH*0.55,RTW*0.58);
  dg.addColorStop(0,'rgba(255,236,205,0.12)'); dg.addColorStop(0.55,'rgba(0,0,0,0.08)'); dg.addColorStop(1,'rgba(0,0,0,0.42)');
  x.fillStyle=dg; x.fillRect(0,0,RTW,RTH);
  // deep cracks across the flagstone
  const nc=2+((h3(seed,5,2)*3)|0);
  for(let k=0;k<nc;k++){
    x.strokeStyle='rgba(12,8,5,0.72)'; x.lineWidth=(1.4+h3(seed,k,4)*2.2)*RS; x.lineCap='round';
    x.beginPath();
    let px=h3(seed,k,7)*RTW, py=h3(seed,k,8)*RTH; x.moveTo(px,py);
    for(let i=0;i<5;i++){ px+=(h3(seed,k*9+i,3)-0.5)*RTW*0.28; py+=(h3(seed,k*7+i,6)-0.5)*RTH*0.32; x.lineTo(px,py); }
    x.stroke();
    x.strokeStyle='rgba(255,228,190,0.08)'; x.lineWidth=1*RS; x.stroke();
  }
  // moss / spore in the grout for fungal chambers
  if(pal.key && pal.key[1]==='b' || pal.amb==='#080614'){
    for(let k=0;k<5;k++){
      x.fillStyle='rgba(120,70,200,'+(0.08+h3(seed,k,88)*0.12)+')';
      x.beginPath(); x.ellipse(RTW*(0.2+h3(seed,k,89)*0.6), RTH*(0.25+h3(seed,k,90)*0.5),
        (2+h3(seed,k,91)*5)*RS,(1+h3(seed,k,92)*3)*RS,0,0,TAU); x.fill();
    }
  }
  // scattered rock
  const nr= accent?2:3+((h3(seed,1,9)*3)|0);
  for(let k=0;k<nr;k++){
    const cx=RTW*(0.18+h3(seed,k,21)*0.64), cy=RTH*(0.20+h3(seed,k,22)*0.60);
    rockChunk(x,cx,cy,(4+h3(seed,k,23)*9)*RS,pal.rock,seed*7+k);
  }
  x.restore();
  return c;
}

function bakeWall(pal,seed,vein){
  const H=RWH+RTH, c=mk(RTW,H), x=c.getContext('2d');
  const cyTop=RWH+RTH/2-RWH;                    // centre of the top diamond
  // ---- left face
  x.save();
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2);
  x.lineTo(0,RWH); x.closePath();
  x.clip();
  x.fillStyle=pal.wL; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13+3,0.5,9);
  for(let i=0;i<5;i++){ x.fillStyle='rgba(0,0,0,'+(0.10+h3(seed,i,2)*0.14)+')';
    x.fillRect(0,RWH-RTH/2+i*RTH*0.34+h3(seed,i,5)*6, RTW/2, (2+h3(seed,i,8)*5)*RS); }
  for(let i=0;i<7;i++){ x.strokeStyle='rgba(255,240,210,0.055)'; x.lineWidth=1.4*RS;
    const px=h3(seed,i,31)*RTW*0.5, py=RWH-RTH/2+h3(seed,i,32)*RTH*1.1;
    x.beginPath(); x.moveTo(px,py); x.lineTo(px+7*RS,py+5*RS); x.stroke(); }
  x.fillStyle='rgba(0,0,0,0.34)'; x.fillRect(0,RWH+RTH*0.10,RTW/2,RTH*0.5);
  x.restore();
  // ---- right face (away from key light, darkest)
  x.save();
  x.beginPath(); x.moveTo(RTW,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2);
  x.lineTo(RTW,RWH); x.closePath(); x.clip();
  x.fillStyle=pal.wR; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13+9,0.5,9);
  for(let i=0;i<5;i++){ x.fillStyle='rgba(0,0,0,'+(0.12+h3(seed,i,12)*0.14)+')';
    x.fillRect(RTW/2,RWH-RTH/2+i*RTH*0.34+h3(seed,i,15)*6, RTW/2, (2+h3(seed,i,18)*5)*RS); }
  x.fillStyle='rgba(0,0,0,0.40)'; x.fillRect(RTW/2,RWH+RTH*0.10,RTW/2,RTH*0.5);
  x.restore();
  // ---- top cap
  x.save(); diamond(x,c,RTW/2,RWH-RTH/2,RTW-2,RTH-2); x.clip();
  x.fillStyle=pal.wT; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13,0.52,10);
  for(let k=0;k<3;k++){ const cx=RTW*(0.24+h3(seed,k,41)*0.52), cy=(RWH-RTH/2)+(h3(seed,k,42)-0.5)*RTH*0.5;
    rockChunk(x,cx,cy,(3.5+h3(seed,k,43)*6)*RS,pal.rock,seed*5+k); }
  const tg=x.createLinearGradient(0,RWH-RTH,0,RWH);
  tg.addColorStop(0,'rgba(255,242,214,0.16)'); tg.addColorStop(1,'rgba(0,0,0,0.12)');
  x.fillStyle=tg; x.fillRect(0,RWH-RTH,RTW,RTH);
  x.restore();
  // silhouette ink
  x.strokeStyle='rgba(0,0,0,0.5)'; x.lineWidth=1.6*RS;
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH-RTH); x.lineTo(RTW,RWH-RTH/2);
  x.lineTo(RTW,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.lineTo(0,RWH); x.closePath(); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.35)'; x.lineWidth=1.3*RS;
  x.beginPath(); x.moveTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.stroke();
  // top-edge rim
  x.strokeStyle='rgba(255,244,220,0.20)'; x.lineWidth=1.8*RS;
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH-RTH); x.lineTo(RTW,RWH-RTH/2); x.stroke();
  if(vein){
    x.save();
    x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.lineTo(0,RWH); x.closePath(); x.clip();
    x.strokeStyle=hexA(pal.key,0.5); x.lineWidth=2.6*RS; x.lineCap='round';
    x.beginPath(); x.moveTo(RTW*0.06,RWH-RTH*0.30);
    x.lineTo(RTW*0.20,RWH-RTH*0.02); x.lineTo(RTW*0.13,RWH+RTH*0.22); x.stroke();
    x.strokeStyle=hexA(pal.key,0.22); x.lineWidth=6*RS; x.stroke();
    for(let i=0;i<5;i++){ x.fillStyle=hexA(pal.key,0.55+h3(seed,i,61)*0.4);
      x.beginPath(); x.arc(RTW*(0.07+h3(seed,i,62)*0.16), RWH-RTH*0.28+h3(seed,i,63)*RTH*0.5, (1.2+h3(seed,i,64)*1.8)*RS,0,TAU); x.fill(); }
    x.restore();
  }
  return c;
}

function bakeBlood(seed){
  const c=mk(60*RS,32*RS), x=c.getContext('2d');
  const base= seed%3===0? '#3a0d10' : '#4d1013';
  for(let i=0;i<7;i++){
    const cx=30*RS+(h3(seed,i,71)-0.5)*40*RS, cy=16*RS+(h3(seed,i,72)-0.5)*18*RS;
    const r=(3+h3(seed,i,73)*10)*RS;
    const g=x.createRadialGradient(cx,cy,1,cx,cy,r);
    g.addColorStop(0,hexA(base,0.85)); g.addColorStop(0.6,hexA(base,0.5)); g.addColorStop(1,hexA(base,0));
    x.fillStyle=g; x.beginPath(); x.ellipse(cx,cy,r,r*0.55,0,0,TAU); x.fill();
  }
  for(let i=0;i<9;i++){ const cx=30*RS+(h3(seed,i,74)-0.5)*54*RS, cy=16*RS+(h3(seed,i,75)-0.5)*24*RS;
    x.fillStyle=hexA(base,0.5+h3(seed,i,76)*0.35);
    x.beginPath(); x.ellipse(cx,cy,(0.8+h3(seed,i,77)*2.4)*RS,(0.5+h3(seed,i,78)*1.4)*RS,0,0,TAU); x.fill(); }
  return c;
}

function bakeGrain(){
  const S=140, c=mk(S,S), x=c.getContext('2d');
  const img=x.createImageData(S,S), d=img.data;
  for(let i=0;i<S*S;i++){ const v=(Math.random()*255)|0; const o=i*4;
    d[o]=d[o+1]=d[o+2]=v; d[o+3]=26; }
  x.putImageData(img,0,0); return c;
}

function bakeWeb(){
  const S=220, c=mk(S,S), x=c.getContext('2d');
  const cx=S/2, cy=S/2;
  x.translate(cx,cy);
  x.strokeStyle='rgba(236,228,214,0.78)'; x.lineCap='round'; x.lineJoin='round';
  const rays=12;
  for(let i=0;i<rays;i++){
    const a=i/rays*TAU, wob=(i%2?0.08:-0.04);
    x.lineWidth=1.15+(i%3===0?0.7:0);
    x.beginPath(); x.moveTo(0,0);
    x.quadraticCurveTo(Math.cos(a+wob)*S*0.22, Math.sin(a+wob)*S*0.18, Math.cos(a)*S*0.46, Math.sin(a)*S*0.38);
    x.stroke();
  }
  x.strokeStyle='rgba(222,214,198,0.55)';
  for(let r=0.16;r<=0.9;r+=0.16){
    x.lineWidth=1.05;
    x.beginPath();
    for(let i=0;i<=rays;i++){
      const a=i/rays*TAU, rr=S*0.46*r*(0.92+(i%2)*0.08);
      const px=Math.cos(a)*rr, py=Math.sin(a)*rr*0.78;
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.closePath(); x.stroke();
  }
  x.strokeStyle='rgba(255,248,232,0.28)'; x.lineWidth=0.7;
  for(let i=0;i<7;i++){
    const a=i/7*TAU+0.4;
    x.beginPath(); x.moveTo(Math.cos(a)*8, Math.sin(a)*6);
    x.quadraticCurveTo(Math.cos(a+0.7)*S*0.18, Math.sin(a+0.5)*S*0.14, Math.cos(a+0.2)*S*0.4, Math.sin(a)*S*0.32);
    x.stroke();
  }
  x.setTransform(1,0,0,1,0,0);
  return c;
}

function bakeTextures(pal){
  TEX.ready=false;
  TEX.floor=[]; TEX.floorA=[]; TEX.wall=[]; TEX.wallVein=[];
  for(let i=0;i<6;i++) TEX.floor.push(bakeFloor(pal,i+1,false));
  for(let i=0;i<2;i++) TEX.floorA.push(bakeFloor(pal,i+31,true));
  for(let i=0;i<4;i++) TEX.wall.push(bakeWall(pal,i+1,false));
  for(let i=0;i<2;i++) TEX.wallVein.push(bakeWall(pal,i+11,true));
  if(!TEX.blood.length) for(let i=0;i<4;i++) TEX.blood.push(bakeBlood(i+1));
  if(!TEX.grain) TEX.grain=bakeGrain();
  if(!TEX.web) TEX.web=bakeWeb();
  TEX.ready=true;
}

function hpG(h){ return Math.max(8, Math.round(h*4)); }
function dmgG(d){ return Math.max(3, Math.round(d*1.65)); }
/* AD&D MV is inches (tens of feet / turn). MV 12" matches MACAR's walk. */
const PARTY_WALK_SP=4.3;
const MV_WALK=12;
function mvSp(m){
  const mv=Math.max(0, m==null?9:+m);
  return +Math.max(0.35, PARTY_WALK_SP*(mv/MV_WALK)).toFixed(2);
}
function atkCd(a){
  if(a>=4) return .52; if(a>=3) return .62; if(a>=2.4) return .72;
  if(a>=2) return .85; if(a>=1.4) return .95; return 1.15;
}

      if(e.mv!=null){ e.baseSp=mvSp(e.mv); e.sp=e.baseSp; }

  });

/* ECS registry: systems constructed here, then run every play-frame from update()
   (which loop() calls). Same layout as GameEngine.gameLoop() → system.update(dt). */
const ENGINE={ systems:[] };
function registerSystem(sys){
  if(!sys||ENGINE.systems.indexOf(sys)>=0) return sys;
  ENGINE.systems.push(sys); return sys;
}
function runSystems(dt, world){
  for(let i=0;i<ENGINE.systems.length;i++) ENGINE.systems[i].update(dt, world);
}

  const sprs=['rubble','rubble2','boulder','boulder2','rubble','rubble2'];

  const out=[];

    out.push({x,y,k:/boulder/.test(spr)&&s>0.95?'boulder':'rubble',spr,s,seed:900+i,backwall:1});

function dressPick(table, n){
  let tot=0; for(let i=0;i<table.length;i++) tot+=table[i][1];
  let r=n*tot;
  for(let i=0;i<table.length;i++){ r-=table[i][1]; if(r<=0) return table[i][0]; }
  return table[0][0];
}
function dressDungeon(L){
  if(!L||!L.grid) return;
  G.props=G.props||[];
  const tables={
    1:[['rubble',4],['timber',5],['barrel',2],['crate',2],['orepile',4],
       ['pickpile',3],['sack',2],['lantern',2],['bones',2],['banner',1]],
    2:[['web',4],['eggs',3],['stalagmite',2],['bones',3],
       ['crystal',2],['sack',2],['crate',1],['timber',2],['orepile',2]],
    3:[['bones',4],['urn',3],['banner',2],['crate',2],['cart',1],['idol',2],
       ['rubble',2],['timber',2],['orepile',2],['hidepile',2],['barrel',1]],
    4:[['bones',4],['slime',4],['urn',2],['banner',2],['crate',2],
       ['hidepile',2],['timber',1],['idol',1],['barrel',1],['pillar',1]],
    5:[['urn',3],['idol',3],['banner',2],['bones',3],['crystal',3],['hidepile',2],
       ['timber',1],['brazier',1],['roots',1]]
  };
  const table=tables[L.n]||tables[1];
  const seed=L.dressSeed||((Math.random()*1e9)|0)+1;
  L.dressSeed=seed;
  const keep=[{x:L.spawn.x,y:L.spawn.y,r:2.4}];
  if(L.rubyDoor) keep.push({x:L.rubyDoor.x,y:L.rubyDoor.y,r:2.2});
  if(L.door) keep.push({x:L.door.x,y:L.door.y,r:2.0});
  if(L.stair) keep.push({x:L.stair.x,y:L.stair.y,r:2.0});
  if(L.camp) keep.push({x:L.camp.x,y:L.camp.y,r:1.8});
  if(L.bell) keep.push({x:L.bell.x,y:L.bell.y,r:1.6});
  G.props.forEach(p=>keep.push({x:p.x,y:p.y,r:1.25}));
  const floors=[];
  for(let y=1;y<L.h-1;y++) for(let x=1;x<L.w-1;x++){
    const t=L.grid[y][x];
    if(t!==0 && t!==3) continue;
    let wall=0;
    for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){
      if(L.grid[y+j][x+i]===1) wall=1;
    }
    if(!wall && h3(x,y,seed)<0.78) continue;
    floors.push({x:x+0.5,y:y+0.5,wall});
  }
  const want=L.n===1?10:L.n===2?16:L.n===5?12:14;
  let placed=0, tries=0;
  while(placed<want && tries<floors.length*4){
    tries++;
    const f=floors[(h3(tries*5, placed*11, seed)*floors.length)|0];
    if(!f) continue;
    let ok=1;
    for(let i=0;i<keep.length;i++){
      const o=keep[i];
      if(Math.hypot(o.x-f.x,o.y-f.y)<o.r){ ok=0; break; }
    }
    if(!ok) continue;
    if(L.n===1 && nearCrush(f.x,f.y,1.2)) continue;
    const k=dressPick(table, h3(f.x*10, f.y*10, seed));
    const pr={x:f.x+(h3(f.x,9,seed)-.5)*0.28, y:f.y+(h3(f.y,4,seed)-.5)*0.28,
      k, s:0.82+h3(f.x,f.y,seed)*0.38, seed:((f.x*13+f.y*7+seed)|0), dress:1};
    if(CRAFT_PROP[k]) pr.craft=1;
    if(k==='rubble'){
      pr.spr=(h3(f.x,3,seed)<0.5)?'rubble':'rubble2';
      pr.s=h01(f.x,6,seed)<0.5?0.26+h01(f.x,7,seed)*0.32:0.58+h01(f.x,7,seed)*0.50;
    }
    G.props.push(pr);
    keep.push({x:f.x,y:f.y,r:1.4});
    placed++;
  }
  placePlantClusters(L);
  placeCraftCaches(L);
}
function isPlantKind(k){
  return k==='shroom'||k==='glowcap'||k==='cavefern'||k==='sporepuff'||k==='nightbloom'||k==='lichen'||k==='moss';
}
function plantKindsFor(n){
  if(n===1) return ['lichen','glowcap','shroom','nightbloom'];
  if(n===2) return ['shroom','glowcap','cavefern','sporepuff','nightbloom','lichen','moss'];
  if(n===3) return ['moss','lichen','nightbloom','cavefern'];
  if(n===4) return ['moss','lichen','sporepuff'];
  return ['lichen','nightbloom','moss'];
}
function placePlantClusters(L){
  if(!L||!L.grid) return;
  G.props=G.props||[];
  const seed=L.dressSeed||1;
  const kinds=plantKindsFor(L.n);
  const floors=[];
  for(let y=2;y<L.h-2;y++) for(let x=2;x<L.w-2;x++){
    const t=L.grid[y][x];
    if(t!==0 && t!==3) continue;
    let wall=0;
    for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){
      if(L.grid[y+j]&&L.grid[y+j][x+i]===1) wall=1;
    }
    if(wall) floors.push({x:x+0.5,y:y+0.5});
  }
  if(!floors.length) return;
  const nCl=L.n===2?5:L.n===1?3:3;
  const keep=[];
  G.props.forEach(p=>keep.push({x:p.x,y:p.y,r:1.05}));
  if(L.spawn) keep.push({x:L.spawn.x,y:L.spawn.y,r:2.2});
  if(L.rubyDoor) keep.push({x:L.rubyDoor.x,y:L.rubyDoor.y,r:2.5});
  if(L.door) keep.push({x:L.door.x,y:L.door.y,r:1.8});
  if(L.stair) keep.push({x:L.stair.x,y:L.stair.y,r:1.8});
  if(L.camp) keep.push({x:L.camp.x,y:L.camp.y,r:1.6});
  if(L.bell) keep.push({x:L.bell.x,y:L.bell.y,r:1.5});
  let clusters=0, tries=0;
  while(clusters<nCl && tries<90){
    tries++;
    const c=floors[(h3(tries*9, clusters*17, seed)*floors.length)|0];
    if(!c) continue;
    let ok=1;
    for(let i=0;i<keep.length;i++){
      const o=keep[i];
      if(Math.hypot(o.x-c.x,o.y-c.y)<o.r+1.5){ ok=0; break; }
    }
    if(!ok) continue;
    if(L.n===1 && nearCrush(c.x,c.y,1.6)) continue;
    const n=3+((h3(c.x*3,c.y*5,seed)*5)|0);
    for(let i=0;i<n;i++){
      const ang=h3(c.x+i, c.y, seed)*TAU;
      const rad=0.22+h3(i*2,c.y,seed)*1.4;
      const x=c.x+Math.cos(ang)*rad, y=c.y+Math.sin(ang)*rad*0.82;
      const ti=x|0, tj=y|0;
      if(!L.grid[tj]||(L.grid[tj][ti]!==0 && L.grid[tj][ti]!==3)) continue;
      if(L.n===1 && nearCrush(x,y,1.1)) continue;
      const k=kinds[(h3(x*8,y*8,seed+i)*kinds.length)|0];
      G.props.push({x,y,k,s:0.72+h3(x,y,seed)*0.48, seed:((x*13+y*7+seed+i)|0), dress:1, plant:1});
    }
    keep.push({x:c.x,y:c.y,r:2.5});
    clusters++;
  }
}
function foesLeft(){ return G.ents.some(e=>e.team==='foe'&&!e.dead&&!e.npc); }
function openPassagesAt(x,y){
  const L=G.lvl; if(!L||!L.grid) return true;
  const sx=x|0, sy=y|0;
  const seen=Object.create(null);
  const q=[[sx,sy,0]];
  seen[sx+','+sy]=1;
  let n=0, far=0;
  while(q.length){
    const [i,j,d]=q.shift();
    n++; far=Math.max(far,d);
    if(n>70 || far>=8) return true;
    for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ni=i+di, nj=j+dj, k=ni+','+nj;
      if(seen[k]||nj<0||ni<0||nj>=L.h||ni>=L.w) continue;
      const t=L.grid[nj][ni];
      if(t===0||t===3||t===4){ seen[k]=1; q.push([ni,nj,d+1]); }
    }
  }
  if((G.props||[]).some(p=>p.k==='tunnel'&&seen[(p.x|0)+','+(p.y|0)])) return true;
  return false;
}
function wanderKinds(){
  const ch=G.ch||1;
  if(ch<=1) return ['rat','centipede','spider','beetle','kobold'];
  if(ch===2) return ['goblin','kobold','rat','orc','gibberling'];
  if(ch===3) return ['crawler','spider','grimlock','troglodyte','myconid'];
  if(ch===4) return ['drow','duergar','grimlock','quaggoth','wraith'];
  return ['undead','orc','drow','gargoyle','wraith'];
}
function wanderSpawnSpots(p){
  const spots=[];
  for(let j=-12;j<=12;j++) for(let i=-12;i<=12;i++){
    const x=p.x+i+0.5, y=p.y+j+0.5, d=Math.hypot(i,j);
    if(d<4.2||d>11) continue;
    if(!walk(x,y,p)) continue;
    spots.push({x,y,d});
  }
  spots.sort((a,b)=>b.d-a.d);
  return spots.slice(0,10);
}
function spawnWanderers(p){
  const kinds=wanderKinds().filter(k=>typeof FOE[k]==='function');
  if(!kinds.length && typeof FOE.rat==='function') kinds.push('rat');
  const spots=wanderSpawnSpots(p);
  const n=Math.min(ri(1,3), Math.max(1,spots.length));
  const spawned=[];
  for(let i=0;i<n;i++){
    const k=kinds[ri(0,kinds.length-1)]||'rat';
    const make=FOE[k]||FOE.rat;
    if(typeof make!=='function') continue;
    const s=spots[i]||spots[0];
    if(!s) continue;
    const e=make();
    e.x=s.x; e.y=s.y;
    if(!walk(e.x,e.y,e)) continue;
    e.aggro=99; e.stun=0.15; e.engaged=1;
    G.ents.push(e); burst(e.x,e.y,'#ff6a3a',12,2.4);
    spawned.push(e.name||k);
  }
  if(spawned.length) beginFight(G.ents[G.ents.length-1]);
  return spawned;
}

function campRest(){
  const p=player(); if(!p) return;
  if(G.sleepShow) return;
  if(G.fightOn || nearestFoe(p,7)){ hint('Not while blades are out.',2.6); return; }
  G.searching=0; G.digging=0; G.dig=null; p.dest=null;
  const open=openPassagesAt(p.x,p.y);
  if(open){
    const roll=ri(1,6);
    say('Open passages. Wandering check: d6 = '+roll+'.','#c9b895');
    if(roll<=2){
      const names=spawnWanderers(p);
      if(names.length){
        say('Steel in the dark: '+names.join(', ')+'. Sleep breaks.','#ff6a5a');
        hint('Wandering monsters. The rest is interrupted.',4.2);
        G.flash={c:'#3a1208',a:.55}; shake(10);
        return;
      }
      say('A scrape in the dark, then nothing. The watch holds.','#c9b895');
    }
    say('The night passes. Nothing comes down the tunnel.','#c9b895');
  } else {
    say('The stone is closed around you. A quiet watch.','#c9b895');
  }
  let healed=0;
  G.ents.forEach(e=>{
    if(e.team!=='party') return;
    if(e.ghost && e.dead) returnGhost(e, true);
    if(e.dead) return;
    const miss=e.maxhp-e.hp;
    if(miss>0) healed+=applyHeal(e, miss/ADD_SCALE);
    if(typeof clearPoison==='function') clearPoison(e);
  });
  G.day=(G.day||1)+1;
  G.dayClock=0;
  tryPordoomGifts();
  G.sleepShow={t:0, dur:5};
  G.flash={c:'#ffb45c',a:.18};
  say('Macar decides to camp to rest and heal.','#ffe08a');
  hint(healed?'Macar camps. Hit points restored.':'Macar camps. Already whole.',5);
}
function isLootableBody(o){
  if(!o||o.hero) return false;
  if(o.ghost) return false;
  return !!(o.corpse||o.crushed||(o.dead&&o.team==='foe'));
}
function nearestCorpse(e, r){
  let best=null, bd=r;
  for(const o of G.ents){
    if(!isLootableBody(o) || o.looted) continue;
    const d=dist(e,o);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}
function lootNearbyCorpses(e, r){
  let n=0;
  for(const o of G.ents){
    if(!isLootableBody(o) || o.looted) continue;
    if(dist(e,o)<r){ lootCorpse(o); n++; }
  }
  return n;
}

function isMagicAttack(src){
  if(!src) return false;
  if(src.magic) return true;
  if(src.from && isMagicAttack(src.from)) return true;

  if(/wraith|lich|beholder|mage|priest|ixzan|horror|element|dao|mindflay|elderbrain|deathtyrant|vampire|aboleth|neothelid|rune/.test(k)) return true;
  if(src.ranged && /drow|fungi|wraith|beholder|lich/.test(k)) return true;
  if(/Spell|Magic|Ray|Gaze|Mind|Spore|Wand|Priest/.test(src.sa||'')) return true;

}
function lootCorpse(e){
  if(!isLootableBody(e)) return;
  if(e.crushed && e.col && e.team==='party'){
    makeGhostAlly(e);
    return;
  }
  if(e.looted) return;
  e.looted=1;
  e.corpse=1;
  const bits=[];
  const kit=e.kit||{};
  ['bombs','rations','ales','torches','ammo'].forEach(k=>{
    if(!kit[k]) return;
    addToPack('macar',k,kit[k]);
    if(k==='ales') bits.push(kit[k]+' draughts of beer');
    else if(k==='rations' && kit[k]===7) bits.push('a week of rations');
    else if(k==='rations' && kit[k]===14) bits.push('two weeks of rations');
    else bits.push(k+' \u00d7'+kit[k]);
  });
  if(kit.bombKit){
    addToPack('macar','bombKit',kit.bombKit);
    gain('powder', 4*kit.bombKit);
    gain('ironstone', 2*kit.bombKit);
    bits.push('a bomb-making kit');
  }
  if(kit.gp){
    addCoin('gp',kit.gp);
    awardPartyXp(kit.gp,'Treasure ('+kit.gp+' gp)',e);
    bits.push(kit.gp+' gp');
  }
  const drop=e.drop;
  if(drop){
    convertHoard(drop.coins||{}, drop.gems||0, drop.jew||0, 0, 'none', e, true);
    if(drop.coins) Object.keys(drop.coins).forEach(k=>{ if(drop.coins[k]) bits.push(drop.coins[k]+' '+k); });
    if(drop.gems) bits.push(drop.gems+' gems');
    if(drop.jew) bits.push(drop.jew+' jewelry');
    (drop.potions||[]).forEach(p=>{ const n=givePotion(p,1); if(n) bits.push(n); });
    (drop.items||[]).forEach(it=>{
      if(it.k==='pack'||it.field){ addToPack('macar', it.field||'ammo', it.count||1); bits.push((it.n||it.field||'kit')+' \u00d7'+(it.count||1)); return; }
      if(it.k==='gem'){ giveGem(it,1); bits.push(it.n||'gem'); }
      else { const n=giveMagic(it,1); if(n) bits.push(n); }
    });
    if(drop.res) Object.keys(drop.res).forEach(k=>gain(k, drop.res[k]));
    e.drop=null;
  }
  packGainNote(bits, e.name);
  const L=G.lvl;
  if(L&&L.n===1){
    const left=(G.ents||[]).filter(z=>z.crushed&&z.corpse&&!z.looted).length;
    if(!left){
      L.flags.looted=1; if(L.objs[0]) L.objs[0].d=1;
      hint('A chamber has opened east. The ruby waits on the far wall.',6);
    }
  }
}

   AD&D 1st Edition rules — to-hit, saves, treasure, potions, herbs
   ========================================================================== */
const ADD_SCALE=4;
const PARTY_LVL=3;
/* Macar — AD&D 1e dwarf fighter 3 (assigned sheet). War hammer 1d8.
   Companions: Method I, 4d6 keep the highest three, then dwarf CON+1 / CHA-1. */
const MACAR_SHEET={str:18,exc:76,int:10,wis:12,dex:11,con:18,cha:10,cls:'f',dice:'1d8'};
function d20(){ return ri(1,20); }
function d6(){ return ri(1,6); }
function d30(){ return ri(1, HERBS.length); }
function d100(){ return ri(1,100); }
function d1000(){ return ri(1,1000); }
function d10000(){ return ri(1,10000); }
function rollDice(n,s,b){ let t=b||0; for(let i=0;i<n;i++) t+=ri(1,s); return t; }
function rollExpr(expr){
  if(!expr) return rollDice(1,6,0);
  let tot=0;
  String(expr).split('/').forEach(part=>{
    const m=part.trim().match(/^(\d+)d(\d+)([+-]\d+)?$/i);
    if(m) tot+=rollDice(+m[1],+m[2], m[3]?+m[3]:0);
    else { const n=parseFloat(part); if(!isNaN(n)) tot+=Math.max(1,Math.round(n)); }
  });
  return Math.max(1,tot);
}
function partyLevel(){ const p=player(); return (p&&p.lvl)||PARTY_LVL; }
function clsLabel(cls){ return cls==='c'?'C':cls==='t'?'T':'F'; }
function clsName(cls){ return cls==='c'?'Cleric':cls==='t'?'Thief':'Fighter'; }
const XP_F=[0,2001,4001,8001,18001,35001,70001,125001,250001,500001,750001];
const XP_C=[0,1501,3001,6001,13001,27501,55001,110001,225001,450001,675001];
const XP_T=[0,1251,2501,5001,10001,20001,42501,70001,110001,160001,220001];
function xpTable(cls){ return cls==='c'?XP_C:cls==='t'?XP_T:XP_F; }
function startXpFor(cls){ return xpTable(cls)[PARTY_LVL-1]||0; }
function levelFromXp(cls, xp){
  const t=xpTable(cls); let lv=1;
  for(let i=1;i<t.length;i++){ if((xp||0)>=t[i]) lv=i+1; else break; }
  return clamp(lv,1,t.length);
}
function xpForNext(cls, lvl){
  const t=xpTable(cls);
  return t[Math.min(lvl, t.length-1)]||t[t.length-1];
}
function ensureCharXp(){
  if(!G.charXp) G.charXp={};
  ROSTER.forEach(r=>{
    if(G.charXp[r.key]==null) G.charXp[r.key]=startXpFor(rosterCls(r));
  });
}
function livingParty(){ return (G.ents||[]).filter(e=>e.team==='party'&&!e.dead&&e.col); }
function monsterXpValue(e){
  const hd=monsterHD(e);
  let base=20, php=2;
  if(hd<=0.5){ base=5; php=1; }
  else if(hd<1){ base=10; php=1; }
  else if(hd<1.01){ base=20; php=2; }
  else if(hd<2){ base=35; php=3; }
  else if(hd<3){ base=50; php=4; }
  else if(hd<4){ base=75; php=5; }
  else if(hd<5){ base=125; php=6; }
  else if(hd<6){ base=175; php=8; }
  else if(hd<7){ base=225; php=10; }
  else if(hd<8){ base=350; php=12; }
  else if(hd<9){ base=575; php=14; }
  else if(hd<10){ base=700; php=15; }
  else { base=900+Math.floor((hd-10)*200); php=16; }
  const hp1e=Math.max(1, Math.round((e.maxhp||8)/ADD_SCALE));
  let xp=base+php*hp1e;
  if(e.sa) xp+=Math.round(base*0.25);
  if(e.boss) xp=Math.round(xp*1.5);
  return Math.max(1, Math.round(xp));
}
function grantCharXp(e, n){
  if(!e||!e.col||n<=0) return;
  ensureCharXp();
  const key=e.col.key;
  G.charXp[key]=(G.charXp[key]||0)+n;
  const ab=entityAbil(e); if(!ab) return;
  const from=ab.lvl||e.lvl||PARTY_LVL;
  const nl=levelFromXp(ab.cls, G.charXp[key]);
  if(nl>from){
    let add=0;
    for(let lv=from+1; lv<=nl; lv++) add+=rollLevelHp(ab.cls, ab.con);
    ab.lvl=nl; e.lvl=nl;
    ab.maxhp=(ab.maxhp||0)+add;
    e.maxhp=(e.maxhp||0)+add*ADD_SCALE;
    e.hp=Math.min(e.maxhp, (e.hp||0)+add*ADD_SCALE);

  if(atk.strMul) raw=Math.round(raw*atk.strMul);
  raw=Math.round(raw*ADD_SCALE*wepMult(atk));
  if(atk.buff>0) raw=Math.round(raw*1.25);
  return Math.max(1, raw);
}
const SAVE_F=[
  [14,15,16,17,17],[13,14,15,16,16],[11,12,13,13,14],[10,11,12,12,13],
  [8,9,10,9,11],[7,8,9,8,10],[5,6,7,5,8],[4,5,6,4,7],[3,4,5,4,6]
];
const SAVE_C=[
  [10,13,14,16,15],[9,12,13,15,14],[7,10,11,13,12],[6,9,10,12,11],
  [5,8,9,11,10],[4,7,8,10,9],[2,5,6,8,7]
];
const SAVE_T=[
  [13,12,14,16,15],[12,11,12,15,13],[11,10,10,14,11],
  [10,9,8,13,9],[9,8,6,12,7],[8,7,4,11,5]
];
function dwarfSaveBonus(e, kind){
  if(!(e.team==='party'||e.race==='dwarf')) return 0;
  const con=(entityAbil(e)&&entityAbil(e).con)||0;
  if(!con) return 0;
  if(kind==='poison'||kind==='rod'||kind==='spell') return Math.floor(con/3.5);
  return 0;
}
function saveNeed(e, kind){
  const idx={poison:0,death:0,petrify:1,rod:2,breath:3,spell:4}[kind]||4;
  let need;
  if(e.team==='party'){
    const lv=clamp(e.lvl||partyLevel(),1,17);
    const cls=e.cls||(e.role==='faith'?'c':e.role==='bolt'?'t':'f');
    if(cls==='c'||e.role==='faith') need=SAVE_C[clamp(Math.floor((lv-1)/3),0,6)][idx];
    else if(cls==='t') need=SAVE_T[clamp(Math.floor((lv-1)/4),0,5)][idx];
    else need=SAVE_F[clamp(Math.floor((lv-1)/2),0,8)][idx];
  } else {
    const hd=monsterHD(e);
    const row=hd<1?0:hd<3?1:hd<5?2:hd<7?3:hd<9?4:hd<11?5:hd<13?6:hd<15?7:hd<17?8:8;
    need=SAVE_F[Math.min(row,8)][idx];
  }
  return need-dwarfSaveBonus(e, kind);
}
function savingThrow(e, kind){
  const need=saveNeed(e,kind)-(e.juice||0);
  const roll=d20();
  const ok=roll===20||roll>=need;
  ftext(e.x,e.y+(ok?0.15:0),(ok?'save':'fail')+' '+roll,'#cfe3ff');
  return ok;
}
function beginFight(foe){
  G.fightOn=1;
  playMusic('battle');
  tryPlayMusic();
  let pSeg=ri(1,6), fSeg=ri(1,6);
  const sneak=foe&&foe.sa&&/Surprise/i.test(foe.sa);
  const pSur=pSeg<=(sneak?4:2), fSur=fSeg<=(sneak?1:2);
  if(pSur&&!fSur){
    G.ents.forEach(e=>{
      if(e.team!=='party'||e.dead) return;
      const ab=entityAbil(e);
      const segs=Math.max(0, pSeg-dexAttackAdj(ab&&ab.dex));
      if(segs>0) e.stun=Math.max(e.stun||0, segs*0.65);
    });
    say('Surprise — they have '+pSeg+' segments. DEX trims yours.','#ff6a5a');
  } else if(fSur&&!pSur){
    G.ents.forEach(e=>{ if(e.team==='foe'&&!e.dead) e.stun=Math.max(e.stun||0, fSeg*0.65); });
    say('Surprise — you have '+fSeg+' segments.','#ffd27a');
  } else if(pSur&&fSur){
    say('Both sides are caught off-guard. No surprise.','#c9b895');
  }
  const ip=ri(1,6), iff=ri(1,6);
  G.initWin=ip>iff?'party':ip<iff?'foe':'tie';
  say('Initiative d6  '+ip+' vs '+iff+' — '+(G.initWin==='tie'?'tied, weapon speed':(G.initWin==='party'?'ours':'theirs'))+'.','#c9b895');
  const gap=Math.abs(ip-iff);
  const delay=0.55+gap*0.18;
  if(G.initWin==='party'){
    G.ents.forEach(e=>{ if(e.team==='foe'&&!e.dead) e.stun=Math.max(e.stun||0, delay); });
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead) e.ct=Math.min(e.ct||0, 0.05); });
  } else if(G.initWin==='foe'){
    G.ents.forEach(e=>{
      if(e.team!=='party'||e.dead) return;
      const ab=entityAbil(e);
      const trim=Math.max(0, dexAttackAdj(ab&&ab.dex)*0.12);
      e.stun=Math.max(e.stun||0, Math.max(0.2, delay-trim));
    });
  } else {
    say('Tie — slower weapons wait.','#c9b895');
    G.ents.forEach(e=>{
      if(e.dead) return;
      const slow=e.ranged?0.15:(e.hero?0.08:0.2);
      e.stun=Math.max(e.stun||0, slow);
    });
  }
}
function endFightIfClear(){
  if(G.fightOn && !G.ents.some(e=>e.team==='foe'&&!e.dead)){
    G.fightOn=0;
    syncMusic();
  }
}

function potionByRoll(r){
  for(const p of POTIONS) if(r>=p.a&&r<=p.b) return p;
  return POTIONS[POTIONS.length-1];
}
function rollPotion(){ return potionByRoll(d10000()); }
function givePotion(p, silent){
  if(!p) return '';
  ensurePacks();
  const pk=packOf('macar');
  pk.potions=pk.potions||[];
  pk.healPots=pk.healPots||[];
  if(isHealPotion(p)){
    pk.healPots.push({n:p.n,d:p.d,k:p.k,gp:p.gp});
    syncPackTotals();
    if(!silent) say('Healing draught into the ale flask: '+p.n+'.','#d2bd63');
    return p.n+' (ale flask)';
  }
  pk.potions.push({n:p.n,d:p.d,k:p.k,gp:p.gp});
  syncPackTotals();
  if(!silent) say('Potion into MACAR\'s pack: '+p.n+'.','#e0d2ff');
  return p.n;
}

   AD&D 1e DMG magic items (Table III and subtables)
   Potions that come up as a category still use the campaign d10,000 list.
   Names follow the Dungeon Masters Guide; notes are short play effects.

function pickRange(table, roll){
  roll=roll==null?d100():roll;
  for(const row of table){ if(roll>=row.a && roll<=row.b) return row; }
  return table[table.length-1];
}
function magItem(o){
  return {n:o.n, d:o.d, cat:o.cat, k:o.k||o.cat, plus:o.plus||0, charges:o.charges||0,
    vs:o.vs||'', cursed:!!o.cursed, xp:o.xp||0};
}
function giveMagic(it, silent){
  if(!it) return '';
  ensurePacks();
  const pk=packOf('macar');
  pk.magic=pk.magic||[];
  pk.magic.push(it);
  const slot=maybeAutoEquip(it);
  syncPackTotals();
  if(!silent){
    if(slot) say(it.n+' — equipped from MACAR\'s pack.','#ffd27a');
    else say((it.cat||'Item')+': '+it.n+' — stowed in MACAR\'s pack. '+(it.d||''), '#ffd27a');
  }
  return it.n+(slot?' [E]':'');
}

function rollDmgScroll(){ const r=pickRange(DMG_SCROLL); return magItem({cat:'Scroll',n:r.n,d:r.d,k:r.k,cursed:r.cursed}); }
function rollDmgRing(){ const r=pickRange(DMG_RING); return magItem({cat:'Ring',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed,charges:r.charges}); }
function rollDmgWand(){ const r=pickRange(DMG_WAND); return magItem({cat:'Rod/Staff/Wand',n:r.n,d:r.d,k:r.k,plus:r.plus,charges:r.charges||20,cursed:r.cursed}); }
function rollDmgArmor(){ const r=pickRange(DMG_ARMOR); return magItem({cat:'Armor/Shield',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed}); }
function rollDmgSword(){ const r=pickRange(DMG_SWORD); return magItem({cat:'Sword',n:r.n,d:r.d,k:r.k,plus:r.plus,vs:r.vs,cursed:r.cursed}); }
function rollDmgWeapon(){ const r=pickRange(DMG_WEAP); return magItem({cat:'Weapon',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed}); }
function rollDmgMisc(){
  const map=d100();
  const table=map<=15?DMG_MISC_A:map<=30?DMG_MISC_B:map<=45?DMG_MISC_C:map<=60?DMG_MISC_D:DMG_MISC_E;
  const r=pickRange(table);
  return magItem({cat:'Miscellaneous',n:r.n,d:r.d,k:r.k,plus:r.plus,charges:r.charges,cursed:r.cursed});
}

function magicCategory(kind){
  if(kind==='potion') return 'potion';
  if(kind==='scroll') return 'scroll';
  if(kind==='saw'){
    const r=d100();
    if(r<=40) return 'sword';
    if(r<=70) return 'armor';
    return 'weapon';
  }
  if(kind==='anynos'){
    const r=d100();
    if(r<=25) return 'potion';
    if(r<=45) return 'scroll';
    if(r<=55) return 'ring';
    if(r<=65) return 'wand';
    if(r<=72) return 'misc';
    if(r<=85) return 'armor';
    return 'weapon';
  }
  const r=d100();
  if(r<=20) return 'potion';
  if(r<=35) return 'scroll';
  if(r<=40) return 'ring';
  if(r<=45) return 'wand';
  if(r<=48) return 'misc';
  if(r<=55) return 'armor';
  if(r<=75) return 'sword';
  return 'weapon';
}
function rollMagicItem(kind){
  const cat=magicCategory(kind);
  if(cat==='potion'){
    const p=rollPotion();
    return {kind:'potion', potion:p, n:p.n, d:p.d, cat:'Potion'};
  }
  let it;
  if(cat==='scroll') it=rollDmgScroll();
  else if(cat==='ring') it=rollDmgRing();
  else if(cat==='wand') it=rollDmgWand();
  else if(cat==='misc') it=rollDmgMisc();
  else if(cat==='armor') it=rollDmgArmor();
  else if(cat==='sword') it=rollDmgSword();
  else it=rollDmgWeapon();
  return {kind:'magic', item:it, n:it.n, d:it.d, cat:it.cat};
}
function extraMagicForKind(kind){
  const extra=[];
  if(kind==='anyp'||kind==='anyps') extra.push('potion');
  if(kind==='anys'||kind==='anyps') extra.push('scroll');
  return extra;
}

function applyEquipped(){
  if(!G.equipped) G.equipped={weapon:null,armor:null,ring:null,wand:null};
  const eq=G.equipped;
  Object.values(G.gear||{}).forEach(g=>{ g.magicAtk=0; g.magicAc=0; });
  const mac=G.gear&&G.gear.macar;
  if(eq.weapon&&mac){
    mac.magicAtk=eq.weapon.plus||0;
    if(eq.weapon.cursed) mac.magicAtk=eq.weapon.plus|| -1;
  }
  const acPlus=(eq.armor&&!eq.armor.cursed?eq.armor.plus||0:eq.armor&&eq.armor.cursed?eq.armor.plus|| -1:0)
    +(eq.ring&&!eq.ring.cursed?eq.ring.plus||0:0);
  Object.values(G.gear||{}).forEach(g=>{ g.magicAc=acPlus; });
  if(eq.armor&&eq.armor.cursed) Object.values(G.gear||{}).forEach(g=>{ g.magicAc=(eq.armor.plus|| -1)+(eq.ring&&eq.ring.plus||0); });
}

  }

function convertHoard(coins, gems, jew, magN, magKind, where, quiet){
  const notes=[];
  if(coins.cp){ addCoin('cp',coins.cp); const n=Math.min(6,Math.max(1,Math.round(coins.cp/1500))); gain('ironstone',n); notes.push(coins.cp+' cp'); }
  if(coins.sp){ addCoin('sp',coins.sp); const n=Math.min(6,Math.max(1,Math.round(coins.sp/1000))); gain('ironstone',n); notes.push(coins.sp+' sp'); }
  if(coins.ep){ addCoin('ep',coins.ep); const n=Math.min(5,Math.max(1,Math.round(coins.ep/600))); gain('deepsilver',n); notes.push(coins.ep+' ep'); }
  if(coins.gp){ addCoin('gp',coins.gp); const n=Math.min(6,Math.max(1,Math.round(coins.gp/700))); gain('deepsilver',n); notes.push(coins.gp+' gp'); }
  if(coins.pp){ addCoin('pp',coins.pp); const n=Math.min(4,Math.max(1,Math.round(coins.pp/200))); gain('starmetal',n); notes.push(coins.pp+' pp'); }
  if(gems){ gain(gems>=8?'starmetal':'deepsilver', Math.min(4,Math.max(1,Math.round(gems/8)))); notes.push(gems+' gems');
    giveGem({n:gems===1?'Gemstone':(gems+' gemstones'), gp:gems*50, d:'Cut stones from the take.'}, 1); }

    giveGem({n:jew===1?'Jewelry':(jew+' pieces of jewelry'), gp:jew*80, d:'Worked gold and silver.'}, 1); }
  const extras=extraMagicForKind(magKind);
  const rolls=magN+extras.length;
  let magGp=0;
  for(let i=0;i<rolls;i++){
    const kind=i<magN?(magKind||'any'):extras[i-magN];
    const got=rollMagicItem(kind);
    if(got.kind==='potion'){ givePotion(got.potion,1); notes.push('Potion: '+got.n); magGp+=got.potion.gp||got.potion.xp||0; }
    else { giveMagic(got.item,1); notes.push(got.cat+': '+got.n); magGp+=got.item.gp||got.item.xp||0; }
  }

    say(((where&&where.name)?where.name+' drops':'Treasure')+': '+notes.join(', ')+'.','#ffd27a');

  return notes;

function rollLair(letter){
  const T=LAIR[letter]; if(!T) return null;

    if(!row) return;
    if(chanceOk(row[0])) coins[key]=rngAmt(row[1],row[2])*(row[3]||1);
  };
  coin('cp',T.cp); coin('sp',T.sp); coin('ep',T.ep); coin('gp',T.gp); coin('pp',T.pp);
  if(T.gem&&chanceOk(T.gem[0])) gems=rngAmt(T.gem[1],T.gem[2]);
  if(T.jew&&chanceOk(T.jew[0])) jew=rngAmt(T.jew[1],T.jew[2]);
  if(T.mag&&chanceOk(T.mag[0])){ magN=T.mag[2]||1; magKind=T.mag[1]; }
  return {coins,gems,jew,magN,magKind};
}

function damage(e,amt,col,src){
  if(e.dead) return;
  if(e.stoneskin>0){ e.stoneskin--; ftext(e.x,e.y,'stoneskin','#cfe3ff'); return; }
  if(e.guard) amt*=.5;
  if(e.ghost && !isMagicAttack(src)) amt=Math.max(1, Math.round(amt/3));
  if(e.team==='party'){ amt*=(1-armCut(e)); wear(e.gear,0,0.7); }
  amt=Math.round(amt); e.hp-=amt;
  if(e.hp>0) e.flash=.18;
  ftext(e.x,e.y,'-'+amt,col||(e.team==='party'?'#ff6a5a':'#ffe6a8'),e.boss);
  if(e.hp>0) burst(e.x,e.y, e.glow||(e.kind==='statue'?'#b8b0a0':e.kind==='undead'?'#7cff9c':e.kind==='spider'?'#9a6bff':'#a3241f'),7,2.2);
  if(e.hero) G.hurt=Math.min(1,G.hurt+amt/70);
  if(e.hp<=0){ e.dead=1; e.deadT=0;
    if(e.team==='foe'){ G.kills++;
      awardPartyXp(monsterXpValue(e), e.name||'Foe', e);
      foeDrop(e);
      e.corpse=1; e.looted=0; e.flash=0;
      if(e.boss){ shake(26); G.flash={c:'#fff',a:.45}; say(e.name+' is broken.','#ffd27a'); G.hitstop=.12; }
    } else if(e.ghost){
      e.hp=0; e.ghostReturn=GHOST_RETURN; e.atk=0; e.moving=0; e.flash=0;
      burst(e.x,e.y,'#7ad8ff',20,3.4);
      say(e.name+' scatters into the dark. He will gather himself in ten minutes.','#80d0ff');
    } else { say(e.name+' goes down!','#ff6a5a'); if(e.hero){ if(e.prot0){ e.prot0=0; e.dead=0; e.hp=Math.round(e.maxhp*.35); say('Protection from Wounds holds.','#ffe08a'); } else G.scene='dead'; } } }
}
function onHitFx(atk,o,dmg){
  if(!atk||!o) return dmg;

  if(atk.poison||/Poison/i.test(sa)){
    if(!savingThrow(o,'poison')){
      if(atk.slowPoison||atk.web||atk.kind==='spider'||/Web/i.test(sa)){
        o.slowT=Math.max(o.slowT||0, atk.boss?8:4.5);
        ftext(o.x,o.y+0.2,'slowed','#c9b895');
      } else {
        o.poisonT=Math.max(o.poisonT||0,4.2);
      }
    }
  }
  if(/Energy Drain/i.test(sa)){
    if(!savingThrow(o,'death')){ dmg=Math.round(dmg*1.35); o.maxhp=Math.max(20,o.maxhp-ADD_SCALE*4); }
  }
  if(/Petrif|Gaze|Cockatrice/i.test(sa)){
    if(!savingThrow(o,'petrify')){ o.stun=Math.max(o.stun||0,2.8); dmg=Math.round(dmg*1.25); ftext(o.x,o.y,'held','#c8d4e0'); }
  }
  if(/Breath/i.test(sa)){
    if(savingThrow(o,'breath')) dmg=Math.max(1,Math.round(dmg*0.5));
  }
  if(/Paralys|Paralyz/i.test(sa)){
    if(!savingThrow(o,'poison')) o.stun=Math.max(o.stun||0,2.4);
  }
  if(/Confusion|Mind Blast|Spore/i.test(sa)){
    if(o.mr||savingThrow(o,'spell')) {}
    else o.stun=Math.max(o.stun||0,1.6);
  }
  return dmg;
}
function meleeSwing(e,arc,reach,dmg,col){
  const fa=ang(e.fdx,e.fdy); let hit=0;
  const rad=Math.max(0.4,(reach||e.range||1)+(0.2));
  const wedge=Math.min(arc||1.9, 2.5);
  for(const o of G.ents){ if(o.dead||o.team===e.team||o.npc||o.sleeping) continue;
    const d=dist(e,o); if(!(d<=rad+(o.r||0.35))) continue;
    const a=ang(o.x-e.x,o.y-e.y); const df=Math.abs(((a-fa+Math.PI*3)%TAU)-Math.PI);
    if(df<=wedge/2){
      const rolled=addAttack(e,o);
      if(rolled){ damage(o,onHitFx(e,o,rolled),col,e);
        wear(e.gear,0.35,0);
        const k=.5/(d+.4); o.kx+=Math.cos(a)*k*2.4; o.ky+=Math.sin(a)*k*2.4; hit=1; }
    } }
  const L=G.lvl;
  const rock=dmg||18;

  if(hit){ shake(4); G.hitstop=Math.max(G.hitstop,.035); }

}

function strengthCheck(e){

function applyWeb(e){

function tryRetrieveBolt(s){
