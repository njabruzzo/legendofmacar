  }
}

function drawPlug(g,L){
  if(!L.plug) return;
  drawRubbleAt(g, L.plug.x, L.plug.y, 14, 1, 0, 1-L.plug.hp/70);
}
function drawRubbleAt(g,x,y,n,sc,seed,dmg){
  const s=w2s(x,y), z=ZOOM*(sc||1); dmg=dmg||0; n=n||14; seed=seed||0;
  g.save(); g.translate(s.x,s.y);
  drawRubbleLocal(g,z,n,seed,dmg);
  g.restore();
}
function drawFallenBeam(g,p,z){
  const sc=p.s||1, seed=p.seed||0;
  const L=92*z*sc, th=9*z*sc;
  const ang=(-0.42+(h2(seed,3)-0.5)*0.55);
  g.save();
  g.rotate(ang);
  softShadow(g,0,2*z,L*0.48,th*0.9,0.5);
  g.beginPath();
  g.moveTo(-L*0.5,-th*0.35); g.lineTo(L*0.42,-th*0.45); g.lineTo(L*0.5,th*0.15);
  g.lineTo(L*0.38,th*0.55); g.lineTo(-L*0.46,th*0.42); g.closePath();
  const gr=g.createLinearGradient(-L*0.5,-th,L*0.5,th);
  gr.addColorStop(0,'#8a6238'); gr.addColorStop(0.45,'#5c4024'); gr.addColorStop(1,'#2a1a10');
  g.fillStyle=gr; g.fill();
  g.strokeStyle='rgba(18,10,6,0.72)'; g.lineWidth=1.4*z; g.stroke();
  g.strokeStyle='rgba(0,0,0,0.28)'; g.lineWidth=1*z;
  for(let i=0;i<5;i++){
    const t=-L*0.42+i*L*0.18;
    g.beginPath(); g.moveTo(t,-th*0.28); g.lineTo(t+6*z,th*0.32); g.stroke();
  }
  g.fillStyle='#3a2614';
  g.beginPath(); g.moveTo(L*0.42,-th*0.45); g.lineTo(L*0.58,-th*0.05); g.lineTo(L*0.5,th*0.15); g.closePath(); g.fill();
  g.restore();
  if(h2(seed,8)>0.45){
    g.save();
    g.translate(18*z*sc,-8*z*sc);
    g.rotate(ang+1.15);
    g.fillStyle='#4a3220';
    g.fillRect(-22*z*sc,-3.2*z*sc,34*z*sc,6.4*z*sc);
    g.restore();
  }
}
function drawFloorDust(g,p,z){
  const sc=p.s||1, seed=p.seed||0;
  const rx=28*z*sc, ry=14*z*sc;
  const gr=g.createRadialGradient(0,0,1,0,0,rx);
  gr.addColorStop(0,'rgba(92,70,46,0.55)');
  gr.addColorStop(0.55,'rgba(58,42,28,0.28)');
  gr.addColorStop(1,'rgba(40,28,18,0)');
  g.fillStyle=gr;
  g.beginPath(); g.ellipse(0,0,rx,ry,0,0,TAU); g.fill();
  for(let i=0;i<7;i++){
    const px=(h2(seed+i,4)-0.5)*rx*1.15, py=(h2(seed+i,9)-0.5)*ry*1.05;
    const sz=(1.4+h2(seed+i,6)*2.6)*z;
    g.fillStyle=i%2?'rgba(74,56,36,0.55)':'rgba(36,24,16,0.5)';
    g.beginPath(); g.ellipse(px,py,sz,sz*0.55,0,0,TAU); g.fill();
  }
}
function drawRubbleLocal(g,z,n,seed,dmg){
  dmg=dmg||0; n=n||14; seed=seed||0;
  softShadow(g,0,0,58*z,26*z,0.58);
  for(let i=0;i<n;i++){
    const hx=(h2(i+seed,3)-.5)*88*z, hy=-h2(i+seed,7)*64*z-6*z, sz=(14+h2(i+seed,11)*18)*z*(1-dmg*.45);
    g.beginPath(); g.moveTo(hx,hy-sz*.6); g.lineTo(hx+sz,hy); g.lineTo(hx+sz*.2,hy+sz*.7); g.lineTo(hx-sz,hy+sz*.1); g.closePath();
    const gr=g.createLinearGradient(hx-sz,hy-sz,hx+sz,hy+sz);
    gr.addColorStop(0,i%2?'#8a6f4c':'#6d5537'); gr.addColorStop(1,i%2?'#3f3020':'#2c2116');
    g.fillStyle=gr; g.fill(); g.strokeStyle=OL; g.lineWidth=1.3*z; g.stroke();
  }
}

/* ---------------------------- shading helpers ---------------------------- */
function softShadow(g,x,y,rx,ry,a){
  if(!QUALITY) return;
  const gr=g.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
  gr.addColorStop(0,'rgba(0,0,0,'+(a||0.5)+')');
  gr.addColorStop(0.55,'rgba(0,0,0,'+((a||0.5)*0.55)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.save(); g.translate(x,y); g.scale(1,ry/Math.max(rx,ry)); g.translate(-x,-y);
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,Math.max(rx,ry),0,TAU); g.fill(); g.restore();
}
/* fill current path with vertical form-shading + ink outline (+ optional rim) */
function sc(g,base,y0,y1,lw,rim){
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,shade(base,0.26)); gr.addColorStop(0.48,base); gr.addColorStop(1,shade(base,-0.34));
  g.fillStyle=gr; g.fill();
  g.strokeStyle=OL; g.lineWidth=(lw||1.7)*ZOOM; g.stroke();
  if(rim){ g.save(); g.clip(); g.strokeStyle='rgba(255,236,198,'+(rim)+')'; g.lineWidth=2.2*ZOOM;
    g.stroke(); g.restore(); }
}
function flat(g,base,lw){ g.fillStyle=base; g.fill(); g.strokeStyle=OL; g.lineWidth=(lw||1.6)*ZOOM; g.stroke(); }
function drawFacetGem(g,x,y,w,h,on,z){
  const b=on?(.72+Math.sin(G.elapsed*2.8+x*0.01)*.28):.08;
  g.beginPath();
  g.moveTo(x, y-h);
  g.lineTo(x+w*0.62, y-h*0.42);
  g.lineTo(x+w*0.38, y+h*0.08);
  g.lineTo(x, y+h);
  g.lineTo(x-w*0.38, y+h*0.08);
  g.lineTo(x-w*0.62, y-h*0.42);
  g.closePath();
  const gr=g.createLinearGradient(x-w,y-h,x+w,y+h);
  gr.addColorStop(0,on?'#ff8a96':'#4a1a20');
  gr.addColorStop(0.35,on?'#e01828':'#3a1218');
  gr.addColorStop(0.7,on?'#8a0c18':'#2a0c12');
  gr.addColorStop(1,on?'#ff4050':'#3a1218');
  g.fillStyle=gr; g.fill();
  g.strokeStyle=on?'rgba(255,200,210,0.85)':'rgba(80,30,36,0.7)'; g.lineWidth=1.8*z; g.stroke();
  // inner facets
  g.strokeStyle=on?'rgba(255,230,235,0.35)':'rgba(255,255,255,0.06)'; g.lineWidth=1.1*z;
  g.beginPath(); g.moveTo(x,y-h); g.lineTo(x,y+h); g.moveTo(x-w*0.62,y-h*0.42); g.lineTo(x+w*0.38,y+h*0.08);
  g.moveTo(x+w*0.62,y-h*0.42); g.lineTo(x-w*0.38,y+h*0.08); g.stroke();
  if(on){
    g.fillStyle='rgba(255,210,220,'+(0.35+b*0.25)+')';
    g.beginPath(); g.moveTo(x-w*0.12,y-h*0.72); g.lineTo(x+w*0.22,y-h*0.28); g.lineTo(x-w*0.04,y-h*0.12); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(x-w*0.14,y-h*0.42,w*0.10,h*0.08, -0.5,0,TAU); g.fill();
  }
  return b;
}

function drawCarvedArch(g,z,W,H,stone){
  // stepped stone doorway: outer, mid, inner
  const tiers=[{w:W,h:H,c:stone},{w:W*0.82,h:H*0.86,c:shade(stone,-0.08)},{w:W*0.64,h:H*0.72,c:shade(stone,-0.16)}];
  for(const t of tiers){
    g.beginPath();
    g.moveTo(-t.w,-8*z); g.lineTo(-t.w,-t.h*0.62); g.quadraticCurveTo(-t.w*0.15,-t.h*1.08,0,-t.h);
    g.quadraticCurveTo(t.w*0.15,-t.h*1.08,t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath();
    sc(g,t.c,-t.h,-8*z,2.4);
    g.fillStyle='rgba(0,0,0,0.22)';
    g.beginPath(); g.moveTo(2*z,-8*z); g.lineTo(2*z,-t.h*0.9); g.lineTo(t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath(); g.fill();
  }
  // block courses
  g.strokeStyle='rgba(12,8,6,0.45)'; g.lineWidth=1.5*z;
  for(let i=1;i<6;i++){
    const yy=-8*z-i*(H/7);
    g.beginPath(); g.moveTo(-W*0.92,yy); g.lineTo(W*0.92,yy); g.stroke();
  }
  // carved runes along the inner arch
  g.strokeStyle='rgba(220,190,140,0.22)'; g.lineWidth=1.3*z;
  for(let i=0;i<9;i++){
    const a=Math.PI+ i/8*Math.PI, rx=W*0.52, ry=H*0.72;
    const px=Math.cos(a)*rx, py=-H*0.28+Math.sin(a)*ry;
    g.beginPath(); g.arc(px,py,2.4*z,0,TAU); g.stroke();
  }
  // rim light on the crown of the arch
  g.strokeStyle='rgba(255,236,200,0.22)'; g.lineWidth=2.6*z;
  g.beginPath(); g.moveTo(-W,-H*0.62); g.quadraticCurveTo(0,-H*1.08,W,-H*0.62); g.stroke();
}

/* ---------------------------- props ---------------------------- */
function drawProp(g,p,pal){
  if(!p||p.gone||p.taken) return;
  const s=w2s(p.x,p.y), z=ZOOM;
  if(p.k==='rubydoor'){
    const img=propAnimImg(p);
    const H=rubyDoorH();
    const half=rubyDoorHalf();
    const yPlane=rubyDoorPlaneY(p);
    const sx=w2s(p.x, yPlane);
    drawIsoPlaneImg(g, img, p.x-half, yPlane, p.x+half, yPlane, H);
    emit(sx.x,sx.y-H*0.42,28*z,'#ff2a3c',0.95);
    ray(sx.x,sx.y-H*0.55,34*z,'#ff4058',0.48);
    return;
  }
  if(p.k==='dwarfface'){
    const img=propAnimImg(p);
    const H=dwarfFaceH();
    const half=dwarfFaceHalf();
    const yPlane=rubyDoorPlaneY(p);
    /* Wall-plane carving. stroke:0 so the iso quad does not box a leftover masonry tile. */
    drawIsoPlaneImg(g, img, p.x-half, yPlane, p.x+half, yPlane, H, {stroke:0});
    return;
  }
  if(timberOnDwarfMouthLane(p) || billboardCoversDwarfMouth(p)) return;
  g.save(); g.translate(s.x,s.y);
  if(p.k==='dust'){
    drawFloorDust(g,p,z);
    g.restore(); return;
  }
  if(p.k==='timber' && p.fallen){
    drawFallenBeam(g,p,z);
    g.restore(); return;
  }
  if(p.k==='web'){
    const img=TEX.web;
    if(img){
      const w=86*z, h=70*z;
      g.globalAlpha=0.82;
      g.drawImage(img, -w/2, -h*0.72, w, h);
      g.globalAlpha=1;
    }
    g.strokeStyle='rgba(236,228,214,0.55)'; g.lineWidth=1.2*z; g.lineCap='round';
    for(let i=0;i<8;i++){
      const a=i/8*TAU+p.x*0.2, r=22*z+i*2.2*z;
      g.beginPath(); g.moveTo(0,-8*z); g.lineTo(Math.cos(a)*r, Math.sin(a)*r*0.58-10*z); g.stroke();
    }
    g.restore(); return;
  }
  const img=(p.k==='stone')?null:propAnimImg(p);
  if(img){
    if(p.k==='stairs') drawStairWell(g,z,p);
    else softShadow(g,2*z,1*z,18*z,8*z,.45);
    const metric=tilesetPropMetric(p.k);
    if(metric) drawObjectProp(g,img,propSpriteH(p,z),metric);
    else drawBillboard(g,img,propSpriteH(p,z));
    const k=p.k;
    if(k==='lantern'){
      const fl=1+Math.sin(G.elapsed*7+p.x)*.13;
      emit(s.x+6*z,s.y-38*z,24*z*fl,'#ffc571',1);
      ray(s.x+6*z,s.y-32*z,48*z,'#ffb45c',0.85);
    }else if(k==='brazier'){
      const fl=1+Math.sin(G.elapsed*9+p.x*3)*.18;
      emit(s.x,s.y-26*z,40*z*fl,'#ff9a44',1.1);
      ray(s.x,s.y-20*z,58*z,'#ff8a3a',0.8);
      if(QUALITY && Math.random()<0.18) G.parts.push({x:p.x,y:p.y,z:0.6,vx:rnd(.25,-.25),vy:rnd(.25,-.25),vz:rnd(2.6,1.2),
        life:rnd(1.5,.7),max:1.5,c:'#ffab52',s:rnd(2.4,1),amb:1});
    }else if(k==='rubywall'||k==='rubydoor'){
      const on=k==='rubydoor'||!(G.lvl&&G.lvl.flags.cleared);
      if(on){ emit(s.x,s.y-42*z,54*z,'#ff2a3c',1.05); ray(s.x,s.y-52*z,48*z,'#ff4058',0.55); }
    }else if(k==='stairs'){
      const b=.55+Math.sin(G.elapsed*3.6+p.x)*.22;
      emit(s.x,s.y-8*z,52*z,'#1a0c08',0.55);
      emit(s.x-10*z,s.y-36*z,28*z,'#ffb45c',0.72+b*0.12);
      emit(s.x+16*z,s.y-34*z,26*z,'#ffb45c',0.68);
      emit(s.x+8*z,s.y+6*z,18*z,'#ff9a44',0.55);
      ray(s.x,s.y-16*z,64*z,'#ffb45c',0.32);
    }else if(k==='bronzedoor'){
      const b=.55+Math.sin(G.elapsed*2.4)*.2;
      emit(s.x,s.y-54*z,92*z,'#d4a04a',b);
      emit(s.x-10*z,s.y-70*z,22*z,'#ff2a3c',0.45);
    }else if(k==='bell'){
      emit(s.x,s.y-28*z,22*z,'#d4a04a',0.45);
    }else if(k==='lift'){
      const on=G.lvl&&(G.lvl.flags.elevReady||G.lvl.n===2);
      if(on){ const b=.5+Math.sin(G.elapsed*4)*.25; emit(s.x,s.y-6*z,110*z,'#ffc061',b);
        ray(s.x,s.y-90*z,90*z,'#ffcf7a',0.7); }
    }else if(k==='rubypillar'){
      const b=.55+Math.sin(G.elapsed*3.2+p.x)*.25;
      emit(s.x,s.y-52*z,52*z,'#ff2a3c',0.95+b*0.2);
      ray(s.x,s.y-58*z,44*z,'#ff4058',0.55);
    }else if(k==='craftstation'){
      const stoked=(p.sprung||0)>0;
      const fl=1+Math.sin(G.elapsed*(stoked?11:7)+p.x)*.18;
      emit(s.x+6*z,s.y-28*z,(stoked?48:34)*z*fl,'#ff9a44',stoked?1.05:0.72);
      emit(s.x-10*z,s.y-36*z,(stoked?22:14)*z*fl,'#ffc061',stoked?0.7:0.42);
      if(stoked) ray(s.x,s.y-24*z,52*z,'#ffb45c',0.45);
      if(QUALITY && Math.random()<(stoked?0.22:0.08)) G.parts.push({x:p.x,y:p.y,z:0.55,vx:rnd(.22,-.22),vy:rnd(.22,-.22),vz:rnd(2.2,1.0),
        life:rnd(1.3,.6),max:1.3,c:'#ffab52',s:rnd(2.2,1),amb:1});
    }else if(k==='altar'){
      const b=.4+Math.sin(G.elapsed*1.8)*.2;
      emit(s.x,s.y-14*z,46*z,'#c81824',0.5*b+0.3);
    }else if(k==='throne'){
      emit(s.x,s.y-136*z,40*z,'#ffd24a',0.4);
    }else if(k==='trap'&&p.trap==='trap_runes'){
      emit(s.x,s.y-8*z,28*z,'#c07bff',0.55);
    }
    g.restore(); return;
  }
  switch(p.k){
  case 'stairs':
    drawStairWell(g,z,p);
    break;
  case 'rubble':{
    const fb=SPR[p.spr||'rubble']||SPR.rubble||SPR.rubble2||SPR.boulder||SPR.cavein;
    if(fb){ softShadow(g,2*z,1*z,22*z,9*z,.5); drawBillboard(g,fb,propSpriteH(p,z)); break; }
    drawRubbleLocal(g, z*(p.s||1.35), p.n||14, p.seed||0, 0);
    break; }
  case 'stone':{

function drawLoot(g,pile){
  const s=w2s(pile.x,pile.y), z=ZOOM;
  const pulse=.62+Math.sin(G.elapsed*4.2+(pile.x||0)*3)*.28;
  g.save(); g.translate(s.x,s.y);
  softShadow(g,0,2*z,14*z,7*z,.5);
  let img=null, h=46*z;
  if(pile.kind==='axe'){ img=SPR.shadowcleaver||SPR.icon_sword; h=54*z; }
  else if(pile.kind==='key'){ img=SPR.dwarfkey||SPR.loot_jewelry; h=42*z; }
  else if(pile.kind==='ruby'){ img=SPR.loot_ruby_shard||SPR.loot_ruby; h=28*z; }
  else if(pile.kind==='ore'){ img=SPR.loot_ore; h=38*z; }
  else if(pile.kind==='herb' || (pile.herbs && Object.keys(pile.herbs).length)){ img=SPR.loot_herbs||SPR.loot_potion; h=48*z; }
  else if(pile.kind==='potion' || ((pile.potions||[]).length && !(pile.coins&&((pile.coins.gp||0)+(pile.coins.pp||0)+(pile.coins.sp||0))))){ img=SPR.loot_potion||SPR.loot_chest; h=48*z; }
  else if(pile.kind==='jewels' || pile.jew || ((pile.items||[]).some(it=>/ring|amulet|jewel|necklace|torque/i.test(it.n||it.k||'')))){ img=SPR.loot_jewelry||SPR.loot_gems; h=44*z; }
  else if((pile.gems||((pile.items||[]).some(it=>it.k==='gem'))) && SPR.loot_gems){ img=SPR.loot_gems; h=46*z; }
  else if(SPR.loot_chest && pile.coins && ((pile.coins.gp||0)+(pile.coins.pp||0)>8)){ img=SPR.loot_chest; h=56*z; }
  else if(SPR.loot_coins){ img=SPR.loot_coins; h=46*z; }
  else img=SPR.sack;
  if(img && img.width && drawBillboard(g, img, h)){
    const glow=pile.kind==='ruby'?'#ff2a3c':(pile.glow||'#ffd27a');
    emit(s.x,s.y-h*0.35,12*z*pulse,glow, pile.kind==='ruby'?0.85:0.75);
    if(pile.kind==='ruby') ray(s.x,s.y-h*0.4,12*z,'#ff4058',0.4);
  } else if(pile.kind==='ruby'){
    drawFacetGem(g,0,-6*z,8*z,10*z,1,z);
    emit(s.x,s.y-6*z,12*z*pulse,'#ff2a3c',0.85);
  } else if(pile.kind==='ore'){
    g.fillStyle=RESMETA.ironstone.c;
    g.beginPath(); g.moveTo(-6*z,-4*z); g.lineTo(0,-12*z); g.lineTo(7*z,-3*z); g.lineTo(3*z,4*z); g.lineTo(-5*z,3*z); g.closePath(); g.fill();
  } else {
    g.fillStyle='#e0c169';
    g.beginPath(); g.ellipse(0,0,10*z,6*z,0,0,TAU); g.fill();
  }
  g.restore();
}

    g.beginPath(); g.moveTo(sgn<0?-10*z:1*z,-2*z+off); g.lineTo(sgn<0?-1*z:10*z,-2*z+off);
    g.lineTo(sgn<0?0:11*z,3*z+off); g.lineTo(sgn<0?-11*z:0,3*z+off); g.closePath();
    sc(g,'#2a2218',-2*z+off,3*z+off,1.3); }
  g.beginPath(); g.moveTo(-11*z,-38*z); g.lineTo(11*z,-38*z); g.lineTo(9*z,-14*z); g.lineTo(-9*z,-14*z); g.closePath();
  sc(g,'#5a6e3a',-38*z,-14*z,1.8);
  g.beginPath(); g.rect(-10*z,-20*z,20*z,8*z); sc(g,'#6a4a2a',-20*z,-12*z,1.4);
  g.beginPath(); g.ellipse(0,-48*z,10*z,9.4*z,0,0,TAU); sc(g,'#6a8a4a',-58*z,-38*z,1.7);
  for(const sgn of [-1,1]){
    g.beginPath(); g.moveTo(sgn*8*z,-50*z); g.quadraticCurveTo(sgn*18*z,-52*z,sgn*16*z,-44*z);
    g.quadraticCurveTo(sgn*10*z,-46*z,sgn*8*z,-48*z); g.closePath(); sc(g,'#5a7a3a',-52*z,-44*z,1.3); }
  g.fillStyle='#1a120c';
  g.beginPath(); g.ellipse(-3.6*z,-50*z,1.7*z,2.2*z,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(3.6*z,-50*z,1.7*z,2.2*z,0,0,TAU); g.fill();
  g.fillStyle='#c9a070';
  g.beginPath(); g.moveTo(-2*z,-46*z); g.lineTo(2*z,-46*z); g.lineTo(0,-42*z); g.closePath(); g.fill();
  g.save(); g.translate(10*z,-32*z); g.rotate(-.4+sw*2.1);
  g.beginPath(); g.rect(-1.2*z,-2.4*z,16*z,4.6*z); sc(g,'#6a5340',-2.4*z,2.2*z,1.2);
  g.beginPath(); g.moveTo(14*z,-6*z); g.lineTo(26*z,-1*z); g.lineTo(14*z,5*z); g.closePath(); sc(g,'#8a9088',-6*z,5*z,1.3);
  g.restore();
}

function drawEnt(g,e){
  if(e.hidden) return;
  /* Living Macar: one after-grain source-over blit only. Do not paint him
     here — gold disc / lighter flash / fringe sheets were the sparkle outline. */
  if(e.hero && !e.dead && !e.ghost) return;
  if(e.ghost && e.dead) return;
  const s=w2s(e.x,e.y), z=ZOOM*e.scale;
  g.save(); g.translate(s.x,s.y);
  const deadSpr=e.crushed && SPR[(e.col&&e.col.key)+'_dead'];
  if(e.sleeping){ g.translate(8*z, 6*z); g.rotate(1.18); }
  if(e.crushed && !deadSpr){ g.translate(6*z, 26*z); g.rotate(1.22); }
  g.globalAlpha=1;
  const deadImg = (e.dead||e.crushed) ? (deadSpr || SPR[entSpriteKey(e)+'_dead']) : null;
  if(e.dead && !e.crushed && !deadImg){
    g.translate(0,8); g.rotate(0.9);
  }
  const p=player();
  if(!e.dead&&p&&p.aim===e){
    const b=.45+Math.sin(G.elapsed*7)*.2;
    g.strokeStyle='rgba(255,90,70,'+b+')'; g.lineWidth=2.6*ZOOM;
    g.beginPath(); g.ellipse(0,0,20*z,10*z,0,0,TAU); g.stroke();
    g.strokeStyle='rgba(255,140,110,'+(b*0.5)+')'; g.lineWidth=1.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,24*z,12*z,0,0,TAU); g.stroke();
  }
  if(!e.dead && e.team==='foe' && (e.atk>0 || (e.engaged && e.ct>0 && e.ct<0.4))){
    const winding=e.atk>0?attackProgress(e)<0.55:true;
    const b=.50+Math.sin(G.elapsed*9)*.28;
    g.strokeStyle='rgba(255,72,48,'+(winding?b:b*0.42)+')';
    g.lineWidth=(winding?3.4:1.8)*ZOOM;
    g.beginPath(); g.ellipse(0,0,20*z,10*z,0,0,TAU); g.stroke();
    if(winding){
      g.strokeStyle='rgba(255,160,90,'+(b*0.55)+')'; g.lineWidth=1.5*ZOOM;
      g.beginPath(); g.ellipse(0,0,24*z,12*z,0,0,TAU); g.stroke();
    }
  }
  /* Living Macar gold foot ellipse / QUALITY radial disc removed — fringe
     let that gold show through as a sparkle outline. Ghosts never got it. */
  const img=solidDwarfSprite(e, entAnimImg(e));
  const bob0=(img && e.moving && !e.dead)?Math.sin((e.gait||0)*TAU)*1.6*z:0;
  if(!e.dead && !e.crushed){
    softShadow(g,2.5*z,1*z,17*z,8*z,0.52);
  } else {
    softShadow(g,1*z,3*z,22*z,10*z,0.55);
  }

  const flip=wantsSpriteFlip(e);
  const sw=e.atk>0?Math.sin((1-e.atk/e.atkMax)*Math.PI):0;
  const squash=img?1:(1+sw*0.06);
  if(e.hero && !e.dead){ g.globalAlpha=1; g.globalCompositeOperation='source-over'; }
  if(e.ghost && !e.dead) g.globalAlpha=0.84;
  g.save(); g.translate(0,-bob0); g.scale(img?1:(flip?-1:1),1); g.scale(1/squash,squash);
  if(deadImg && drawDeadBillboard(g,e,deadImg,z)){
    /* prone corpse sprite */
  } else if(!(img && drawEntBillboard(g,e,img,z,flip))){
    if(e.kind==='dwarf') drawDwarf(g,e,z,sw);
    else if(e.kind==='statue') drawStatue(g,e,z,sw);
    else if(e.kind==='spider') drawSpider(g,e,z,sw);
    else if(e.kind==='fungi') drawFungi(g,e,z,sw);
    else if(e.kind==='undead') drawUndead(g,e,z,sw,null);
    else if(e.kind==='warden') drawWarden(g,e,z,sw);
    else if(e.kind==='goblin') drawGoblin(g,e,z,sw);
    else if(e.kind==='gnome') drawGnome(g,e,z,sw);
    else if(e.kind==='king') drawKing(g,e,z,sw);
    else drawStatue(g,e,z,sw);
  }
  if(e.ghost && e.atk>0 && !e.dead && e.atkKind!=='bow') drawHeroMeleeArc(g,e,z);
  g.restore();
  if(e.ghost) g.globalAlpha=1;

  if(e.flash>0 && !e.dead && !(e.hero && !e.ghost)){ g.globalCompositeOperation='lighter'; g.globalAlpha=clamp(e.flash*3,0,1);
    g.fillStyle='#ffb894'; g.beginPath(); g.ellipse(0,-27*z,19*z,29*z,0,0,TAU); g.fill();
    g.globalCompositeOperation='source-over'; g.globalAlpha=1; }
  if((e.webbed||0)>0){
    const webImg=TEX.web;
    if(webImg){
      const ww=54*z, hh=48*z;
      g.globalAlpha=0.72;
      g.drawImage(webImg, -ww/2, -hh*0.95, ww, hh);
      g.globalAlpha=1;
    }
    g.strokeStyle='rgba(236,228,214,0.7)'; g.lineWidth=1.3*ZOOM;
    for(let i=0;i<5;i++){
      const a=i/5*TAU+G.elapsed;
      g.beginPath(); g.moveTo(Math.cos(a)*6*z,-18*z); g.lineTo(Math.cos(a)*22*z, Math.sin(a)*10*z-8*z); g.stroke();
    }
  }
  if(e.guard){ const b=.4+Math.sin(G.elapsed*8)*.2;
    g.strokeStyle='rgba(180,215,255,'+b+')'; g.lineWidth=2.8*ZOOM;
    g.beginPath(); g.ellipse(0,-27*z,24*z,32*z,0,0,TAU); g.stroke(); }
  if(e.buff>0){ g.strokeStyle='rgba(255,205,110,0.6)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,19*z,9*z,0,0,TAU); g.stroke(); }
  g.restore();

  /* No free-floating glow globes above foes / ghosts. Baked lantern light stays. */

  if(!e.dead&&(e.ally||e.ghost)&&e.hp<e.maxhp){
    const w=32*ZOOM,h=3.6*ZOOM, yy=s.y-48*ZOOM*e.scale;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(s.x-w/2-1,yy-1,w+2,h+2);
    ctx.fillStyle='#6ecf6a'; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
  }

  if(!e.dead&&e.team==='foe'&&(e.hp<e.maxhp||e.boss)){
    const w=(e.boss?122:38)*ZOOM,h=(e.boss?8:4.4)*ZOOM, yy=s.y-(e.boss?106:62)*ZOOM*e.scale;
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(s.x-w/2-1.5,yy-1.5,w+3,h+3);
    const bg=ctx.createLinearGradient(0,yy,0,yy+h);
    bg.addColorStop(0,e.boss?'#f04a42':'#c9382c'); bg.addColorStop(1,e.boss?'#8d1512':'#6d1712');
    ctx.fillStyle=bg; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
    ctx.strokeStyle='rgba(255,220,180,0.4)'; ctx.lineWidth=1; ctx.strokeRect(s.x-w/2,yy,w,h);
    if(e.boss){ ctx.font='800 '+(13*ZOOM)+'px "Trebuchet MS",sans-serif'; ctx.textAlign='center';
      ctx.lineWidth=3*ZOOM; ctx.strokeStyle='rgba(0,0,0,0.8)';
      ctx.strokeText(e.name,s.x,yy-7*ZOOM);
      ctx.fillStyle='#f6e2b6'; ctx.fillText(e.name,s.x,yy-7*ZOOM); ctx.textAlign='left'; }
  }
  if(e.crushed){
    ctx.strokeStyle='rgba(255,214,140,0.9)'; ctx.lineWidth=2.2*ZOOM;
    ctx.beginPath(); ctx.ellipse(s.x, s.y+2*ZOOM, 22*ZOOM, 11*ZOOM, 0, 0, TAU); ctx.stroke();
    ctx.font='800 '+(12*ZOOM)+'px '+FONT_TITLE; ctx.textAlign='center';
    const tag=e.name||'Kin';
    ctx.lineWidth=4*ZOOM; ctx.strokeStyle='rgba(0,0,0,0.88)';
    ctx.strokeText(tag,s.x,s.y-34*ZOOM);
    ctx.fillStyle='#ffe7b8'; ctx.fillText(tag,s.x,s.y-34*ZOOM); ctx.textAlign='left';
  }
  if(!e.dead&&e.npc&&e.name){
    ctx.font='700 '+(10*ZOOM)+'px "Trebuchet MS",sans-serif'; ctx.textAlign='center';
    const label=e.tied?e.name+'  (bound)':e.sleeping?e.name+'  (asleep)':e.name;
    ctx.lineWidth=3*ZOOM; ctx.strokeStyle='rgba(0,0,0,0.75)';
    ctx.strokeText(label,s.x,s.y-52*ZOOM*e.scale);
    ctx.fillStyle='#ffe08a'; ctx.fillText(label,s.x,s.y-52*ZOOM*e.scale); ctx.textAlign='left';
  }
}

function drawBeard(g,z,c,len,braids){
  g.beginPath(); g.moveTo(-11.5*z,-40*z);
  g.quadraticCurveTo(-16.5*z,-40*z+len*.52*z,-6*z,-40*z+len*z);
  g.quadraticCurveTo(0,-40*z+len*1.18*z,6*z,-40*z+len*z);
  g.quadraticCurveTo(16.5*z,-40*z+len*.52*z,11.5*z,-40*z); g.closePath();
  sc(g,c.beard,-42*z,-40*z+len*1.12*z,1.6);
  g.fillStyle='rgba(0,0,0,0.28)';
  g.beginPath(); g.moveTo(-2.2*z,-40*z); g.lineTo(2.2*z,-40*z); g.lineTo(1.2*z,-40*z+len*1.04*z);

  } else {
    const fxKey=({bolt:'fx_bolt',flame:'fx_flame',hex:'fx_hex',spit:'fx_spit',spore:'fx_spit',wisp:'fx_wisp',bomb:'fx_bomb',heal:'fx_heal',charm:'fx_hex',fear:'fx_wisp',death:'fx_hex',fire:'fx_flame'})[s.kind]||'fx_bolt';
    const img=SPR[fxKey];
    if(img&&img.width){
      const hh=28*z, ww=hh*(img.width/img.height);
      g.rotate(s.spin||0);
      g.drawImage(img,-ww/2,-hh/2,ww,hh);
    } else {
      const gr=g.createRadialGradient(0,0,1,0,0,14*z);
      gr.addColorStop(0,s.col); gr.addColorStop(1,'rgba(0,0,0,0)');

  g.restore();

}

function craftPropLabel(pr){
  const spec=CRAFT_PROP[pr.k];
  return (spec&&spec.label)||('Scavenge '+pr.k);
}
function nearestCraftProp(e,maxd){
  let best=null, bd=maxd||1.35;
  for(const pr of (G.props||[])){
    if(pr.gone||pr.taken) continue;
    if(!CRAFT_PROP[pr.k] && !pr.craft) continue;
    if(!CRAFT_PROP[pr.k]) continue;
    const d=Math.hypot(e.x-pr.x,e.y-pr.y);
    if(d<bd){ bd=d; best=pr; }
  }
  return best;
}
function scavengeCraft(pr){
  if(!pr||pr.taken||pr.gone) return;
  const spec=CRAFT_PROP[pr.k]; if(!spec) return;
  const roll=spec.rolls[(Math.random()*spec.rolls.length)|0];
  const [res,n]=roll;
  const bonus=Math.max(0, skillLvl(spec.skill)-1);
  const got=n+(bonus&&Math.random()<0.28?1:0);
  gain(res, got);
  learn(spec.skill, 2+((got>1)?1:0));
  pr.taken=1; pr.gone=1;
  ftext(pr.x,pr.y,'+'+got+' '+(RESMETA[res]?RESMETA[res].n:res), RESMETA[res]?RESMETA[res].c:'#ffd27a');
  say((RESMETA[res]?RESMETA[res].n:res)+' for the craft — '+SKILLS.find(s=>s.k===spec.skill).n+'.','#cfe0ea');
  burst(pr.x,pr.y, RESMETA[res]?RESMETA[res].c:'#ffd27a', 10, 1.8);
}
function placeCraftCaches(L){
  if(!L||!L.grid) return;
  G.props=G.props||[];
  const seed=L.dressSeed||1;
  const kits={
    1:[['orepile',3],['timber',2],['pickpile',1],['bones',1]],
    2:[['web',3],['eggs',2],['orepile',1],['timber',1],['bones',1]],
    3:[['bones',2],['hidepile',2],['timber',1],['orepile',1],['crystal',1]],
    4:[['slime',2],['bones',2],['hidepile',1]],
    5:[['crystal',2],['bones',1],['hidepile',1],['roots',1]]
  };
  const want=(kits[L.n]||kits[1]).filter(x=>x[1]>0);
  const floors=[];
  for(let y=2;y<L.h-2;y++) for(let x=2;x<L.w-2;x++){
    const t=L.grid[y][x];
    if(t!==0 && t!==3) continue;
    floors.push({x:x+0.5,y:y+0.5});
  }
  if(!floors.length) return;
  const keep=[];
  G.props.forEach(p=>keep.push({x:p.x,y:p.y,r:1.15}));
  if(L.spawn) keep.push({x:L.spawn.x,y:L.spawn.y,r:2.0});
  want.forEach((pair,wi)=>{
    const [k,n]=pair;
    for(let i=0;i<n;i++){
      let placed=0, tries=0;
      while(!placed && tries<40){
        tries++;
        const f=floors[((h3(wi*17+i*9, tries*5, seed)*floors.length)|0)];
        if(!f) continue;
        let ok=1;
        for(let j=0;j<keep.length;j++){
          if(Math.hypot(keep[j].x-f.x,keep[j].y-f.y)<keep[j].r){ ok=0; break; }
        }
        if(!ok) continue;
        if(L.n===1 && nearCrush(f.x,f.y,1.2)) continue;
        G.props.push({x:f.x,y:f.y,k,s:0.9+h3(f.x,f.y,seed)*0.25,seed:seed+wi*30+i,dress:1,craft:1});
        keep.push({x:f.x,y:f.y,r:1.35});
        placed=1;
      }
    }
  });
}
function addCraftStation(x,y,seed,L){
  G.props=G.props||[];
  if((G.props||[]).some(p=>p&&p.k==='craftstation')) return null;
  G.props.push({x,y,k:'craftstation',s:1.05,seed:seed||1,station:1});
  const lvl=L||G.lvl;
  if(lvl&&lvl.lights) lvl.lights.push({x,y,c:'#ffc061',r:3.6,f:0.72});
}
function placeCraftStations(L){
  if(!L||!L.grid) return;
  G.props=G.props||[];
  const CS=typeof CraftStation!=='undefined'?CraftStation:null;
  const plan=CS&&CS.planPlacement?CS.planPlacement(L.n, G.props):null;
  if(!plan) return;
  let x=plan.x, y=plan.y;
  const walk=t=>t===0||t===3;
  const tile=(tx,ty)=>{ const g=L.grid[ty|0]; return g?g[tx|0]:1; };
  if(!walk(tile(x,y))){
    let found=0;
    for(let r=1;r<=4&&!found;r++){
      for(let dy=-r;dy<=r&&!found;dy++) for(let dx=-r;dx<=r&&!found;dx++){
        const nx=x+dx, ny=y+dy;
        if(walk(tile(nx,ny))){ x=nx+0.5; y=ny+0.5; found=1; }
      }
    }
    if(!found) return;
  }
  addCraftStation(x,y,plan.seed,L);
}

  const power=dmg*(1+skillLvl('mining')*0.14);
  r.hp-=power;
  burst(t.i+0.5,t.j+0.5,'#8f7757',7,2.2);
  ftext(t.i+0.5,t.j+0.5,'-'+Math.round(power),'#d8c49a');
  wear(e.gear,0.5,0);
  if(r.hp<=0) breakRock(L,t.i,t.j);
  return true;
}

/* ==========================================================================
   BOMBS  -  select, aim, throw. 10d10 in a radius, and it opens rock.
   ========================================================================== */
function bombDamage(){ let d=0; for(let i=0;i<10;i++) d+=ri(1,10);
  return Math.round(d*(1+skillLvl('bomb')*0.10)); }
function burpDamage(){ return Math.round(rollDice(3,10)*(1+skillLvl('bomb')*0.10)); }
function bombRadius(){ return 2.7+skillLvl('bomb')*0.06; }
function burpRadius(){ return 1.8+skillLvl('bomb')*0.04; }
function nextThrowKind(){
  if(partyCount('bombs')>0) return 'bomb';
  if(partyCount('burps')>0) return 'burp';
  return null;
}
function throwRadius(kind){ return kind==='burp'?burpRadius():bombRadius(); }
function throwBomb(){
  const p=player(); if(!p||!G.aim) return;
  let kind=null;
  if(G.packPrefer){
    const pk=packOf(G.packPrefer);
    if((pk.bombs||0)>0) kind='bomb';
    else if((pk.burps||0)>0) kind='burp';
  }
  if(!kind) kind=nextThrowKind();
  if(!kind){
    hint(partyCount('bombKit')?'No bombs in the packs.':'No bombs. Rouse the red hat — the ghost sapper packs two a day.',2.2);
    return;
  }
  const took=kind==='bomb'?takeFromPacks('bombs', G.packPrefer):takeFromPacks('burps', G.packPrefer);
  if(!took){
    hint(partyCount('bombKit')?'No bombs in the packs.':'No bombs. Rouse the red hat — the ghost sapper packs two a day.',2.2);
    return;
  }
  const a=ang(G.aim.x-p.x, G.aim.y-p.y);
  p.fdx=Math.cos(a); p.fdy=Math.sin(a);
  G.thrown.push({sx:p.x,sy:p.y,tx:G.aim.x,ty:G.aim.y,x:p.x,y:p.y,t:0,dur:0.62,fuse:0.55,state:0,spin:0,kind});
  if(kind==='burp') say("PORDUM: Borga's Burp. Don't sniff the cork.",'#d2bd63');
  else say('A bomb from the packs. Fuse lit.','#ffb45c');
  G.aim=null;
  learn('bomb',2);
}
function explode(x,y,kind){
  const burp=kind==='burp';
  const dmg=burp?burpDamage():bombDamage(), R=burp?burpRadius():bombRadius();
  const dice=burp?'3d10':'10d10';
  shake(burp?18:30); G.flash={c:burp?'#ffe08a':'#ffd9a0',a:burp?0.38:0.55};
  burst(x,y,burp?'#d2bd63':'#ffd27a',burp?36:60,burp?4.4:7);
  burst(x,y,burp?'#c9783a':'#ff7a3a',burp?22:44,burp?3.2:5);
  for(let i=0;i<(burp?5:8);i++) addDecal(x+rnd(1.8,-1.8),y+rnd(1.8,-1.8),rnd(burp?1.2:1.8,0.8));
  ftext(x,y-0.6,dice+' = '+dmg, burp?'#d2bd63':'#ffd27a',1);
  for(const e of G.ents){
    if(e.dead) continue;
    const d=dist(e,{x,y}); if(d>R+e.r) continue;
    const f=clamp(1-(d/R)*0.5,0.5,1);
    const own=e.team==='party'?0.5:1;
    damage(e, dmg*f*own, burp?'#d2bd63':'#ffcf7a');
    const a=ang(e.x-x,e.y-y); e.kx+=Math.cos(a)*(burp?2.2:3.2); e.ky+=Math.sin(a)*(burp?2.2:3.2);
  }
  const L=G.lvl;
  if(L){ const R2=Math.ceil(R)-0.4;
    for(let j=(y-R2)|0;j<=(y+R2);j++) for(let i=(x-R2)|0;i<=(x+R2);i++){
      if(Math.hypot(i+0.5-x,j+0.5-y)>R2) continue;
      if(diggable(L,i,j)){ const r=rockAt(L,i,j); r.hp-=dmg*(burp?0.55:0.9); if(r.hp<=0) breakRock(L,i,j); } } }
}
function updateBombs(dt){
  for(const b of G.thrown){
    b.spin+=dt*9;
    if(b.state===0){
      b.t+=dt/b.dur;
      const f=clamp(b.t,0,1);
      b.x=lerp(b.sx,b.tx,f); b.y=lerp(b.sy,b.ty,f);
      b.arc=Math.sin(f*Math.PI)*2.6;
      if(b.t>=1){ b.state=1; b.arc=0; }
    } else { b.fuse-=dt;
      if(b.fuse<=0 && !b.done){ b.done=1; explode(b.x,b.y,b.kind); } }
  }
  G.thrown=G.thrown.filter(b=>!b.done);
}

function makeCraftingBridge(){
  return {
    getResource(id){ return (G.res&&G.res[id])||0; },
    spendResources(cost){
      if(!afford(cost)) return false;
      spend(cost);
      return true;
    },
    applyOutput(recipe){
      const out=recipe.output;
      if(!out) return;
      if(out.kind==='potion' && out.item) givePotion(out.item, true);
      else if((out.kind==='weapon'||out.kind==='armor'||out.kind==='magic') && out.item)
        giveMagic(magItem(out.item), true);
      else if(out.kind==='pack' && out.field)
        addToPack(out.packKey||'macar', out.field, out.count||1);
      syncPackTotals();
    },
    skillLevel(k){ return skillLvl(k); },
    learnSkill(k,n){ learn(k,n); }
  };
}
function campActionReady(a){
  if(a.craftRecipeId && window.CraftingEngine)
    return CraftingEngine.canCraft(a.craftRecipeId, makeCraftingBridge()).ok;
  return afford(a.cost);
}
function runCampAction(a){
  if(a.craftRecipeId && window.CraftingEngine){
    const r=CraftingEngine.craftItem(a.craftRecipeId, makeCraftingBridge());
    if(r.ok) say(r.message, a.grp==='FORGE'?'#ffd27a':'#d2bd63');
    else say(r.message, '#ff6a6a');
    return;
  }
  if(afford(a.cost)){ spend(a.cost); a.fn(); }
}
function recipeToAction(recipe){
  return {
    grp: recipe.group||'CRAFT',
    t: recipe.name,
    cost: recipe.ingredients,
    info: recipe.info||'',
    craftRecipeId: recipe.id,
    sapper: !!recipe.sapper,
    fn: function(){}

}
function craftBenchActions(){
  if(!window.CraftingEngine) return [];
  const ids=G.craftRecipeIds;
  if(ids&&ids.length){
    return ids.map(id=>CraftingEngine.get(id)).filter(Boolean).map(recipeToAction);
  }
  return CraftingEngine.stationPool().map(recipeToAction);
}
function leaveCraft(){
  if(G.craftStation) G.craftStation.sprung=0;

function openCraftBench(station){
  const p=player(); if(!p) return;
  if(G.scene==='craft'){ leaveCraft(); return; }
  if(foesVisible()){ hint('Not while enemies are in sight.',2.6); return; }

  G.craftFrom=G.scene==='play'?'play':G.scene;

function roundPath(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }
function carveFrame(g,x,y,w,h,r,a){
  x=+x; y=+y; w=+w; h=+h;
  if(!isFinite(x)||!isFinite(y)||!isFinite(w)||!isFinite(h)||w<=0||h<=0) return;
  r=Math.min(r||7,w/2,h/2);
  if(!isFinite(r)||r<0) r=0;
  g.fillStyle='rgba(8,6,5,'+(a===undefined?0.84:a)+')'; roundPath(g,x,y,w,h,r); g.fill();
  if(!QUALITY){
    g.strokeStyle='rgba(214,176,112,0.5)'; g.lineWidth=1.5; roundPath(g,x+1,y+1,w-2,h-2,r); g.stroke();
    return;
  }
  if(h<0.5) return;
  const ig=g.createLinearGradient(x,y,x,y+h);
  ig.addColorStop(0,'rgba(48,36,24,0.55)'); ig.addColorStop(1,'rgba(14,10,8,0.35)');
  g.fillStyle=ig; roundPath(g,x+3,y+3,w-6,h-6,Math.max(2,r-2)); g.fill();
  g.strokeStyle='rgba(214,176,112,0.62)'; g.lineWidth=1.8; roundPath(g,x+1,y+1,w-2,h-2,r); g.stroke();
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1.15; roundPath(g,x+4.5,y+4.5,w-9,h-9,Math.max(1,r-3)); g.stroke();
  g.fillStyle='rgba(196,158,88,0.75)';
  const d=5.5;
  [[x+d,y+d],[x+w-d,y+d],[x+d,y+h-d],[x+w-d,y+h-d]].forEach(p=>{
    g.beginPath(); g.arc(p[0],p[1],2.05,0,TAU); g.fill();
  });
}
function plate(g,x,y,w,h,r,a){ carveFrame(g,x,y,w,h,r,a); }
function ellipsize(g, txt, maxW){
  txt=String(txt||'');
  if(!maxW || g.measureText(txt).width<=maxW) return txt;
  while(txt.length>1 && g.measureText(txt+'\u2026').width>maxW) txt=txt.slice(0,-1);
  return txt+'\u2026';
}
function drawMenuWash(g){
  g.fillStyle='#0b0806'; g.fillRect(0,0,VW,VH);
  embers(g); darken(g,.50);
}
function drawThumb(g, img, x, y, sz, fill){
  carveFrame(g, x, y, sz, sz, 5, .92);
  g.save();
  roundPath(g, x+3, y+3, sz-6, sz-6, 3); g.clip();
  g.fillStyle=fill||'#1c140e'; g.fillRect(x,y,sz,sz);
  if(img&&img.width){
    const sc=Math.max((sz-8)/img.width,(sz-8)/img.height);
    const w=img.width*sc, h=img.height*sc;
    g.drawImage(img, x+sz/2-w/2, y+sz/2-h/2, w, h);
  }
  g.restore();
}
function drawChip(g, x, y, w, h, label, on, col){
  plate(g, x, y, w, h, 5, on?0.9:0.46);
  if(on){ g.strokeStyle=col||'rgba(255,208,124,0.72)'; g.lineWidth=1.5; roundPath(g,x,y,w,h,5); g.stroke(); }

function drawStockStrip(g, x, y, w, extra){
  const s=UIS;
  const keys=RES.filter(r=>(G.res[r]||0)>0 || (extra&&extra[r]));
  if(!keys.length) return 0;
  g.font='700 '+(PORT?10*s:11*s)+'px '+FONT_UI;
  const gap=8*s, pad=10*s, rh=PORT?28*s:26*s;
  let cx=x+pad, cy=y, rows=1;
  keys.forEach(r=>{

    g.fillText(label, cx+14*s, cy+rh*0.68);
    cx+=tw+gap;

  return rows*rh;
}

function drawMinimap(g,s){

  if(!MINI || MINI_KEY!==key){

function drawStickBase(g,s){
  const home=UI.stickHome;
  const k=IN.stick;
  const ox=(k&&k.moved)?k.ox:home.x, oy=(k&&k.moved)?k.oy:home.y, R=home.r;
  const active=!!(k&&k.moved);
  g.globalAlpha=active?1:.42;
  g.fillStyle='rgba(16,11,7,0.45)'; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.fill();
  g.strokeStyle='rgba(214,180,120,0.55)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.stroke();
  // 4 iso direction ticks
  g.strokeStyle='rgba(214,180,120,0.30)'; g.lineWidth=2*s;
  for(let i=0;i<4;i++){ const a=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(ox+Math.cos(a)*R*.6,oy+Math.sin(a)*R*.6);
    g.lineTo(ox+Math.cos(a)*R*.85,oy+Math.sin(a)*R*.85); g.stroke(); }
  let dx=0,dy=0;
  if(active){ dx=k.x-k.ox; dy=k.y-k.oy; const m=Math.hypot(dx,dy);
    if(m>R*.72){ dx=dx/m*R*.72; dy=dy/m*R*.72; } }
  g.fillStyle='rgba(236,214,168,0.62)'; g.beginPath(); g.arc(ox+dx,oy+dy,R*.42,0,TAU); g.fill();
  g.strokeStyle='rgba(255,236,192,0.85)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox+dx,oy+dy,R*.42,0,TAU); g.stroke();
  g.globalAlpha=1;
}

function icon(g,kind,x,y,s,col){

    g.fillRect(0,-12*s,12*s,10*s); }
  if(kind==='flask'){ g.beginPath(); g.moveTo(-3*s,-10*s); g.lineTo(-3*s,-3*s); g.lineTo(-7*s,7*s);
    g.quadraticCurveTo(-7*s,11*s,-3*s,11*s); g.lineTo(3*s,11*s); g.quadraticCurveTo(7*s,11*s,7*s,7*s);
    g.lineTo(3*s,-3*s); g.lineTo(3*s,-10*s); g.closePath(); g.stroke(); g.fillRect(-5*s,2*s,10*s,7*s); }
  if(kind==='shield'||kind==='defend'){
    g.beginPath(); g.arc(0,0.4*s,11*s,0,TAU); g.fillStyle='#8a93a0'; g.fill();

    g.beginPath(); g.arc(0,0.4*s,2.4*s,0,TAU); g.fillStyle='#cfd8e2'; g.fill();
    g.strokeStyle=col; g.fillStyle=col; g.lineWidth=2.3*s; }
  if(kind==='pick'){ g.beginPath(); g.moveTo(-9*s,10*s); g.lineTo(6*s,-5*s); g.stroke();

  if(kind==='sword'){ g.beginPath(); g.moveTo(-7*s,11*s); g.lineTo(8*s,-10*s); g.stroke();
    g.beginPath(); g.moveTo(-3*s,3*s); g.lineTo(4*s,9*s); g.stroke();

  if(kind==='bomb'){ g.beginPath(); g.arc(-1*s,3*s,8*s,0,TAU); g.stroke();

  if(kind==='pack'){
    g.beginPath(); g.moveTo(-8.5*s,-1*s); g.lineTo(-8.5*s,10*s); g.quadraticCurveTo(0,12.5*s,8.5*s,10*s);
    g.lineTo(8.5*s,-1*s); g.quadraticCurveTo(8.5*s,-8*s,0,-9*s); g.quadraticCurveTo(-8.5*s,-8*s,-8.5*s,-1*s); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(-8.5*s,-1*s); g.quadraticCurveTo(0,1.5*s,8.5*s,-1*s); g.stroke();
    g.beginPath(); g.moveTo(-6*s,-8.5*s); g.quadraticCurveTo(-11*s,-2*s,-6*s,9*s); g.stroke();
    g.beginPath(); g.moveTo(6*s,-8.5*s); g.quadraticCurveTo(11*s,-2*s,6*s,9*s); g.stroke(); }
  if(kind==='more'){
    g.beginPath(); g.arc(-6.2*s,0,2.15*s,0,TAU); g.fill();
    g.beginPath(); g.arc(0,0,2.15*s,0,TAU); g.fill();

  if(kind==='plant'){
    g.fillStyle='#3a7a3a'; g.beginPath(); g.moveTo(0,10*s); g.quadraticCurveTo(-8*s,2*s,0,-11*s);
    g.quadraticCurveTo(8*s,2*s,0,10*s); g.fill();
    g.strokeStyle=col; g.beginPath(); g.moveTo(0,10*s); g.lineTo(0,-4*s); g.stroke();
    g.fillStyle='#6aff8a'; g.beginPath(); g.ellipse(-5*s,-2*s,5*s,3*s,-0.6,0,TAU); g.fill();
    g.beginPath(); g.ellipse(5*s,-1*s,5*s,3*s,0.6,0,TAU); g.fill();

    g.beginPath(); g.moveTo(-10*s,7*s); g.quadraticCurveTo(-4*s,14*s,2*s,10*s); g.quadraticCurveTo(-2*s,6*s,-10*s,7*s); g.fill(); }
  if(kind==='campfire'){
    g.fillStyle='#c45a1a';
    g.beginPath(); g.moveTo(-8*s,8*s); g.lineTo(-2*s,10*s); g.lineTo(9*s,6*s); g.lineTo(4*s,3*s); g.closePath(); g.fill();
    g.fillStyle='#ffb45c';
    g.beginPath(); g.moveTo(0,8*s); g.quadraticCurveTo(-7*s,-2*s,0,-12*s); g.quadraticCurveTo(7*s,-2*s,0,8*s); g.fill();
    g.fillStyle='#ffe08a';

  if(kind==='craft'){
    g.fillStyle='#4a4038';
    g.fillRect(-10*s,8*s,20*s,4*s);
    g.fillStyle='#6a5340';
    g.fillRect(-8*s,4*s,16*s,5*s);
    g.fillStyle='#8a93a0';
    g.beginPath();
    g.moveTo(-9*s,4*s); g.lineTo(-9*s,-1*s); g.lineTo(-4*s,-4*s); g.lineTo(8*s,-4*s);
    g.lineTo(8*s,4*s); g.closePath(); g.fill();
    g.fillStyle=col;
    g.beginPath(); g.moveTo(-9*s,-1*s); g.lineTo(-12*s,-6*s); g.lineTo(-4*s,-4*s); g.closePath(); g.fill();
    g.fillStyle='#ffb45c';
    g.fillRect(-3*s,-6*s,8*s,2*s); }
  g.restore();
}

function slotAnimImg(b){
  const ico=b.ico||(b.key==='attack'?'sword':((ABIL.find(a=>a.key===b.key)||{}).ico));
  const k=ICON_SPR[ico];
  if(!k) return null;

}
function drawSlot(g,b,s){
  const R=b.r, x=b.x-R, y=b.y-R, w=R*2, h=R*2;
  const ab=ABIL.find(a=>a.key===b.key);
  const ready=!ab || !(ab.cd>0) || (cds[ab.key]||0)<=0;
  const atForge=b.key!=='craft' || (!foesVisible() && !!(player()&&nearestCraftStation(player(),1.7)));
  const ico=b.ico||(b.key==='attack'?'attack':(ab&&ab.ico));
  carveFrame(g,x,y,w,h,5,.92);
  if(b.hold){ g.strokeStyle='rgba(255,220,150,0.95)'; g.lineWidth=2.2*s; roundPath(g,x+1,y+1,w-2,h-2,5); g.stroke(); }
  const specLit=b.spec && player() && player().specialty===b.spec;
  if((b.key==='search'&&G.searching)||(b.key==='secret'&&G.secretSearch)||(b.key==='shovel'&&G.digging)||(b.key==='wall'&&player()&&player().defending)||(b.key==='craft'&&G.scene==='craft')||specLit){
    g.strokeStyle='rgba(255,214,140,'+(0.5+Math.sin(G.elapsed*6)*0.4)+')'; g.lineWidth=2.4*s;
    roundPath(g,x-2.5*s,y-2.5*s,w+5*s,h+5*s,6); g.stroke(); }
  const col=ready?(b.key==='rally'?'#ff8a7a':'#e9d5a6'):'rgba(160,140,110,0.42)';
  const simg=slotAnimImg(b);
  if(simg){
    g.save();
    roundPath(g,x+3*s,y+3*s,w-6*s,h-6*s,3); g.clip();
    g.globalAlpha=(ready&&atForge)?1:0.42;
    const iw=Math.max(1,simg.width), ih=Math.max(1,simg.height);
    const dw=w-6*s, dh=h-6*s;
    const sc=Math.max(dw/iw, dh/ih);
    const rw=iw*sc, rh=ih*sc;
    g.drawImage(simg, x+3*s+(dw-rw)/2, y+3*s+(dh-rh)/2, rw, rh);
    g.globalAlpha=1; g.restore();
  } else {
    icon(g, ico, b.x, b.y-(b.num?2*s:0), b.small?0.78*s:1.05*s, atForge?col:'rgba(160,140,110,0.42)');
  }
  if(b.num){
    g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='left';
    g.fillStyle='rgba(232,212,172,0.85)'; g.fillText(String(b.num), x+5*s, y+12*s);
  }
  if(!ready && ab && ab.cd>0){
    g.fillStyle='rgba(6,4,2,0.66)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill();
    g.font='800 '+(12*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle='rgba(244,226,186,0.92)'; g.fillText(Math.ceil(cds[ab.key]),b.x,b.y+4*s); g.textAlign='left';
  }
  if(b.key==='craft' && !atForge){
    g.fillStyle='rgba(8,5,3,0.46)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill();
  }
  if(ab&&(ab.key==='bomb'||ab.key==='ale'||ab.key==='bow')){
    syncPackTotals();
    const n=ab.key==='bomb'?(partyCount('bombs')+partyCount('burps')):ab.key==='ale'?healCharges():partyCount('ammo');
    if(!n){ g.fillStyle='rgba(8,5,3,0.5)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill(); }
    const px=b.x+R*0.72, py=b.y-R*0.72;
    g.fillStyle=n?'rgba(20,14,8,0.92)':'rgba(50,14,8,0.92)';
    g.beginPath(); g.arc(px,py,8.4*s,0,TAU); g.fill();
    g.strokeStyle=n?'rgba(214,176,104,0.85)':'rgba(190,80,60,0.8)'; g.lineWidth=1.4*s; g.stroke();
    g.font='800 '+(9.5*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle=n?'#f2dfb6':'#ff9a86'; g.fillText(String(n),px,py+3.4*s); g.textAlign='left';
  }
  if(ab&&ab.key==='bomb'&&G.aim){
    g.strokeStyle='rgba(255,170,90,'+(0.6+Math.sin(G.elapsed*6)*0.3)+')'; g.lineWidth=2.4*s;
    roundPath(g,x-3*s,y-3*s,w+6*s,h+6*s,6); g.stroke(); }
  if(b.key==='shovel'&&G.digging){
    const left=G.dig?Math.max(0,digNeedMinutes()-G.dig.min):digNeedMinutes();
    g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle='#f2dfb6'; g.fillText(Math.ceil(left)+'m', b.x, b.y+R*0.62); g.textAlign='left'; }
  if(b.label && b.r>=18){
    const labelPx=b.r>=28?Math.min(14, Math.max(11, b.r*0.34)):(PORT?9.5:8.5)*s;
    g.font='800 '+labelPx+'px '+FONT_UI; g.textAlign='center';
    g.lineWidth=3*s; g.strokeStyle='rgba(0,0,0,0.75)';
    g.strokeText(b.label, b.x, b.y-R-7*s);
    g.fillStyle='#f2dfb6'; g.fillText(b.label, b.x, b.y-R-7*s); g.textAlign='left'; }
}

function drawTitleCavern(g){
  const cx=VW/2, cy=VH*0.44, z=Math.min(VW,VH)/620;

    g.beginPath(); g.moveTo(x,y-20*z); g.lineTo(x+40*z,y); g.lineTo(x,y+20*z); g.lineTo(x-40*z,y); g.closePath(); g.stroke();
  }
  g.restore();
  g.save();
  const gx=cx, gy=cy-48*z;
  const pulse=.7+Math.sin(G.t*2.4)*.3;
  const glow=g.createRadialGradient(gx,gy,10*z,gx,gy,210*z);
  glow.addColorStop(0,'rgba(255,40,50,'+(0.46*pulse)+')');
  glow.addColorStop(0.34,'rgba(140,12,22,0.16)');
  glow.addColorStop(1,'rgba(255,40,50,0)');

function drawSplashCover(g, img, opt){

}
function drawArtFrame(g, x, y, w, h, r){

function strokeFillCenter(g, txt, y, fill){

function drawGoldRule(g, cx, y, w){

function wrapLines(g, txt, maxW){
  const words=String(txt||'').split(/\s+/);
  const lines=[]; let cur='';
  words.forEach(w=>{
    const t=cur?cur+' '+w:w;
    if(cur && g.measureText(t).width>maxW){ lines.push(cur); cur=w; }
    else cur=t;
  });
  if(cur) lines.push(cur);
  return lines;
}
function centerCopyY(ceil, floor, blockH){
  const mid=(ceil+floor)*0.5;
  let y=mid-blockH*0.5;
  if(y<ceil) y=ceil;
  if(y+blockH>floor) y=Math.max(ceil, floor-blockH);
  return y;
}
/* Title + every chapter plate: compact head at the TOP, air before flavor, buttons stay low. */
function highPlateMetrics(s, port){
  return {
    ceilK: port?0.048:0.038,
    labGap: 8*s,
    titleGap: 28*s,
    titleGapMin: 22*s,
    musGap: 10*s
  };
}
function layoutHighPlate(g, spec){
  const s=spec.s, maxW=spec.maxW;
  const lab=spec.label||'', title=spec.title||'', flavor=spec.flavor||'', music=spec.music||'';
  let labSize=spec.labSize, titleSize=spec.titleSize, flSize=spec.flSize, musSize=spec.musSize;
  let labGap=spec.labGap, titleGap=spec.titleGap, musGap=spec.musGap;
  const titleGapMin=spec.titleGapMin!=null?spec.titleGapMin:titleGap;
  const ceil=spec.ceil, floor=spec.floor;
  function measure(ls, ts, fs, ms, lg, tg, mg){
    g.font='700 '+ls+'px '+FONT_TITLE;
    const labLines=lab?wrapLines(g, lab, maxW):[];
    g.font='700 '+ts+'px '+FONT_DISPLAY;
    const tLines=title?wrapLines(g, title, maxW):[];
    g.font='italic 600 '+fs+'px '+FONT_QUOTE;
    const fl=flavor?wrapLines(g, flavor, maxW):[];
    g.font='600 '+ms+'px '+FONT_UI;
    const mus=music?wrapLines(g, music, maxW):[];
    const labH=labLines.length?ls+(labLines.length-1)*ls*1.12:0;
    const titleH=tLines.length?ts+(tLines.length-1)*(ts*1.18)+ts*0.12:0;
    const flH=fl.length?fl.length*Math.max(16*s, fs*1.32):0;
    const musH=mus.length?ms*1.35*mus.length:0;
    const h=labH+(labH?lg:0)+titleH+(fl.length?tg:0)+flH+(mus.length?mg+musH:0);
    return {labLines, tLines, fl, mus, labH, titleH, flH, musH, h};
  }
  let lay=measure(labSize, titleSize, flSize, musSize, labGap, titleGap, musGap);
  const band=Math.max(48*s, floor-ceil);
  while(lay.h+20*s>band && titleSize>14){
    titleSize-=0.8; flSize=Math.max(14, flSize-0.4); musSize=Math.max(7, musSize-0.12);
    labSize=Math.max(9, labSize-0.2);
    labGap=Math.max(6*s, labGap-0.25); titleGap=Math.max(titleGapMin, titleGap-0.3);
    lay=measure(labSize, titleSize, flSize, musSize, labGap, titleGap, musGap);
  }
  const t0=ceil;
  let y=t0;
  const labelY=lay.labLines.length?y+labSize:y;
  if(lay.labLines.length) y=labelY+(lay.labLines.length-1)*labSize*1.12+labGap;
  const titleY=lay.tLines.length?y+titleSize:y;
  if(lay.tLines.length) y=titleY+lay.titleH-titleSize;
  const ruleY=lay.fl.length?y+titleGap*0.38:y;
  const flavorY=lay.fl.length?y+titleGap:y;
  if(lay.fl.length) y=flavorY+lay.flH;
  const musicY=lay.mus.length?y+musGap+musSize:y;
  if(lay.mus.length) y=musicY+(lay.mus.length-1)*musSize*1.35;
  return {
    t0, labelY, titleY, ruleY, flavorY, musicY, bottom:y,
    labSize, titleSize, flSize, musSize, labGap, titleGap, musGap,
    labLines:lay.labLines, tLines:lay.tLines, fl:lay.fl, mus:lay.mus, h:lay.h
  };
}
function paintHighPlate(g, lay, spec){
  const a=spec.alpha!=null?spec.alpha:1;
  g.globalAlpha=a; g.textAlign='center';
  if(lay.labLines.length){
    g.font='700 '+lay.labSize+'px '+FONT_TITLE;
    let y=lay.labelY;
    lay.labLines.forEach((ln,i)=>{ strokeFillCenter(g, ln, y, spec.labelFill||'rgba(232,196,120,0.94)'); y+=lay.labSize*1.12; });
  }
  if(lay.tLines.length){
    let y=lay.titleY;
    lay.tLines.forEach(ln=>{
      if(spec.paintTitle) spec.paintTitle(g, ln, y, lay.titleSize);
      else {
        g.font='700 '+lay.titleSize+'px '+FONT_DISPLAY;
        g.lineWidth=lay.titleSize*.16; g.strokeStyle='rgba(0,0,0,0.9)'; g.strokeText(ln,VW/2,y);
        const gr=g.createLinearGradient(0,y-lay.titleSize*.85,0,y+lay.titleSize*.2);
        gr.addColorStop(0,'#fff3cc'); gr.addColorStop(0.45,'#ffe08a'); gr.addColorStop(1,'#b57a2c');
        g.fillStyle=gr; g.fillText(ln,VW/2,y);
      }
      y+=lay.titleSize*1.18;
    });
    if(spec.rule!==false && lay.fl.length) drawGoldRule(g, VW/2, lay.ruleY, spec.ruleW||Math.min(200*UIS, (spec.maxW||VW*0.7)*0.42));
  }
  if(lay.fl.length){
    g.font='italic 600 '+lay.flSize+'px '+FONT_QUOTE;
    let y=lay.flavorY;
    const step=Math.max(16*UIS, lay.flSize*1.32);
    lay.fl.forEach(ln=>{ strokeFillCenter(g, ln, y, spec.flavorFill||'rgba(236,214,176,0.96)'); y+=step; });
  }
  if(lay.mus.length){
    g.font='600 '+lay.musSize+'px '+FONT_UI;
    g.fillStyle=spec.musicFill||'rgba(160,140,110,0.70)';
    let y=lay.musicY;
    lay.mus.forEach(ln=>{ g.fillText(ln, VW/2, y); y+=lay.musSize*1.35; });
  }
  g.textAlign='left'; g.globalAlpha=1;
  return lay.bottom;
}
function drawArtRect(g, img, x, y, w, h, r){
  g.save();
  roundPath(g,x,y,w,h,r||8); g.clip();
  g.fillStyle='#0a0706'; g.fillRect(x,y,w,h);
  if(img&&img.width){
    const sc=Math.max(w/img.width, h/img.height);
    const iw=img.width*sc, ih=img.height*sc;
    drawPhoto(g, img, x+(w-iw)/2, y+(h-ih)/2, iw, ih);
  }
  g.restore();
}

function drawTitle(g){

  });

  g.textAlign='left';
  const nums=['I','II','III','IV','V'];
  const gap=10*s;
  const top=VH*0.128, bot=VH-62*s;
  const cols=PORT?1:2;
  const rows=Math.ceil(5/cols);
  const cw=Math.min((VW-36*s)/cols-gap, PORT?VW-36*s:560*s);
  const ch=(bot-top)/rows-gap;
  [1,2,3,4,5].forEach((n,i)=>{
    const col=i%cols, row=(i/cols)|0;
    const x=VW/2 - (cols*cw+(cols-1)*gap)/2 + col*(cw+gap);
    const y=top + row*(ch+gap);
    const m=CH_META[n], locked=m.locked||n>G.unlocked;
    const intro=CH_INTRO[n]||{fl:m.s||''};
    plate(g, x, y, cw, ch, 10, locked?0.52:0.86);
    g.strokeStyle=locked?'rgba(120,100,80,0.35)':(G.cleared[n]?'rgba(150,200,130,0.7)':'rgba(255,208,124,0.7)');
    g.lineWidth=1.8; roundPath(g,x,y,cw,ch,10); g.stroke();
    if(!locked) menuHits.push({x,y,w:cw,h:ch,fn:()=>startChapter(n)});
    const innerW=cw-36*s;
    const pad=12*s;
    let tSize=(PORT?13:16)*s, sSize=(PORT?9:11)*s, labSize=10*s;
    let tStep=tSize*1.18, sStep=sSize*1.32, labGap=8*s, midGap=16*s;
    function layoutCard(ts, ss, ls, tg, sg, lg, mg){
      g.font='800 '+ts+'px '+FONT_TITLE;
      const tLines=wrapLines(g, m.t, innerW);
      g.font='600 '+ss+'px '+FONT_UI;
      const sLines=wrapLines(g, intro.fl||m.s||'', innerW);
      const h=ls+lg+tLines.length*tg+(sLines.length?mg+sLines.length*sg:0);
      return {tLines, sLines, h};
    }
    let lay=layoutCard(tSize, sSize, labSize, tStep, sStep, labGap, midGap);
    while(lay.h>ch-pad*2 && tSize>9){
      tSize-=0.7; sSize=Math.max(8, sSize-0.45); labSize=Math.max(8, labSize-0.3);
      tStep=tSize*1.16; sStep=sSize*1.28; labGap=Math.max(6*s, tSize*0.5); midGap=Math.max(12*s, midGap-0.3);
      lay=layoutCard(tSize, sSize, labSize, tStep, sStep, labGap, midGap);
    }
    const t0=centerCopyY(y+pad, y+ch-pad, lay.h);
    const cx=x+cw/2;
    g.textAlign='center';
    g.font='700 '+labSize+'px '+FONT_TITLE;
    g.fillStyle=locked?'rgba(160,140,110,0.55)':'rgba(232,196,120,0.9)';
    let yy=t0+labSize;
    g.fillText('CHAPTER  '+nums[n-1], cx, yy);
    yy+=labGap;
    g.font='800 '+tSize+'px '+FONT_TITLE;
    g.fillStyle=locked?'rgba(180,160,130,0.55)':'#ffe9c0';
    lay.tLines.forEach(ln=>{ yy+=tSize; g.fillText(ln, cx, yy); yy+=tStep-tSize; });
    if(lay.sLines.length){
      yy+=midGap;
      g.font='600 '+sSize+'px '+FONT_UI;
      g.fillStyle=locked?'rgba(160,140,110,0.55)':'rgba(210,190,150,0.94)';
      lay.sLines.forEach(ln=>{ yy+=sSize; g.fillText(ln, cx, yy); yy+=sStep-sSize; });
    }
    g.textAlign='left';
    if(G.cleared[n]){
      g.font='700 '+(10*s)+'px '+FONT_UI;
      g.fillStyle='rgba(150,200,130,0.9)';
      g.textAlign='right'; g.fillText('cleared', x+cw-12*s, y+16*s); g.textAlign='left';
    } else if(locked){
      g.font='700 '+(10*s)+'px '+FONT_UI;
      g.fillStyle='rgba(160,140,110,0.7)';
      g.textAlign='right'; g.fillText('sealed', x+cw-12*s, y+16*s); g.textAlign='left';
    }
  });
  menuBtn(g,'Back',VW/2-Math.min(90*s,VW*.24)-6*s,VH-36*s,Math.min(180*s,VW*.42),40*s,()=>{G.scene='title';});
  menuBtn(g,'Credits',VW/2+Math.min(90*s,VW*.24)+6*s,VH-36*s,Math.min(180*s,VW*.42),40*s,()=>openCredits('chapters'));
}

function enterPlayFromIntro(){
  G._wantPlay=1;
  if(!tryEnterPlay()) hint('The seam is still settling.',1.8);
}
function tryEnterPlay(){
  if(!G._wantPlay) return false;
  if(G.scene!=='intro' && G.scene!=='play') return false;
  if(!worldArtReady(G.ch)) return false;
  G._wantPlay=0;
  if(G.scene==='play') return true;
  G.scene='play';
  if(G.ch===1){ /* first room stays quiet; walking up still Rouses */ }
  else if(!G.taught.move){ G.taught.move=1; hint('Drag the left side of the screen to walk',6); }
  else if(!G.taught.dig){ G.taught.dig=1; hint('Shovel: face solid rock. One square foot per 10 minutes.',6); }
  else if(!G.taught.herb){ G.taught.herb=1; hint('Plant icon (F): notice plants, roll the herb table, then recover that herb vs its chance.',6); }
  else if(G.ch===2&&!G.taught.floor){ G.taught.floor=1; }
  return true;
}

function drawCamp(g){
  menuHits=[]; const s=UIS;
  g.fillStyle='#0b0806'; g.fillRect(0,0,VW,VH); embers(g); darken(g,.42);
  const titleY=VH*(PORT?0.055:0.048);
  const titleSize=(PORT?22:28)*s;
  g.textAlign='center';
  goldTitleLine(g,'CAMP', titleY+titleSize*0.72, titleSize);
  g.font='italic 600 '+((PORT?12:14)*s)+'px '+FONT_UI;
  g.fillStyle='rgba(210,190,150,0.78)';
  const cleared=(CH_META[G.ch]&&CH_META[G.ch].t)||'The Beginning';
  g.fillText(cleared+' cleared', VW/2, titleY+titleSize+22*s);
  g.textAlign='left';

  const btnW=Math.min(170*s, VW*.36);
  const btnH=Math.max(PORT?50:48, (PORT?50:48)*s);
  const footH=btnH+4*s;
  const footY=VH-footH-10*s;
  const detailH=PORT?78*s:72*s;
  const acts=campActions();
  const tabs=[{id:'repair',n:'Repair'},{id:'improve',n:'Improve'},{id:'craft',n:'Craft'},{id:'other',n:'Other'}];
  if(!G.campTab) G.campTab='repair';
  const tabActs=acts.filter(a=>campActionTab(a)===G.campTab);
  if(G.campSel && !tabActs.some(a=>campActionId(a)===G.campSel)) G.campSel=null;
  const sel=tabActs.find(a=>campActionId(a)===G.campSel)||null;

  const stockY=titleY+titleSize+34*s;
  const stockH=drawStockStrip(g, 12*s, stockY, VW-24*s, sel&&sel.cost);
  const tabY=stockY+stockH+8*s, tabH=PORT?40*s:36*s;
  const skillW=Math.min(86*s, VW*0.18);
  const tabW=(VW-24*s-12*s-skillW)/tabs.length;
  tabs.forEach((tb,i)=>{
    const x=12*s+i*(tabW+3*s), on=G.campTab===tb.id;
    drawChip(g,x,tabY,tabW,tabH,tb.n,on);
    menuHits.push({x,y:tabY,w:tabW,h:tabH,fn:()=>{ G.campTab=tb.id; G.campSel=null; G.campScroll=0; }});
  });
  drawChip(g, VW-12*s-skillW, tabY, skillW, tabH, 'Skills', !!G.campSkills);
  menuHits.push({x:VW-12*s-skillW,y:tabY,w:skillW,h:tabH,fn:()=>{ G.campSkills=!G.campSkills; }});

  const listTop=tabY+tabH+10*s;
  const listBot=footY-detailH-10*s;
  const rowH=Math.max(PORT?46*s:44*s, 44);
  const vis=Math.max(1, Math.floor((listBot-listTop)/rowH));
  const maxScroll=Math.max(0, tabActs.length-vis);
  G.campScroll=clamp(G.campScroll||0, 0, maxScroll);
  const shown=tabActs.slice(G.campScroll, G.campScroll+vis);
  shown.forEach((a,i)=>{
    const y=listTop+i*rowH, h=rowH-6*s, x=12*s, w=VW-24*s;
    const can=campActionReady(a);
    const on=campActionId(a)===G.campSel;
    plate(g,x,y,w,h,6, on?0.9:(can?0.78:0.48));
    if(on){ g.strokeStyle='rgba(255,208,124,0.8)'; g.lineWidth=2; roundPath(g,x,y,w,h,6); g.stroke(); }
    else if(can){ g.strokeStyle='rgba(255,208,124,0.35)'; g.lineWidth=1.4; roundPath(g,x,y,w,h,6); g.stroke(); }
    g.font='700 '+(PORT?14*s:15*s)+'px '+FONT_UI;
    g.fillStyle=can?'#f4e2b8':'rgba(140,126,104,0.55)';
    g.fillText(ellipsize(g, campActionName(a), w*0.58), x+14*s, y+h*0.64);
    g.textAlign='right';
    g.font='700 '+(PORT?11*s:12*s)+'px '+FONT_UI;
    g.fillStyle=can?'rgba(214,190,140,0.95)':'rgba(180,90,70,0.75)';
    g.fillText(ellipsize(g, costText(a.cost), w*0.36), x+w-14*s, y+h*0.64);
    g.textAlign='left';
    if(y+h>footY-6*s) return;
    menuHits.push({x,y,w,h,fn:()=>{
      const id=campActionId(a);
      if(G.campSel===id){ if(can) runCampAction(a); }
      else G.campSel=id;
    }});
  });
  if(maxScroll){
    drawScrollArrows(g, VW-36*s, listTop, listBot-listTop, G.campScroll>0, G.campScroll<maxScroll,
      ()=>{ G.campScroll=Math.max(0,(G.campScroll||0)-1); },
      ()=>{ G.campScroll=Math.min(maxScroll,(G.campScroll||0)+1); });
  }

  const dX=12*s, dY=listBot+6*s, dW=VW-24*s;
  plate(g,dX,dY,dW,detailH-4*s,7,.88);
  if(sel){
    const rec=sel.craftRecipeId&&window.CraftingEngine&&CraftingEngine.get(sel.craftRecipeId);
    const check=rec?CraftingEngine.canCraft(sel.craftRecipeId, makeCraftingBridge()):null;
    const can=check?!!check.ok:campActionReady(sel);
    const sk=sel.skill&&SKILLS.find(z=>z.k===sel.skill);
    g.font='700 '+(PORT?12*s:13*s)+'px '+FONT_UI;
    g.fillStyle='#ffe9c0';
    g.fillText(ellipsize(g, sel.t, dW-120*s), dX+14*s, dY+22*s);
    g.font='600 '+(PORT?10*s:11*s)+'px '+FONT_UI;
    g.fillStyle='rgba(210,190,150,0.82)';
    g.fillText(ellipsize(g, sel.info||'', dW-28*s), dX+14*s, dY+42*s);
    g.font='700 '+(PORT?10*s:11*s)+'px '+FONT_UI;
    g.fillStyle=can?'rgba(150,200,130,0.9)':'rgba(200,120,90,0.9)';
    const skLine=sk?(sk.n+' '+skillLvl(sk.k)+'  ·  '):'';
    const why=can?'Ready.':((check&&check.message)||('Need '+costText(sel.cost)));
    g.fillText(ellipsize(g, skLine+why, dW-28*s), dX+14*s, dY+62*s);
    const doW=Math.min(110*s, dW*0.28), doH=PORT?36*s:32*s;
    const doCy=Math.min(dY+detailH*0.52, footY-doH/2-6*s);
    menuBtn(g, can?'Do it':'Need', dX+dW-doW/2-10*s, doCy, doW, doH, ()=>{ if(can) runCampAction(sel); });
  } else {
    g.font='600 '+(PORT?11*s:12*s)+'px '+FONT_UI;
    g.fillStyle='rgba(186,166,130,0.7)';
    g.fillText('Choose a row. Details stay here.', dX+14*s, dY+detailH*0.48);
  }
  if(G.campSkills){
    const boxH=PORT?96*s:88*s;
    plate(g, dX, dY-boxH-6*s, dW, boxH, 7, .92);
    SKILLS.forEach((sk,i)=>{
      const col=PORT?2:4, cw=(dW-20*s)/col;
      const cx=dX+10*s+(i%col)*cw, cy=dY-boxH+18*s+((i/col)|0)*20*s;
      g.font='700 '+(9.5*s)+'px '+FONT_UI;
      g.fillStyle='rgba(226,206,164,0.9)';
      g.fillText(sk.n+'  '+skillLvl(sk.k), cx, cy);
    });
  }

  const nxt=G.ch===3?5:G.ch+1;
  const saved=G.campSaveFlash && (G.t||0)<G.campSaveFlash;
  if(saved){
    g.textAlign='center';
    g.font='700 '+(PORT?12:13)*s+'px '+FONT_UI;
    g.fillStyle='#ffe08a';
    g.fillText('The book is marked.', VW/2, footY-6*s);
    g.textAlign='left';
  }
  const beforeFoot=menuHits.length;
  menuBtn(g, saved?'Saved':'Save',VW/2-btnW/2-8*s,footY+btnH/2,btnW,btnH,()=>writeGameSave(), false, SPR.icon_save);
  if(CH_META[nxt]&&!CH_META[nxt].locked)
    menuBtn(g,'Go deeper',VW/2+btnW/2+8*s,footY+btnH/2,btnW,btnH,()=>startChapter(nxt));
  else menuBtn(g,'Chapters',VW/2+btnW/2+8*s,footY+btnH/2,btnW,btnH,()=>{G.scene='chapters';});
  const footHits=menuHits.splice(beforeFoot);
  menuHits.unshift.apply(menuHits, footHits);
}

function packUser(){
  if(G.packWho && G.packWho!=='macar') return player();
  const key=G.packWho||'macar';
  const GK=typeof GhostKit!=='undefined'?GhostKit:null;
  if(GK&&GK.packUseTarget) return GK.packUseTarget(G.ents||[], key, player())||player();
  const e=packOwnerEntity(key);

function collectPackRows(pk, who){
  const eq=G.equipped||{};
  const rows=[];
  const ghost=isGhostPack(who);
  const npc=who&&who!=='macar'&&!ghost;
  const lend=ghost?'Tap to use, or take into MACAR\'s pack. ':(npc?'Tap to share with MACAR. Returns after camp. ':'');
  const flaskN=(pk.ales||0)+((pk.healPots||[]).length);
  if(flaskN){
    const names=(pk.healPots||[]).map(p=>p.n).slice(0,3);
    rows.push({kind:'ale', t:'Draughts of beer  \u00d7'+flaskN,
      info:lend+(names.length?('Flask: '+names.join(', ')+((pk.healPots||[]).length>3?'\u2026':'')):'Each draught heals d10. Tap Heal, or tap here to drink.'),
      tag:'Beer'});
  }
  if(pk.bombs){
    rows.push({kind:'supply', field:'bombs', t:'Bombs  \u00d7'+pk.bombs,
      info:lend+'10d10 throwables.', tag:'Bomb'});
  }
  if(pk.burps){
    rows.push({kind:'burp', t:"Borga's Burp  \u00d7"+(pk.burps||0),
      info:lend+"Pordum's brew-bomb. 3d10.",
      tag:'Bomb'});
  }
  if(pk.ammo){
    rows.push({kind:'supply', field:'ammo', t:'Crossbow bolts  \u00d7'+pk.ammo,
      info:lend+'Quarrels for the shoot.', tag:'Ammo'});
  }
  if(pk.rations){
    rows.push({kind:'supply', field:'rations', t:'Rations  \u00d7'+pk.rations,
      info:lend+'Travel bread and hard cheese.', tag:'Food'});
  }
  if(pk.torches){
    rows.push({kind:'supply', field:'torches', t:'Torches  \u00d7'+pk.torches,
      info:lend+'Pitch and pine.', tag:'Light'});
  }
  if(pk.bombKit){
    rows.push({kind:'kit', t:'Bomb-making kit  \u00d7'+(pk.bombKit||0),
      info:lend+'Casings, fuses, and tools. Pack bombs at a crafting station.',
      tag:'Kit'});
  }
  (pk.magic||[]).forEach((it,i)=>{
    mapPackItemToEquipment(it);
    const worn=!!wornSlotOf(it);
    const canEq=isPackEquipable({kind:'magic',it});
    const slot=typeof EquipmentSlots!=='undefined'&&EquipmentSlots.itemSlot?EquipmentSlots.itemSlot(it):'';
    const from=it._borrowOwner?('Borrowed from '+kinName(it._borrowOwner)+'. Returns at camp. '):'';
    rows.push({kind:'magic',it,i,t:it.n, worn, slot,
      info:from+lend+(canEq?(worn?'Equipped. Tap a slot to stow it. ':'Tap to don or wield. ')+(it.d||''):(it.d||'')),
      tag:it.cat||(slot?slot:'Magic')});
  });
  (pk.potions||[]).forEach((p,i)=>{
    if(isHealPotion(p)) return;
    const from=p._borrowOwner?('Borrowed from '+kinName(p._borrowOwner)+'. Returns at camp. '):'';
    rows.push({kind:'potion',p,i,t:p.n,info:from+lend+(p.d||''),tag:'Potion'});
  });
  (pk.gems||[]).forEach((gm,i)=>{
    const from=gm._borrowOwner?('Borrowed from '+kinName(gm._borrowOwner)+'. Returns at camp. '):'';
    rows.push({kind:'gem',gm,i,t:gm.n+(gm.gp?('  \u2014  '+gm.gp+' gp'):''),info:from+lend+(gm.d||''),tag:'Gem'});
  });
  Object.keys(pk.herbs||{}).forEach(n=>rows.push({kind:'herb',n,t:n+'  \u00d7'+(pk.herbs[n]||0),
    info:lend+((HERBS.find(h=>h.n===n)||{}).d||''),tag:'Herb'}));
  return rows;
}
function shareCountWithMacar(from, field, n){
  n=n||1;
  const pk=packOf(from);
  const have=pk[field]||0;
  const take=Math.min(n, have);
  if(!take) return 0;
  pk[field]=have-take;
  addToPack('macar', field, take);
  noteNpcLoan(from, {field, n:take, held:true});
  return take;
}
function shareItemWithMacar(from, slot, index, item){
  const pk=packOf(from);
  if(slot==='herbs'){
    if(!pk.herbs||!pk.herbs[item]) return false;
    pk.herbs[item]--;
    if(pk.herbs[item]<=0) delete pk.herbs[item];
    const dest=packOf('macar');
    dest.herbs=dest.herbs||{};
    dest.herbs[item]=(dest.herbs[item]||0)+1;
    noteNpcLoan(from, {herb:item, n:1, held:true});
    return true;
  }
  const arr=pk[slot];
  if(!arr||index==null||!arr[index]) return false;
  const it=arr.splice(index,1)[0];
  if(window.BorrowKit) BorrowKit.mark(it, from);
  const dest=packOf('macar');
  dest[slot]=dest[slot]||[];
  dest[slot].push(it);
  noteNpcLoan(from, {slot, item:it, held:true});
  return it;
}
function sharePackRow(r){
  const from=G.packWho;
  if(!from||from==='macar') return;
  let label=r.t||r.n||'kit';
  if(r.kind==='supply'||r.kind==='burp'){
    const field=r.field||(r.kind==='burp'?'burps':null);
    const n=shareCountWithMacar(from, field, 1);
    if(!n) return;
    label=(n)+' '+(r.tag||field);
  } else if(r.kind==='kit'){
    if(!shareCountWithMacar(from, 'bombKit', 1)) return;
    label='bomb-making kit';
  } else if(r.kind==='ale'){
    const pk=packOf(from);
    if(pk.healPots&&pk.healPots.length){
      const p=shareItemWithMacar(from, 'healPots', 0);
      if(!p) return;
      label=p.n||'healing draught';
    } else if(!shareCountWithMacar(from, 'ales', 1)) return;
    else label='draught of beer';
  } else if(r.kind==='magic'){
    if(!shareItemWithMacar(from, 'magic', r.i, r.it)) return;
  } else if(r.kind==='potion'){
    if(!shareItemWithMacar(from, 'potions', r.i, r.p)) return;
  } else if(r.kind==='gem'){
    if(!shareItemWithMacar(from, 'gems', r.i, r.gm)) return;
  } else if(r.kind==='herb'){
    if(!shareItemWithMacar(from, 'herbs', null, r.n)) return;
    label=r.n;
  } else return;
  say('MACAR borrows '+label+' from '+kinName(from)+'. It returns after camp.','#ffe08a');
  syncPackTotals();
}
function usePackRow(r){
  if(G.faceOffer){
    askDropInMouth(r);
    return;
  }
  if(G.packWho && G.packWho!=='macar' && !isGhostPack()){
    sharePackRow(r);
    return;
  }
  const who=packUser();
  const bag=packOf(G.packWho);
  const inField=G.packFrom==='play';
  if(isPackEquipable(r)){
    const it=r.it||r;
    if(G.packWho==='macar' || isGhostPack()){
      if(wornSlotOf(it)){
        if(G.packSel===it){
          unequipPackSlot(wornSlotOf(it));
          G.packSel=it;
        } else {
          G.packSel=it;
        }
        return;
      }
      G.packSel=it;
      equipPackItem(it);
    } else {
      G.packSel=it;
    }
    return;
  }
  const field=r.field||(r.kind==='burp'?'burps':(r.kind==='bombs'?'bombs':(r.kind==='ammo'?'ammo':(r.kind==='torches'?'torches':(r.kind==='rations'?'rations':null)))));
  if(r.kind==='supply'||r.kind==='bombs'||r.kind==='ammo'||r.kind==='torches'||r.kind==='rations'||r.kind==='burp'){
    if(field==='bombs'||field==='burps'){
      if(inField){ G.packPrefer=G.packWho; G.scene='play'; fire('bomb'); G.packPrefer=null; }
      else if(isGhostPack()) takeStackToMacar(field);
      else say(field==='burps'?"Borga's Burp stays corked until you throw it in the seam.":'Bombs stay packed until you throw them in the seam.','#ffb45c');
    } else if(field==='ammo'){
      if(inField){ G.packPrefer=G.packWho; G.scene='play'; fire('bow'); G.packPrefer=null; }
      else if(isGhostPack()) takeStackToMacar('ammo');
      else say((r.info||r.t||'Kit')+' stays in MACAR\'s pack.','#c9b895');
    } else if(field==='torches'||field==='rations'){
      if(isGhostPack()) takeStackToMacar(field);
      else say((r.info||r.t||'Kit')+' stays in MACAR\'s pack.','#c9b895');
    }
    syncPackTotals();
    return;
  }
  if(r.kind==='magic'){
    const it=bag.magic[r.i];
    if(!it) return;
    const consume=it.k==='scroll'||it.k==='prot'||it.k==='heal';
    if(inField){
      const spent=useMagicItem(it, who);
      if(spent==='spent'||consume) bag.magic.splice(r.i,1);
    } else if(consume){
      bag.magic.splice(r.i,1);
      G.carryEffects=G.carryEffects||[];
      G.carryEffects.push({t:'magic',it});
      say('Set aside for the next descent: '+it.n,'#ffd27a');
    } else {
      useMagicItem(it, who);
    }
  } else if(r.kind==='ale'){
    if(inField){ G.packPrefer=G.packWho; G.scene='play'; fire('ale'); G.packPrefer=null; }
    else say('Ale and healing draughts sit in the beer flask. Drink them in the seam.','#d2bd63');
  } else if(r.kind==='potion'){
    const pot=bag.potions.splice(r.i,1)[0];
    if(!pot) return;
    if(inField) drinkPotion(pot, who);
    else { G.carryEffects=G.carryEffects||[]; G.carryEffects.push({t:'potion',p:pot}); say('Set aside for the next descent: '+pot.n,'#e0d2ff'); }
  } else if(r.kind==='gem'){
    const gm=(bag.gems||[])[r.i];
    if(gm) say(gm.n+(gm.gp?(' \u2014 '+gm.gp+' gp. '):'. ')+(gm.d||''),'#ff6a6a');
  } else if(r.kind==='kit'){
    if(isGhostPack()) takeStackToMacar('bombKit');
    else say('Bomb kit stays in the pack. Craft more bombs at a station.','#ffb45c');
  } else {
    if(inField) useHerb(r.n, who);
    else { if(bag.herbs[r.n]){ bag.herbs[r.n]--; if(bag.herbs[r.n]<=0) delete bag.herbs[r.n]; }
      G.carryEffects=G.carryEffects||[]; G.carryEffects.push({t:'herb',n:r.n}); say('Herb packed: '+r.n,'#6aff8a'); }
  }
  syncPackTotals();
}
function dollSlotLayout(x, y, w, h){
  const pad=6, innerH=Math.max(80, h-pad*2), rowH=innerH/7;
  const slot=Math.max(16, Math.min((w-pad*2)/3.35, rowH*0.86, 46));
  const cx=x+w/2;
  const cell=(k, px, py, sw, sh)=>{
    if(typeof EquipmentSlots!=='undefined' && EquipmentSlots.slotCell) return EquipmentSlots.slotCell(k, px, py, sw, sh);
    sh=(sh==null || !isFinite(sh) || sh<=0)?sw:sh;
    return {k, x:px-sw/2, y:py-sh/2, w:sw, h:sh};
  };
  const mid=y+pad+rowH*2.5;
  return {
    slot,
    body:{x:cx-slot*0.62, y:mid-slot*0.85, w:slot*1.24, h:slot*1.7},
    cells:[
      cell('helmet', cx, y+pad+rowH*0.5, slot),
      cell('necklace', cx, y+pad+rowH*1.5, slot*0.88, slot*0.7),
      cell('primary', cx-slot*1.22, mid, slot),
      cell('secondary', cx+slot*1.22, mid, slot),
      cell('chest', cx, y+pad+rowH*3.5, slot),
      cell('bracers', cx-slot*1.22, y+pad+rowH*3.5, slot),
      cell('gloves', cx+slot*1.22, y+pad+rowH*3.5, slot),
      cell('pants', cx, y+pad+rowH*4.5, slot),
      cell('boots', cx, y+pad+rowH*5.5, slot),
      cell('quiver', cx, y+pad+rowH*6.5, slot*1.55, slot*0.82)
    ]
  };
}
function slotThumbFor(it, slot){
  if(it) return packThumbFor({kind:'magic', it});
  return slotSprite(slot);
}
function togglePackSlot(slot){
  ensureEquippedShape();
  const worn=G.equipped&&G.equipped[slot];
  const sel=G.packSel;
  const ES=typeof EquipmentSlots!=='undefined'?EquipmentSlots:null;
  if(sel && ES && ES.itemSlot && ES.itemSlot(sel)===slot){
    if(worn===sel){
      unequipPackSlot(slot);
      G.packSel=sel;
    } else {
      equipPackItem(sel);
    }
    G.packSlotFilter=null;
    return;
  }
  if(worn){
    if(G.packSel===worn){
      unequipPackSlot(slot);
      G.packSel=worn;
    } else {
      G.packSel=worn;
    }
    G.packSlotFilter=null;
    G.packTab='gear';
    return;
  }
  G.packSlotFilter=G.packSlotFilter===slot?null:slot;
  G.packTab='gear';
}
function drawEquipDoll(g, x, y, w, h){
  const s=UIS;
  ensureEquippedShape();
  const eq=G.equipped||{};
  const ES=typeof EquipmentSlots!=='undefined'?EquipmentSlots:null;
  plate(g, x, y, w, h, 7, .78);
  g.strokeStyle='rgba(255,208,124,0.35)'; g.lineWidth=1.2;
  roundPath(g, x+1, y+1, w-2, h-2, 7); g.stroke();

  const mac=player();
  const desc=ES&&ES.describeAC?ES.describeAC(eq):null;
  const ac=mac?effectiveAC(mac):(desc?desc.ac:'—');
  g.font='800 '+(9*s)+'px '+FONT_TITLE;
  g.fillStyle='#ffe9c0';
  g.fillText('MACAR', x+10*s, y+14*s);
  g.font='700 '+(8*s)+'px '+FONT_UI;
  g.fillStyle='#cfe3ff';
  g.fillText(ellipsize(g, 'AC '+ac+(desc&&desc.note?('  ·  '+desc.note):''), w-20*s), x+10*s, y+26*s);

  const lay=dollSlotLayout(x, y+22*s, w, h-28*s);
  const body=lay.body;
  /* Pack doll is the living Macar painting — same blitLivingMacar pipe
     as the dungeon blit. Shadow Cleaver swaps the idle to the punched axe. */
  const img=blitLivingMacar(SPR[livingMacarIdleKey()]||SPR.macar);
  if(img&&img.width){
    const b=spriteBounds(img);
    const sx=(b&&b.ok&&b.x0!=null)?b.x0*img.width:0;
    const sy=(b&&b.ok&&b.y0!=null)?b.y0*img.height:0;
    const sw=(b&&b.ok&&b.x1!=null)?Math.max(8,(b.x1-b.x0)*img.width):img.width;
    const sh=(b&&b.ok&&b.y1!=null)?Math.max(8,(b.y1-b.y0)*img.height):img.height;
    const sc=Math.min(body.w/sw, body.h/sh);
    const dw=sw*sc, dh=sh*sc;
    g.save();
    g.globalAlpha=1;
    g.globalCompositeOperation='source-over';
    g.drawImage(img, sx, sy, sw, sh, body.x+body.w/2-dw/2, body.y+body.h/2-dh/2, dw, dh);
    g.restore();
  } else {
    g.fillStyle='rgba(80,58,36,0.55)';
    g.beginPath();
    g.ellipse(body.x+body.w/2, body.y+body.h*0.22, body.w*0.28, body.h*0.18, 0, 0, Math.PI*2);
    g.fill();
    g.fillRect(body.x+body.w*0.28, body.y+body.h*0.38, body.w*0.44, body.h*0.55);
  }

  lay.cells.forEach(c=>{
    const it=eq[c.k];
    const on=G.packSlotFilter===c.k || (G.packSel && it===G.packSel);
    const filled=!!it;
    plate(g, c.x, c.y, c.w, c.h, 5, filled?0.92:0.42);
    g.strokeStyle=on?'rgba(255,220,140,0.95)':(filled?'rgba(255,208,124,0.55)':'rgba(120,100,80,0.45)');
    g.lineWidth=on?2:1.2;
    roundPath(g, c.x, c.y, c.w, c.h, 5); g.stroke();
    const thumb=slotThumbFor(it, c.k);
    if(filled && thumb) drawThumb(g, thumb, c.x+3, c.y+3, Math.min(c.w, c.h)-6);
    else if(!filled && thumb && thumb.width){
      g.globalAlpha=0.62;
      const sz=Math.min(c.w, c.h)-8;
      const sc=Math.min(sz/thumb.width, sz/thumb.height);
      const tw=thumb.width*sc, th=thumb.height*sc;
      g.drawImage(thumb, c.x+c.w/2-tw/2, c.y+c.h/2-th/2-3, tw, th);
      g.globalAlpha=1;
    }
    const def=ES&&ES.slotDef?ES.slotDef(c.k):{short:c.k,label:c.k};
    g.font='800 '+Math.max(7, c.h*0.18)+'px '+FONT_UI;
    g.fillStyle=filled?'#ffe9c0':'rgba(170,150,120,0.7)';
    g.textAlign='center';
    const label=filled?ellipsize(g, it.n, c.w-6):def.short.toUpperCase();
    g.fillText(label, c.x+c.w/2, c.y+c.h-4);
    if(c.k==='quiver'){
      const n=packBoltCount();
      const bw=Math.max(16, 18*s), bh=12*s;
      const bx=c.x+c.w-bw-2, by=c.y+2;
      g.fillStyle='#2a1810';
      g.fillRect(bx, by, bw, bh);
      g.strokeStyle='#e8c25a'; g.lineWidth=1; g.strokeRect(bx, by, bw, bh);
      g.fillStyle='#ffe08a';
      g.font='800 '+(9*s)+'px '+FONT_UI;
      g.fillText(String(n), bx+bw/2, by+bh*0.78);
    }
    g.textAlign='left';
    menuHits.push({x:c.x,y:c.y,w:c.w,h:c.h,fn:()=>togglePackSlot(c.k)});
  });
}
function drawPack(g){
  menuHits=[]; const s=UIS;
  ensurePacks();
  if(!G.packWho) G.packWho='macar';
  if(!G.packTab) G.packTab='gear';
  const pk=packOf(G.packWho);
  syncPackTotals();
  drawMenuWash(g);

  const packImg=SPR.icon_pack;
  const headY=VH*0.014, headH=PORT?44*s:52*s;
  if(packImg) drawThumb(g, packImg, 10*s, headY, headH, '#2a1c12');
  g.font='800 '+(PORT?20*s:26*s)+'px '+FONT_TITLE;
  g.fillStyle='#ffe9c0';
  g.fillText('BACKPACK', 10*s+headH+10*s, headY+22*s);
  g.font='600 '+(9*s)+'px '+FONT_UI;
  g.fillStyle='rgba(200,180,140,0.78)';
  const ghostPack=isGhostPack();
  const npcPack=G.packWho&&G.packWho!=='macar'&&!ghostPack;
  g.fillText(G.faceOffer?'Choose something for the stone mouth.'
    :(ghostPack?'Ghost kit. Macar can use or take anything here.'
    :(npcPack?'Tap to share with MACAR. Borrowed kit returns after camp.'
    :(G.packFrom==='play'?'Body slots on the left. Gear below can be donned.':'Set potions and herbs aside for the next descent.'))), 10*s+headH+10*s, headY+40*s);

  const coin=G.coin||{};
  const coins=[{k:'cp',n:'CP',c:'#c47a3a'},{k:'sp',n:'SP',c:'#c8ccd0'},{k:'ep',n:'EP',c:'#6ec8b0'},{k:'gp',n:'GP',c:'#e8c25a'},{k:'pp',n:'PP',c:'#ececf4'}];
  const coinY=headY+headH+6*s, coinH=PORT?22*s:24*s, coinW=(VW-20*s)/coins.length;
  coins.forEach((cn,i)=>{
    const x=10*s+i*coinW+2*s, w=coinW-4*s, have=coin[cn.k]||0;
    plate(g,x,coinY,w,coinH,5,have?0.86:0.42);
    g.textAlign='center';
    g.font='800 '+(8*s)+'px '+FONT_UI; g.fillStyle=cn.c;
    g.fillText(have+' '+cn.n, x+w/2, coinY+coinH*0.66);
    g.textAlign='left';
  });

  const tabY=coinY+coinH+8*s, tabH=PORT?46*s:50*s, tabW=(VW-20*s)/ROSTER.length;
  ROSTER.forEach((r,i)=>{
    const x=10*s+i*tabW+2*s, w=tabW-4*s, on=G.packWho===r.key;
    plate(g,x,tabY,w,tabH,6,on?0.92:0.48);
    if(on){ g.strokeStyle='rgba(255,208,124,0.75)'; g.lineWidth=1.7; roundPath(g,x,tabY,w,tabH,6); g.stroke(); }
    const e=(G.ents||[]).find(z=>z.col&&z.col.key===r.key);
    face(g, x+14*s, tabY+tabH*0.46, 12*s, r, !!(e&&e.dead), !!(e&&e.ghost));
    g.font='800 '+(PORT?7.5*s:8.5*s)+'px '+FONT_UI;
    g.fillStyle=on?'#ffe9c0':'rgba(170,150,120,0.78)';
    g.fillText(ellipsize(g,r.name,w-32*s), x+28*s, tabY+tabH*0.42);
    const bag=packOf(r.key);
    const n=(bag.magic||[]).length+(bag.potions||[]).length+(bag.gems||[]).length+Object.keys(bag.herbs||{}).length;
    g.font='700 '+(7.5*s)+'px '+FONT_UI;
    g.fillStyle=on?'rgba(255,210,122,0.85)':'rgba(140,120,96,0.7)';
    g.fillText(n?'x'+n:'kit', x+28*s, tabY+tabH*0.72);
    menuHits.push({x,y:tabY,w,h:tabH,fn:()=>{ G.packWho=r.key; G.packScroll=0; syncPackTotals(); }});
  });

  const whoE=packUser();
  const sheet=G.abil&&G.abil[G.packWho];
  const kitY=tabY+tabH+6*s, kitH=PORT?24*s:26*s;
  const kit=[
    whoE?('HP '+sheetHpNow(whoE)+'/'+sheetHpMax(whoE)): (sheet?('HP '+sheet.maxhp):''),
    pk.bombs?('Bombs '+pk.bombs):'',
    pk.burps?("Burp "+pk.burps):'',
    ((pk.ales||0)+((pk.healPots||[]).length))?('Beer '+((pk.ales||0)+((pk.healPots||[]).length))):'',
    pk.rations?('Rations '+pk.rations):'',
    pk.torches?('Torches '+pk.torches):'',
    pk.ammo?('Bolts '+pk.ammo):'',
    pk.bombKit?('Kit '+pk.bombKit):''
  ].filter(Boolean);
  const mac=player();
  const ES=typeof EquipmentSlots!=='undefined'?EquipmentSlots:null;
  if(mac && ES && ES.describeAC){
    const d=ES.describeAC(G.equipped||{});
    kit.unshift('AC '+effectiveAC(mac)+(d.note?(' '+d.note):''));
  }
  plate(g,10*s,kitY,VW-20*s,kitH,5,.7);
  g.font='700 '+(8.5*s)+'px '+FONT_UI;
  g.fillStyle='rgba(220,200,160,0.88)';

  const shown=rows.slice(G.packScroll, G.packScroll+vis);
  const listW=listWidth-(maxScroll?32*s:0);

  if(!rows.length){

    g.textAlign='left';
  }
  shown.forEach((r,i)=>{
    const y=listTop+i*rowH, x=listX, h=rowH-4*s, w=listW;
    const sel=G.packSel && ((r.it&&r.it===G.packSel)||(r.gm&&r.gm===G.packSel)||r===G.packSel);
    plate(g,x,y,w,h,6,sel?0.95:0.84);
    if(sel){ g.strokeStyle='rgba(255,208,124,0.85)'; g.lineWidth=1.8; roundPath(g,x,y,w,h,6); g.stroke(); }
    const dropW=Math.min(70*s, w*0.16), dropH=Math.min(28*s, h-16*s);
    const dropX=x+w-dropW-6*s, dropY=y+(h-dropH)/2;
    const brkW=dropW, brkX=dropX-brkW-4*s, brkY=dropY;
    const actSpan=npcPack?0:(dropW+brkW+16*s);
    const th=h-10*s;
    drawThumb(g, packThumbFor(r), x+6*s, y+5*s, th);
    const tx=x+th+16*s, tw=w-th-actSpan-20*s;
    g.font='800 '+(PORT?11*s:12*s)+'px '+FONT_UI;
    g.fillStyle=packKindColor(r.kind);
    g.fillText((r.tag||r.kind).toUpperCase()+(r.worn?'  \u00b7  EQUIPPED':'')+(ghostPack?'  \u00b7  USE':(npcPack?'  \u00b7  SHARE':'')), tx, y+16*s);
    g.font='800 '+(PORT?17*s:22*s)+'px '+FONT_UI;
    g.fillStyle='#fff4d4';
    g.fillText(ellipsize(g, r.t, tw), tx, y+h*0.58);
    g.font='600 '+(PORT?10*s:11*s)+'px '+FONT_UI;
    g.fillStyle='rgba(190,170,130,0.78)';
    const hint=sel?packBreakHint(r):'';
    g.fillText(ellipsize(g, (hint&&hint!==(r.info||'')?(hint+'  ·  '):'')+(r.info||''), tw), tx, y+h-10*s);
    if(!npcPack){
      const locked=!!packBreakLock(r);
      drawChip(g,brkX,brkY,brkW,dropH,'Break',sel&&!locked,'#ffe9c0');
      if(locked){
        g.save(); g.globalAlpha=0.42;
        g.fillStyle='rgba(20,12,8,0.35)'; g.fillRect(brkX,brkY,brkW,dropH);
        g.restore();
      }
      if(!locked) menuHits.push({x:brkX,y:brkY,w:brkW,h:dropH,fn:()=>breakDownPackRow(r)});
      drawChip(g,dropX,dropY,dropW,dropH,'Drop',false,'#ffe9c0');
      menuHits.push({x:dropX,y:dropY,w:dropW,h:dropH,fn:()=>dropPackRow(r)});
    }
    menuHits.push({x,y,w:w-(npcPack?0:actSpan),h,fn:()=>usePackRow(r)});
  });
  if(maxScroll){
    drawScrollArrows(g, listX+listWidth-28*s, listTop, listH, G.packScroll>0, G.packScroll<maxScroll,
      ()=>{ G.packScroll=Math.max(0,(G.packScroll||0)-1); },
      ()=>{ G.packScroll=Math.min(maxScroll,(G.packScroll||0)+1); });
  }
  const back=G.packFrom==='play'?'Back to the seam':'Back to camp';
  const canEquip=G.packSel&&isPackEquipable({kind:'magic',it:G.packSel});
  const canTake=isGhostPack();
  if(canEquip&&canTake){
    menuBtn(g,'Equip',VW/2-(PORT?110:120)*s,VH-22*s,Math.min(120*s,VW*.28),34*s,()=>{
