name: Refresh Observatory indicators
on:
  schedule:
    - cron: '23 12 * * *' # daily, UTC; scheduled workflows may be delayed
  workflow_dispatch:
  push:
    paths:
      - 'anomaly-atlas/update_signals.py'
      - 'anomaly-atlas/update_uap_sources.py'
      - 'anomaly-atlas/update_ai_horizons.py'
      - 'anomaly-atlas/update_live_events.py'
      - 'anomaly-atlas/update_ap_coverage.py'
      - '.github/workflows/observatory-refresh.yml'
permissions:
  contents: write
concurrency:
  group: observatory-signal-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh primary-source indicators
        run: python anomaly-atlas/update_signals.py
      - name: Refresh METR benchmark snapshot and frontier model timeline
        run: python anomaly-atlas/update_ai_horizons.py
      - name: Refresh public USGS, EONET and CISA advisory events
        run: python anomaly-atlas/update_live_events.py
      - name: Discover AP News story links by topic (metadata only)
        run: python anomaly-atlas/update_ap_coverage.py
      - name: Refresh public MUFON newsroom links (not protected case records)
        run: python anomaly-atlas/update_uap_sources.py
      - name: Commit refreshed public-source data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anomaly-atlas/signals.json anomaly-atlas/uap_sources.json anomaly-atlas/ai_horizons.json anomaly-atlas/events_live.json anomaly-atlas/ap_coverage.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Observatory AI, cyber and UAP public-source data'
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push origin HEAD:main; then exit 0; fi
              sleep 3
            done
            echo 'Could not publish refreshed signals after three attempts' >&2
            exit 1
          fi