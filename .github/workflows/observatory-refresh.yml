name: Refresh Observatory indicators
on:
  schedule:
    - cron: '23 12 * * *' # daily, UTC; scheduled workflows may be delayed
  workflow_dispatch:
  push:
    paths:
      - 'anomaly-atlas/update_signals.py'
      - '.github/workflows/observatory-refresh.yml'
permissions:
  contents: write
concurrency:
  group: observatory-signal-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh primary-source indicators
        run: python anomaly-atlas/update_signals.py
      - name: Commit only refreshed signal data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add anomaly-atlas/signals.json
          if ! git diff --cached --quiet; then
            git commit -m 'Daily update of independent observatory indicators'
            git push
          fi