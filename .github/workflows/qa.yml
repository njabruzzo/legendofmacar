name: qa
on:
  pull_request:
  push:
    branches: [main]
jobs:
  living-macar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test
      - name: Install Chrome
        run: |
          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/chrome.deb
          google-chrome --version
      - run: npm install --no-save puppeteer-core@24.15.0
      - name: Protected asset render smoke
        run: node src/qa/protected-assets-render-smoke.js
        env:
          CHROME: /usr/bin/google-chrome
