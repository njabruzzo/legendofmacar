name: Probe public GEIPAN export format
on:
  push:
    paths:
      - 'anomaly-atlas/uap_geipan_probe.py'
      - '.github/workflows/observatory-uap-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect public CSV schema, without archiving witness data
        run: python anomaly-atlas/uap_geipan_probe.py
