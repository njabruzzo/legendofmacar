/* ---------------------------- utils ---------------------------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const ri=(a,b)=>Math.floor(rnd(b+1,a));
function h2(x,y){ let n=(x|0)*374761393+(y|0)*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
function h3(x,y,s){ let n=(x|0)*374761393+(y|0)*668265263+(s|0)*1442695041; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
const ang=(dx,dy)=>Math.atan2(dy,dx);
function approach(a,b,max){ const d=b-a; if(Math.abs(d)<=max) return b; return a+Math.sign(d)*max; }
function turnToward(e,dx,dy,dt,rate){
  if(!(dx||dy)) return 0;
  const ta=ang(dx,dy); let ca=ang(e.fdx,e.fdy);
  let d=((ta-ca+Math.PI*3)%TAU)-Math.PI;
  const max=(rate||16)*dt;
  if(Math.abs(d)<=max){ e.fdx=Math.cos(ta); e.fdy=Math.sin(ta); return 0; }
  ca+=Math.sign(d)*max; e.fdx=Math.cos(ca); e.fdy=Math.sin(ca);
  return Math.abs(d)-max;
}
function gaitAdvance(e,dt){ e.gait=(e.gait||0)+Math.max(0,dt)*2.55; }
function partyForm(i,p){
  const slots=[[-1.15,0.95],[-1.15,-0.95],[-2.15,0.55],[-2.15,-0.55]];
  const s=slots[(i-1)%4], fx=p.fdx, fy=p.fdy, rx=-fy, ry=fx;
  return {x:p.x+fx*s[0]+rx*s[1], y:p.y+fy*s[0]+ry*s[1]};
}
function bestSlide(e,dx,dy){
  let best=null, score=-1e9;
  for(let i=0;i<8;i++){
    const a=i*Math.PI/4, sx=Math.cos(a), sy=Math.sin(a);
    if(sx*dx+sy*dy<0.12) continue;
    const nx=e.x+sx*0.5, ny=e.y+sy*0.5;
    if(!canBe(nx,e.y,e.r,e) && !canBe(e.x,ny,e.r,e)) continue;
    const along=sx*dx+sy*dy;
    if(along>score){ score=along; best={dx:sx,dy:sy}; }
  }
  return best;
}
function nearestWalk(x,y,e){
  if(walk(x,y,e)) return {x,y};
  let best=null, bd=99;
  for(let j=-3;j<=3;j++) for(let i=-3;i<=3;i++){
    const nx=(x|0)+i+0.5, ny=(y|0)+j+0.5;
    if(!walk(nx,ny,e)) continue;
    const d=Math.hypot(nx-x,ny-y);
    if(d<bd){ bd=d; best={x:nx,y:ny}; }
  }
  return best;
}
function recordTrail(p){
  G.trail=G.trail||[];
  const last=G.trail[G.trail.length-1];
  if(!last || Math.hypot(p.x-last.x,p.y-last.y)>0.16){
    G.trail.push({x:p.x,y:p.y,fdx:p.fdx,fdy:p.fdy});
    if(G.trail.length>140) G.trail.shift();
  }
}
function trailSlot(i){
  const t=G.trail||[];
  if(t.length<4) return null;
  const need=1.2*(i+1);
  let acc=0;
  for(let k=t.length-1;k>0;k--){
    acc+=Math.hypot(t[k].x-t[k-1].x, t[k].y-t[k-1].y);
    if(acc>=need) return t[k];
  }
  return t[0];
}
function steerWalk(e,dx,dy,sp,dt){
  if(!(dx||dy) || sp<=0){ e.ix=0; e.iy=0; e.moving=0; return 0; }
  const m=Math.hypot(dx,dy)||1;
  dx/=m; dy/=m;
  turnToward(e, dx, dy, dt, 22);
  const aligned=e.fdx*dx+e.fdy*dy;
  if(aligned<0.16){
    e.ix=0; e.iy=0; e.moving=1;
    gaitAdvance(e, dt);
    return 0;
  }
  const ox=e.x, oy=e.y;
  e.ix=e.fdx*sp; e.iy=e.fdy*sp;
  move(e, e.ix, e.iy, dt);
  let distMoved=Math.hypot(e.x-ox, e.y-oy);
  if(distMoved<0.002){
    const slide=bestSlide(e, dx, dy);
    if(slide){
      turnToward(e, slide.dx, slide.dy, dt, 20);
      e.ix=e.fdx*sp; e.iy=e.fdy*sp;
      move(e, e.ix, e.iy, dt);
      distMoved=Math.hypot(e.x-ox, e.y-oy);
    }
  }
  e.moving=1;
  gaitAdvance(e, dt);
  if(distMoved<0.002){ e.ix=0; e.iy=0; }
  return distMoved;
}
function shade(h,a){
  h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(clamp(a>0? v+(255-v)*a : v*(1+a),0,255));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgbOf(h){ h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }

function openCredits(from){ G.creditsFrom=from||'title'; G.scene='credits'; }
function leaveCredits(){
  const from=G.creditsFrom||'title';
  G.creditsFrom=null;
  if(from==='pause'){ G.scene='play'; G.paused=true; }
  else G.scene=from;

let musicEl=null, musicKey=null, musicUnlocked=false, musicRetryAt=0, musicPlayP=null;
function musicIsPlaying(){
  return !!(musicEl && !musicEl.paused && !musicEl.ended);
}
function ensureMusic(){
  if(musicEl) return musicEl;
  musicEl=new Audio();
  musicEl.loop=true;
  musicEl.preload='auto';
  musicEl.playsInline=true;
  musicEl.setAttribute('playsinline','');
  musicEl.setAttribute('webkit-playsinline','');
  musicEl.volume=0.55;
  musicEl.addEventListener('canplay', tryPlayMusic);
  musicEl.addEventListener('canplaythrough', tryPlayMusic);
  return musicEl;
}
function tryPlayMusic(){
  if(!musicUnlocked || !musicEl || !musicEl.src) return;
  if(musicIsPlaying() || musicPlayP) return;
  musicPlayP=musicEl.play();
  if(musicPlayP&&musicPlayP.then){
    musicPlayP.then(()=>{ musicPlayP=null; }).catch(()=>{ musicPlayP=null; });
  } else musicPlayP=null;
}
function unlockMusic(){
  musicUnlocked=true;
  ensureMusic();
  tryPlayMusic();
}
function playMusic(key){
  const src=MUSIC[key];
  if(!src) return;
  const el=ensureMusic();
  if(musicKey===key) return;
  musicKey=key;
  musicPlayP=null;
  el.src=assetUrl(src);
  el.loop=true;
  el.volume=0.55;
  tryPlayMusic();
}
function wantedMusic(){
  if(!G || !G.scene) return 'title';
  const sc=G.scene;
  if(sc==='title' || sc==='chapters' || sc==='credits') return 'title';
  return (G.ch===1 || (G.lvl && G.lvl.n===1)) ? 'ch1' : 'ch2';
}
function syncMusic(){
  playMusic(wantedMusic());
  if(musicUnlocked && musicEl && !musicIsPlaying() && G && G.t>=musicRetryAt){
    musicRetryAt=G.t+1;
    tryPlayMusic();
  }
}

function loadSprites(done){
  const first=['title_splash','icon_pack','icon_sword','icon_flask','icon_shield','icon_cross',
    'icon_plant','icon_shovel','icon_bomb','skill_icons','macar','pordoom','fendur','orbo','talpor',
    'macar_w1','macar_w2','macar_atk','pordoom_dead','fendur_dead','orbo_dead','talpor_dead',
    'rubydoor','shroom','lantern','floor_mine','wall_cave'];
  const seen={};
  const queue=[];
  first.forEach(k=>{ if(SPRITE_FILES[k]&&!seen[k]){ seen[k]=1; queue.push(k); } });
  Object.keys(SPRITE_FILES).forEach(k=>{ if(!seen[k]){ seen[k]=1; queue.push(k); } });
  const total=queue.length;
  if(!total){ SPLASH_STATE='fail'; done(); return; }
  SPLASH_STATE=SPRITE_FILES.title_splash?'loading':'fail';
  let i=0, inflight=0, finished=0;
  const MAX=6;
  function next(){
    while(inflight<MAX && i<total){
      const k=queue[i++];
      inflight++;
      const img=new Image();
      const fin=ok=>{
        if(ok) SPR[k]=img;
        if(k==='title_splash') SPLASH_STATE=ok?'ready':'fail';
        inflight--; finished++;
        if(finished>=total) done();
        else next();
      };
      img.onload=()=>fin(true);
      img.onerror=()=>fin(false);
      img.src=assetUrl(SPRITE_FILES[k]);
    }
  }
  next();
}
function drawBillboard(g,img,h){
  if(!img||!img.width) return false;
  const W=h*(img.width/Math.max(1,img.height));
  g.drawImage(img,-W/2,-h,W,h); return true;
}
function drawEntBillboard(g,e,img,z){
  if(!img||!img.width) return false;
  const k=entSpriteKey(e);
  const ref=SPR[k]||img;
  if(e.crushed||e.prone){
    const ph=42*z, pw=ph*(img.width/Math.max(1,img.height));
    g.drawImage(img, -pw/2, -ph*0.82, pw, ph);
    return true;
  }
  const scale=entSpriteH(e,z)/Math.max(1, ref.height);
  const W=img.width*scale, H=img.height*scale;
  g.drawImage(img, -W/2, -H, W, H);
  return true;
}

function entAnimImg(e){
  const k=entSpriteKey(e);
  if(!k) return null;
  if(e.dead||e.crushed) return SPR[k+'_dead']||null;
  if(e.atk>0 && SPR[k+'_atk']) return SPR[k+'_atk'];
  if(e.moving){
    const a=SPR[k+'_w1'], b=SPR[k+'_w2'];
    if(a||b){
      const frames=[a,b].filter(Boolean);
      const phase=((e.gait||0)%1)<0.5?0:1;
      return frames[phase%frames.length];
    }
  }
  return SPR[k]||null;
}

  if(e.boss||e.kind==='king'||e.kind==='warden'||e.kind==='drake'||e.kind==='horror'||e.kind==='beholder'||

     e.kind==='roper'||e.kind==='giantslug'||e.kind==='gelcube'||e.kind==='lich'||e.kind==='vampire'||

     e.kind==='crysmal'||e.kind==='greenslime') return 48*z;

/* value noise + fBm, for the baked rock surfaces */
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(h3(xi,yi,s),h3(xi+1,yi,s),u), lerp(h3(xi,yi+1,s),h3(xi+1,yi+1,s),u), v);
}
function fbm(x,y,s,oct){ let v=0,a=.5,f=1,t=0;
  for(let o=0;o<(oct||3);o++){ v+=a*vnoise(x*f,y*f,s+o*17); t+=a; f*=2.03; a*=.5; } return v/t; }

/* ---------------------------- grid helpers ---------------------------- */
function newGrid(w,h,f){ const g=[]; for(let y=0;y<h;y++){const r=new Uint8Array(w); r.fill(f); g.push(r);} return g; }
function rect(g,x,y,w,h,t){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) if(g[j]&&g[j][i]!==undefined) g[j][i]=t; }
function corridor(g,x1,y1,x2,y2,wd,t){
  wd=wd||3; const hw=(wd/2)|0;
  const sx=Math.min(x1,x2),ex=Math.max(x1,x2),sy=Math.min(y1,y2),ey=Math.max(y1,y2);
  rect(g,sx,y1-hw,ex-sx+1,wd,t);
  rect(g,x2-hw,sy,wd,ey-sy+1,t);
}

/* ==========================================================================
   TEXTURE BAKE  -  per-pixel rock surfaces, generated once per chapter
   ========================================================================== */
const RS=2, RTW=84*RS, RTH=42*RS, RWH=50*RS;
const TEX={ floor:[], floorA:[], wall:[], wallVein:[], blood:[], scorch:null, grain:null, ready:false };

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function diamond(x,c,cx,cy,w,h){ x.beginPath(); x.moveTo(cx,cy-h/2); x.lineTo(cx+w/2,cy);
  x.lineTo(cx,cy+h/2); x.lineTo(cx-w/2,cy); x.closePath(); }

/* multiply every opaque pixel by an fBm field -> real grain, not speckles */
function grainPass(x,w,h,seed,amt,sc){
  let img; try{ img=x.getImageData(0,0,w,h); }catch(_){ return; }
  if(!img||!img.data) return;
  const d=img.data;
  for(let j=0;j<h;j++){
    for(let i=0;i<w;i++){
      const o=(j*w+i)*4; if(d[o+3]<8) continue;
      const n=fbm(i/sc,j/sc,seed,3);
      const fine=vnoise(i/2.1,j/2.1,seed+91);
      const m=(1-amt)+amt*(n*0.82+fine*0.34);
      d[o]=clamp(d[o]*m,0,255); d[o+1]=clamp(d[o+1]*m,0,255); d[o+2]=clamp(d[o+2]*m,0,255);
    }
  }
  x.putImageData(img,0,0);
}

function rockChunk(x,cx,cy,r,base,seed){
  const pts=6+((h3(seed,3,7)*3)|0);
  x.beginPath();
  for(let i=0;i<pts;i++){ const a=i/pts*TAU, rr=r*(0.62+h3(seed,i,11)*0.55);
    const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr*0.62;
    i?x.lineTo(px,py):x.moveTo(px,py); }
  x.closePath();
  const g=x.createLinearGradient(cx-r,cy-r*0.7,cx+r*0.6,cy+r*0.7);
  g.addColorStop(0,shade(base,0.30)); g.addColorStop(0.5,base); g.addColorStop(1,shade(base,-0.42));
  x.fillStyle=g; x.fill();
  x.strokeStyle='rgba(14,10,7,0.55)'; x.lineWidth=1.3*RS; x.stroke();
  // top facet catching the key light
  x.beginPath();
  for(let i=0;i<pts;i++){ const a=i/pts*TAU, rr=r*0.48*(0.7+h3(seed,i,11)*0.5);
    const px=cx-r*0.16+Math.cos(a)*rr, py=cy-r*0.20+Math.sin(a)*rr*0.6;
    i?x.lineTo(px,py):x.moveTo(px,py); }
  x.closePath(); x.fillStyle='rgba(255,238,205,0.14)'; x.fill();
  // contact shadow
  x.fillStyle='rgba(0,0,0,0.30)';
  x.beginPath(); x.ellipse(cx+r*0.28,cy+r*0.44,r*0.85,r*0.34,0,0,TAU); x.fill();
}

function bakeFloor(pal,seed,accent){
  const c=mk(RTW,RTH), x=c.getContext('2d');
  diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.save(); x.clip();
  x.fillStyle= accent? shade(pal.fA,0.10) : (seed%2?pal.fA:pal.fB);
  x.fillRect(0,0,RTW,RTH);
  grainPass(x,RTW,RTH,seed*31,0.62,9);
  // cut-stone slabs inside the diamond
  x.strokeStyle='rgba(18,12,8,0.38)'; x.lineWidth=1.4*RS;
  const slabs=2+((h3(seed,2,4)*2)|0);
  for(let k=0;k<slabs;k++){
    const t=0.22+k*0.22; x.beginPath();
    x.moveTo(RTW*t, RTH*0.5); x.lineTo(RTW*0.5, RTH*t*0.55); x.stroke();
  }
  // dirt pooling in the low corners
  const dg=x.createRadialGradient(RTW/2,RTH*0.22,3,RTW/2,RTH*0.55,RTW*0.58);
  dg.addColorStop(0,'rgba(255,236,205,0.12)'); dg.addColorStop(0.55,'rgba(0,0,0,0.08)'); dg.addColorStop(1,'rgba(0,0,0,0.42)');
  x.fillStyle=dg; x.fillRect(0,0,RTW,RTH);
  // deep cracks across the flagstone
  const nc=2+((h3(seed,5,2)*3)|0);
  for(let k=0;k<nc;k++){
    x.strokeStyle='rgba(12,8,5,0.72)'; x.lineWidth=(1.4+h3(seed,k,4)*2.2)*RS; x.lineCap='round';
    x.beginPath();
    let px=h3(seed,k,7)*RTW, py=h3(seed,k,8)*RTH; x.moveTo(px,py);
    for(let i=0;i<5;i++){ px+=(h3(seed,k*9+i,3)-0.5)*RTW*0.28; py+=(h3(seed,k*7+i,6)-0.5)*RTH*0.32; x.lineTo(px,py); }
    x.stroke();
    x.strokeStyle='rgba(255,228,190,0.08)'; x.lineWidth=1*RS; x.stroke();
  }
  // moss / spore in the grout for fungal chambers
  if(pal.key && pal.key[1]==='b' || pal.amb==='#080614'){
    for(let k=0;k<5;k++){
      x.fillStyle='rgba(120,70,200,'+(0.08+h3(seed,k,88)*0.12)+')';
      x.beginPath(); x.ellipse(RTW*(0.2+h3(seed,k,89)*0.6), RTH*(0.25+h3(seed,k,90)*0.5),
        (2+h3(seed,k,91)*5)*RS,(1+h3(seed,k,92)*3)*RS,0,0,TAU); x.fill();
    }
  }
  // scattered rock
  const nr= accent?2:3+((h3(seed,1,9)*3)|0);
  for(let k=0;k<nr;k++){
    const cx=RTW*(0.18+h3(seed,k,21)*0.64), cy=RTH*(0.20+h3(seed,k,22)*0.60);
    rockChunk(x,cx,cy,(4+h3(seed,k,23)*9)*RS,pal.rock,seed*7+k);
  }
  x.restore();
  // ambient occlusion hugging the tile seams
  x.save(); diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.clip();
  x.strokeStyle='rgba(0,0,0,0.52)'; x.lineWidth=8*RS;
  diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.28)'; x.lineWidth=3.4*RS; x.stroke();
  x.restore();
  // lit upper edges
  x.strokeStyle= accent?'rgba(255,214,140,0.38)':'rgba(255,236,200,0.18)'; x.lineWidth=2*RS;
  x.beginPath(); x.moveTo(2,RTH/2); x.lineTo(RTW/2,2); x.lineTo(RTW-2,RTH/2); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.45)'; x.lineWidth=2.2*RS;
  x.beginPath(); x.moveTo(2,RTH/2); x.lineTo(RTW/2,RTH-2); x.lineTo(RTW-2,RTH/2); x.stroke();
  return c;
}

function bakeWall(pal,seed,vein){
  const H=RWH+RTH, c=mk(RTW,H), x=c.getContext('2d');
  const cyTop=RWH+RTH/2-RWH;                    // centre of the top diamond
  // ---- left face
  x.save();
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2);
  x.lineTo(0,RWH); x.closePath();
  x.clip();
  x.fillStyle=pal.wL; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13+3,0.5,9);
  for(let i=0;i<5;i++){ x.fillStyle='rgba(0,0,0,'+(0.10+h3(seed,i,2)*0.14)+')';
    x.fillRect(0,RWH-RTH/2+i*RTH*0.34+h3(seed,i,5)*6, RTW/2, (2+h3(seed,i,8)*5)*RS); }
  for(let i=0;i<7;i++){ x.strokeStyle='rgba(255,240,210,0.055)'; x.lineWidth=1.4*RS;
    const px=h3(seed,i,31)*RTW*0.5, py=RWH-RTH/2+h3(seed,i,32)*RTH*1.1;
    x.beginPath(); x.moveTo(px,py); x.lineTo(px+7*RS,py+5*RS); x.stroke(); }
  x.fillStyle='rgba(0,0,0,0.34)'; x.fillRect(0,RWH+RTH*0.10,RTW/2,RTH*0.5);
  x.restore();
  // ---- right face (away from key light, darkest)
  x.save();
  x.beginPath(); x.moveTo(RTW,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2);
  x.lineTo(RTW,RWH); x.closePath(); x.clip();
  x.fillStyle=pal.wR; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13+9,0.5,9);
  for(let i=0;i<5;i++){ x.fillStyle='rgba(0,0,0,'+(0.12+h3(seed,i,12)*0.14)+')';
    x.fillRect(RTW/2,RWH-RTH/2+i*RTH*0.34+h3(seed,i,15)*6, RTW/2, (2+h3(seed,i,18)*5)*RS); }
  x.fillStyle='rgba(0,0,0,0.40)'; x.fillRect(RTW/2,RWH+RTH*0.10,RTW/2,RTH*0.5);
  x.restore();
  // ---- top cap
  x.save(); diamond(x,c,RTW/2,RWH-RTH/2,RTW-2,RTH-2); x.clip();
  x.fillStyle=pal.wT; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13,0.52,10);
  for(let k=0;k<3;k++){ const cx=RTW*(0.24+h3(seed,k,41)*0.52), cy=(RWH-RTH/2)+(h3(seed,k,42)-0.5)*RTH*0.5;
    rockChunk(x,cx,cy,(3.5+h3(seed,k,43)*6)*RS,pal.rock,seed*5+k); }
  const tg=x.createLinearGradient(0,RWH-RTH,0,RWH);
  tg.addColorStop(0,'rgba(255,242,214,0.16)'); tg.addColorStop(1,'rgba(0,0,0,0.12)');
  x.fillStyle=tg; x.fillRect(0,RWH-RTH,RTW,RTH);
  x.restore();
  // silhouette ink
  x.strokeStyle='rgba(0,0,0,0.5)'; x.lineWidth=1.6*RS;
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH-RTH); x.lineTo(RTW,RWH-RTH/2);
  x.lineTo(RTW,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.lineTo(0,RWH); x.closePath(); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.35)'; x.lineWidth=1.3*RS;
  x.beginPath(); x.moveTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.stroke();
  // top-edge rim
  x.strokeStyle='rgba(255,244,220,0.20)'; x.lineWidth=1.8*RS;
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH-RTH); x.lineTo(RTW,RWH-RTH/2); x.stroke();
  if(vein){
    x.save();
    x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.lineTo(0,RWH); x.closePath(); x.clip();
    x.strokeStyle=hexA(pal.key,0.5); x.lineWidth=2.6*RS; x.lineCap='round';
    x.beginPath(); x.moveTo(RTW*0.06,RWH-RTH*0.30);
    x.lineTo(RTW*0.20,RWH-RTH*0.02); x.lineTo(RTW*0.13,RWH+RTH*0.22); x.stroke();
    x.strokeStyle=hexA(pal.key,0.22); x.lineWidth=6*RS; x.stroke();
    for(let i=0;i<5;i++){ x.fillStyle=hexA(pal.key,0.55+h3(seed,i,61)*0.4);
      x.beginPath(); x.arc(RTW*(0.07+h3(seed,i,62)*0.16), RWH-RTH*0.28+h3(seed,i,63)*RTH*0.5, (1.2+h3(seed,i,64)*1.8)*RS,0,TAU); x.fill(); }
    x.restore();
  }
  return c;
}

function bakeBlood(seed){
  const c=mk(60*RS,32*RS), x=c.getContext('2d');
  const base= seed%3===0? '#3a0d10' : '#4d1013';
  for(let i=0;i<7;i++){
    const cx=30*RS+(h3(seed,i,71)-0.5)*40*RS, cy=16*RS+(h3(seed,i,72)-0.5)*18*RS;
    const r=(3+h3(seed,i,73)*10)*RS;
    const g=x.createRadialGradient(cx,cy,1,cx,cy,r);
    g.addColorStop(0,hexA(base,0.85)); g.addColorStop(0.6,hexA(base,0.5)); g.addColorStop(1,hexA(base,0));
    x.fillStyle=g; x.beginPath(); x.ellipse(cx,cy,r,r*0.55,0,0,TAU); x.fill();
  }
  for(let i=0;i<9;i++){ const cx=30*RS+(h3(seed,i,74)-0.5)*54*RS, cy=16*RS+(h3(seed,i,75)-0.5)*24*RS;
    x.fillStyle=hexA(base,0.5+h3(seed,i,76)*0.35);
    x.beginPath(); x.ellipse(cx,cy,(0.8+h3(seed,i,77)*2.4)*RS,(0.5+h3(seed,i,78)*1.4)*RS,0,0,TAU); x.fill(); }
  return c;
}

function bakeGrain(){
  const S=140, c=mk(S,S), x=c.getContext('2d');
  const img=x.createImageData(S,S), d=img.data;
  for(let i=0;i<S*S;i++){ const v=(Math.random()*255)|0; const o=i*4;
    d[o]=d[o+1]=d[o+2]=v; d[o+3]=26; }
  x.putImageData(img,0,0); return c;
}

function bakeTextures(pal){
  TEX.ready=false;
  TEX.floor=[]; TEX.floorA=[]; TEX.wall=[]; TEX.wallVein=[];
  for(let i=0;i<6;i++) TEX.floor.push(bakeFloor(pal,i+1,false));
  for(let i=0;i<2;i++) TEX.floorA.push(bakeFloor(pal,i+31,true));
  for(let i=0;i<4;i++) TEX.wall.push(bakeWall(pal,i+1,false));
  for(let i=0;i<2;i++) TEX.wallVein.push(bakeWall(pal,i+11,true));
  if(!TEX.blood.length) for(let i=0;i<4;i++) TEX.blood.push(bakeBlood(i+1));
  if(!TEX.grain) TEX.grain=bakeGrain();
  TEX.ready=true;
}

function foesLeft(){ return G.ents.some(e=>e.team==='foe'&&!e.dead&&!e.npc); }
function nearestCorpse(e, r){
  let best=null, bd=r;
  for(const o of G.ents){
    if(!o.corpse||o.looted) continue;
    const d=dist(e,o);
    if(d<bd){ bd=d; best=o; }
  }
  return best;
}
function lootCorpse(e){
  if(!e||!e.corpse||e.looted) return;
  e.looted=1;
  const kit=e.kit||{};
  const bits=[];
  ['bombs','rations','ales','torches','ammo'].forEach(k=>{
    if(kit[k]){
      addToPack('macar',k,kit[k]);
      if(k==='rations'&&kit[k]===7) bits.push('a week of rations');
      else bits.push(kit[k]+' '+k);
    }
  });
  if(kit.gp){
    addCoin('gp',kit.gp);
    awardPartyXp(kit.gp,'Treasure ('+kit.gp+' gp)',e);
    bits.push(kit.gp+' gp');
  }
  const who=e.name||'the kin';
  say('MACAR takes '+who+(bits.length?"'s kit: "+bits.join(', '):'. Empty')+'.','#ffd27a');
  ftext(e.x,e.y-0.35,bits[0]||'Looted','#ffd27a');
  burst(e.x,e.y,'#ffd27a',10,2.2);
  const L=G.lvl;
  if(L&&L.n===1&&e.col&&e.col.key==='pordoom'){
    L.flags.looted=1; if(L.objs[0]) L.objs[0].d=1;
    hint('Four bombs and a week of rations. The ruby waits east.',5);
  }
}
function wave(list){ list.forEach(([k,x,y])=>{ const e=FOE[k](); e.x=x+rnd(.6,-.6); e.y=y+rnd(.6,-.6);
  e.stun=rnd(.5,.1); G.ents.push(e); burst(e.x,e.y,'#5a4a3a',10); }); }
function joinAllies(list){
  list.forEach(([k,x,y])=>{
    const e=ALLY[k](); e.x=x+rnd(.4,-.4); e.y=y+rnd(.4,-.4); e.stun=.25;
    G.ents.push(e); burst(e.x,e.y,'#ffe08a',14);
  });
}

  if(!G.res||!G.res.ironstone&&G.res.ironstone!==0) initEconomy();
  G.lvl=makeChapter(n);
  bakeTextures(G.lvl.pal);
  const sp=G.lvl.spawn;
  ensurePartySheets();
  ensureCharXp();
  ensurePacks();
  syncPackTotals();
  G.inspect=null;
  ROSTER.forEach((r,i)=>{
    const hero=i===0;
    const sheet=G.abil[r.key];
    const cls=sheet.cls;
    const hp=sheet.maxhp*ADD_SCALE;
    const atkCd=hero?1.05:r.role==='bolt'?1.7:r.role==='faith'?1.25:1.15;
    const crush=n===1 && !hero && CRUSH_SPOTS[r.key];
    if(!hero && n!==1) return;
    const x=crush?crush.x:sp.x+(hero?0:Math.cos(i*1.3)*1.5);
    const y=crush?crush.y:sp.y+(hero?0:Math.sin(i*1.3)*1.5);
    const e=ent({kind:'dwarf',team:'party',x,y, hp, sp:hero?4.3:4.0, dmg:8, range:hero?1.4:1.15, cd:atkCd,
      r:.36, col:r, name:r.name, hero, role:r.role, gear:G.gear[r.key],
      lvl:sheet.lvl||PARTY_LVL, cls, race:'dwarf', abil:sheet, ac:5, dice:sheet.dice});
    e.ac=partyAC(e);
    if(r.role==='bolt'){e.ranged=1;e.range=6.5;}
    if(r.role==='faith'){e.range=1.05;e.heals=1;e.cls='c';}
    if(n===1){ e.fdx=1; e.fdy=0; }
    if(hero){ e.atkMax=0.78; }
    if(crush){
      e.hp=0; e.dead=1; e.crushed=1; e.deadT=0.62; e.prone=1; e.moving=0;
      if(crush.kit){
        e.kit=crush.kit; e.corpse=1; e.looted=0;
        const pk=packOf(r.key);
        Object.keys(crush.kit).forEach(k=>{ if(typeof pk[k]==='number') pk[k]=0; });
        syncPackTotals();
      }
    }
    G.ents.push(e);
  });
  if(!G.abilSaid){
    G.abilSaid=1;
    ROSTER.forEach(r=>{
      const a=G.abil[r.key];
      say(r.name+'  '+clsLabel(a.cls)+PARTY_LVL+'  HP '+a.maxhp+' (max HD + CON)  '+fmtAbil(a),'#c9b895');
    });
  }
  applyEquipped();
  (G.carryEffects||[]).forEach(x=>{
    const e=G.ents.find(z=>z.hero)||G.ents[0];

function hitBonus(e){
  let b=0;
  if(e.team==='party'){
    const g=e.gear||{};
    const ab=entityAbil(e);
    b+=(g.wt||0)+(g.magicAtk||0);
    if(g.rune) b+=1;
    if(e.buff>0) b+=2;
    if((g.wd||1)<=0) b-=2;
    if(e.ranged) b+=dexMissile(ab&&ab.dex);
    else b+=strMods(ab, e.cls||'f').hit;
  } else {
    if(e.sa&&/\+\d/.test(e.sa)){ const m=e.sa.match(/\+(\d)/); if(m) b+=+m[1]; }
  }
  if(e.strMul>1) b+=2;
  return b;
}
function effectiveAC(e, atk){
  const rear=atk?isRearAttack(atk,e):false;
  const helpless=e.stun>0||e.prone;
  let ac=(typeof e.ac==='number')?e.ac:(e.team==='party'?partyAC(e):6);
  if(e.team==='party') ac=partyAC(e,{rear, helpless});
  if(e.stoneskin>0) ac-=2;
  return clamp(ac,-8,10);
}
function addAttack(atk, def){
  if(!G.fightOn) beginFight(def.team==='foe'?def:atk);
  const rear=isRearAttack(atk, def);
  const ac=effectiveAC(def, atk);
  const need=thacNeed(atk, ac);
  const roll=d20();
  let bonus=hitBonus(atk);
  if(rear) bonus+=2;
  if(def.stun>0||def.prone) bonus+=4;
  if(atk.ranged){
    const d=dist(atk,def), rng=atk.range||6;
    if(d>rng*0.85) bonus-=5;
    else if(d>rng*0.55) bonus-=2;
  }
  const tot=roll+bonus;
  const extra=need<0?-need:0;
  const hit=roll===20 || tot>=need;
  const pct=hitChancePct(need, bonus);
  const line=(atk.name||'atk')+' d20 '+roll+(bonus?((bonus>=0?'+':'')+bonus):'')+'='+tot+' vs '+need+' (AC '+ac+') '+pct+'%'+(hit?' hit':' miss')+(rear?' rear':'');
  if(atk.team==='party') say(line, hit?'#ff6a5a':'#9a8a78');
  if(!hit){ ftext(def.x,def.y,'miss '+tot,'#8a7a68'); return 0; }
  ftext(def.x,def.y,tot+' vs '+need,'#ffe6a8');
  let raw;
  if(atk.dice) raw=rollExpr(atk.dice);
  else if(atk.team==='party') raw=rollExpr(atk.hero?'1d8':atk.ranged?'1d6':'1d6+1');
  else raw=Math.max(1, Math.round((atk.dmg||6)/1.65*rnd(1.15,.85)));
  if(atk.team==='party' && !atk.ranged) raw+=strMods(entityAbil(atk), atk.cls||'f').dmg;
  if(atk.team==='party' && atk.ranged && atk.role==='pick') raw+=strMods(entityAbil(atk), atk.cls||'f').dmg;
  raw+=extra;
  if(atk.strMul) raw=Math.round(raw*atk.strMul);
  raw=Math.round(raw*ADD_SCALE*wepMult(atk));
  if(atk.buff>0) raw=Math.round(raw*1.25);
  return Math.max(1, raw);
}
const SAVE_F=[
  [14,15,16,17,17],[13,14,15,16,16],[11,12,13,13,14],[10,11,12,12,13],
  [8,9,10,9,11],[7,8,9,8,10],[5,6,7,5,8],[4,5,6,4,7],[3,4,5,4,6]
];
const SAVE_C=[
  [10,13,14,16,15],[9,12,13,15,14],[7,10,11,13,12],[6,9,10,12,11],
  [5,8,9,11,10],[4,7,8,10,9],[2,5,6,8,7]
];
const SAVE_T=[
  [13,12,14,16,15],[12,11,12,15,13],[11,10,10,14,11],
  [10,9,8,13,9],[9,8,6,12,7],[8,7,4,11,5]
];
function dwarfSaveBonus(e, kind){
  if(!(e.team==='party'||e.race==='dwarf')) return 0;
  const con=(entityAbil(e)&&entityAbil(e).con)||0;
  if(!con) return 0;
  if(kind==='poison'||kind==='rod'||kind==='spell') return Math.floor(con/3.5);
  return 0;
}
function saveNeed(e, kind){
  const idx={poison:0,death:0,petrify:1,rod:2,breath:3,spell:4}[kind]||4;
  let need;
  if(e.team==='party'){
    const lv=clamp(e.lvl||partyLevel(),1,17);
    const cls=e.cls||(e.role==='faith'?'c':e.role==='bolt'?'t':'f');
    if(cls==='c'||e.role==='faith') need=SAVE_C[clamp(Math.floor((lv-1)/3),0,6)][idx];
    else if(cls==='t') need=SAVE_T[clamp(Math.floor((lv-1)/4),0,5)][idx];
    else need=SAVE_F[clamp(Math.floor((lv-1)/2),0,8)][idx];
  } else {
    const hd=monsterHD(e);
    const row=hd<1?0:hd<3?1:hd<5?2:hd<7?3:hd<9?4:hd<11?5:hd<13?6:hd<15?7:hd<17?8:8;
    need=SAVE_F[Math.min(row,8)][idx];
  }
  return need-dwarfSaveBonus(e, kind);
}
function savingThrow(e, kind){
  const need=saveNeed(e,kind)-(e.juice||0);
  const roll=d20();
  const ok=roll===20||roll>=need;
  ftext(e.x,e.y+(ok?0.15:0),(ok?'save':'fail')+' '+roll,'#cfe3ff');
  return ok;
}
function beginFight(foe){
  G.fightOn=1;
  let pSeg=ri(1,6), fSeg=ri(1,6);
  const sneak=foe&&foe.sa&&/Surprise/i.test(foe.sa);
  const pSur=pSeg<=(sneak?4:2), fSur=fSeg<=(sneak?1:2);
  if(pSur&&!fSur){
    G.ents.forEach(e=>{
      if(e.team!=='party'||e.dead) return;
      const ab=entityAbil(e);
      const segs=Math.max(0, pSeg-dexAttackAdj(ab&&ab.dex));
      if(segs>0) e.stun=Math.max(e.stun||0, segs*0.65);
    });
    say('Surprise — they have '+pSeg+' segments. DEX trims yours.','#ff6a5a');
  } else if(fSur&&!pSur){
    G.ents.forEach(e=>{ if(e.team==='foe'&&!e.dead) e.stun=Math.max(e.stun||0, fSeg*0.65); });
    say('Surprise — you have '+fSeg+' segments.','#ffd27a');
  } else if(pSur&&fSur){
    say('Both sides are caught off-guard. No surprise.','#c9b895');
  }
  const ip=ri(1,6), iff=ri(1,6);
  G.initWin=ip>iff?'party':ip<iff?'foe':'tie';
  say('Initiative d6  '+ip+' vs '+iff+' — '+(G.initWin==='tie'?'tied, weapon speed':(G.initWin==='party'?'ours':'theirs'))+'.','#c9b895');
  const gap=Math.abs(ip-iff);
  const delay=0.55+gap*0.18;
  if(G.initWin==='party'){
    G.ents.forEach(e=>{ if(e.team==='foe'&&!e.dead) e.stun=Math.max(e.stun||0, delay); });
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead) e.ct=Math.min(e.ct||0, 0.05); });
  } else if(G.initWin==='foe'){
    G.ents.forEach(e=>{
      if(e.team!=='party'||e.dead) return;
      const ab=entityAbil(e);
      const trim=Math.max(0, dexAttackAdj(ab&&ab.dex)*0.12);
      e.stun=Math.max(e.stun||0, Math.max(0.2, delay-trim));
    });
  } else {
    say('Tie — slower weapons wait.','#c9b895');
    G.ents.forEach(e=>{
      if(e.dead) return;
      const slow=e.ranged?0.15:(e.hero?0.08:0.2);
      e.stun=Math.max(e.stun||0, slow);
    });
  }
}
function endFightIfClear(){
  if(G.fightOn && !G.ents.some(e=>e.team==='foe'&&!e.dead)) G.fightOn=0;
}

function potionByRoll(r){
  for(const p of POTIONS) if(r>=p.a&&r<=p.b) return p;
  return POTIONS[POTIONS.length-1];
}
function rollPotion(){ return potionByRoll(d10000()); }
function givePotion(p, silent){
  ensurePacks();
  packOf('macar').potions.push({n:p.n,d:p.d,k:p.k,gp:p.gp});
  syncPackTotals();
  if(!silent) say('Potion into MACAR\'s pack: '+p.n+'.','#e0d2ff');
}


/* ==========================================================================
   AD&D 1e DMG magic items (Table III and subtables)
   Potions that come up as a category still use the campaign d10,000 list.
   Names follow the Dungeon Masters Guide; notes are short play effects.
   ========================================================================== */
function pickRange(table, roll){
  roll=roll==null?d100():roll;
  for(const row of table){ if(roll>=row.a && roll<=row.b) return row; }
  return table[table.length-1];
}
function magItem(o){
  return {n:o.n, d:o.d, cat:o.cat, k:o.k||o.cat, plus:o.plus||0, charges:o.charges||0,
    vs:o.vs||'', cursed:!!o.cursed, xp:o.xp||0};
}
function giveMagic(it, silent){
  ensurePacks();
  packOf('macar').magic.push(it);
  syncPackTotals();
  if(!silent) say(it.cat+': '+it.n+' — stowed in MACAR\'s pack. '+it.d, '#ffd27a');
}

function rollDmgScroll(){ const r=pickRange(DMG_SCROLL); return magItem({cat:'Scroll',n:r.n,d:r.d,k:r.k,cursed:r.cursed}); }
function rollDmgRing(){ const r=pickRange(DMG_RING); return magItem({cat:'Ring',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed,charges:r.charges}); }
function rollDmgWand(){ const r=pickRange(DMG_WAND); return magItem({cat:'Rod/Staff/Wand',n:r.n,d:r.d,k:r.k,plus:r.plus,charges:r.charges||20,cursed:r.cursed}); }
function rollDmgArmor(){ const r=pickRange(DMG_ARMOR); return magItem({cat:'Armor/Shield',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed}); }
function rollDmgSword(){ const r=pickRange(DMG_SWORD); return magItem({cat:'Sword',n:r.n,d:r.d,k:r.k,plus:r.plus,vs:r.vs,cursed:r.cursed}); }
function rollDmgWeapon(){ const r=pickRange(DMG_WEAP); return magItem({cat:'Weapon',n:r.n,d:r.d,k:r.k,plus:r.plus,cursed:r.cursed}); }
function rollDmgMisc(){
  const map=d100();
  const table=map<=15?DMG_MISC_A:map<=30?DMG_MISC_B:map<=45?DMG_MISC_C:map<=60?DMG_MISC_D:DMG_MISC_E;
  const r=pickRange(table);
  return magItem({cat:'Miscellaneous',n:r.n,d:r.d,k:r.k,plus:r.plus,charges:r.charges,cursed:r.cursed});
}

function magicCategory(kind){
  if(kind==='potion') return 'potion';
  if(kind==='scroll') return 'scroll';
  if(kind==='saw'){
    const r=d100();
    if(r<=40) return 'sword';
    if(r<=70) return 'armor';
    return 'weapon';
  }
  if(kind==='anynos'){
    const r=d100();
    if(r<=25) return 'potion';
    if(r<=45) return 'scroll';
    if(r<=55) return 'ring';
    if(r<=65) return 'wand';
    if(r<=72) return 'misc';
    if(r<=85) return 'armor';
    return 'weapon';
  }
  const r=d100();
  if(r<=20) return 'potion';
  if(r<=35) return 'scroll';
  if(r<=40) return 'ring';
  if(r<=45) return 'wand';
  if(r<=48) return 'misc';
  if(r<=55) return 'armor';
  if(r<=75) return 'sword';
  return 'weapon';
}
function rollMagicItem(kind){
  const cat=magicCategory(kind);
  if(cat==='potion'){
    const p=rollPotion();
    return {kind:'potion', potion:p, n:p.n, d:p.d, cat:'Potion'};
  }
  let it;
  if(cat==='scroll') it=rollDmgScroll();
  else if(cat==='ring') it=rollDmgRing();
  else if(cat==='wand') it=rollDmgWand();
  else if(cat==='misc') it=rollDmgMisc();
  else if(cat==='armor') it=rollDmgArmor();
  else if(cat==='sword') it=rollDmgSword();
  else it=rollDmgWeapon();
  return {kind:'magic', item:it, n:it.n, d:it.d, cat:it.cat};
}
function extraMagicForKind(kind){
  const extra=[];
  if(kind==='anyp'||kind==='anyps') extra.push('potion');
  if(kind==='anys'||kind==='anyps') extra.push('scroll');
  return extra;
}

function applyEquipped(){
  if(!G.equipped) G.equipped={weapon:null,armor:null,ring:null,wand:null};
  const eq=G.equipped;
  Object.values(G.gear||{}).forEach(g=>{ g.magicAtk=0; g.magicAc=0; });
  const mac=G.gear&&G.gear.macar;
  if(eq.weapon&&mac){
    mac.magicAtk=eq.weapon.plus||0;
    if(eq.weapon.cursed) mac.magicAtk=eq.weapon.plus|| -1;
  }
  const acPlus=(eq.armor&&!eq.armor.cursed?eq.armor.plus||0:eq.armor&&eq.armor.cursed?eq.armor.plus|| -1:0)
    +(eq.ring&&!eq.ring.cursed?eq.ring.plus||0:0);
  Object.values(G.gear||{}).forEach(g=>{ g.magicAc=acPlus; });
  if(eq.armor&&eq.armor.cursed) Object.values(G.gear||{}).forEach(g=>{ g.magicAc=(eq.armor.plus|| -1)+(eq.ring&&eq.ring.plus||0); });
}
function useMagicItem(it, e){
  e=e||player();
  if(!it) return;
  say(it.n+': '+it.d, '#ffd27a');
  if(it.cursed){
    if(it.k==='cursed'&&/Armor|Shield|Sword|Weapon/.test(it.cat||'')){
      if(/Sword|Weapon|Hammer|Axe|Mace|Rod|Staff/.test(it.n+it.cat)) G.equipped.weapon=it;
      else G.equipped.armor=it;
      applyEquipped();
      say('The curse binds. It will not be set aside.','#ff6a5a');
      return;
    }
    if(e){ e.stun=Math.max(e.stun||0,2.2); damage(e, ADD_SCALE*4, '#ff6a5a'); }
    return;
  }
  if(it.k==='weapon'||it.cat==='Sword'||it.cat==='Weapon'||it.cat==='Rod/Staff/Wand'&&it.k==='weapon'){
    G.equipped.weapon=it; applyEquipped();
    say('Wielded: '+it.n+'.','#ffd27a'); return;
  }
  if(it.k==='armor'||it.cat==='Armor/Shield'){
    G.equipped.armor=it; applyEquipped();
    say('Donned: '+it.n+'.','#cfe3ff'); return;
  }
  if(it.k==='ring'||it.cat==='Ring'){
    G.equipped.ring=it; applyEquipped();
    if(it.k==='regen'&&e) e.potionRegen=Math.max(e.potionRegen||0, 999);
    if(it.k==='invis'&&e){ e.invis=30; e.aggro=2; }
    say('Worn: '+it.n+'.','#e0d2ff'); return;
  }
  if(it.k==='wand'||it.cat==='Rod/Staff/Wand'){
    G.equipped.wand=it;
    if(e&&it.charges){
      const t=nearestFoe(e,8);
      const dmg=rollDice(6,6,0)*ADD_SCALE;
      if(t){ damage(t, dmg, '#7ad0ff'); burst(t.x,t.y,'#7ad0ff',16,3); }
      it.charges=Math.max(0,(it.charges||1)-1);
      say(it.n+' ('+it.charges+' charges left).','#7ad0ff');
    }
    return;
  }
  if(it.k==='heal'){
    if(e){ applyHeal(e, 18); clearPoison(e); }
    return 'spent';
  }
  if(/Ointment|Curing|Periapt of Wound/.test(it.n)){
    if(e){ applyHeal(e, 18); clearPoison(e); }
    return;
  }
  if(it.k==='scroll'||it.k==='prot'){
    if(e){ e.guardT=Math.max(e.guardT||0, 8); e.mr=1; applyHeal(e, 8); }
    say('The scroll is read and the ink fades.','#e0d2ff');
    return 'spent';
  }
  if(it.k==='ammo'){
    const t=e?nearestFoe(e,8):null;
    const dmg=rollDice(6,6,0)*ADD_SCALE;
    if(t){ damage(t, dmg, '#7ad0ff'); burst(t.x,t.y,'#7ad0ff',16,3); }
    return 'spent';
  }
  if(it.k==='sense'){ if(e) e.trueSee=40; return; }
  if(e){ e.buff=Math.max(e.buff||0, 10); applyHeal(e, 6); }
}

function chanceOk(pct){ return d100()<=pct; }
function rngAmt(a,b){ return a+ri(0,Math.max(0,b-a)); }
function addCoin(k,n){
  if(!G.coin) G.coin={cp:0,sp:0,ep:0,gp:0,pp:0};
  G.coin[k]=(G.coin[k]||0)+n;
}
function convertHoard(coins, gems, jew, magN, magKind, where){
  const notes=[];
  if(coins.cp){ addCoin('cp',coins.cp); const n=Math.min(6,Math.max(1,Math.round(coins.cp/1500))); gain('ironstone',n); notes.push(coins.cp+' cp'); }
  if(coins.sp){ addCoin('sp',coins.sp); const n=Math.min(6,Math.max(1,Math.round(coins.sp/1000))); gain('ironstone',n); notes.push(coins.sp+' sp'); }
  if(coins.ep){ addCoin('ep',coins.ep); const n=Math.min(5,Math.max(1,Math.round(coins.ep/600))); gain('deepsilver',n); notes.push(coins.ep+' ep'); }
  if(coins.gp){ addCoin('gp',coins.gp); const n=Math.min(6,Math.max(1,Math.round(coins.gp/700))); gain('deepsilver',n); notes.push(coins.gp+' gp'); }
  if(coins.pp){ addCoin('pp',coins.pp); const n=Math.min(4,Math.max(1,Math.round(coins.pp/200))); gain('starmetal',n); notes.push(coins.pp+' pp'); }
  if(gems){ gain(gems>=8?'starmetal':'deepsilver', Math.min(4,Math.max(1,Math.round(gems/8)))); notes.push(gems+' gems'); }
  if(jew){ gain('silk', Math.min(4,Math.max(1,Math.round(jew/3)))); notes.push(jew+' jewelry'); }
  const extras=extraMagicForKind(magKind);
  const rolls=magN+extras.length;
  let magGp=0;
  for(let i=0;i<rolls;i++){
    const kind=i<magN?(magKind||'any'):extras[i-magN];
    const got=rollMagicItem(kind);
    if(got.kind==='potion'){ givePotion(got.potion,1); notes.push('Potion: '+got.n); magGp+=got.potion.gp||got.potion.xp||0; }
    else { giveMagic(got.item,1); notes.push(got.cat+': '+got.n); magGp+=got.item.gp||got.item.xp||0; }
  }
  if(notes.length){
    say(((where&&where.name)?where.name+' drops':'Treasure')+': '+notes.join(', ')+'.','#ffd27a');
    if(where&&where.x!=null) ftext(where.x, where.y-0.4, notes[0], '#ffd27a');
  }
  const gp=treasureGp(coins, gems, jew)+Math.round(magGp||0);
  if(gp) awardPartyXp(gp, 'Treasure ('+gp+' gp)', where);
  return notes;
}
function rollLair(letter){
  const T=LAIR[letter]; if(!T) return null;
  const coins={}; let gems=0,jew=0,magN=0,magKind='any';
  const coin= (key,row)=>{
    if(!row) return;
    if(chanceOk(row[0])) coins[key]=rngAmt(row[1],row[2])*(row[3]||1);
  };
  coin('cp',T.cp); coin('sp',T.sp); coin('ep',T.ep); coin('gp',T.gp); coin('pp',T.pp);
  if(T.gem&&chanceOk(T.gem[0])) gems=rngAmt(T.gem[1],T.gem[2]);
  if(T.jew&&chanceOk(T.jew[0])) jew=rngAmt(T.jew[1],T.jew[2]);
  if(T.mag&&chanceOk(T.mag[0])){ magN=T.mag[2]||1; magKind=T.mag[1]; }
  return {coins,gems,jew,magN,magKind};
}
function rollIndividual(letter){
  const coins={};
  if(letter==='J') coins.cp=rollDice(3,8,0);
  else if(letter==='K') coins.sp=rollDice(3,6,0);
  else if(letter==='L') coins.ep=rollDice(2,6,0);
  else if(letter==='M') coins.gp=rollDice(2,4,0);
  else if(letter==='N') coins.pp=rollDice(1,6,0);
  else if(letter==='Q') return {coins:{},gems:chanceOk(50)?ri(1,4):0,jew:0,magN:0};
  else if(letter==='R') return {coins:{},gems:0,jew:chanceOk(50)?ri(2,8):0,magN:0};
  else if(letter==='S') return {coins:{},gems:0,jew:0,magN:chanceOk(40)?ri(1,8):0,magKind:'potion'};
  else if(letter==='T') return {coins:{},gems:0,jew:0,magN:chanceOk(50)?ri(1,4):0,magKind:'scroll'};
  else if(letter==='X') return {coins:{},gems:0,jew:0,magN:chanceOk(60)?2:0,magKind:'potion'};
  else if(letter==='Y'){ if(chanceOk(70)) coins.gp=rollDice(2,6,0)*100; }
  else return null;
  return {coins,gems:0,jew:0,magN:0,magKind:'any'};
}
function applyHeal(e, n){
  if(!e||e.dead) return 0;
  const amt=Math.round(n*ADD_SCALE);
  e.hp=Math.min(e.maxhp, e.hp+amt);
  ftext(e.x,e.y,'+'+amt,'#e0c169',e.hero);
  burst(e.x,e.y,'#c9a24a',10,2);
  return amt;
}
function clearPoison(e){ e.poisonT=0; e._pt=0; }
function drinkPotion(p, e){

  say(e.name+' drinks '+p.n+'.','#e0d2ff');

  else if(k==='antidote'){ clearPoison(e); say('The poison leaves.','#6aff8a'); }
  else if(k==='haste'){ e.buff=Math.max(e.buff||0, lv*0.6); e.cd=Math.max(.28,(e.cd||1)*0.5); e.sp=(e.sp||3)*1.35; }
  else if(k==='invis'){ e.invis=lv*0.6; e.aggro=2; }
  else if(k==='invuln'){ e.guardT=Math.max(e.guardT||0, lv*0.6); }
  else if(k==='fly'){ e.sp=Math.max(e.sp,5.2); e.buff=Math.max(e.buff||0,8); }
  else if(k==='regen'||k==='fast'){ e.potionRegen=60; }
  else if(k==='str2'){ e.strMul=2; e.buff=Math.max(e.buff||0, lv*0.6); }
  else if(k==='str3'){ e.strMul=3; e.buff=Math.max(e.buff||0, lv*0.6); }
  else if(k==='vital'){ e.hp=Math.min(e.maxhp*2, e.hp+e.maxhp); e.maxhp=Math.round(e.maxhp*1.35); }
  else if(k==='stoneskin'){ e.stoneskin=4+ri(1,4); }
  else if(k==='guard'){ e.guardT=Math.max(e.guardT||0, lv); }
  else if(k==='mr'){ e.mr=1; }
  else if(k==='prot0'){ e.prot0=1; }
  else if(k==='life'){ G.ents.forEach(x=>{ if(x.team==='party'&&x.dead){ x.dead=0; x.crushed=0; x.prone=0; x.hp=Math.round(x.maxhp*.5); }}); say('The dead kin draw breath.','#ffe08a'); }
  else if(k==='gear'){
    if(e.gear){ e.gear.wd=e.gear.wmax; e.gear.ad=e.gear.amax; e.gear.wt=(e.gear.wt||0)+1; }
    say('The oil takes on the kit.','#cfe3ff');
  }
  else if(k==='atk'){
    const t=nearestFoe(e,7);
    if(t){ const dmg=rollExpr(k==='unused'?'1d20':'1d20')*ADD_SCALE; damage(t,dmg,'#ff8a3a'); }
    else applyHeal(e,8);
  }
  else if(k==='juice'){ e.juice=(e.juice||0)+1; }
  else if(k==='sense'||k==='see'){ e.trueSee=30; }
  else { e.buff=Math.max(e.buff||0,6); applyHeal(e,6); }
}
function useHerb(name, e){
  e=e||player(); const h=HERBS.find(x=>x.n===name); if(!h||!e) return;

  else if(k==='healall'){ e.hp=e.maxhp; applyHeal(e,1); }

  else if(k==='haste'){ e.buff=3; e.cd=Math.max(.3,(e.cd||1)*0.5); e.sp=(e.sp||3)*1.3; e.stun=Math.max(e.stun||0,0); e.afterHaste=5; }
  else if(k==='regen'||k==='tickheal'){ e.potionRegen=8; }

  else applyHeal(e,4);

/* ---------------------------- combat ---------------------------- */
function damage(e,amt,col){
  if(e.dead) return;
  if(e.stoneskin>0){ e.stoneskin--; ftext(e.x,e.y,'stoneskin','#cfe3ff'); return; }
  if(e.guard) amt*=.5;
  if(e.team==='party'){ amt*=(1-armCut(e)); wear(e.gear,0,0.7); }
  amt=Math.round(amt); e.hp-=amt; e.flash=.18;
  ftext(e.x,e.y,'-'+amt,col||(e.team==='party'?'#ff6a5a':'#ffe6a8'),e.boss);
  burst(e.x,e.y, e.glow||(e.kind==='statue'?'#b8b0a0':e.kind==='undead'?'#7cff9c':e.kind==='spider'?'#9a6bff':'#a3241f'),7,2.2);
  if(e.hero) G.hurt=Math.min(1,G.hurt+amt/70);
  if(e.hp<=0){ e.dead=1; e.deadT=0;
    if(e.team==='foe'){ G.kills++; burst(e.x,e.y,'#c2452e',18,3.5);
      awardPartyXp(monsterXpValue(e), e.name||'Foe', e);
      foeDrop(e);
      addDecal(e.x,e.y,(e.boss?2.6:1)*rnd(1.5,.9));
      if(e.boss) for(let i=0;i<5;i++) addDecal(e.x+rnd(1.6,-1.6),e.y+rnd(1.6,-1.6),rnd(2,1.2));
      if(e.boss){ shake(26); G.flash={c:'#fff',a:.45}; say(e.name+' is broken.','#ffd27a'); G.hitstop=.12; }
    } else { say(e.name+' goes down!','#ff6a5a'); if(e.hero){ if(e.prot0){ e.prot0=0; e.dead=0; e.hp=Math.round(e.maxhp*.35); say('Protection from Wounds holds.','#ffe08a'); } else G.scene='dead'; } } }
}
function onHitFx(atk,o,dmg){
  if(!atk||!o) return dmg;
  const sa=atk.sa||'';
  if(atk.rust&&o.gear){ wear(o.gear,14,6); ftext(o.x,o.y+0.2,'Rust!','#ff8a3a'); }
  if(atk.poison||/Poison/i.test(sa)){
    if(!savingThrow(o,'poison')) o.poisonT=Math.max(o.poisonT||0,4.2);
    else ftext(o.x,o.y+0.25,'poison save','#6aff8a');
  }
  if(/Energy Drain/i.test(sa)){
    if(!savingThrow(o,'death')){ dmg=Math.round(dmg*1.35); o.maxhp=Math.max(20,o.maxhp-ADD_SCALE*4); }
  }
  if(/Petrif|Gaze|Cockatrice/i.test(sa)){
    if(!savingThrow(o,'petrify')){ o.stun=Math.max(o.stun||0,2.8); dmg=Math.round(dmg*1.25); ftext(o.x,o.y,'held','#c8d4e0'); }
  }
  if(/Breath/i.test(sa)){
    if(savingThrow(o,'breath')) dmg=Math.max(1,Math.round(dmg*0.5));
  }
  if(/Paralys|Paralyz/i.test(sa)){
    if(!savingThrow(o,'poison')) o.stun=Math.max(o.stun||0,2.4);
  }
  if(/Confusion|Mind Blast|Spore/i.test(sa)){
    if(o.mr||savingThrow(o,'spell')) {}
    else o.stun=Math.max(o.stun||0,1.6);
  }
  return dmg;
}
function meleeSwing(e,arc,reach,dmg,col){
  const fa=ang(e.fdx,e.fdy); let hit=0;
  for(const o of G.ents){ if(o.dead||o.team===e.team||o.npc||o.sleeping) continue;
    const d=dist(e,o); if(d>reach+o.r) continue;
    const a=ang(o.x-e.x,o.y-e.y); const df=Math.abs(((a-fa+Math.PI*3)%TAU)-Math.PI);
    if(df<=arc/2){
      const rolled=addAttack(e,o);
      if(rolled){ damage(o,onHitFx(e,o,rolled),col);
        wear(e.gear,0.35,0);
        const k=.5/(d+.4); o.kx+=Math.cos(a)*k*2.4; o.ky+=Math.sin(a)*k*2.4; hit=1; }
    } }
  const L=G.lvl;
  const rock=dmg||18;
  if(e.hero&&L&&L.plug&&!L.flags.broke&&dist(e,L.plug)<reach+.95){
    L.plug.hp-=rock; hit=1; burst(L.plug.x,L.plug.y-.2,'#7a6045',9,2.4); ftext(L.plug.x,L.plug.y,'crack','#d8c49a'); }
  if(hit){ shake(4); G.hitstop=Math.max(G.hitstop,.035); }
  return hit;
}
function shoot(from,tx,ty,dmg,kind,col,spd){
  const a=ang(tx-from.x,ty-from.y);
  G.shots.push({x:from.x,y:from.y,vx:Math.cos(a)*(spd||9),vy:Math.sin(a)*(spd||9),dmg,team:from.team,kind,col,life:2.2,spin:0,
    rust:from.rust,poison:from.poison,sa:from.sa,from});
}
function nearestFoe(e,maxd){ let b=null,bd=maxd||99;
  for(const o of G.ents){ if(o.team!=='foe'||o.dead) continue; const d=dist(e,o); if(d<bd){bd=d;b=o;} } return b; }
function nearestAlly(e,maxd,hurt){ let b=null,bd=maxd||99;
  for(const o of G.ents){ if(o.team!=='party'||o.dead) continue; if(hurt&&o.hp>=o.maxhp*.7) continue;
    const d=dist(e,o); if(d<bd){bd=d;b=o;} } return b; }

/* ---------------------------- movement ---------------------------- */
function walk(x,y,e){ const L=G.lvl; if(!L) return false;
  const i=x|0,j=y|0; if(j<0||j>=L.h||i<0||i>=L.w) return false;
  const t=L.grid[j][i];
  if(t===0||t===3) return true;
  if(t===4) return !!(e && e.kind==='gnome');
  return false; }
function canBe(x,y,r,e){
  return walk(x+r,y,e)&&walk(x-r,y,e)&&walk(x,y+r,e)&&walk(x,y-r,e)&&
         walk(x+r*.7,y+r*.7,e)&&walk(x-r*.7,y-r*.7,e)&&walk(x+r*.7,y-r*.7,e)&&walk(x-r*.7,y+r*.7,e); }
function move(e,dx,dy,dt){
  const nx=e.x+dx*dt, ny=e.y+dy*dt; let moved=0;
  if(canBe(nx,e.y,e.r,e)){ e.x=nx; moved=1; }
  if(canBe(e.x,ny,e.r,e)){ e.y=ny; moved=1; }
  return moved;
}

const IN={stick:null,keys:{},taps:[]};
const UIBTN=[];
const UI={};

const BARSLOTS=[
  {key:'attack', ico:'sword',  num:1, label:'STRIKE'},
  {key:'ale',    ico:'flask',  num:2, label:'ALE'},
  {key:'wall',   ico:'shield', num:3, label:'GUARD'},
  {key:'pack',   ico:'pack',   num:4, label:'PACK'},
  {key:'rally',  ico:'cross',  num:5, label:'RALLY'},
];
const EXTRASLOTS=[
  {key:'swing', ico:'hammer', label:'SWING'},
  {key:'throw', ico:'pick',   label:'PICK'},
  {key:'bomb',  ico:'bomb',   label:'BOMB'},
  {key:'search', ico:'plant', label:'HERB'},
  {key:'shovel', ico:'shovel', label:'DIG'},
];

function layoutUI(){
  UIBTN.length=0;
  const s=UIS;
  const slot = PORT ? Math.max(28, 38*s) : Math.max(34, 46*s);
  const gap = PORT? 5*s : 7*s;
  const n=BARSLOTS.length;
  const extraN=EXTRASLOTS.length;
  const barW = n*slot + (n-1)*gap;
  const extraW = extraN*slot + (extraN-1)*gap;
  const orbR = PORT? Math.max(26, 32*s) : Math.max(32, 40*s);
  const skillsW = Math.max(barW, extraW);
  const totalW = orbR*2 + 14*s + skillsW;
  const by = VH - (PORT? 36*s : 34*s) - slot/2;
  const extraY = by - slot - (PORT? 8*s : 10*s);
  let left = VW/2 - totalW/2;
  const stickReserve = (PORT? 108*s : 128*s);
  if(left < stickReserve) left = stickReserve;
  if(left + totalW > VW - 8*s) left = Math.max(8*s, VW - totalW - 8*s);

  UI.orb = { r:orbR, x: left + orbR, y: by };
  UI.attack={x:0,y:0,r:slot/2};
  const barLeft = left + orbR*2 + 14*s;
  BARSLOTS.forEach((b,i)=>{
    const x = barLeft + i*(slot+gap) + slot/2;
    const btn={x, y:by, r:slot/2, key:b.key, ico:b.ico, num:b.num, slot:1};
    if(b.key==='attack') UI.attack=btn;
    UIBTN.push(btn);
  });
  EXTRASLOTS.forEach((b,i)=>{
    const x = barLeft + i*(slot+gap) + slot/2;
    UIBTN.push({x, y:extraY, r:slot/2, key:b.key, ico:b.ico, label:b.label, slot:1});
  });
  UIBTN.push({x:VW-(PORT?88*s:118*s)-28*s, y:22*s, r:14*s, key:'pause'});
  UIBTN.push({x:UI.orb.x, y:UI.orb.y, r:UI.orb.r, key:'pack', ico:'pack', label:'PACK', packOrb:1});
  UI.stickHome={ x: (PORT? 56*s : 78*s), y: VH - (PORT? 128*s : 112*s), r: (PORT?38*s:46*s) };
}
function btnAt(x,y){ for(const b of UIBTN) if(Math.hypot(x-b.x,y-b.y)<b.r*1.25) return b; return null; }

const pressed={};
function onDown(id,x,y,ptr){
  if(G.scene!=='play'||G.paused){ IN.taps.push({x,y}); return; }
  const b=btnAt(x,y);
  if(b){ pressed[id]={btn:b}; b.hold=1; fire(b.key); return; }
  if(G.inspect){
    const hit=(UI.portraitHits||[]).find(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);
    if(hit){ G.inspect=hit.key; return; }
    G.inspect=null; return;
  }
  const ph=(UI.portraitHits||[]).find(p=>x>=p.x&&x<=p.x+p.w&&y>=p.y&&y<=p.y+p.h);
  if(ph){ G.inspect=ph.key; return; }
  const nearHome = Math.hypot(x-UI.stickHome.x,y-UI.stickHome.y) < UI.stickHome.r*2.2;
  if(G.aim && !(x<VW*0.5||nearHome)){ aimDrag=id; }
  const touchStick = ptr!=='mouse' && (x < VW*0.5 || nearHome);
  if(touchStick){ IN.stick={id,ox:x,oy:y,x,y,moved:0}; return; }
  IN.taps.push({x,y});
}
function onMove(id,x,y){ const k=IN.stick; if(k&&k.id===id){ k.x=x;k.y=y;
  if(Math.hypot(x-k.ox,y-k.oy)>10) k.moved=1; return; }
  if(G.aim&&aimDrag===id){ const p=player(); if(p){ const w=s2w(x,y+22*ZOOM), d=dist(p,w), R=8;
    G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y}; } } }
let aimDrag=null;
function onUp(id,x,y){
  if(aimDrag===id) aimDrag=null;
  const k=IN.stick;
  if(k&&k.id===id){ if(!k.moved) IN.taps.push({x:k.ox,y:k.oy}); IN.stick=null; }
  if(pressed[id]){ pressed[id].btn.hold=0; delete pressed[id]; }
}
cv.addEventListener('pointerdown',e=>{ unlockMusic();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  onDown(e.pointerId,e.clientX,e.clientY,e.pointerType); e.preventDefault(); });
cv.addEventListener('pointermove',e=>onMove(e.pointerId,e.clientX,e.clientY));
cv.addEventListener('pointerup',e=>onUp(e.pointerId,e.clientX,e.clientY));
cv.addEventListener('pointercancel',e=>onUp(e.pointerId,e.clientX,e.clientY));
cv.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  unlockMusic();
  const k=e.key.toLowerCase(); IN.keys[k]=1;
  if(G.scene==='credits' && e.key==='Escape'){ leaveCredits(); return; }
  if(G.scene==='pack' && e.key==='Escape'){
    G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
    return;
  }
  if(G.scene!=='play'){ IN.taps.push({x:VW/2,y:VH/2}); return; }
  if(e.key===' '){ fire('attack'); e.preventDefault(); }
  if(e.key==='e'||e.key==='Enter') fire('use');
  if(e.key==='1') fire('attack');
  if(e.key==='2') fire('ale');
  if(e.key==='3') fire('wall');
  if(e.key==='4'||k==='i'||k==='p') fire('pack');
  if(e.key==='5') fire('rally');
  if(k==='q') fire('swing');
  if(k==='r') fire('throw');
  if(k==='b') fire('bomb');
  if(k==='f') fire('search');
  if(k==='g') fire('shovel');
  if(e.key==='Escape'){
    if(G.inspect){ G.inspect=null; return; }
    G.paused=!G.paused;
  }
});
window.addEventListener('keyup',e=>{ IN.keys[e.key.toLowerCase()]=0; });

/* ---------------------------- abilities ---------------------------- */
function fire(key){
  if(G.scene!=='play') return;
  if(key==='pause'){ G.paused=!G.paused; return; }
  if(G.paused) return;
  const p=player(); if(!p) return;
  if(key==='attack'){ p.dest=null; if(p.ct<=0){ p.atk=p.atkMax; p.ct=p.cd; p.swung=0; } return; }
  if(key==='use'){ if(PROMPT){ const f=PROMPT.fn; PROMPT=null; f(); } return; }
  if(key==='search'){
    if(G.searching){ G.searching=0; hint('Stopped searching.',1.8); return; }
    G.searching=1; G.digging=0; G.dig=null;
    p.searchCd=2.2;
    say('Eyes on the floor. Movement crawls.','#6aff8a');
    hint('Herb search on. Walk is very slow. Plant icon or F to stop.',3.8);
    return;
  }
  if(key==='shovel'){
    if(G.digging){ G.digging=0; G.dig=null; hint('Put the shovel up.',1.8); return; }
    G.searching=0; G.digging=1;
    const t=digTarget(p);
    if(!t){
      G.dig=null;
      hint('Face solid rock. Dwarves excavate one square foot per 10 minutes.',4.4);
      say('Shovel out. Face the stone.','#d8c49a');
    } else {
      G.dig={i:t.i,j:t.j,min:0};
      say('Digging. One square foot per 10 minutes.','#d8c49a');
      hint('Solid rock — 10 dungeon minutes a square (1 second = 1 minute).',4);
    }
    return;
  }
  if(key==='pack'){
    G.packFrom='play'; G.packWho=G.packWho||'macar';
    ensurePacks(); syncPackTotals();
    G.scene='pack';
    return;
  }
  if(key==='bomb'){
    if(G.aim){ G.aim=null; return; }
    syncPackTotals();
    if(partyCount('bombs')<=0){ hint('No bombs in any pack. Craft more at the bench.',2.8); return; }
    if(cds.bomb>0) return;
    const t=nearestFoe(p,8);
    G.aim = t? {x:t.x,y:t.y} : {x:p.x+p.fdx*4.5, y:p.y+p.fdy*4.5};
    p.dest=null; hint('Drag to aim, then press THROW. Bomb icon or B to cancel.',3.4);
    return;
  }
  const a=ABIL.find(z=>z.key===key); if(!a||cds[key]>0) return;
  cds[key]=a.cd; p.dest=null;
  if(key==='swing'){ p.atk=p.atkMax*1.5; p.swung=1; meleeSwing(p,TAU,2.6,44,'#ffd27a');
    burst(p.x,p.y,'#ffcf5c',28,4.6); shake(12); ftext(p.x,p.y-.6,'HAMMER ARC','#ffd27a',1);
    say('MACAR preparing special hammer attack!','#ff6a5a'); }
  if(key==='ale'){
    if(!takeFromPacks('ales')){ cds[key]=0; hint('No ale in the packs. Brew more at camp.',2.6); return; }
    const heal=8+skillLvl('ale')*2; let n=0;
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead&&dist(e,p)<6.5){
      applyHeal(e, heal); n++; } });
    learn('ale',3); say('The flask goes round. '+n+' dwarves the better for it.','#d2bd63');
  }
  if(key==='wall'){ p.guardT=5; burst(p.x,p.y,'#cfe3ff',18,2.4); ftext(p.x,p.y-.5,'GUARD','#cfe3ff'); }
  if(key==='throw'){ const t=nearestFoe(p,10); const tx=t?t.x:p.x+p.fdx*6, ty=t?t.y:p.y+p.fdy*6;
    const thrower=G.ents.find(z=>z.role==='pick'&&!z.dead)||p;
    thrower.fdx=Math.cos(ang(tx-thrower.x,ty-thrower.y)); thrower.fdy=Math.sin(ang(tx-thrower.x,ty-thrower.y));
    shoot(thrower, tx, ty, 0, 'pick', '#cfd6de', 12);
    say((thrower.name||'PICK')+' hurls a pick. d20 vs AC.','#ffb45c'); }
  if(key==='rally'){ G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead){ e.buff=8; e.hp=Math.min(e.maxhp,e.hp+30);
      burst(e.x,e.y,'#ffd27a',10,2);} }); ftext(p.x,p.y-.8,'RALLY','#ffd27a',1);
    say('MACAR raises the hammer. The kin answer.','#ffd27a'); }
}

/* ==========================================================================
   UPDATE
   ========================================================================== */
function update(dt){
  if(G.scene!=='play'||G.paused) return;
  G.elapsed+=dt;
  const L=G.lvl; if(!L) return;
  PROMPT=null;
  ABIL.forEach(a=>{ if(cds[a.key]>0) cds[a.key]=Math.max(0,cds[a.key]-dt); });
  if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
  G.hurt=Math.max(0,G.hurt-dt*1.4);

  const p=player();
  if(p){
    let dx=0,dy=0, analog=0;
    if(IN.stick && IN.stick.moved){
      const ox=IN.stick.x-IN.stick.ox, oy=IN.stick.y-IN.stick.oy, m=Math.hypot(ox,oy);
      const dead=6*UIS;
      if(m>dead){
        const f=clamp((m-dead)/(46*UIS),0,1);
        const sx=ox/m, sy=oy/m;
        let wx=sy/(TH/2)+sx/(TW/2), wy=sy/(TH/2)-sx/(TW/2);
        const wm=Math.hypot(wx,wy)||1; dx=wx/wm; dy=wy/wm; analog=f; p.dest=null;
      }
    }
    const K=IN.keys; let kx=0,ky=0;
    if(K['w']||K['arrowup']){kx-=1;ky-=1;} if(K['s']||K['arrowdown']){kx+=1;ky+=1;}
    if(K['a']||K['arrowleft']){kx-=1;ky+=1;} if(K['d']||K['arrowright']){kx+=1;ky-=1;}
    if(kx||ky){ const m=Math.hypot(kx,ky); dx=kx/m; dy=ky/m; analog=1; p.dest=null; }

    if(!dx&&!dy&&p.dest){
      if(p.dest.foe){
        const foe=G.ents.find(z=>z.id===p.dest.foe&&!z.dead);
        if(!foe) p.dest=null;
        else { p.dest.x=foe.x; p.dest.y=foe.y; }
      } else if(p.dest.loot){
        const pile=(G.loot||[]).find(z=>z.id===p.dest.loot&&!z.gone);
        if(!pile) p.dest=null;
        else { p.dest.x=pile.x; p.dest.y=pile.y; }
      } else if(p.dest.corpse){
        const body=G.ents.find(z=>z.id===p.dest.corpse&&z.corpse&&!z.looted);
        if(!body) p.dest=null;
        else { p.dest.x=body.x; p.dest.y=body.y; }
      }
    }
    if(!dx&&!dy&&p.dest){
      const d=dist(p,p.dest);
      const arrive=p.dest.foe?(p.range+.2):(p.dest.loot||p.dest.corpse)?0.72:0.26;
      if(d<=arrive){
        if(p.dest.loot){ const pile=(G.loot||[]).find(z=>z.id===p.dest.loot&&!z.gone); if(pile) takeLoot(pile); }
        if(p.dest.corpse){ const body=G.ents.find(z=>z.id===p.dest.corpse&&z.corpse&&!z.looted); if(body) lootCorpse(body); }
        if(!p.dest.foe && !p.dest.loot && !p.dest.corpse && canBe(p.dest.x,p.dest.y,p.r,p)){ p.x=p.dest.x; p.y=p.dest.y; }
        p.dest=null; p.stuck=0;
      }
      else {
        dx=p.dest.x-p.x; dy=p.dest.y-p.y; analog=1;
        p.stuck=(p.stuck||0)+dt;
        if(p.lastD!==undefined && p.lastD-d>0.008) p.stuck=0;
        p.lastD=d; if(p.stuck>1.4){ p.dest=null; p.stuck=0; }
      }
    }

    let sp=p.sp;
    if(G.searching) sp*=0.16;
    if(G.digging) sp*=0.14;
    if(analog && analog<1) sp*=analog;
    steerWalk(p, dx, dy, sp, dt);
    if(p.moving) recordTrail(p);
    p.guard = (p.guardT=Math.max(0,(p.guardT||0)-dt))>0;
    const stepped=nearestLoot(p,0.7);
    if(stepped) takeLoot(stepped);

    // auto-attack while standing in reach (Baldur's Gate: never swing while walking)
    if(!G.digging){
      const t=nearestFoe(p,p.range+.75);
      if(t&&p.ct<=0&&!p.moving){
        turnToward(p, t.x-p.x, t.y-p.y, dt, 18);
        p.atk=p.atkMax; p.ct=p.cd; p.swung=0; p.aim=t; }
      if(!t) p.aim=null;
    }

    G.cam.x=lerp(G.cam.x,p.x,1-Math.pow(.0004,dt));
    G.cam.y=lerp(G.cam.y,p.y,1-Math.pow(.0004,dt));
    const ci=p.x|0,cj=p.y|0;
    for(let j=cj-10;j<=cj+10;j++) for(let i=ci-10;i<=ci+10;i++)
      if(L.seen[j]&&L.seen[j][i]!==undefined&&(i-p.x)*(i-p.x)+(j-p.y)*(j-p.y)<100) L.seen[j][i]=1;
    p.searchCd=Math.max(0,(p.searchCd||0)-dt);
    if(G.searching && (p.searchCd||0)<=0){ p.searchCd=7; forageHerbs(p); }
    if(G.digging){
      const t=digTarget(p);
      if(t){
        if(!G.dig || G.dig.i!==t.i || G.dig.j!==t.j) G.dig={i:t.i,j:t.j,min:0};
        else {
          G.dig.min+=dt;
          if(G.dig.min>=DIG_MINUTES){
            breakRock(L,G.dig.i,G.dig.j);
            say('A square foot of stone comes away.','#d8c49a');
            G.dig=null;
          }
        }
      }
    }
    if(!PROMPT){
      const pile=nearestLoot(p,1.45);
      if(pile) interact('Pick up '+pile.label,()=>takeLoot(pile));
    }
    if(!PROMPT){
      const body=nearestCorpse(p,1.45);
      if(body) interact('Loot '+body.name,()=>lootCorpse(body));
    }
    if(!PROMPT){
      const sh=G.props.find(pr=>pr.k==='shroom'&&!(pr.picked>2)&&dist(p,pr)<1.35);
      if(sh) interact('Search for herbs',()=>{ p.searchCd=5; forageHerbs(sh); });
    }
    for(const pr of G.props){
      if(pr.sprung>0) pr.sprung=Math.max(0,pr.sprung-dt);
      if(pr.k!=='trap') continue;
      pr.cd=(pr.cd||0)-dt;
      if(pr.cd>0) continue;
      for(const e of G.ents){
        if(e.dead||e.team!=='party') continue;
        if(dist(e,pr)<0.72){
          const pit=pr.trap==='trap_pit', rune=pr.trap==='trap_runes';
          damage(e, pit?16:rune?13:11, rune?'#c07bff':'#ff6a4a');
          burst(pr.x,pr.y, rune?'#c07bff':'#c2452e', 12, 2.4);
          say((e.name||'Kin')+' hits a trap.','#ff6a6a');
          pr.cd=pit?2.8:rune?1.6:2.2; pr.sprung=0.55; shake(8); break;
        }
      }
    }
  }

  for(const e of G.ents){
    if(e.dead){ if(!e.crushed) e.deadT=(e.deadT||0)+dt; continue; }
    e.anim+=dt*(e.moving?1:.35);
    if(e.flash>0) e.flash-=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    if(e.regen && e.hp<e.maxhp) e.hp=Math.min(e.maxhp, e.hp+0.5*dt);
    if(e.potionRegen>0){ e.potionRegen-=dt; e.hp=Math.min(e.maxhp, e.hp+2.2*dt); }
    if(e.afterHaste>0 && (e.buff||0)<=0){ e.afterHaste-=dt; e.sp=Math.max(1.2,(e.sp||3)*0.985); }
    if(e.invis>0){ e.invis-=dt; if(e.invis<=0) e.aggro=7.5; }
    if(e.poisonT>0){
      e.poisonT-=dt; e._pt=(e._pt||0)+dt;
      if(e._pt>=0.7){ e._pt=0; damage(e,2,'#6aff8a'); }
    }
    if(e.buff>0) e.buff-=dt;
    if(e.ct>0) e.ct-=dt;
    if(e.atk>0){
      e.atk-=dt;
      if(!e.swung&&e.atk<e.atkMax*.55){ e.swung=1; const bo=e.buff>0?1.5:1;
        if(e.ranged){ const t=e.team==='party'?nearestFoe(e,e.range+2):player();
          if(t){ const st=shotStyle(e); shoot(e,t.x,t.y,e.dmg*bo, st[0], st[1], st[2]); }
        } else meleeSwing(e,e.hero?2.3:1.9,e.range+.35,e.dmg*bo); }
      if(e.atk<=0) e.swung=0;
    }
    if(e.kx||e.ky){ move(e,e.kx*6,e.ky*6,dt); e.kx*=Math.pow(.02,dt); e.ky*=Math.pow(.02,dt);
      if(Math.abs(e.kx)<.01)e.kx=0; if(Math.abs(e.ky)<.01)e.ky=0; }
    if(e.hero) continue;
    if(e.hidden){ e.moving=0; e.ix=0; e.iy=0; continue; }
    if(e.sleeping){ e.moving=0; e.ix=0; e.iy=0; continue; }
    if(e.fleeTo){
      const t=e.fleeTo, d=dist(e,t);
      if(d>0.55) steerWalk(e, t.x-e.x, t.y-e.y, e.sp, dt);
      else {
        e.moving=0; e.ix=0; e.iy=0; e.x=t.x; e.y=t.y; e.fleeTo=null;
        if(e.onArrive){ const fn=e.onArrive; e.onArrive=null; fn(); }
      }
      continue;
    }
    if(e.npc && e.team!=='party'){ e.moving=0; e.ix=0; e.iy=0; continue; }

    let tgt=null, want=e.range, form=0;
    if(e.team==='party'){
      if(e.heals){ const hu=nearestAlly(e,12,1);
        if(hu&&hu.hp<hu.maxhp*.6&&e.ct<=0){ hu.hp=Math.min(hu.maxhp,hu.hp+24);
          burst(hu.x,hu.y,'#ffe9a8',10,2); ftext(hu.x,hu.y,'+24','#ffe9a8'); e.ct=4.5; } }
      const kin=G.ents.filter(x=>x.team==='party'&&!x.dead&&!x.hero);
      const idx=kin.indexOf(e);
      const macarFighting=p&&!p.moving&&(p.aim||p.atk>0)&&!p.dest;
      const foe=nearestFoe(e, e.ranged?8:4.6);
      if(macarFighting&&foe&&p&&dist(e,p)<6.5){ tgt=foe; want=e.ranged?e.range*.7:e.range; }
      else if(p){
        if(p.moving) tgt=trailSlot(idx<0?0:idx)||partyForm(idx<0?1:idx+1, p);
        else tgt=partyForm(idx<0?1:idx+1, p);
        want=.38; form=1;
      }
    } else {
      tgt=nearestAlly(e,999);
      if(tgt){ const d=dist(e,tgt);
        if(d>e.aggro&&!e.boss&&!e.engaged) tgt=null; else e.engaged=1; }
      want=e.ranged?e.range*.75:e.range;
    }
    if(tgt){
      const d=dist(e,tgt);
      if(d>want){
        let vx=tgt.x-e.x, vy=tgt.y-e.y;
        for(const o of G.ents){ if(o===e||o.dead) continue; const dd=dist(e,o);
          if(dd<(e.r+o.r)*1.15&&dd>.001){ vx+=(e.x-o.x)/dd*.35; vy+=(e.y-o.y)/dd*.35; } }
        steerWalk(e, vx, vy, e.sp, dt);
      } else {
        e.ix=0; e.iy=0; e.moving=0;
        if(form&&p) turnToward(e, p.fdx, p.fdy, dt, 8);
        else turnToward(e, tgt.x-e.x, tgt.y-e.y, dt, 14);
        if(!form&&e.ct<=0&&tgt.hp!==undefined){ e.atk=e.atkMax; e.ct=e.cd; e.swung=0; }
      }
    } else { e.moving=0; e.ix=0; e.iy=0; }
  }

  for(const s of G.shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; s.spin+=dt*14;
    if(!walk(s.x,s.y)){ s.life=0; burst(s.x,s.y,s.col,8,2); continue; }
    for(const o of G.ents){ if(o.dead||o.team===s.team||o.npc||o.sleeping) continue;
      if(dist(s,o)<o.r+.35){
        const rolled=s.from?addAttack(s.from,o):(s.dmg||8);
        if(rolled) damage(o,onHitFx(s.from||s,o,rolled),s.col);
        s.life=0; burst(s.x,s.y,s.col,9,2.5); break; } }
  }
  G.shots=G.shots.filter(s=>s.life>0);
  for(const q of G.parts){ q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=11*dt;
    if(q.z<0){q.z=0;q.vz*=-.35;q.vx*=.6;q.vy*=.6;} q.life-=dt; }
  G.parts=G.parts.filter(q=>q.life>0);
  for(const t of G.texts){ t.y-=dt*.9; t.life-=dt; }
  G.texts=G.texts.filter(t=>t.life>0);
  for(const l of G.log) l.a=Math.max(.35,l.a-dt*.03);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*46);
  if(G.flash){ G.flash.a-=dt*1.8; if(G.flash.a<=0) G.flash=null; }
  if(Math.random()<dt*15&&p){ const a=rnd(TAU),r=rnd(12,3);
    G.parts.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,z:rnd(2.8,.3),vx:rnd(.16,-.16),vy:rnd(.16,-.16),
      vz:rnd(.3,-.05),life:rnd(3.6,1.8),max:3.6,c:L.pal.dust,s:rnd(2.3,.9),amb:1}); }
  updateBombs(dt);
  if(G.songBuff>0 && p){ const rg=G.songBuff*0.5*dt;
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead) e.hp=Math.min(e.maxhp,e.hp+rg); }); }
  if(L.tick) L.tick(dt);
  endFightIfClear();
  if(G.ents.length>44) G.ents=G.ents.filter(e=>!(e.dead&&e.team==='foe'&&(e.deadT||0)>2.2));
}


/* ---------------------------- projection ---------------------------- */
function w2s(x,y){ return {
  x:(x-y)*(TW/2)-(G.cam.x-G.cam.y)*(TW/2)+VW/2,
  y:(x+y)*(TH/2)-(G.cam.x+G.cam.y)*(TH/2)+VH*(PORT?.46:.52) }; }
function s2w(sx,sy){
  const ix=sx-VW/2+(G.cam.x-G.cam.y)*(TW/2), iy=sy-VH*(PORT?.46:.52)+(G.cam.x+G.cam.y)*(TH/2);
  return {x:(iy/(TH/2)+ix/(TW/2))/2, y:(iy/(TH/2)-ix/(TW/2))/2}; }

/* emissive registrations, consumed by the bloom pass each frame */
let EMIT=[], RAYS=[];
function emit(sx,sy,r,c,i){ if(QUALITY&&EMIT.length<110) EMIT.push({x:sx,y:sy,r,c,i:i===undefined?1:i}); }
function ray(sx,sy,r,c,i){ if(QUALITY) RAYS.push({x:sx,y:sy,r,c,i}); }

/* ==========================================================================
   RENDER
   ========================================================================== */
function render(){
  const g=ctx; EMIT=[]; RAYS=[];
  try{
  g.save();
  if(G.shake>0) g.translate(rnd(G.shake,-G.shake)*.3,rnd(G.shake,-G.shake)*.3);
  const L=G.lvl;
  g.fillStyle=L?L.pal.fogTop:'#07060a'; g.fillRect(-40,-40,VW+80,VH+80);
  const inWorld = L && G.scene!=='title' && G.scene!=='chapters' && G.scene!=='credits';
  if(inWorld){ drawWorld(g,L); applyLighting(g,L); drawGodRays(g); drawBloom(g); drawAtmosphere(g,L); drawFloaters(g); }
  g.restore();
  if(G.flash){ g.globalAlpha=clamp(G.flash.a,0,1); g.fillStyle=G.flash.c; g.fillRect(0,0,VW,VH); g.globalAlpha=1; }
  if(G.hurt>0.02){ const v=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.25,VW/2,VH/2,Math.max(VW,VH)*.62);
    v.addColorStop(0,'rgba(160,0,0,0)'); v.addColorStop(1,'rgba(150,0,0,'+(G.hurt*.55)+')');
    g.fillStyle=v; g.fillRect(0,0,VW,VH); }
  if(inWorld && QUALITY) drawGrain(g);
  if(G.scene==='play') drawHUD(g);
  if(G.scene==='title') drawTitle(g);
  if(G.scene==='chapters') drawChapterSelect(g);
  if(G.scene==='credits') drawCredits(g);
  if(G.scene==='intro') drawIntro(g);
  if(G.scene==='camp') drawCamp(g);
  if(G.scene==='pack') drawPack(g);
  if(G.scene==='trade') drawTrade(g);
  if(G.scene==='dead') drawDead(g);
  if(G.scene==='win') drawWin(g);
  if(G.paused&&G.scene==='play') drawPause(g);
  }catch(err){
    try{
      g.setTransform(DPR,0,0,DPR,0,0);
      g.fillStyle='#1a0808'; g.fillRect(0,0,VW,VH);
      g.fillStyle='#ffd27a'; g.font='14px sans-serif'; g.textAlign='left';
      String(err&&err.stack||err).split('\n').slice(0,12).forEach((ln,i)=>g.fillText(ln,16,28+i*18));
    }catch(_){}
  }
}

let DIGT=null;
function drawWorld(g,L){
  const pal=L.pal;
  { const pl=player(); DIGT = pl? digTarget(pl) : null; }
  const c=[s2w(-TW,-TH*5),s2w(VW+TW,-TH*5),s2w(-TW,VH+TH*5),s2w(VW+TW,VH+TH*5)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-1);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+1);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-1);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+1);

  const B={}, push=(k,f)=>{(B[k]||(B[k]=[])).push(f);};
  const M=TW*2, near=o=>{const s=w2s(o.x,o.y); return s.x>-M&&s.x<VW+M&&s.y>-M*2.6&&s.y<VH+M;};
  for(const d of G.decals) if(near(d)) push((d.x+d.y)|0,()=>drawDecal(g,d));
  for(const e of G.ents)  if(e.crushed&&near(e)) push((e.x+e.y)|0,()=>drawEnt(g,e));
  for(const p of G.props) if(near(p)) push((p.x+p.y)|0,()=>drawProp(g,p,pal));
  for(const q of (G.loot||[])) if(!q.gone&&near(q)) push((q.x+q.y)|0,()=>drawLoot(g,q));
  for(const e of G.ents)  if(!e.crushed&&near(e)) push((e.x+e.y)|0,()=>drawEnt(g,e));
  for(const s of G.shots) if(near(s)) push((s.x+s.y)|0,()=>drawShot(g,s));
  for(const q of G.parts) if(near(q)) push((q.x+q.y)|0,()=>drawPart(g,q));
  for(const b of G.thrown) if(near(b)) push((b.x+b.y)|0,()=>drawThrown(g,b));
  if(G.aim) push(((G.aim.x+G.aim.y)|0)-1,()=>drawAim(g));
  if(L.plug&&!L.flags.broke) push((L.plug.x+L.plug.y)|0,()=>drawPlug(g,L));

  const k=TW/RTW, WH=RWH*k, FH=RTH*k, SH=(RWH+RTH)*k;
  const p=player(), pd=p?p.x+p.y:0, ps=p?w2s(p.x,p.y):null;
  const okTex=TEX.ready;
  if(p&&p.dest) push((p.dest.x+p.dest.y)|0,()=>drawMoveMark(g,p.dest));

  for(let d=minx+miny; d<=maxx+maxy; d++){
    const x0=Math.max(minx,d-maxy), x1=Math.min(maxx,d-miny);
    for(let x=x0;x<=x1;x++){
      const y=d-x, t=L.grid[y][x];
      if(t===2||!L.seen[y][x]) continue;
      const s=w2s(x,y);
      if(t===1){
        const oS=L.grid[y+1]&&(L.grid[y+1][x]===0||L.grid[y+1][x]===3||L.grid[y+1][x]===4);
        const oE=L.grid[y]&&(L.grid[y][x+1]===0||L.grid[y][x+1]===3||L.grid[y][x+1]===4);
        if(!oS&&!oE) continue;
        // fade walls that stand between the camera and Macar
        let a=1;
        if(ps && d>pd+0.6 && Math.abs(ps.x-s.x)<TW*0.62 && ps.y>s.y-WH*1.15 && ps.y<s.y+TH*0.9) a=0.34;
        if(a<1) g.globalAlpha=a;
        if(okTex){
          const vein = h2(x*3,y*7)>0.86;
          const wv=[SPR.wall_cave, SPR.wall_cave_w1, SPR.wall_cave_w2, SPR.wall_cave_atk].filter(Boolean);
          const rk=L.wallHP[x+','+y];
          const wallImg=wv.length?((rk&&rk.hp<rk.max&&SPR.wall_cave_atk)?SPR.wall_cave_atk:wv[(h2(x+3,y)*wv.length)|0]):null;
          if(wallImg){
            g.drawImage(wallImg, s.x-TW/2, s.y-WH-FH/2, TW, SH);
          } else {
            const arr = vein?TEX.wallVein:TEX.wall;
            g.drawImage(arr[(h2(x,y)*arr.length)|0], s.x-TW/2, s.y-WH-FH/2, TW, SH);
          }
          if(vein) emit(s.x, s.y-WH*0.35, TW*0.30, pal.key, 0.5);
          if(rk && rk.hp<rk.max) drawCracks(g,s.x,s.y,WH,1-rk.hp/rk.max);
          if(DIGT && DIGT.i===x && DIGT.j===y) drawDigMark(g,s.x,s.y,WH);
          if(G.dig && G.dig.i===x && G.dig.j===y) drawDigProgress(g,s.x,s.y,WH,G.dig.min/DIG_MINUTES);
        } else { g.fillStyle=pal.wT; g.fillRect(s.x-TW/2,s.y-WH,TW,WH); }
        if(a<1) g.globalAlpha=1;
      } else {
        const key=palFloorKey(pal);
        const variants=[SPR[key], SPR[key+'_w1'], SPR[key+'_w2'], SPR[key+'_atk']].filter(Boolean);
        const fl=variants.length?variants[(h2(x,y)*variants.length)|0]:null;
        if(fl){
          g.save(); diamondPath(g,s.x,s.y); g.clip();
          g.drawImage(fl, s.x-TW/2, s.y-TH/2, TW, TH);
          g.restore();
        } else if(okTex){
          const arr = t===3?TEX.floorA:TEX.floor;
          g.drawImage(arr[(h2(x,y)*arr.length)|0], s.x-TW/2, s.y-FH/2, TW, FH);
        } else { g.fillStyle=pal.fA; diamondPath(g,s.x,s.y); g.fill(); }
      }
    }
    const b=B[d]; if(b) for(const f of b) f();
  }
}
function drawCracks(g,sx,sy,WH,f){
  g.save(); g.globalAlpha=clamp(f*1.15,0,1);
  g.strokeStyle='rgba(14,9,6,0.95)'; g.lineCap='round';
  for(let k=0;k<3;k++){
    if(k/3>f) break;
    g.lineWidth=(1.4+f*2.6)*ZOOM;
    let px=sx+(h2(k,7)-0.5)*TW*0.34, py=sy-WH*(0.25+h2(k,3)*0.5);
    g.beginPath(); g.moveTo(px,py);
    for(let i=0;i<3;i++){ px+=(h2(k*5+i,9)-0.5)*TW*0.26; py+=(h2(k*3+i,4)-0.2)*WH*0.30; g.lineTo(px,py); }
    g.stroke();
  }
  if(f>0.55){ g.fillStyle='rgba(255,150,80,'+((f-0.55)*0.5)+')';
    g.beginPath(); g.ellipse(sx,sy-WH*0.5,TW*0.20,WH*0.28,0,0,TAU); g.fill(); }
  g.restore(); g.globalAlpha=1;
}
function drawDigMark(g,sx,sy,WH){
  const b=0.5+Math.sin(G.elapsed*8)*0.25;
  g.strokeStyle='rgba(255,214,140,'+b+')'; g.lineWidth=2.4*ZOOM;
  g.beginPath();
  g.moveTo(sx-TW*0.30,sy-WH*0.62); g.lineTo(sx-TW*0.30,sy-WH*0.80); g.lineTo(sx-TW*0.12,sy-WH*0.80);
  g.moveTo(sx+TW*0.30,sy-WH*0.62); g.lineTo(sx+TW*0.30,sy-WH*0.80); g.lineTo(sx+TW*0.12,sy-WH*0.80);
  g.stroke();
}
function drawDigProgress(g,sx,sy,WH,pct){
  const left=Math.max(0,DIG_MINUTES*(1-clamp(pct,0,1)));
  const w=TW*0.58, h=5*ZOOM, x=sx-w/2, y=sy-WH*0.96;
  g.fillStyle='rgba(0,0,0,0.72)'; g.fillRect(x-1.5,y-1.5,w+3,h+3);
  g.fillStyle='#c9a24a'; g.fillRect(x,y,w*clamp(pct,0,1),h);
  g.strokeStyle='rgba(255,220,180,0.45)'; g.lineWidth=1; g.strokeRect(x,y,w,h);
  g.font='800 '+(10*ZOOM)+'px '+FONT_UI; g.textAlign='center';
  g.lineWidth=3*ZOOM; g.strokeStyle='rgba(0,0,0,0.75)';
  g.strokeText(Math.ceil(left)+' min', sx, y-5*ZOOM);
  g.fillStyle='#f2dfb6'; g.fillText(Math.ceil(left)+' min', sx, y-5*ZOOM);
  g.textAlign='left';
}
function drawMoveMark(g,dest){
  const s=w2s(dest.x,dest.y), z=ZOOM;
  const pulse=.55+Math.sin(G.elapsed*9)*.45;
  g.save(); g.translate(s.x,s.y);
  g.strokeStyle='rgba(255,214,90,'+(0.9*pulse)+')'; g.lineWidth=2.2*z;
  g.beginPath(); g.ellipse(0,0,11*z,5.5*z,0,0,TAU); g.stroke();
  g.strokeStyle='rgba(255,236,160,'+(0.55*pulse)+')'; g.lineWidth=1.2*z;
  g.beginPath(); g.ellipse(0,0,16*z,8*z,0,0,TAU); g.stroke();
  g.fillStyle='rgba(255,220,110,'+(0.42*pulse)+')';
  g.beginPath(); g.ellipse(0,0,3.4*z,1.7*z,0,0,TAU); g.fill();
  const spark=6+pulse*4;
  g.strokeStyle='rgba(255,240,170,'+pulse+')'; g.lineWidth=1.4*z;
  for(let i=0;i<4;i++){
    const a=i*Math.PI/2+G.elapsed*2.4;
    g.beginPath();
    g.moveTo(Math.cos(a)*spark*z, Math.sin(a)*spark*z*0.5);
    g.lineTo(Math.cos(a)*(spark+5)*z, Math.sin(a)*(spark+5)*z*0.5);
    g.stroke();
  }
  g.restore();
  emit(s.x,s.y,22*z,'#ffd24a',0.35*pulse);
}
function drawAim(g){
  const p=player(); if(!p||!G.aim) return;
  const a=w2s(G.aim.x,G.aim.y), ps=w2s(p.x,p.y);
  const R=bombRadius();
  const b=0.55+Math.sin(G.elapsed*5)*0.2;
  // lobbed trajectory
  g.strokeStyle='rgba(255,200,120,0.4)'; g.lineWidth=2*ZOOM; g.setLineDash([6*ZOOM,7*ZOOM]);
  g.beginPath();
  for(let i=0;i<=16;i++){ const f=i/16;
    const wx=lerp(p.x,G.aim.x,f), wy=lerp(p.y,G.aim.y,f);
    const sp=w2s(wx,wy); const yy=sp.y-30*ZOOM-Math.sin(f*Math.PI)*54*ZOOM;
    i?g.lineTo(sp.x,yy):g.moveTo(sp.x,yy); }
  g.stroke(); g.setLineDash([]);
  // blast footprint
  g.save(); g.translate(a.x,a.y); g.scale(1,TH/TW);
  g.fillStyle='rgba(255,120,60,'+(0.10+b*0.06)+')';
  g.beginPath(); g.arc(0,0,R*TW/2,0,TAU); g.fill();
  g.strokeStyle='rgba(255,170,90,'+b+')'; g.lineWidth=3*ZOOM;
  g.beginPath(); g.arc(0,0,R*TW/2,0,TAU); g.stroke();
  g.strokeStyle='rgba(255,220,160,'+(b*0.6)+')'; g.lineWidth=1.6*ZOOM;
  g.beginPath(); g.arc(0,0,R*TW/2*0.55,0,TAU); g.stroke();
  g.restore();
  g.strokeStyle='rgba(255,220,160,'+b+')'; g.lineWidth=2.4*ZOOM;
  for(let i=0;i<4;i++){ const th=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(a.x+Math.cos(th)*10*ZOOM,a.y+Math.sin(th)*5*ZOOM);
    g.lineTo(a.x+Math.cos(th)*20*ZOOM,a.y+Math.sin(th)*10*ZOOM); g.stroke(); }
  emit(a.x,a.y,60*ZOOM,'#ff9a44',0.5);
}
function drawThrown(g,b){
  const s=w2s(b.x,b.y), z=ZOOM;
  const yy=s.y-30*z-(b.arc||0)*20*z;
  softShadow(g,s.x,s.y,13*z,6*z,0.45);
  g.save(); g.translate(s.x,yy); g.rotate(b.spin);
  g.beginPath(); g.arc(0,0,9*z,0,TAU); sc(g,'#2f3138',-9*z,9*z,1.8);
  g.fillStyle='rgba(255,255,255,0.18)'; g.beginPath(); g.arc(-3*z,-3.4*z,3*z,0,TAU); g.fill();
  g.strokeStyle='#6b5a3a'; g.lineWidth=2.2*z;
  g.beginPath(); g.moveTo(4*z,-6*z); g.quadraticCurveTo(9*z,-12*z,6*z,-15*z); g.stroke();
  const sp=b.state? (0.55+Math.sin(G.elapsed*30)*0.45) : 0.7;
  g.fillStyle='rgba(255,'+Math.round(190+60*sp)+',90,'+(0.7+sp*0.3)+')';
  g.beginPath(); g.arc(6*z,-16*z,(2.4+sp*1.8)*z,0,TAU); g.fill();
  g.restore();
  emit(s.x,yy-16*z,(26+(b.state?14*Math.sin(G.elapsed*30):0))*z,'#ffab52',1);
  if(Math.random()<0.6) G.parts.push({x:b.x,y:b.y,z:1.4+(b.arc||0),vx:rnd(.4,-.4),vy:rnd(.4,-.4),

}

/* ---------------------------- lighting ---------------------------- */
function gatherLights(L){
  const out=L.lights.map(l=>({x:l.x,y:l.y,c:l.c,r:l.r,f:l.f||1,fl:1}));
  const p=player();
  if(p) out.push({x:p.x,y:p.y,c:'#ffd6a0',r:6.6,f:1.05,fl:0});
  for(const e of G.ents) if(!e.dead&&e.boss&&e.glow) out.push({x:e.x,y:e.y,c:e.glow,r:7,f:1.3,fl:1});
  for(const s of G.shots) out.push({x:s.x,y:s.y,c:s.col,r:2.6,f:1.1,fl:0});
  for(const pr of G.props){
    if(pr.k==='shroom') out.push({x:pr.x,y:pr.y,c:'#b06cff',r:3.4,f:0.72,fl:1});
    if(pr.k==='rubywall'||pr.k==='rubydoor') out.push({x:pr.x,y:pr.y,c:'#ff2a3c',r:8.2,f:1.35,fl:1});
    if(pr.k==='brazier') out.push({x:pr.x,y:pr.y,c:'#ff8a3a',r:5.5,f:1.1,fl:1});
    if(pr.k==='trap'&&pr.trap==='trap_runes') out.push({x:pr.x,y:pr.y,c:'#c07bff',r:2.6,f:0.7,fl:1});
    if(pr.k==='gate') out.push({x:pr.x,y:pr.y,c:'#6fd0ff',r:4.2,f:0.8,fl:1});
  }
  return out;
}
/* scene * (ambient + sum of coloured lights) */
function applyLighting(g,L){
  const x=lmx, w=LM.width, h=LM.height;
  x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='source-over';
  x.fillStyle=L.pal.amb; x.fillRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  for(const li of gatherLights(L)){
    const s=w2s(li.x,li.y), cx=s.x/2, cy=(s.y-TH*.8)/2;
    const flick = li.fl? (0.90+Math.sin(G.elapsed*7.3+li.x*3.1)*0.06+Math.sin(G.elapsed*17+li.y)*0.035) : 1;
    const rad=li.r*TW*0.27*li.f*flick;
    if(cx<-rad||cy<-rad||cx>w+rad||cy>h+rad) continue;
    const c=rgbOf(li.c);
    const gr=x.createRadialGradient(cx,cy,1,cx,cy,rad);
    gr.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',1)');
    gr.addColorStop(0.34,'rgba('+c[0]+','+c[1]+','+c[2]+',0.62)');
    gr.addColorStop(0.68,'rgba('+Math.round(c[0]*0.6)+','+Math.round(c[1]*0.5)+','+Math.round(c[2]*0.5)+',0.24)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';
  g.globalCompositeOperation='multiply';
  g.drawImage(LM,0,0,VW,VH);
  g.globalCompositeOperation='source-over';
}

/* cone of dust hanging under each lantern */
function drawGodRays(g){
  if(!RAYS.length) return;
  g.globalCompositeOperation='lighter';
  for(const r of RAYS){
    const gr=g.createLinearGradient(r.x,r.y-r.r*0.2,r.x,r.y+r.r*1.5);
    gr.addColorStop(0,hexA(r.c,0.16*r.i)); gr.addColorStop(1,hexA(r.c,0));
    g.fillStyle=gr;
    g.beginPath(); g.moveTo(r.x-r.r*0.18,r.y); g.lineTo(r.x+r.r*0.18,r.y);
    g.lineTo(r.x+r.r*0.95,r.y+r.r*1.5); g.lineTo(r.x-r.r*0.95,r.y+r.r*1.5); g.closePath(); g.fill();
  }
  g.globalCompositeOperation='source-over';
}

function drawBloom(g){
  if(!QUALITY||!EMIT.length) return;
  const x=blx, w=BL.width, h=BL.height;
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  for(const e of EMIT){
    const cx=e.x/4, cy=e.y/4, rad=Math.max(2,e.r/4);
    if(cx<-rad||cy<-rad||cx>w+rad||cy>h+rad) continue;
    const c=rgbOf(e.c);
    const gr=x.createRadialGradient(cx,cy,0.5,cx,cy,rad);
    gr.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.95*e.i)+')');
    gr.addColorStop(0.45,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.34*e.i)+')');
    gr.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';
  g.save();
  g.globalCompositeOperation='lighter';
  if(CAN_BLUR){ g.filter='blur('+(3.2*Math.max(1,ZOOM))+'px)'; }
  g.globalAlpha=0.95; g.drawImage(BL,0,0,VW,VH);
  if(CAN_BLUR) g.filter='blur('+(10*Math.max(1,ZOOM))+'px)';
  g.globalAlpha=0.62; g.drawImage(BL,0,0,VW,VH);
  g.filter='none'; g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.restore();
}

function drawAtmosphere(g,L){

  tg.addColorStop(0,hexA(L.pal.fogTop,0.88)); tg.addColorStop(1,hexA(L.pal.fogTop,0));
  g.fillStyle=tg; g.fillRect(0,0,VW,VH*0.32);
  const bg=g.createLinearGradient(0,VH*0.76,0,VH);
  bg.addColorStop(0,hexA(L.pal.fogTop,0)); bg.addColorStop(1,hexA(L.pal.fogTop,0.66));
  g.fillStyle=bg; g.fillRect(0,VH*0.76,VW,VH*0.24);
  // dual-tone cave haze from the chapter key colour

function drawGrain(g){

function drawFloaters(g){
