function drawCamp(g){
  menuHits=[]; const s=UIS;
  g.fillStyle='#0b0806'; g.fillRect(0,0,VW,VH); embers(g); darken(g,.42);
  g.textAlign='center';
  g.font='700 '+(11.5*s)+'px "Trebuchet MS",sans-serif'; g.fillStyle='rgba(190,220,170,0.9)';
  g.fillText('CAMP  \u00b7  '+CH_META[G.ch].t.toUpperCase()+' CLEARED', VW/2, VH*.075);
  g.textAlign='left';

  // ---- stock
  const top=VH*.105, rw=VW-20*s;
  plate(g,10*s,top,rw,PORT?58*s:36*s,5,.72);
  g.font='800 '+(PORT?10*s:11.5*s)+'px "Trebuchet MS",sans-serif';
  RES.forEach((r,i)=>{
    const per=PORT?3:6;
    const cx=18*s+(i%per)*(rw/per), cy=top+(PORT? 18*s+((i/per)|0)*24*s : 23*s);
    const m=RESMETA[r], have=G.res[r]||0;
    g.fillStyle= have? m.c : 'rgba(120,110,96,0.45)';
    g.beginPath(); g.moveTo(cx-6*s,cy-4*s); g.lineTo(cx,cy-9*s); g.lineTo(cx+6*s,cy-4*s);
    g.lineTo(cx+2.5*s,cy+3*s); g.lineTo(cx-2.5*s,cy+3*s); g.closePath(); g.fill();
    g.strokeStyle='rgba(0,0,0,0.6)'; g.lineWidth=1; g.stroke();
    g.fillStyle= have? 'rgba(238,224,192,0.95)':'rgba(130,120,102,0.55)';
    g.fillText(have+'  '+m.n, cx+11*s, cy+3.5*s);
  });

  // ---- skills
  const sy0=top+(PORT?66*s:44*s);
  g.font='700 '+(8.5*s)+'px "Trebuchet MS",sans-serif';
  g.fillStyle='rgba(190,166,120,0.6)'; g.fillText('CRAFT SKILLS', 12*s, sy0-2*s);
  const per2=PORT?2:4, cellW=(VW-20*s)/per2;
  SKILLS.forEach((sk,i)=>{
    const cx=12*s+(i%per2)*cellW, cy=sy0+10*s+((i/per2)|0)*20*s;
    const lv=skillLvl(sk.k);
    g.font='700 '+(9.5*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle='rgba(226,206,164,0.9)'; g.fillText(sk.n, cx, cy+4*s);
    g.font='800 '+(9.5*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle='#ffd27a'; g.fillText(String(lv), cx+cellW-34*s, cy+4*s);
    const bx=cx+cellW-26*s, bw=18*s;
    g.fillStyle='rgba(0,0,0,0.6)'; g.fillRect(bx,cy-2*s,bw,4*s);
    g.fillStyle='rgba(255,206,120,0.8)'; g.fillRect(bx,cy-2*s,bw*skillNext(sk.k),4*s);
  });

  // ---- actions
  const acts=campActions();
  const listTop=sy0+18*s+Math.ceil(SKILLS.length/per2)*20*s;
  const listBot=VH-70*s;
  const rowH=Math.min(PORT?40*s:44*s,(listBot-listTop)/Math.max(1,acts.length));
  acts.forEach((a,i)=>{
    const y=listTop+i*rowH, h=rowH-4*s, x=10*s, w=VW-20*s;
    const can=afford(a.cost);
    plate(g,x,y,w,h,5, can?.82:.5);
    if(can){ g.strokeStyle='rgba(255,208,124,0.45)'; g.lineWidth=1.6; roundPath(g,x,y,w,h,5); g.stroke();
      menuHits.push({x,y,w,h,fn:()=>{ if(afford(a.cost)){ spend(a.cost); a.fn(); } }}); }
    g.font='800 '+(8*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle= can?'rgba(255,196,110,0.85)':'rgba(130,116,94,0.5)';
    g.fillText(a.grp, x+11*s, y+13*s);
    g.font='700 '+(PORT?11*s:12.5*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle= can?'#f4e2b8':'rgba(140,126,104,0.55)';
    g.fillText(a.t, x+11*s, y+h*0.62);
    g.font='600 '+(9*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle= can?'rgba(200,182,146,0.7)':'rgba(120,108,88,0.5)';
    g.fillText(a.info, x+11*s, y+h-5*s);
    g.textAlign='right';
    g.font='700 '+(9.5*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle= can?'rgba(214,190,140,0.9)':'rgba(180,90,70,0.7)';
    g.fillText(costText(a.cost), x+w-11*s, y+h*0.62);
    g.textAlign='left';
  });

  // ---- kit line
  const gm=G.gear.macar, k0=G.gear.pordoom;
  g.font='600 '+(9.5*s)+'px "Trebuchet MS",sans-serif'; g.textAlign='center';
  g.fillStyle='rgba(186,166,130,0.75)';
  g.fillText('Hammer T'+gm.wt+(gm.rune?' + rune':'')+'  \u00b7  Armour T'+k0.at+
    '  \u00b7  Bombs '+G.bombs+'  \u00b7  Ale '+G.ales+(G.songBuff?'  \u00b7  Song +'+G.songBuff:''),
    VW/2, VH-46*s);
  g.textAlign='left';
  const nxt=G.ch===3?5:G.ch+1;
  if(CH_META[nxt]&&!CH_META[nxt].locked)
    menuBtn(g,'Go deeper',VW/2,VH-22*s,Math.min(230*s,VW*.56),34*s,()=>startChapter(nxt));
  else menuBtn(g,'Chapters',VW/2,VH-22*s,Math.min(230*s,VW*.56),34*s,()=>{G.scene='chapters';});
}

/* ---------------------------- tap resolution ---------------------------- */
function resolveTaps(){
  while(IN.taps.length){
    const t=IN.taps.shift();
    if(G.scene==='play'&&!G.paused){
      if(promptBtn&&t.x>promptBtn.x&&t.x<promptBtn.x+promptBtn.w&&t.y>promptBtn.y&&t.y<promptBtn.y+promptBtn.h){
        fire('use'); continue; }
      if(throwBtn&&t.x>throwBtn.x&&t.x<throwBtn.x+throwBtn.w&&t.y>throwBtn.y&&t.y<throwBtn.y+throwBtn.h){
        cds.bomb=ABIL.find(a=>a.key==='bomb').cd; throwBomb(); continue; }
      const p=player(); if(!p) continue;
      const w=s2w(t.x,t.y+22*ZOOM);
      if(G.aim){ const d=dist(p,w), R=8;
        G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y};
        continue; }
      const foe=G.ents.find(e=>e.team==='foe'&&!e.dead&&dist(e,w)<1.1);
      const dst=foe?{x:foe.x,y:foe.y}:w;
      if(walk(dst.x,dst.y)||foe){ p.dest={x:dst.x,y:dst.y}; p.stuck=0; p.lastD=undefined;
        G.parts.push({x:dst.x,y:dst.y,z:0,vx:0,vy:0,vz:0,life:.5,max:.5,c:'#ffd9a0',s:5,amb:1}); }
      continue;
    }
    for(const h of menuHits) if(t.x>h.x&&t.x<h.x+h.w&&t.y>h.y&&t.y<h.y+h.h){ h.fn(); break; }
  }
}

/* ---------------------------- loop ---------------------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05); G.t+=dt;
  if(G.hitstop>0) G.hitstop-=dt; else update(dt);
  render(); resolveTaps();
  requestAnimationFrame(loop);
}
resize();
bakeTextures(PAL.mine);
loadSprites(()=>{});
try{
  if(/play/.test((location.hash||'')+(location.search||''))) { startChapter(1); G.scene='play'; }
}catch(e){ console.error(e); }
render();
requestAnimationFrame(loop);
