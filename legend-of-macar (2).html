function drawPlug(g,L){
  if(!L.plug) return;
  drawRubbleAt(g, L.plug.x, L.plug.y, 14, 1, 0, 1-L.plug.hp/70);
}
function drawRubbleAt(g,x,y,n,sc,seed,dmg){
  const s=w2s(x,y), z=ZOOM*(sc||1); dmg=dmg||0; n=n||14; seed=seed||0;
  g.save(); g.translate(s.x,s.y);
  drawRubbleLocal(g,z,n,seed,dmg);
  g.restore();
}
function drawRubbleLocal(g,z,n,seed,dmg){
  dmg=dmg||0; n=n||14; seed=seed||0;
  softShadow(g,0,0,58*z,26*z,0.58);
  for(let i=0;i<n;i++){
    const hx=(h2(i+seed,3)-.5)*88*z, hy=-h2(i+seed,7)*64*z-6*z, sz=(14+h2(i+seed,11)*18)*z*(1-dmg*.45);
    g.beginPath(); g.moveTo(hx,hy-sz*.6); g.lineTo(hx+sz,hy); g.lineTo(hx+sz*.2,hy+sz*.7); g.lineTo(hx-sz,hy+sz*.1); g.closePath();
    const gr=g.createLinearGradient(hx-sz,hy-sz,hx+sz,hy+sz);
    gr.addColorStop(0,i%2?'#8a6f4c':'#6d5537'); gr.addColorStop(1,i%2?'#3f3020':'#2c2116');
    g.fillStyle=gr; g.fill(); g.strokeStyle=OL; g.lineWidth=1.3*z; g.stroke();
  }
}

/* ---------------------------- shading helpers ---------------------------- */
function softShadow(g,x,y,rx,ry,a){
  const gr=g.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
  gr.addColorStop(0,'rgba(0,0,0,'+(a||0.5)+')');
  gr.addColorStop(0.55,'rgba(0,0,0,'+((a||0.5)*0.55)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.save(); g.translate(x,y); g.scale(1,ry/Math.max(rx,ry)); g.translate(-x,-y);
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,Math.max(rx,ry),0,TAU); g.fill(); g.restore();
}
/* fill current path with vertical form-shading + ink outline (+ optional rim) */
function sc(g,base,y0,y1,lw,rim){
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,shade(base,0.26)); gr.addColorStop(0.48,base); gr.addColorStop(1,shade(base,-0.34));
  g.fillStyle=gr; g.fill();
  g.strokeStyle=OL; g.lineWidth=(lw||1.7)*ZOOM; g.stroke();
  if(rim){ g.save(); g.clip(); g.strokeStyle='rgba(255,236,198,'+(rim)+')'; g.lineWidth=2.2*ZOOM;
    g.stroke(); g.restore(); }
}
function flat(g,base,lw){ g.fillStyle=base; g.fill(); g.strokeStyle=OL; g.lineWidth=(lw||1.6)*ZOOM; g.stroke(); }
function drawFacetGem(g,x,y,w,h,on,z){
  const b=on?(.72+Math.sin(G.elapsed*2.8+x*0.01)*.28):.08;
  g.beginPath();
  g.moveTo(x, y-h);
  g.lineTo(x+w*0.62, y-h*0.42);
  g.lineTo(x+w*0.38, y+h*0.08);
  g.lineTo(x, y+h);
  g.lineTo(x-w*0.38, y+h*0.08);
  g.lineTo(x-w*0.62, y-h*0.42);
  g.closePath();
  const gr=g.createLinearGradient(x-w,y-h,x+w,y+h);
  gr.addColorStop(0,on?'#ff8a96':'#4a1a20');
  gr.addColorStop(0.35,on?'#e01828':'#3a1218');
  gr.addColorStop(0.7,on?'#8a0c18':'#2a0c12');
  gr.addColorStop(1,on?'#ff4050':'#3a1218');
  g.fillStyle=gr; g.fill();
  g.strokeStyle=on?'rgba(255,200,210,0.85)':'rgba(80,30,36,0.7)'; g.lineWidth=1.8*z; g.stroke();
  // inner facets
  g.strokeStyle=on?'rgba(255,230,235,0.35)':'rgba(255,255,255,0.06)'; g.lineWidth=1.1*z;
  g.beginPath(); g.moveTo(x,y-h); g.lineTo(x,y+h); g.moveTo(x-w*0.62,y-h*0.42); g.lineTo(x+w*0.38,y+h*0.08);
  g.moveTo(x+w*0.62,y-h*0.42); g.lineTo(x-w*0.38,y+h*0.08); g.stroke();
  if(on){
    g.fillStyle='rgba(255,210,220,'+(0.35+b*0.25)+')';
    g.beginPath(); g.moveTo(x-w*0.12,y-h*0.72); g.lineTo(x+w*0.22,y-h*0.28); g.lineTo(x-w*0.04,y-h*0.12); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(x-w*0.14,y-h*0.42,w*0.10,h*0.08, -0.5,0,TAU); g.fill();
  }
  return b;
}

function drawCarvedArch(g,z,W,H,stone){
  // stepped stone doorway: outer, mid, inner
  const tiers=[{w:W,h:H,c:stone},{w:W*0.82,h:H*0.86,c:shade(stone,-0.08)},{w:W*0.64,h:H*0.72,c:shade(stone,-0.16)}];
  for(const t of tiers){
    g.beginPath();
    g.moveTo(-t.w,-8*z); g.lineTo(-t.w,-t.h*0.62); g.quadraticCurveTo(-t.w*0.15,-t.h*1.08,0,-t.h);
    g.quadraticCurveTo(t.w*0.15,-t.h*1.08,t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath();
    sc(g,t.c,-t.h,-8*z,2.4);
    g.fillStyle='rgba(0,0,0,0.22)';
    g.beginPath(); g.moveTo(2*z,-8*z); g.lineTo(2*z,-t.h*0.9); g.lineTo(t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath(); g.fill();
  }
  // block courses
  g.strokeStyle='rgba(12,8,6,0.45)'; g.lineWidth=1.5*z;
  for(let i=1;i<6;i++){
    const yy=-8*z-i*(H/7);
    g.beginPath(); g.moveTo(-W*0.92,yy); g.lineTo(W*0.92,yy); g.stroke();
  }
  // carved runes along the inner arch
  g.strokeStyle='rgba(220,190,140,0.22)'; g.lineWidth=1.3*z;
  for(let i=0;i<9;i++){
    const a=Math.PI+ i/8*Math.PI, rx=W*0.52, ry=H*0.72;
    const px=Math.cos(a)*rx, py=-H*0.28+Math.sin(a)*ry;
    g.beginPath(); g.arc(px,py,2.4*z,0,TAU); g.stroke();
  }
  // rim light on the crown of the arch
  g.strokeStyle='rgba(255,236,200,0.22)'; g.lineWidth=2.6*z;
  g.beginPath(); g.moveTo(-W,-H*0.62); g.quadraticCurveTo(0,-H*1.08,W,-H*0.62); g.stroke();
}

/* ---------------------------- props ---------------------------- */
function drawProp(g,p,pal){
  const s=w2s(p.x,p.y), z=ZOOM;
  g.save(); g.translate(s.x,s.y);
  const img=(p.k==='stone'||p.k==='rubble')?null:propAnimImg(p);
  if(img){
    softShadow(g,2*z,1*z,18*z,8*z,.45);
    drawBillboard(g,img,propSpriteH(p,z));
    const k=p.k;
    if(k==='lantern'){
      const fl=1+Math.sin(G.elapsed*7+p.x)*.13;
      emit(s.x,s.y-21*z,26*z*fl,'#ffc571',1);
      ray(s.x,s.y-16*z,52*z,'#ffb45c',0.9);
    }else if(k==='shroom'){
      const t=G.elapsed*1.4+p.x*3, b=.78+Math.sin(t)*.22;
      emit(s.x,s.y-34*z,42*z*b,'#b57cff',0.72);
      ray(s.x,s.y-20*z,36*z,'#a06cff',0.35);
      if(Math.random()<0.08) G.parts.push({x:p.x,y:p.y,z:1.1,vx:rnd(.2,-.2),vy:rnd(.2,-.2),vz:rnd(1.4,.4),
        life:rnd(1.8,.8),max:1.8,c:'#c9a6ff',s:rnd(2.2,1),amb:1});
    }else if(k==='brazier'){
      const fl=1+Math.sin(G.elapsed*9+p.x*3)*.18;
      emit(s.x,s.y-26*z,40*z*fl,'#ff9a44',1.1);
      ray(s.x,s.y-20*z,58*z,'#ff8a3a',0.8);
      if(Math.random()<0.35) G.parts.push({x:p.x,y:p.y,z:0.6,vx:rnd(.25,-.25),vy:rnd(.25,-.25),vz:rnd(2.6,1.2),
        life:rnd(1.5,.7),max:1.5,c:'#ffab52',s:rnd(2.4,1),amb:1});
    }else if(k==='rubywall'||k==='rubydoor'){
      const on=k==='rubydoor'||!(G.lvl&&G.lvl.flags.cleared);
      if(on){ emit(s.x,s.y-78*z,110*z,'#ff2a3c',1.35); ray(s.x,s.y-110*z,86*z,'#ff4058',0.9); }
    }else if(k==='gate'){
      emit(s.x,s.y-54*z,80*z,'#6fd0ff',0.75);
    }else if(k==='bronzedoor'){
      const b=.55+Math.sin(G.elapsed*2.4)*.2;
      emit(s.x,s.y-54*z,80*z,'#d4a04a',b);
    }else if(k==='lift'){
      const on=G.lvl&&G.lvl.flags.cleared;
      if(on){ const b=.5+Math.sin(G.elapsed*4)*.25; emit(s.x,s.y-6*z,110*z,'#ffc061',b);
        ray(s.x,s.y-90*z,90*z,'#ffcf7a',0.7); }
    }else if(k==='altar'){
      const b=.4+Math.sin(G.elapsed*1.8)*.2;
      emit(s.x,s.y-14*z,46*z,'#c81824',0.5*b+0.3);
    }else if(k==='throne'){
      emit(s.x,s.y-136*z,40*z,'#ffd24a',0.4);
    }else if(k==='trap'&&p.trap==='trap_runes'){
      emit(s.x,s.y-8*z,28*z,'#c07bff',0.55);
    }
    g.restore(); return;
  }
  switch(p.k){
  case 'rubble':{
    drawRubbleLocal(g, z*(p.s||1.35), p.n||14, p.seed||0, 0);
    break; }
  case 'stone':{
    const sc=p.s||1.35, seed=p.seed||0, pin=!!p.pin;
    const W=(pin?34:28)*z*sc, H=(pin?11:22)*z*sc;
    softShadow(g,2*z,3*z,W*0.9,H*0.55,0.6);
    g.beginPath();
    if(pin){
      g.moveTo(-W*0.15,-H*0.55); g.lineTo(W*0.82,-H*0.22); g.lineTo(W*0.7,H*0.42);
      g.lineTo(-W*0.08,H*0.62); g.lineTo(-W*0.78,H*0.28); g.lineTo(-W*0.72,-H*0.18); g.closePath();
    } else {
      g.moveTo(0,-H*1.15); g.lineTo(W*0.72,-H*0.55); g.lineTo(W*0.55,H*0.08);
      g.lineTo(0,H*0.38); g.lineTo(-W*0.58,H*0.06); g.lineTo(-W*0.7,-H*0.5); g.closePath();
    }
    const gr=g.createLinearGradient(-W,-H,W,H);
    gr.addColorStop(0,'#8a6e4e'); gr.addColorStop(0.35,'#5c4630'); gr.addColorStop(0.7,'#3a2a1c'); gr.addColorStop(1,'#1e140c');
    g.fillStyle=gr; g.fill(); g.strokeStyle=OL; g.lineWidth=1.8*z; g.stroke();
    g.strokeStyle='rgba(255,220,180,0.12)'; g.lineWidth=1.2*z;
    g.beginPath(); g.moveTo(-W*0.2,pin?-H*0.28:-H*0.85); g.lineTo(W*0.15,-H*0.08); g.lineTo(-W*0.05,H*0.22); g.stroke();
    g.fillStyle='rgba(0,0,0,0.28)';
    g.beginPath(); g.moveTo(W*0.18,-H*0.18); g.lineTo(W*0.7,H*0.28); g.lineTo(pin?-W*0.08:0,H*0.55); g.closePath(); g.fill();
    for(let i=0;i<(pin?2:3);i++){
      const hx=(h2(i+seed,5)-.5)*18*z*sc, hy=(pin?2: -6)*z*sc-h2(i+seed,9)*6*z*sc, sz=(5+h2(i+seed,13)*4)*z*sc;
      g.beginPath(); g.moveTo(hx,hy-sz*0.55); g.lineTo(hx+sz,hy); g.lineTo(hx,hy+sz*0.45); g.lineTo(hx-sz,hy); g.closePath();
      g.fillStyle=i%2?'#6a5136':'#4a3826'; g.fill(); g.strokeStyle=OL; g.lineWidth=1*z; g.stroke();
    }
    break; }

function drawLoot(g,pile){
  const s=w2s(pile.x,pile.y), z=ZOOM;
  const pulse=.62+Math.sin(G.elapsed*4.2+(pile.x||0)*3)*.28;
  g.save(); g.translate(s.x,s.y);
  softShadow(g,0,2*z,12*z,6*z,.5);
  if(pile.kind==='ruby'){
    drawFacetGem(g,0,-10*z,14*z,18*z,1,z);
    emit(s.x,s.y-10*z,22*z*pulse,'#ff2a3c',1.15);
    ray(s.x,s.y-12*z,18*z,'#ff4058',0.55);
  } else if(pile.kind==='ore'){
    g.fillStyle=RESMETA.ironstone.c;
    g.beginPath(); g.moveTo(-6*z,-4*z); g.lineTo(0,-12*z); g.lineTo(7*z,-3*z); g.lineTo(3*z,4*z); g.lineTo(-5*z,3*z); g.closePath(); g.fill();
    g.strokeStyle='rgba(40,28,16,0.7)'; g.lineWidth=1.2*z; g.stroke();
  } else if(SPR.sack&&SPR.sack.width){
    drawBillboard(g, SPR.sack, 32*z);
    emit(s.x,s.y-8*z,16*z*pulse,'#ffd27a',0.7);
  } else {
    g.fillStyle='#e0c169';
    g.beginPath(); g.ellipse(0,0,10*z,6*z,0,0,TAU); g.fill();
    g.fillStyle='#ffe08a'; g.beginPath(); g.arc(-3*z,-2*z,3*z,0,TAU); g.fill();
    emit(s.x,s.y-4*z,16*z*pulse,'#ffd27a',0.8);
  }
  g.restore();
}

    g.lineTo(sgn<0?0:11*z,3*z+off); g.lineTo(sgn<0?-11*z:0,3*z+off); g.closePath();
    sc(g,'#2a2218',-2*z+off,3*z+off,1.3); }
  g.beginPath(); g.moveTo(-11*z,-38*z); g.lineTo(11*z,-38*z); g.lineTo(9*z,-14*z); g.lineTo(-9*z,-14*z); g.closePath();

function drawEnt(g,e){
  if(e.hidden) return;
  const s=w2s(e.x,e.y), z=ZOOM*e.scale;
  g.save(); g.translate(s.x,s.y);
  const deadSpr=e.crushed && SPR[(e.col&&e.col.key)+'_dead'];
  if(e.sleeping){ g.translate(8*z, 6*z); g.rotate(1.18); }
  if(e.crushed && !deadSpr){ g.translate(12*z, 10*z); g.rotate(1.22); }
  if(e.dead && !e.crushed){
    const lie=e.deadT||0;
    g.globalAlpha=clamp(1-lie/1.3,0,1);
    g.translate(0,lie*7); g.rotate(clamp(lie*1.5,0,.95));
  }
  const p=player();
  if(!e.dead&&p&&p.aim===e){
    const b=.45+Math.sin(G.elapsed*7)*.2;
    g.strokeStyle='rgba(255,90,70,'+b+')'; g.lineWidth=2.6*ZOOM;
    g.beginPath(); g.ellipse(0,0,20*z,10*z,0,0,TAU); g.stroke();
    g.strokeStyle='rgba(255,140,110,'+(b*0.5)+')'; g.lineWidth=1.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,24*z,12*z,0,0,TAU); g.stroke();
  }
  if(!e.dead&&e.hero){
    g.strokeStyle='rgba(255,214,140,0.55)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,18*z,9*z,0,0,TAU); g.stroke();
    const gr=g.createRadialGradient(0,0,1,0,0,26*z);
    gr.addColorStop(0,'rgba(255,206,130,0.14)'); gr.addColorStop(1,'rgba(255,180,90,0)');
    g.save(); g.scale(1,0.5); g.fillStyle=gr; g.beginPath(); g.arc(0,0,26*z,0,TAU); g.fill(); g.restore();
  }
  const img=entAnimImg(e);
  const bob0=(img && e.moving && !e.dead)?Math.sin((e.gait||0)*TAU)*1.6*z:0;
  softShadow(g,2.5*z,1*z,17*z,8*z,0.52);

  const heading=(e.moving&&((e.ix||0)||(e.iy||0)))?((e.ix||0)-(e.iy||0)):(e.fdx-e.fdy);
  const flip=!e.crushed && !e.dead && heading>0;
  const sw=e.atk>0?Math.sin((1-e.atk/e.atkMax)*Math.PI):0;
  const squash=img?1:(1+sw*0.06);
  g.save(); g.translate(0,-bob0); g.scale(flip?-1:1,1); g.scale(1/squash,squash);
  if(!(img && drawEntBillboard(g,e,img,z))){
    if(e.kind==='dwarf') drawDwarf(g,e,z,sw);
    else if(e.kind==='statue') drawStatue(g,e,z,sw);
    else if(e.kind==='spider') drawSpider(g,e,z,sw);
    else if(e.kind==='fungi') drawFungi(g,e,z,sw);
    else if(e.kind==='undead') drawUndead(g,e,z,sw,null);
    else if(e.kind==='warden') drawWarden(g,e,z,sw);
    else if(e.kind==='goblin') drawGoblin(g,e,z,sw);
    else if(e.kind==='gnome') drawGnome(g,e,z,sw);
    else if(e.kind==='king') drawKing(g,e,z,sw);
    else drawStatue(g,e,z,sw);
  }
  g.restore();

  if(e.hero && e.atk>0 && !e.dead){
    const t=1-e.atk/Math.max(0.01,e.atkMax);
    const ang=-1.25+t*2.55, rad=26*z;
    emit(s.x+Math.cos(ang)*rad*(flip?-1:1), s.y-30*z+Math.sin(ang)*10*z, 18*z, '#ffd27a', 0.55);
  }

  if(e.flash>0){ g.globalCompositeOperation='lighter'; g.globalAlpha=clamp(e.flash*3,0,1);
    g.fillStyle='#ffb894'; g.beginPath(); g.ellipse(0,-27*z,19*z,29*z,0,0,TAU); g.fill();
    g.globalCompositeOperation='source-over'; g.globalAlpha=e.crushed?1:(e.dead?clamp(1-(e.deadT||0)/1.3,0,1):1); }
  if(e.guard){ const b=.4+Math.sin(G.elapsed*8)*.2;
    g.strokeStyle='rgba(180,215,255,'+b+')'; g.lineWidth=2.8*ZOOM;
    g.beginPath(); g.ellipse(0,-27*z,24*z,32*z,0,0,TAU); g.stroke();
    emit(s.x,s.y-27*z,48*z,'#9fd0ff',0.5); }
  if(e.buff>0){ g.strokeStyle='rgba(255,205,110,0.6)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,19*z,9*z,0,0,TAU); g.stroke(); }
  g.restore();

  if(!e.dead&&e.glow&&(e.team==='foe'||e.boss||e.npc||e.kind==='undead'||e.kind==='statue'||e.kind==='wraith'||e.kind==='fungi'||e.kind==='horror'||e.kind==='drake'||e.kind==='spider'||e.kind==='golem'||e.kind==='drow'||e.kind==='duergar'||e.kind==='gnome'||e.kind==='umberhulk'||e.kind==='hookedhorror'||e.kind==='beholder'))
    emit(s.x,s.y-(e.boss||e.kind==='golem'||e.kind==='beholder'?76:56)*z, (e.boss?34:14)*z, e.glow, e.boss?0.75:0.35);

  if(!e.dead&&e.ally&&e.hp<e.maxhp){
    const w=32*ZOOM,h=3.6*ZOOM, yy=s.y-48*ZOOM*e.scale;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(s.x-w/2-1,yy-1,w+2,h+2);
    ctx.fillStyle='#6ecf6a'; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
  }

  if(!e.dead&&e.team==='foe'&&(e.hp<e.maxhp||e.boss)){
    const w=(e.boss?122:38)*ZOOM,h=(e.boss?8:4.4)*ZOOM, yy=s.y-(e.boss?106:62)*ZOOM*e.scale;
    ctx.fillStyle='rgba(0,0,0,0.72)'; ctx.fillRect(s.x-w/2-1.5,yy-1.5,w+3,h+3);
    const bg=ctx.createLinearGradient(0,yy,0,yy+h);
    bg.addColorStop(0,e.boss?'#f04a42':'#c9382c'); bg.addColorStop(1,e.boss?'#8d1512':'#6d1712');
    ctx.fillStyle=bg; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
    ctx.strokeStyle='rgba(255,220,180,0.4)'; ctx.lineWidth=1; ctx.strokeRect(s.x-w/2,yy,w,h);
    if(e.boss){ ctx.font='800 '+(13*ZOOM)+'px "Trebuchet MS",sans-serif'; ctx.textAlign='center';
      ctx.lineWidth=3*ZOOM; ctx.strokeStyle='rgba(0,0,0,0.8)';
      ctx.strokeText(e.name,s.x,yy-7*ZOOM);
      ctx.fillStyle='#f6e2b6'; ctx.fillText(e.name,s.x,yy-7*ZOOM); ctx.textAlign='left'; }
  }
  if(e.crushed){
    if(e.corpse&&!e.looted){
      const pulse=.5+Math.sin(G.elapsed*4.1+e.x)*.28;
      emit(s.x,s.y-10*ZOOM,20*ZOOM*pulse,'#ffd27a',0.55);
    }
    ctx.font='700 '+(10*ZOOM)+'px "Trebuchet MS",sans-serif'; ctx.textAlign='center';
    const tag=(e.col&&e.col.key==='pordoom'&&!e.looted)?(e.name+'  (red cap)'):(e.name||'Kin')+'  (under stone)';
    ctx.lineWidth=3*ZOOM; ctx.strokeStyle='rgba(0,0,0,0.75)';
    ctx.strokeText(tag,s.x,s.y-20*ZOOM);
    ctx.fillStyle=e.corpse&&!e.looted?'#ffe08a':'#e8c9a0'; ctx.fillText(tag,s.x,s.y-20*ZOOM); ctx.textAlign='left';
  }
  if(!e.dead&&e.npc&&e.name){
    ctx.font='700 '+(10*ZOOM)+'px "Trebuchet MS",sans-serif'; ctx.textAlign='center';
    const label=e.sleeping?e.name+'  (asleep)':e.name;
    ctx.lineWidth=3*ZOOM; ctx.strokeStyle='rgba(0,0,0,0.75)';
    ctx.strokeText(label,s.x,s.y-52*ZOOM*e.scale);
    ctx.fillStyle='#ffe08a'; ctx.fillText(label,s.x,s.y-52*ZOOM*e.scale); ctx.textAlign='left';
  }
}

function drawShot(g,s){

function drawPart(g,q){

/* ==========================================================================
   ECONOMY  -  ore, skills, gear, consumables. Persists across chapters.
   ========================================================================== */
const RESMETA={

};
const RES=Object.keys(RESMETA);
const SKILLS=[
  {k:'weapon',n:'Weapon Smithing',who:'MACAR'},
  {k:'armour',n:'Armour Smithing',who:'ORBO'},
  {k:'bomb',  n:'Bomb Making',    who:'FENDUR'},

  {k:'forage',n:'Herb Lore',      who:'TALPOR'},

function skillLvl(k){ return clamp(1+Math.floor(Math.sqrt((G.xp[k]||0)/7)),1,10); }
function skillNext(k){ const l=skillLvl(k); return l>=10?1:clamp(((G.xp[k]||0)-7*(l-1)*(l-1))/(7*(l*l-(l-1)*(l-1))),0,1); }
function learn(k,n){ G.xp[k]=(G.xp[k]||0)+n;
  const before=G.skillSnap[k]||1, now=skillLvl(k);
  if(now>before){ G.skillSnap[k]=now;
    say(SKILLS.find(s=>s.k===k).n+' is now rank '+now+'.','#ffd27a'); } }
function gain(r,n){ G.res[r]=(G.res[r]||0)+n; }
function gpTotal(){
  const c=G.coin||{};
  let n=(c.pp||0)*5+(c.gp||0)+Math.floor((c.ep||0)/2)+Math.floor((c.sp||0)/10)+Math.floor((c.cp||0)/100);
  ensurePacks();
  ROSTER.forEach(r=>{(packOf(r.key).gems||[]).forEach(g=>n+=g.gp||0);});
  return n;
}
function spendGp(n){
  if(!G.coin) G.coin={cp:0,sp:0,ep:0,gp:0,pp:0};
  const c=G.coin; let left=n;
  const take=(k,rate)=>{
    if(left<=0) return;
    const have=c[k]||0, need=Math.ceil(left/rate), use=Math.min(have,need);
    if(!use) return;
    c[k]-=use; left-=use*rate;
  };
  take('gp',1); take('pp',5); take('ep',0.5); take('sp',0.1); take('cp',0.01);
  if(left>0.01){
    ensurePacks();
    ROSTER.forEach(r=>{
      const pk=packOf(r.key); if(!pk.gems||left<=0) return;
      pk.gems=pk.gems.filter(gm=>{
        if(left<=0) return true;
        const v=gm.gp||0;
        if(v<=left){ left-=v; return false; }
        gm.gp=v-Math.ceil(left); left=0; return true;
      });
    });
    syncPackTotals();
  }
  if(left>0.01) c.gp=Math.max(0,(c.gp||0)-Math.ceil(left));
}
function giveGnomeThanks(){
  if(G.gnomeGift) return;
  G.gnomeGift=1;
  addCoin('gp',80); addCoin('sp',40);
  gain('deepsilver',2); gain('silk',1);
  const p=rollPotion(); givePotion(p,1);
  awardPartyXp(treasureGp({gp:80,sp:40},0,0), 'Gnome payment', player());
  say('Vesk sets a pouch on the sill. Payment for Nim.','#ffd27a');
  say('Inside: coin, metal, silk, and a potion — '+p.n+'.','#e0d2ff');
}
function afford(cost){ for(const k in cost) if((G.res[k]||0)<cost[k]) return false; return true; }
function spend(cost){ for(const k in cost) G.res[k]-=cost[k]; }
function costText(cost){ const p=[]; for(const k in cost) p.push(cost[k]+' '+RESMETA[k].n); return p.length?p.join(' + '):'free'; }

function giveGem(it, silent){
  ensurePacks();
  const pk=packOf('macar');
  if(!pk.gems) pk.gems=[];
  pk.gems.push({n:it.n, d:it.d||'', gp:it.gp||0, k:'gem'});

  if(!silent) say((it.n||'Gem')+' into MACAR\'s pack'+(it.gp?' \u2014 '+it.gp+' gp.':'.'), '#ff6a6a');

function ensureLoot(){ if(!G.loot) G.loot=[]; }
function lootLabel(pile){
  if(pile.label) return pile.label;
  if(pile.items&&pile.items.length===1&&pile.items[0].k==='gem'){
    const it=pile.items[0];
    return it.n+(it.gp?(' ('+it.gp+' gp)'):'');
  }
  const bits=[];
  const c=pile.coins||{};
  if(c.gp) bits.push(c.gp+' gp');
  if(c.pp) bits.push(c.pp+' pp');
  if(c.sp) bits.push(c.sp+' sp');
  if(c.ep) bits.push(c.ep+' ep');
  if(c.cp) bits.push(c.cp+' cp');
  if(pile.gems) bits.push(pile.gems+' gems');
  if(pile.jew) bits.push(pile.jew+' jewelry');
  (pile.potions||[]).forEach(p=>bits.push(p.n));
  (pile.items||[]).forEach(it=>bits.push(it.n));
  if(pile.res) Object.keys(pile.res).forEach(k=>bits.push((RESMETA[k]&&RESMETA[k].n)||k));
  return bits.slice(0,3).join(', ')||'Treasure';
}
function spawnLoot(x,y, pile){
  ensureLoot();
  pile=pile||{};
  const loot={
    id:EID++, x, y, r:0.38, gone:0,
    kind:pile.kind||'pile',
    coins:pile.coins||{},
    gems:pile.gems||0,
    jew:pile.jew||0,
    potions:pile.potions||[],
    items:pile.items||[],
    res:pile.res||null,
    glow:pile.glow||(pile.kind==='ruby'?'#ff2a3c':'#ffd27a')
  };
  loot.label=lootLabel(Object.assign({label:pile.label}, loot));
  G.loot.push(loot);
  burst(x,y,loot.glow,10,2.2);
  return loot;
}
function nearestLoot(e, r){
  ensureLoot();
  let best=null, bd=r;
  for(const pile of G.loot){
    if(pile.gone) continue;
    const d=dist(e,pile);
    if(d<bd){ bd=d; best=pile; }
  }
  return best;
}
function takeLoot(pile){
  if(!pile||pile.gone) return;
  pile.gone=1;
  G.loot=(G.loot||[]).filter(x=>x!==pile);
  convertHoard(pile.coins||{}, pile.gems||0, pile.jew||0, 0, 'none', pile);
  (pile.potions||[]).forEach(p=>givePotion(p,1));
  let extra=0;
  (pile.items||[]).forEach(it=>{
    extra+=it.gp||it.xp||0;
    if(it.k==='gem') giveGem(it,1);
    else giveMagic(it,1);
  });
  if(pile.res){
    Object.keys(pile.res).forEach(k=>{
      gain(k, pile.res[k]);
      ftext(pile.x, pile.y, '+'+pile.res[k]+' '+((RESMETA[k]&&RESMETA[k].n)||k), (RESMETA[k]&&RESMETA[k].c)||'#ffd27a');
    });
  }
  if(extra) awardPartyXp(Math.round(extra), 'Treasure ('+Math.round(extra)+' gp)', pile);
  say('Picked up '+pile.label+'.','#ffd27a');
  ftext(pile.x, pile.y-0.35, pile.label, pile.glow||'#ffd27a');
  burst(pile.x, pile.y, pile.glow||'#ffd27a', 12, 2.4);
}
function hoardToPile(hoard){
  if(!hoard) return null;
  const potions=[], items=[];
  const magN=hoard.magN||0;
  const extras=extraMagicForKind(hoard.magKind||'any');
  const rolls=magN+extras.length;
  for(let i=0;i<rolls;i++){
    const kind=i<magN?(hoard.magKind||'any'):extras[i-magN];
    const got=rollMagicItem(kind);
    if(got.kind==='potion') potions.push(got.potion);
    else items.push(got.item);
  }
  const coins=hoard.coins||{};
  const hasCoin=Object.keys(coins).some(k=>coins[k]>0);
  if(!hasCoin && !hoard.gems && !hoard.jew && !potions.length && !items.length) return null;
  return {kind:'pile', coins, gems:hoard.gems||0, jew:hoard.jew||0, potions, items, glow:'#ffd27a'};
}
function foeDrop(e){
  if(e.rubyDrop || e.kind==='statue' || e.name==='Thin One'){
    const gp=d1000();
    spawnLoot(e.x+rnd(.3,-.3), e.y+rnd(.3,-.3), {
      kind:'ruby', glow:'#ff2a3c',
      items:[{n:'Ruby', gp, k:'gem', d:'A blood-red shard from a Thin One. Worth '+gp+' gp.'}],
      label:'Ruby ('+gp+' gp)'
    });
    say((e.name||'The statue')+' drops a ruby.','#ff6a6a');
    return;
  }
  const raw=(e.treasure||'Nil').toString().trim();
  if(!raw || /^nil$/i.test(raw)){
    if(e.boss){
      const hoard=rollLair('H')||{coins:{},gems:0,jew:0,magN:1,magKind:'anyp'};
      const pile=hoardToPile(hoard);
      if(pile) spawnLoot(e.x, e.y, pile);
    } else if(Math.random()<0.18){
      spawnLoot(e.x, e.y, {kind:'ore', res:{ironstone:1}, label:'Ironstone', glow:RESMETA.ironstone.c});
    }
    return;
  }
  const letter=raw[0];
  let hoard=('ABCDEFGHI'.indexOf(letter)>=0)?rollLair(letter):rollIndividual(letter);
  if(!hoard){
    if(e.boss) hoard=rollLair('C')||{coins:{gp:ri(20,80)},gems:0,jew:0,magN:0};
    else return;
  }
  if(e.boss && !hoard.magN && chanceOk(40)){ hoard.magN=1; hoard.magKind='anyp'; }
  const pile=hoardToPile(hoard);
  if(pile) spawnLoot(e.x+rnd(.25,-.25), e.y+rnd(.25,-.25), pile);
}
function newGear(){ return {wt:0,wd:100,wmax:100,rune:0, at:0,ad:100,amax:100, cd:100}; }
function initEconomy(){
  G.res={}; RES.forEach(r=>G.res[r]=0);
  G.xp={}; G.skillSnap={}; SKILLS.forEach(s=>{G.xp[s.k]=0;G.skillSnap[s.k]=1;});
  G.gear={}; ROSTER.forEach(r=>G.gear[r.key]=newGear());
  G.packs={}; ROSTER.forEach(r=>G.packs[r.key]=newPack(r));
  G.packWho='macar';

  G.coin={cp:0,sp:0,ep:0,gp:0,pp:0};

  G.equipped={weapon:null,armor:null,ring:null,wand:null};

}
function wepMult(e){ const g=e.gear; if(!g) return 1;
  let m=1+g.wt*0.18+(g.rune?0.12:0); if(g.wd<=0) m*=0.6; return m; }
function armCut(e){ const g=e.gear; if(!g) return 0;
  let c=g.at*0.065 + (g.cd>55?0.05:0); if(g.ad<=0) c*=0.3; return clamp(c,0,0.45); }
function wear(g,w,a){ if(!g) return; if(w) g.wd=Math.max(0,g.wd-w); if(a) g.ad=Math.max(0,g.ad-a); }

/* ==========================================================================
   MINING  -  shovel excavates solid rock; 1 sq ft per 10 dungeon minutes
   (1 real second = 1 dungeon minute). Bombs still blow rock. Combat does not.
   ========================================================================== */
const DIG_MINUTES=10;
function isVein(i,j){ return h2(i*3,j*7)>0.86; }
function rockAt(L,i,j){
  const k=i+','+j;
  if(!L.wallHP[k]) L.wallHP[k]={hp:isVein(i,j)?48:120, max:isVein(i,j)?48:120};
  return L.wallHP[k];
}
function diggable(L,i,j){
  return i>=1 && j>=1 && i<L.w-1 && j<L.h-1 && L.grid[j] && L.grid[j][i]===1;
}
function digTarget(e){
  const L=G.lvl; if(!L) return null;
  for(const reach of [0.85,1.15]){
    const i=(e.x+e.fdx*reach)|0, j=(e.y+e.fdy*reach)|0;
    if(diggable(L,i,j)) return {i,j};
  }
  return null;
}
function oreDrop(i,j,vein){
  const got={};
  const add=(r,n)=>{ got[r]=(got[r]||0)+n; gain(r,n); };
  add('ironstone', 1+ri(0,1)+(vein?2:0));
  if(Math.random() < (vein?0.12:0.05)) add(Math.random()<0.62?'deepsilver':'starmetal',1);
  if(Math.random() < 0.10) add('powder',1);
  if(G.lvl && G.lvl.n===2 && Math.random()<0.20) add('barley',1);
  const keys=Object.keys(got);
  let off=0;
  for(const r of keys){
    ftext(i+0.5,j+0.5-off*0.35,'+'+got[r]+' '+RESMETA[r].n, RESMETA[r].c, r==='starmetal'||r==='deepsilver');
    off++;
    if(r==='starmetal'||r==='deepsilver'){ shake(9); burst(i+0.5,j+0.5,RESMETA[r].c,22,3.4);
      say('A rare seam! '+RESMETA[r].n+'.', RESMETA[r].c); }
  }
  return got;
}
function breakRock(L,i,j){
  if(!diggable(L,i,j)) return false;
  const vein=isVein(i,j);
  L.grid[j][i]=0; L.seen[j][i]=1; delete L.wallHP[i+','+j];
  burst(i+0.5,j+0.5, vein?'#d8b46a':'#9a8163', 22, 3.6);
  addDecal(i+0.5,j+0.5,rnd(1.4,0.8));
  oreDrop(i,j,vein);
  learn('mining', vein?6:3);
  shake(7);
  return true;
}
/* returns true if the swing was spent on rock */
function digSwing(e,dmg){
  const L=G.lvl; if(!L||!e.hero) return false;
  const t=digTarget(e); if(!t) return false;
  const r=rockAt(L,t.i,t.j);
  const power=dmg*(1+skillLvl('mining')*0.14);
  r.hp-=power;
  burst(t.i+0.5,t.j+0.5,'#8f7757',7,2.2);
  ftext(t.i+0.5,t.j+0.5,'-'+Math.round(power),'#d8c49a');
  wear(e.gear,0.5,0);
  if(r.hp<=0) breakRock(L,t.i,t.j);
  return true;
}

/* ==========================================================================
   BOMBS  -  select, aim, throw. 10d10 in a radius, and it opens rock.
   ========================================================================== */
function bombDamage(){ let d=0; for(let i=0;i<10;i++) d+=ri(1,10);
  return Math.round(d*(1+skillLvl('bomb')*0.10)); }
function bombRadius(){ return 2.7+skillLvl('bomb')*0.06; }
function throwBomb(){
  const p=player(); if(!p||!G.aim) return;
  if(!takeFromPacks('bombs')){ hint('No bombs in the packs.',2.2); return; }
  G.thrown.push({sx:p.x,sy:p.y,tx:G.aim.x,ty:G.aim.y,x:p.x,y:p.y,t:0,dur:0.62,fuse:0.55,state:0,spin:0});
  say('A bomb from the packs. Fuse lit.','#ffb45c');
  G.aim=null;
  learn('bomb',2);
}
function explode(x,y){
  const dmg=bombDamage(), R=bombRadius();
  shake(30); G.flash={c:'#ffd9a0',a:0.55};
  burst(x,y,'#ffd27a',60,7); burst(x,y,'#ff7a3a',44,5);
  for(let i=0;i<8;i++) addDecal(x+rnd(1.8,-1.8),y+rnd(1.8,-1.8),rnd(1.8,1));
  ftext(x,y-0.6,'10d10 = '+dmg,'#ffd27a',1);
  for(const e of G.ents){
    if(e.dead) continue;
    const d=dist(e,{x,y}); if(d>R+e.r) continue;
    const f=clamp(1-(d/R)*0.5,0.5,1);
    const own=e.team==='party'?0.5:1;
    damage(e, dmg*f*own, '#ffcf7a');
    const a=ang(e.x-x,e.y-y); e.kx+=Math.cos(a)*3.2; e.ky+=Math.sin(a)*3.2;
  }
  const L=G.lvl;
  if(L){ const R2=Math.ceil(R)-0.4;
    for(let j=(y-R2)|0;j<=(y+R2);j++) for(let i=(x-R2)|0;i<=(x+R2);i++){
      if(Math.hypot(i+0.5-x,j+0.5-y)>R2) continue;
      if(diggable(L,i,j)){ const r=rockAt(L,i,j); r.hp-=dmg*0.9; if(r.hp<=0) breakRock(L,i,j); } } }
}
function updateBombs(dt){
  for(const b of G.thrown){
    b.spin+=dt*9;
    if(b.state===0){
      b.t+=dt/b.dur;
      const f=clamp(b.t,0,1);
      b.x=lerp(b.sx,b.tx,f); b.y=lerp(b.sy,b.ty,f);
      b.arc=Math.sin(f*Math.PI)*2.6;
      if(b.t>=1){ b.state=1; b.arc=0; }
    } else { b.fuse-=dt;
      if(b.fuse<=0 && !b.done){ b.done=1; explode(b.x,b.y); } }
  }
  G.thrown=G.thrown.filter(b=>!b.done);
}

function roundPath(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }
function carveFrame(g,x,y,w,h,r,a){
  r=Math.min(r||7,w/2,h/2);
  g.fillStyle='rgba(8,6,5,'+(a===undefined?0.84:a)+')'; roundPath(g,x,y,w,h,r); g.fill();
  const ig=g.createLinearGradient(x,y,x,y+h);
  ig.addColorStop(0,'rgba(48,36,24,0.55)'); ig.addColorStop(1,'rgba(14,10,8,0.35)');
  g.fillStyle=ig; roundPath(g,x+3,y+3,w-6,h-6,Math.max(2,r-2)); g.fill();
  g.strokeStyle='rgba(214,176,112,0.62)'; g.lineWidth=1.8; roundPath(g,x+1,y+1,w-2,h-2,r); g.stroke();
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1.15; roundPath(g,x+4.5,y+4.5,w-9,h-9,Math.max(1,r-3)); g.stroke();
  g.fillStyle='rgba(196,158,88,0.75)';
  const d=5.5;
  [[x+d,y+d],[x+w-d,y+d],[x+d,y+h-d],[x+w-d,y+h-d]].forEach(p=>{
    g.beginPath(); g.arc(p[0],p[1],2.05,0,TAU); g.fill();
  });
}
function plate(g,x,y,w,h,r,a){ carveFrame(g,x,y,w,h,r,a); }
function banner(g,x,y,w,h){ g.beginPath(); g.moveTo(x,y); g.lineTo(x+w,y);
  g.lineTo(x+w-h*.55,y+h); g.lineTo(x,y+h); g.closePath(); }
function face(g,cx,cy,rr,c,dead){
  const img=c&&SPR[c.key];
  g.save();
  roundPath(g,cx-rr,cy-rr,rr*2,rr*2,3); g.clip();
  g.fillStyle=dead?'#1a120c':'#2a1c14'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2);
  if(img){
    const h=rr*3.15, w=h*(img.width/Math.max(1,img.height));
    g.drawImage(img, cx-w/2, cy-rr*0.55, w, h);
  } else {
  const u=rr/20;
  g.fillStyle=c.skin; g.beginPath(); g.ellipse(cx,cy+2*u,12.4*u,13.4*u,0,0,TAU); g.fill();
  g.fillStyle=c.beard; g.beginPath(); g.moveTo(cx-11*u,cy+1*u);
  g.quadraticCurveTo(cx-14*u,cy+17*u,cx,cy+22*u); g.quadraticCurveTo(cx+14*u,cy+17*u,cx+11*u,cy+1*u); g.closePath(); g.fill();
  g.fillStyle=c.beardD; g.fillRect(cx-1.3*u,cy+2*u,2.6*u,18*u);
  g.fillStyle=c.trim;
  g.beginPath(); g.ellipse(cx-6.4*u,cy+16*u,2.4*u,1.5*u,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(cx+6.4*u,cy+16*u,2.4*u,1.5*u,0,0,TAU); g.fill();
  g.fillStyle='#1d1410'; g.beginPath(); g.arc(cx-4.6*u,cy-1.6*u,2*u,0,TAU); g.fill();
  g.beginPath(); g.arc(cx+4.6*u,cy-1.6*u,2*u,0,TAU); g.fill();
  g.fillStyle='rgba(255,255,255,0.45)';
  g.beginPath(); g.arc(cx-5.2*u,cy-2.4*u,0.7*u,0,TAU); g.fill();
  g.beginPath(); g.arc(cx+4*u,cy-2.4*u,0.7*u,0,TAU); g.fill();
  g.fillStyle=c.hair; g.fillRect(cx-12*u,cy-12*u,24*u,5.5*u);
  if(c.cap){ g.fillStyle=c.cap; g.beginPath(); g.moveTo(cx-13*u,cy-8*u);
    g.quadraticCurveTo(cx,cy-21*u,cx+13*u,cy-8*u); g.closePath(); g.fill(); }
  else { g.fillStyle=c.metal; g.beginPath(); g.arc(cx,cy-8*u,12.4*u,Math.PI,0); g.fill();
    g.fillStyle=c.trim; g.fillRect(cx-2.1*u,cy-19*u,4.2*u,12*u);
    g.fillStyle='rgba(255,246,220,0.28)'; g.fillRect(cx-10*u,cy-14*u,6*u,3*u); }
  }
  if(dead){ g.fillStyle='rgba(0,0,0,0.65)'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2); }
  g.restore();
  g.strokeStyle='rgba(40,28,16,0.9)'; g.lineWidth=1.6;
  roundPath(g,cx-rr,cy-rr,rr*2,rr*2,3); g.stroke();
}

function drawPortraitStack(g,s){
  const party=ROSTER.map(r=>G.ents.find(e=>e.team==='party'&&e.col&&e.col.key===r.key)).filter(Boolean);
  const x=8*s, y=8*s, w=PORT?152*s:188*s, gap=3*s;
  const avail=Math.max(160, VH-(PORT?130*s:110*s));
  const h=Math.min(PORT?46*s:50*s, (avail-y)/Math.max(1,party.length)-gap);
  UI.portraitHits=[];
  party.forEach((e,i)=>{
    const yy=y+i*(h+gap);
    UI.portraitHits.push({x,y:yy,w,h,key:e.col.key});
    carveFrame(g,x,yy,w,h,6,.88);
    if(e.hero){ g.strokeStyle='rgba(255,210,130,0.7)'; g.lineWidth=1.6; roundPath(g,x+1,yy+1,w-2,h-2,6); g.stroke(); }
    if(G.inspect===e.col.key){ g.strokeStyle='rgba(255,220,140,0.95)'; g.lineWidth=2; roundPath(g,x+1,yy+1,w-2,h-2,6); g.stroke(); }
    const rr=PORT?15*s:17*s, cx=x+rr+8*s, cy=yy+h/2;
    face(g,cx,cy,rr,e.col,e.dead);
    const tx=cx+rr+8*s;
    g.font='800 '+(PORT?11*s:12.5*s)+'px '+FONT_UI;
    g.fillStyle=e.dead?'#6b5b48':'#f2e0b6';
    g.fillText(e.col.name+'  '+clsLabel(e.cls)+e.lvl, tx, yy+16*s);
    g.font='700 '+(PORT?8*s:8.5*s)+'px '+FONT_UI;
    g.fillStyle='rgba(200,170,120,0.78)';
    const ab=entityAbil(e);
    g.fillText(sheetHpNow(e)+'/'+sheetHpMax(e)+' hp  AC '+effectiveAC(e)+(ab?'  CON '+ab.con:''), tx, yy+27*s);
    const bx=tx, by=yy+h-14*s, bw=w-(tx-x)-12*s, bh=7*s, f=clamp(e.hp/e.maxhp,0,1);
    g.fillStyle='rgba(0,0,0,0.72)'; g.fillRect(bx,by,bw,bh);
    const gr=g.createLinearGradient(bx,by,bx,by+bh);
    gr.addColorStop(0,e.dead?'#4a4a4a':(f<.3?'#e0644a':'#7ad45a'));
    gr.addColorStop(1,e.dead?'#2a2a2a':(f<.3?'#8a1f14':'#2f7a28'));
    g.fillStyle=gr; g.fillRect(bx,by,bw*f,bh);
    g.strokeStyle='rgba(220,190,130,0.4)'; g.lineWidth=1; g.strokeRect(bx,by,bw,bh);
  });
}

function drawMinimap(g,s){
  const L=G.lvl; if(!L) return;
  const sz=PORT?88*s:118*s, x=VW-sz-10*s, y=8*s;
  carveFrame(g,x,y,sz,sz,6,.88);
  const p=player(); if(!p) return;
  const pad=7*s, inner=sz-pad*2, cell=inner/28, ox=x+sz/2-p.x*cell, oy=y+sz/2-p.y*cell;
  g.save(); g.beginPath(); g.rect(x+pad,y+pad,inner,inner); g.clip();
  g.fillStyle='rgba(6,5,8,0.92)'; g.fillRect(x+pad,y+pad,inner,inner);
  for(let j=Math.max(0,(p.y-16)|0);j<Math.min(L.h,p.y+16);j++)
    for(let i=Math.max(0,(p.x-16)|0);i<Math.min(L.w,p.x+16);i++){
      if(!L.seen[j][i]) continue; const t=L.grid[j][i]; if(t===1||t===2) continue;
      g.fillStyle=t===4?'rgba(212,160,74,0.75)':t===3?'rgba(200,168,104,0.7)':'rgba(110,98,82,0.55)';
      g.fillRect(ox+i*cell,oy+j*cell,cell+.7,cell+.7); }
  const MAPC={macar:'#ffe08a',pordoom:'#ff8a4a',fendur:'#8ec8ff',orbo:'#d4b06a',talpor:'#d0d4e8'};
  g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='center';
  for(const e of G.ents){ if(e.dead) continue;
    const mx=ox+e.x*cell, my=oy+e.y*cell;
    if(e.team==='foe'){
      g.fillStyle=e.boss?'#ff3a3a':'#e04840';
      g.fillText('E', mx, my+3.2*s);
    } else {
      g.fillStyle=MAPC[e.col&&e.col.key]||'#fff2cf';
      g.fillText((e.col&&e.col.name||'M')[0], mx, my+3.2*s);
    } }
  const gd=L.guide&&L.guide();
  if(gd){ g.fillStyle='#ffd24a'; g.beginPath();
    g.moveTo(ox+gd.x*cell,oy+gd.y*cell-4); g.lineTo(ox+gd.x*cell+3.4,oy+gd.y*cell+2);
    g.lineTo(ox+gd.x*cell-3.4,oy+gd.y*cell+2); g.closePath(); g.fill(); }
  g.textAlign='left';
  g.restore();
}

function drawLog(g,s){
  const w=236*s,h=108*s,x=VW-w-10*s,y=VH-h-(PORT?96*s:94*s);
  carveFrame(g,x,y,w,h,6,.8);
  g.font='800 '+(10*s)+'px '+FONT_TITLE; g.fillStyle='rgba(232,217,184,0.9)';
  g.fillText('COMBAT LOG',x+12*s,y+16*s);
  g.strokeStyle='rgba(190,150,90,0.3)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x+10*s,y+22*s); g.lineTo(x+w-10*s,y+22*s); g.stroke();
  g.font='600 '+(10*s)+'px '+FONT_UI;
  const lines=[];
  for(const l of G.log){
    const tag=l.k==='combat'?'[COMBAT] ':'[LOG] ';
    const words=(tag+l.t).split(' '); let cur='';
    for(const wd of words){ const t=cur?cur+' '+wd:wd;
      if(g.measureText(t).width>w-22*s){ lines.push({t:cur,c:l.c,a:l.a,k:l.k}); cur=wd; } else cur=t; }
    if(cur) lines.push({t:cur,c:l.c,a:l.a,k:l.k}); }
  lines.slice(-6).forEach((l,i)=>{
    g.globalAlpha=l.a;
    const combat=l.t.indexOf('[COMBAT]')===0 || l.k==='combat';
    g.fillStyle=combat?'#ff6a5a':(l.t.indexOf('[LOG]')===0?'#ffb45c':l.c);
    g.fillText(l.t,x+12*s,y+38*s+i*12.2*s);
  });
  g.globalAlpha=1;
}

// on-screen compass to the next objective - the single biggest nav win
function drawGuideArrow(g,s){
  const L=G.lvl,p=player(); if(!L||!p||!L.guide) return;
  const gd=L.guide(); if(!gd) return;
  if(dist(p,gd)<3.2) return;
  const ps=w2s(p.x,p.y), ts=w2s(gd.x,gd.y);
  const a=Math.atan2(ts.y-ps.y,ts.x-ps.x);
  const rad=(PORT?64:78)*s;
  const cx=ps.x+Math.cos(a)*rad, cy=ps.y-46*ZOOM+Math.sin(a)*rad*.85;
  const pulse=.55+Math.sin(G.elapsed*3.4)*.25;
  g.save(); g.translate(cx,cy); g.rotate(a);
  g.fillStyle='rgba(255,206,110,'+pulse+')';
  g.beginPath(); g.moveTo(15*s,0); g.lineTo(-7*s,-9*s); g.lineTo(-3*s,0); g.lineTo(-7*s,9*s); g.closePath(); g.fill();
  g.strokeStyle='rgba(60,36,10,0.7)'; g.lineWidth=1.4; g.stroke();
  g.restore();
}

function drawBackpack(g,s){

    const dw=r*2-6*s, dh=r*2-6*s;

function drawStickBase(g,s){
  const home=UI.stickHome;
  const k=IN.stick;
  const ox=(k&&k.moved)?k.ox:home.x, oy=(k&&k.moved)?k.oy:home.y, R=home.r;
  const active=!!(k&&k.moved);
  g.globalAlpha=active?1:.42;
  g.fillStyle='rgba(16,11,7,0.45)'; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.fill();
  g.strokeStyle='rgba(214,180,120,0.55)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.stroke();
  // 4 iso direction ticks
  g.strokeStyle='rgba(214,180,120,0.30)'; g.lineWidth=2*s;
  for(let i=0;i<4;i++){ const a=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(ox+Math.cos(a)*R*.6,oy+Math.sin(a)*R*.6);
    g.lineTo(ox+Math.cos(a)*R*.85,oy+Math.sin(a)*R*.85); g.stroke(); }
  let dx=0,dy=0;
  if(active){ dx=k.x-k.ox; dy=k.y-k.oy; const m=Math.hypot(dx,dy);

  if(kind==='plant'){
    g.fillStyle='#3a7a3a'; g.beginPath(); g.moveTo(0,10*s); g.quadraticCurveTo(-8*s,2*s,0,-11*s);

function slotAnimImg(b){
  const ico=b.ico||(b.key==='attack'?'sword':((ABIL.find(a=>a.key===b.key)||{}).ico));
  const k=ICON_SPR[ico];
  if(!k) return null;
  const ab=ABIL.find(a=>a.key===b.key);
  if(b.hold && SPR[k+'_atk']) return SPR[k+'_atk'];
  if((b.key==='search'&&G.searching)||(b.key==='shovel'&&G.digging)) return SPR[k+'_atk']||SPR[k]||null;
  if(ab && cds[ab.key]>0 && cds[ab.key]>ab.cd-0.22 && SPR[k+'_atk']) return SPR[k+'_atk'];
  if(!(ab && cds[ab.key]>0)){
    const a=SPR[k+'_w1'], c=SPR[k+'_w2']||SPR[k];
    if(a) return ((G.elapsed*5)|0)%2 ? (c||a) : a;
  }
  return SPR[k]||null;
}
function drawSlot(g,b,s){
  const R=b.r, x=b.x-R, y=b.y-R, w=R*2, h=R*2;
  const ab=ABIL.find(a=>a.key===b.key);
  const cd=ab?cds[ab.key]/ab.cd:0, ready=cd<=0;
  const ico=b.ico||(b.key==='attack'?'sword':(ab&&ab.ico));
  carveFrame(g,x,y,w,h,5,.92);
  if(b.hold){ g.strokeStyle='rgba(255,220,150,0.95)'; g.lineWidth=2.2*s; roundPath(g,x+1,y+1,w-2,h-2,5); g.stroke(); }
  if((b.key==='search'&&G.searching)||(b.key==='shovel'&&G.digging)){
    g.strokeStyle='rgba(255,214,140,'+(0.5+Math.sin(G.elapsed*6)*0.4)+')'; g.lineWidth=2.4*s;
    roundPath(g,x-2.5*s,y-2.5*s,w+5*s,h+5*s,6); g.stroke(); }
  const col=ready?(b.key==='rally'?'#ff8a7a':'#e9d5a6'):'rgba(160,140,110,0.42)';

    g.save();
    roundPath(g,x+3*s,y+3*s,w-6*s,h-6*s,3); g.clip();
    g.globalAlpha=ready?1:0.42;
    const iw=Math.max(1,simg.width), ih=Math.max(1,simg.height);
    const dw=w-6*s, dh=h-6*s;
    const sc=Math.max(dw/iw, dh/ih);
    const rw=iw*sc, rh=ih*sc;
    g.drawImage(simg, x+3*s+(dw-rw)/2, y+3*s+(dh-rh)/2, rw, rh);
    g.globalAlpha=1; g.restore();
  } else {
    icon(g, ico, b.x, b.y-(b.num?2*s:0), b.small?0.78*s:1.05*s, col);
  }
  if(b.num){
    g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='left';

  }

  }
  if(ab&&(ab.key==='bomb'||ab.key==='ale')){
    syncPackTotals();
    const n=ab.key==='bomb'?partyCount('bombs'):partyCount('ales');
    if(!n){ g.fillStyle='rgba(8,5,3,0.5)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill(); }
    const px=b.x+R*0.72, py=b.y-R*0.72;
    g.fillStyle=n?'rgba(20,14,8,0.92)':'rgba(50,14,8,0.92)';
    g.beginPath(); g.arc(px,py,8.4*s,0,TAU); g.fill();
    g.strokeStyle=n?'rgba(214,176,104,0.85)':'rgba(190,80,60,0.8)'; g.lineWidth=1.4*s; g.stroke();
    g.font='800 '+(9.5*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle=n?'#f2dfb6':'#ff9a86'; g.fillText(String(n),px,py+3.4*s); g.textAlign='left';
  }
  if(ab&&ab.key==='bomb'&&G.aim){
    g.strokeStyle='rgba(255,170,90,'+(0.6+Math.sin(G.elapsed*6)*0.3)+')'; g.lineWidth=2.4*s;
    roundPath(g,x-3*s,y-3*s,w+6*s,h+6*s,6); g.stroke(); }
  if(b.key==='shovel'&&G.digging){
    const left=G.dig?Math.max(0,DIG_MINUTES-G.dig.min):DIG_MINUTES;
    g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='center';

  if(b.label && !b.num){
    g.font='800 '+(8*s)+'px '+FONT_UI; g.textAlign='center';
    g.lineWidth=3*s; g.strokeStyle='rgba(0,0,0,0.75)';

    g.fillStyle='#f2dfb6'; g.fillText(b.label, b.x, b.y-R-4*s); g.textAlign='left'; }
}

function drawPack(g){
  menuHits=[]; const s=UIS;
  ensurePacks();
  if(!G.packWho) G.packWho='macar';
  const pk=packOf(G.packWho);
  syncPackTotals();
  g.fillStyle='#0b0806'; g.fillRect(0,0,VW,VH); embers(g); darken(g,.5);
  g.textAlign='center';
  g.font='700 '+(11.5*s)+'px "Trebuchet MS",sans-serif'; g.fillStyle='rgba(190,220,170,0.9)';
  g.fillText('BACKPACK  \u00b7  ITEMS, COIN, AND MAGIC', VW/2, VH*.055);
  g.font='600 '+(10*s)+'px "Trebuchet MS",sans-serif'; g.fillStyle='rgba(200,180,140,0.75)';
  const c=G.coin||{};
  g.fillText((c.cp||0)+' cp   '+(c.sp||0)+' sp   '+(c.ep||0)+' ep   '+(c.gp||0)+' gp   '+(c.pp||0)+' pp', VW/2, VH*.09);
  g.textAlign='left';
  const tabW=(VW-20*s)/ROSTER.length, tabH=PORT?26*s:28*s, tabY=VH*.11;
  ROSTER.forEach((r,i)=>{
    const x=10*s+i*tabW, on=G.packWho===r.key;
    plate(g,x+2*s,tabY,tabW-4*s,tabH,5,on?.9:.5);
    if(on){ g.strokeStyle='rgba(255,208,124,0.7)'; g.lineWidth=1.6; roundPath(g,x+2*s,tabY,tabW-4*s,tabH,5); g.stroke(); }
    g.font='800 '+(PORT?8*s:9.5*s)+'px "Trebuchet MS",sans-serif'; g.textAlign='center';
    g.fillStyle=on?'#ffe9c0':'rgba(160,140,110,0.75)';
    g.fillText(r.name, x+tabW/2, tabY+tabH*0.62);
    g.textAlign='left';
    menuHits.push({x:x+2*s,y:tabY,w:tabW-4*s,h:tabH,fn:()=>{ G.packWho=r.key; syncPackTotals(); }});
  });
  const sheet=G.abil&&G.abil[G.packWho];
  g.font='600 '+(9.5*s)+'px "Trebuchet MS",sans-serif';
  g.fillStyle='rgba(210,190,150,0.85)';
  g.fillText((sheet?fmtAbil(sheet)+'  HP '+sheet.maxhp:'')+'   bombs '+(pk.bombs||0)+
    '  ale '+(pk.ales||0)+'  rations '+(pk.rations||0)+'  torches '+(pk.torches||0)+
    (pk.ammo?'  bolts '+pk.ammo:''), 14*s, tabY+tabH+16*s);
  const eq=G.equipped||{};
  const mag=pk.magic||[];
  const pots=pk.potions||[];
  const herbs=Object.keys(pk.herbs||{});
  const gems=pk.gems||[];
  const rows=[];
  mag.forEach((it,i)=>{
    const worn=eq.weapon===it||eq.armor===it||eq.ring===it||eq.wand===it;
    rows.push({kind:'magic',it,i,t:(worn?'[E] ':'')+it.n,info:it.d,tag:it.cat||'Magic'});
  });
  pots.forEach((p,i)=>rows.push({kind:'potion',p,i,t:p.n,info:p.d,tag:'Potion'}));
  gems.forEach((gm,i)=>rows.push({kind:'gem',gm,i,t:gm.n+(gm.gp?('  \u2014  '+gm.gp+' gp'):''),info:gm.d||'',tag:'Gem'}));
  herbs.forEach(n=>rows.push({kind:'herb',n,t:n+'  \u00d7'+(pk.herbs[n]||0),info:(HERBS.find(h=>h.n===n)||{}).d||'',tag:'Herb'}));
  const top=tabY+tabH+26*s, bot=VH-58*s, h=Math.min(PORT?34*s:38*s, Math.max(26*s,(bot-top)/Math.max(1,rows.length||1)));
  if(!rows.length){
    g.textAlign='center'; g.fillStyle='rgba(180,160,120,0.7)';
    g.fillText('This pack holds kit only. Loot potions go to MACAR. Tap another name.', VW/2, VH*.48);
    g.textAlign='left';
  }
  const inField=G.packFrom==='play';
  rows.slice(0,10).forEach((r,i)=>{
    const y=top+i*h, x=10*s, w=VW-20*s;
    plate(g,x,y,w,h-3*s,5,.8);
    g.font='800 '+(8*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle=r.kind==='magic'?'#ffd27a':r.kind==='potion'?'#e0d2ff':r.kind==='gem'?'#ff6a6a':'#6aff8a';
    g.fillText((r.tag||r.kind).toUpperCase(), x+10*s, y+12*s);
    g.font='700 '+(PORT?11*s:12*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle='#f4e2b8'; g.fillText(r.t, x+10*s, y+h*0.58);
    g.font='600 '+(8.5*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle='rgba(190,170,130,0.7)'; g.fillText((r.info||'').slice(0,72), x+10*s, y+h-8*s);
    menuHits.push({x,y,w,h:h-3*s,fn:()=>{
      const who=packUser();
      const bag=packOf(G.packWho);
      if(r.kind==='magic'){
        const it=bag.magic[r.i];
        if(!it) return;
        const consume=it.k==='scroll'||it.k==='prot'||it.k==='heal'||it.k==='ammo';
        if(inField){
          const spent=useMagicItem(it, who);
          if(spent==='spent'||consume) bag.magic.splice(r.i,1);
        } else if(consume){
          bag.magic.splice(r.i,1);
          G.carryEffects=G.carryEffects||[];
          G.carryEffects.push({t:'magic',it});
          say('Set aside for the next descent: '+it.n,'#ffd27a');
        } else {
          useMagicItem(it, who);
        }
      } else if(r.kind==='potion'){
        const pot=bag.potions.splice(r.i,1)[0];
        if(!pot) return;
        if(inField) drinkPotion(pot, who);
        else { G.carryEffects=G.carryEffects||[]; G.carryEffects.push({t:'potion',p:pot}); say('Set aside for the next descent: '+pot.n,'#e0d2ff'); }
      } else if(r.kind==='gem'){
        const gm=(bag.gems||[])[r.i];
        if(gm) say(gm.n+(gm.gp?(' \u2014 '+gm.gp+' gp. '):'. ')+(gm.d||''),'#ff6a6a');
      } else {
        if(inField) useHerb(r.n, who);
        else { if(bag.herbs[r.n]){ bag.herbs[r.n]--; if(bag.herbs[r.n]<=0) delete bag.herbs[r.n]; }
          G.carryEffects=G.carryEffects||[]; G.carryEffects.push({t:'herb',n:r.n}); say('Herb packed: '+r.n,'#6aff8a'); }
      }
      syncPackTotals();
    }});
  });
  const back=G.packFrom==='play'?'Back to the seam':'Back to camp';
  menuBtn(g,back,VW/2,VH-22*s,Math.min(230*s,VW*.56),34*s,()=>{
    G.scene=G.packFrom==='play'?'play':(G.packFrom||'camp');
  });
}

function gnomeWares(){
  return [
    {t:'3 Ironstone',info:'Gnomish pig-iron, stacked for the next descent',gp:18,fn:()=>gain('ironstone',3)},
    {t:'Deepsilver',info:'A thumb of metal from their own seam',gp:55,fn:()=>gain('deepsilver',1)},
    {t:'Silk',info:'Underdark weave. Better padding than wool',gp:40,fn:()=>gain('silk',1)},
    {t:'A bottle from their still',info:'Rolled on the campaign d10,000 potion list',gp:35,fn:()=>givePotion(rollPotion())},
    {t:'A svirfneblin scroll',info:'Ink that only deep gnomes keep',gp:70,fn:()=>giveMagic(rollDmgScroll())},
    {t:'Gnomish Dagger +1',info:'Short blade. +1 to hit and damage',gp:90,fn:()=>giveMagic(magItem({cat:'Weapon',n:'Gnomish Dagger +1',d:'+1 to hit and damage. Forged behind the bronze door.',k:'weapon',plus:1}))}
  ];
}
function drawTrade(g){
  menuHits=[]; const s=UIS;
  giveGnomeThanks();
  g.fillStyle='#0b0806'; g.fillRect(0,0,VW,VH); embers(g); darken(g,.5);
  g.textAlign='center';
  g.font='700 '+(11.5*s)+'px "Trebuchet MS",sans-serif'; g.fillStyle='rgba(255,210,122,0.95)';
  g.fillText('SVIRFNEBLIN TRADE  \u00b7  FOR NIM', VW/2, VH*.07);
  g.font='600 '+(10*s)+'px "Trebuchet MS",sans-serif'; g.fillStyle='rgba(200,180,140,0.8)';
  const c=G.coin||{};
  g.fillText(gpTotal()+' gp   \u00b7   '+(c.gp||0)+' gp  '+(c.sp||0)+' sp  '+(c.pp||0)+' pp', VW/2, VH*.115);
  g.textAlign='left';
  const rows=gnomeWares();
  const top=VH*.16, bot=VH-58*s, h=Math.min(PORT?38*s:42*s, Math.max(30*s,(bot-top)/rows.length));
  rows.forEach((r,i)=>{
    const y=top+i*h, x=10*s, w=VW-20*s;
    const ok=gpTotal()>=r.gp;
    plate(g,x,y,w,h-3*s,5,ok?.85:.55);
    g.font='800 '+(8*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle=ok?'#d4a04a':'#8a7a60';
    g.fillText(r.gp+' GP', x+10*s, y+12*s);
    g.font='700 '+(PORT?11*s:12*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle=ok?'#f4e2b8':'#9a8a78'; g.fillText(r.t, x+10*s, y+h*0.58);
    g.font='600 '+(8.5*s)+'px "Trebuchet MS",sans-serif';
    g.fillStyle='rgba(190,170,130,0.7)'; g.fillText(r.info, x+10*s, y+h-8*s);
    menuHits.push({x,y,w,h:h-3*s,fn:()=>{
      if(gpTotal()<r.gp){ say('Not enough coin. The gnomes wait.','#9a8a78'); return; }
      spendGp(r.gp); r.fn(); say('Bought: '+r.t+'.','#ffd27a');
    }});
  });
  menuBtn(g,'Back to the door',VW/2,VH-22*s,Math.min(240*s,VW*.62),34*s,()=>{G.scene='play';});
}

function drawPause(g){
  menuHits=[]; const s=UIS; darken(g,.72);
  bigTitle(g,'PAUSED',VH*.24,(PORT?26:34)*s);
  g.textAlign='center'; g.font='600 '+(11*s)+'px "Trebuchet MS",sans-serif';
  g.fillStyle='rgba(190,168,128,0.8)';
  g.fillText('4/P pack  ·  B bomb  ·  F herbs  ·  G shovel  ·  d20 vs descending AC',VW/2,VH*.31);
  g.font='600 '+(10*s)+'px "Trebuchet MS",sans-serif';
  g.fillStyle='rgba(160,140,110,0.7)';
  g.fillText(G.ch===1?'Music: Cave of Time — Komiku':'Music: Dungeon_01 — Beau Buckley',VW/2,VH*.355);
  g.textAlign='left';
  menuBtn(g,'Resume',VW/2,VH*.40,Math.min(230*s,VW*.66),42*s,()=>{G.paused=false;});
  menuBtn(g,'Effects: '+(QUALITY?'High':'Fast'),VW/2,VH*.505,Math.min(230*s,VW*.66),38*s,()=>{QUALITY=QUALITY?0:1;});
  menuBtn(g,'Restart chapter',VW/2,VH*.61,Math.min(230*s,VW*.66),38*s,()=>{G.paused=false;startChapter(G.ch);});
  menuBtn(g,'Chapters',VW/2,VH*.715,Math.min(230*s,VW*.66),38*s,()=>{G.paused=false;G.scene='chapters';});
  menuBtn(g,'Credits',VW/2,VH*.82,Math.min(230*s,VW*.66),38*s,()=>openCredits('pause'));
}

/* ---------------------------- tap resolution ---------------------------- */
function resolveTaps(){
  while(IN.taps.length){
    const t=IN.taps.shift();
    if(G.scene==='play'&&!G.paused){
      if(promptBtn&&t.x>promptBtn.x&&t.x<promptBtn.x+promptBtn.w&&t.y>promptBtn.y&&t.y<promptBtn.y+promptBtn.h){
        fire('use'); continue; }
      if(throwBtn&&t.x>throwBtn.x&&t.x<throwBtn.x+throwBtn.w&&t.y>throwBtn.y&&t.y<throwBtn.y+throwBtn.h){
        cds.bomb=ABIL.find(a=>a.key==='bomb').cd; throwBomb(); continue; }
      const p=player(); if(!p) continue;
      const w=s2w(t.x,t.y+22*ZOOM);
      if(G.aim){ const d=dist(p,w), R=8;
        G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y};
        continue; }
      const foe=G.ents.find(e=>e.team==='foe'&&!e.dead&&dist(e,w)<1.1);
      const pile=(G.loot||[]).find(q=>!q.gone&&dist(q,w)<0.95);
      const body=G.ents.find(e=>e.corpse&&!e.looted&&dist(e,w)<1.1);
      if(pile && (!foe || dist(pile,w)<=dist(foe,w)) && (!body || dist(pile,w)<=dist(body,w))){
        if(dist(p,pile)<1.5) takeLoot(pile);
        else { p.dest={x:pile.x,y:pile.y,loot:pile.id}; p.stuck=0; p.lastD=undefined; }
        continue;
      }
      if(body && (!foe || dist(body,w)<=dist(foe,w))){
        if(dist(p,body)<1.5) lootCorpse(body);
        else { p.dest={x:body.x,y:body.y,corpse:body.id}; p.stuck=0; p.lastD=undefined; }
        continue;
      }
      if(foe){ p.dest={x:foe.x,y:foe.y,foe:foe.id}; p.stuck=0; p.lastD=undefined; continue; }
      const dst=nearestWalk(w.x,w.y,p);
      if(dst){ p.dest={x:dst.x,y:dst.y}; p.stuck=0; p.lastD=undefined; }
      continue;
    }
    for(const h of menuHits) if(t.x>h.x&&t.x<h.x+h.w&&t.y>h.y&&t.y<h.y+h.h){ h.fn(); break; }
  }
}

/* ---------------------------- loop ---------------------------- */
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now; dt=Math.min(dt,.05); G.t+=dt;
  if(G.hitstop>0) G.hitstop-=dt; else update(dt);
  syncMusic();
  render(); resolveTaps();
  requestAnimationFrame(loop);
}
resize();
bakeTextures(PAL.mine);
loadSprites(()=>{});
try{
  if(/play/.test((location.hash||'')+(location.search||''))) { startChapter(1); G.scene='play'; }
}catch(e){ console.error(e); }
render();
requestAnimationFrame(loop);
</script>
