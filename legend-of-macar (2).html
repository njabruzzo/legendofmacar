<script>
"use strict";
/* ==========================================================================
   THE LEGEND OF MACAR - Book I: From the Deep Seam
   Renderer: baked rock textures + colour lightmap (multiply) + additive bloom
   + persistent decals + sculpted characters. Canvas 2D, portrait & landscape.
   ========================================================================== */

const cv  = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
const LM  = document.createElement('canvas'), lmx = LM.getContext('2d');   // lightmap
const BL  = document.createElement('canvas'), blx = BL.getContext('2d');   // bloom
let VW=0, VH=0, DPR=1, UIS=1, ZOOM=1, TW=80, TH=40, PORT=false;
let QUALITY = 1;           // 1 = full post stack, 0 = lean
let CAN_BLUR = true;

function resize(){
  DPR = Math.min(window.devicePixelRatio||1, 2);
  VW = Math.max(240, window.innerWidth); VH = Math.max(240, window.innerHeight);
  cv.width = Math.floor(VW*DPR); cv.height = Math.floor(VH*DPR);
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  PORT = VH > VW;
  UIS  = clamp(Math.min(VW,VH)/(PORT?430:700), 0.66, 1.30);
  ZOOM = clamp(Math.min(VW,VH*1.5)/780, 0.78, 1.55);
  TW = 84*ZOOM; TH = 42*ZOOM;
  LM.width = Math.max(2,Math.floor(VW/2));  LM.height = Math.max(2,Math.floor(VH/2));
  BL.width = Math.max(2,Math.floor(VW/4));  BL.height = Math.max(2,Math.floor(VH/4));
  layoutUI();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,200));
try{ ctx.filter='blur(2px)'; CAN_BLUR = ctx.filter==='blur(2px)'; ctx.filter='none'; }catch(_){ CAN_BLUR=false; }

/* ---------------------------- utils ---------------------------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const ri=(a,b)=>Math.floor(rnd(b+1,a));
function h2(x,y){ let n=(x|0)*374761393+(y|0)*668265263; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
function h3(x,y,s){ let n=(x|0)*374761393+(y|0)*668265263+(s|0)*1442695041; n=(n^(n>>13))*1274126177; return ((n^(n>>16))>>>0)/4294967295; }
const ang=(dx,dy)=>Math.atan2(dy,dx);
function shade(h,a){
  h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); const r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=v=>Math.round(clamp(a>0? v+(255-v)*a : v*(1+a),0,255));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgbOf(h){ h=(h||'#888').replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function hexA(h,a){ const c=rgbOf(h); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
const OL='rgba(11,8,6,0.9)';
const FONT_UI='"Trebuchet MS","Gill Sans",Optima,sans-serif';
const FONT_TITLE='Cinzel,Palatino,"Palatino Linotype",Georgia,serif';

/* ---------------------------- painted sprites (Baldur's Gate isometric) ---------------------------- */
const SPR={};
const SPRITE_FILES={
  macar:'assets/dwarf_macar.png', pordoom:'assets/dwarf_pordoom.png', fendur:'assets/dwarf_fendur.png',
  orbo:'assets/dwarf_orbo.png', talpor:'assets/dwarf_talpor.png',
  rat:'assets/mon_rat.png', bat:'assets/mon_bat.png', spider:'assets/mon_spider.png', spitter:'assets/mon_spitter.png',
  beetle:'assets/mon_beetle.png', myconid:'assets/mon_myconid.png', thinone:'assets/mon_thinone.png',
  crawler:'assets/mon_crawler.png', undead:'assets/mon_undead.png', elder:'assets/mon_elder.png',
  barrow:'assets/mon_barrow.png', troll:'assets/mon_troll.png', construct:'assets/mon_construct.png',
  wraith:'assets/mon_wraith.png', burrower:'assets/mon_burrower.png', champion:'assets/mon_champion.png',
  warden:'assets/mon_warden.png', horror:'assets/mon_horror.png', drake:'assets/mon_drake.png', king:'assets/mon_king.png',
  golem_brass:'assets/mon_golem_brass.png', golem_silver:'assets/mon_golem_silver.png',
  golem_gold:'assets/mon_golem_gold.png', golem_platinum:'assets/mon_golem_platinum.png',
  drow:'assets/mon_drow.png', drow_mage:'assets/mon_drow_mage.png',
  duergar:'assets/mon_duergar.png', duergar_overseer:'assets/mon_duergar_overseer.png',
  gnome:'assets/mon_gnome.png', gnome_sapper:'assets/mon_gnome_sapper.png',
  gnome_good:'assets/mon_gnome_good.png', gnome_tinker:'assets/mon_gnome_tinker.png',
  umberhulk:'assets/mon_umberhulk.png', hookedhorror:'assets/mon_hookedhorror.png',
  beholder:'assets/mon_beholder.png',
  lantern:'assets/prop_lantern.png', pillar:'assets/prop_pillar.png', cart:'assets/prop_cart.png',
  brazier:'assets/prop_brazier.png', shroom:'assets/prop_shroom.png', rubydoor:'assets/prop_rubydoor.png',
  tunnel:'assets/prop_tunnel.png', crate:'assets/prop_crate.png', bones:'assets/prop_bones.png',
  altar:'assets/prop_altar.png', gate:'assets/prop_gate.png', lift:'assets/prop_lift.png',
  names:'assets/prop_names.png', throne:'assets/prop_throne.png',
  trap_spikes:'assets/prop_trap_spikes.png', trap_runes:'assets/prop_trap_runes.png', trap_pit:'assets/prop_trap_pit.png',
  floor_mine:'assets/tile_floor_mine.png', floor_fungi:'assets/tile_floor_fungi.png',
  floor_ruin:'assets/tile_floor_ruin.png', floor_hall:'assets/tile_floor_hall.png',
  wall_cave:'assets/tile_wall_cave.png'
};
Object.keys(SPRITE_FILES).forEach(k=>{
  const src=SPRITE_FILES[k];
  if(!/^assets\/(dwarf_|mon_)/.test(src)) return;
  if(/_(w1|w2|atk)\.png$/.test(src)) return;
  const stem=src.replace(/\.png$/,'');
  SPRITE_FILES[k+'_w1']=stem+'_w1.png';
  SPRITE_FILES[k+'_w2']=stem+'_w2.png';
  SPRITE_FILES[k+'_atk']=stem+'_atk.png';
});
function loadSprites(done){
  const keys=Object.keys(SPRITE_FILES); let left=keys.length;
  if(!left){ done(); return; }
  keys.forEach(k=>{
    const img=new Image();
    img.onload=()=>{ SPR[k]=img; if(--left<=0) done(); };
    img.onerror=()=>{ if(--left<=0) done(); };
    img.src=SPRITE_FILES[k];
  });
}
function drawBillboard(g,img,h){
  if(!img||!img.width) return false;
  const W=h*(img.width/Math.max(1,img.height));
  g.drawImage(img,-W/2,-h,W,h); return true;
}
function palFloorKey(pal){
  if(pal===PAL.fungi) return 'floor_fungi';
  if(pal===PAL.ruin) return 'floor_ruin';
  if(pal===PAL.hall) return 'floor_hall';
  return 'floor_mine';
}
function entSpriteKey(e){
  if(e.kind==='dwarf') return e.col && e.col.key;
  if(e.sprite) return e.sprite;
  return e.kind;
}
function entAnimImg(e){
  const k=entSpriteKey(e);
  if(!k) return null;
  if(!e.dead && e.atk>0 && SPR[k+'_atk']) return SPR[k+'_atk'];
  if(!e.dead && e.moving){
    const a=SPR[k+'_w1'], b=SPR[k+'_w2']||SPR[k];
    if(a) return ((e.anim*8)|0)%2 ? (b||a) : a;
  }
  return SPR[k]||null;
}
function entSpriteH(e,z){
  if(e.kind==='dwarf') return 78*z;
  if(e.boss||e.kind==='king'||e.kind==='warden'||e.kind==='drake'||e.kind==='horror'||e.kind==='beholder') return 128*z;
  if(e.kind==='umberhulk'||e.kind==='hookedhorror') return 112*z;
  if(e.kind==='golem'||e.kind==='troll'||e.kind==='construct'||e.kind==='champion'||e.kind==='burrower') return 108*z;
  if(e.kind==='drow') return 86*z;
  if(e.kind==='gnome'||e.kind==='rat'||e.kind==='bat'||e.kind==='beetle') return 48*z;
  return 70*z;
}
function propSpriteKey(p){
  const k=p.k;
  if(k==='rubywall'||k==='rubydoor') return 'rubydoor';
  if(k==='trap') return p.trap||'trap_spikes';
  if(k==='barrel'||k==='sack') return 'crate';
  return k;
}
function propSpriteH(p,z){
  const k=p.k;
  if(k==='rubywall'||k==='rubydoor') return 172*z;
  if(k==='pillar'||k==='names') return 108*z;
  if(k==='altar'||k==='throne') return 100*z;
  if(k==='gate'||k==='tunnel') return 120*z;
  if(k==='lantern') return 102*z;
  if(k==='lift') return 72*z;
  if(k==='cart'||k==='crate'||k==='barrel'||k==='sack') return 54*z;
  if(k==='bones') return 42*z;
  if(k==='shroom') return 54*z;
  if(k==='brazier') return 60*z;
  if(k==='trap') return 36*z;
  return 62*z;
}
function shotStyle(e){
  if(e.kind==='spider'||e.sprite==='spitter') return ['spit','#b06bff',11];
  if(e.kind==='fungi') return ['spore','#d07bff',7];
  if(e.kind==='wraith'||e.kind==='bat') return ['wisp','#80d0ff',10];
  if(e.kind==='drake') return ['flame','#ff6a3a',10];
  if(e.sprite==='drow_mage'||(e.kind==='drow'&&e.ranged)) return ['hex','#c07bff',10];
  if(e.sprite==='gnome_sapper') return ['bomb','#ff8a3a',8];
  if(e.sprite==='gnome_tinker') return ['bolt','#ffd27a',11];
  if(e.kind==='beholder'){
    const rays=[['charm','#ff7ad9',9],['fear','#80d0ff',10],['death','#c07bff',11],['fire','#ff6a3a',10]];
    return rays[((G.elapsed*4)|0)%rays.length];
  }
  return ['bolt','#e8dcc0',11];
}

/* value noise + fBm, for the baked rock surfaces */
function vnoise(x,y,s){
  const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return lerp(lerp(h3(xi,yi,s),h3(xi+1,yi,s),u), lerp(h3(xi,yi+1,s),h3(xi+1,yi+1,s),u), v);
}
function fbm(x,y,s,oct){ let v=0,a=.5,f=1,t=0;
  for(let o=0;o<(oct||3);o++){ v+=a*vnoise(x*f,y*f,s+o*17); t+=a; f*=2.03; a*=.5; } return v/t; }

/* ---------------------------- palettes ----------------------------
   Albedo is painted BRIGHT; the lightmap multiplies it back down.     */
const PAL={
  mine :{fA:'#8a6d4e',fB:'#6f563d',rock:'#b59a72',wT:'#7a6244',wL:'#5a4632',wR:'#3e3124',
         crack:'#1c140e', amb:'#0a0b12', key:'#ffcf8a', dust:'#e8c08a', fogTop:'#07060c'},
  fungi:{fA:'#5a4e78',fB:'#4a4066',rock:'#7d6eae',wT:'#5c5084',wL:'#403862',wR:'#2c2648',
         crack:'#160f28', amb:'#080614', key:'#c084ff', dust:'#c9a6ff', fogTop:'#060510'},
  ruin :{fA:'#7a7064',fB:'#655c52',rock:'#9a9084',wT:'#6e6254',wL:'#4e453c',wR:'#3a342c',
         crack:'#1c1814', amb:'#0c0a0a', key:'#ff6a4c', dust:'#f0a184', fogTop:'#090706'},
  hall :{fA:'#8a6254',fB:'#734e42',rock:'#b0846e',wT:'#825848',wL:'#5e4034',wR:'#442e26',
         crack:'#201410', amb:'#10080c', key:'#ffd07a', dust:'#ffc189', fogTop:'#0c0606'},
};

/* ---------------------------- grid helpers ---------------------------- */
function newGrid(w,h,f){ const g=[]; for(let y=0;y<h;y++){const r=new Uint8Array(w); r.fill(f); g.push(r);} return g; }
function rect(g,x,y,w,h,t){ for(let j=y;j<y+h;j++) for(let i=x;i<x+w;i++) if(g[j]&&g[j][i]!==undefined) g[j][i]=t; }
function corridor(g,x1,y1,x2,y2,wd,t){
  wd=wd||3; const hw=(wd/2)|0;
  const sx=Math.min(x1,x2),ex=Math.max(x1,x2),sy=Math.min(y1,y2),ey=Math.max(y1,y2);
  rect(g,sx,y1-hw,ex-sx+1,wd,t);
  rect(g,x2-hw,sy,wd,ey-sy+1,t);
}

/* ==========================================================================
   TEXTURE BAKE  -  per-pixel rock surfaces, generated once per chapter
   ========================================================================== */
const RS=2, RTW=84*RS, RTH=42*RS, RWH=50*RS;
const TEX={ floor:[], floorA:[], wall:[], wallVein:[], blood:[], scorch:null, grain:null, ready:false };

function mk(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; return c; }
function diamond(x,c,cx,cy,w,h){ x.beginPath(); x.moveTo(cx,cy-h/2); x.lineTo(cx+w/2,cy);
  x.lineTo(cx,cy+h/2); x.lineTo(cx-w/2,cy); x.closePath(); }

/* multiply every opaque pixel by an fBm field -> real grain, not speckles */
function grainPass(x,w,h,seed,amt,sc){
  let img; try{ img=x.getImageData(0,0,w,h); }catch(_){ return; }
  if(!img||!img.data) return;
  const d=img.data;
  for(let j=0;j<h;j++){
    for(let i=0;i<w;i++){
      const o=(j*w+i)*4; if(d[o+3]<8) continue;
      const n=fbm(i/sc,j/sc,seed,3);
      const fine=vnoise(i/2.1,j/2.1,seed+91);
      const m=(1-amt)+amt*(n*0.82+fine*0.34);
      d[o]=clamp(d[o]*m,0,255); d[o+1]=clamp(d[o+1]*m,0,255); d[o+2]=clamp(d[o+2]*m,0,255);
    }
  }
  x.putImageData(img,0,0);
}

function rockChunk(x,cx,cy,r,base,seed){
  const pts=6+((h3(seed,3,7)*3)|0);
  x.beginPath();
  for(let i=0;i<pts;i++){ const a=i/pts*TAU, rr=r*(0.62+h3(seed,i,11)*0.55);
    const px=cx+Math.cos(a)*rr, py=cy+Math.sin(a)*rr*0.62;
    i?x.lineTo(px,py):x.moveTo(px,py); }
  x.closePath();
  const g=x.createLinearGradient(cx-r,cy-r*0.7,cx+r*0.6,cy+r*0.7);
  g.addColorStop(0,shade(base,0.30)); g.addColorStop(0.5,base); g.addColorStop(1,shade(base,-0.42));
  x.fillStyle=g; x.fill();
  x.strokeStyle='rgba(14,10,7,0.55)'; x.lineWidth=1.3*RS; x.stroke();
  // top facet catching the key light
  x.beginPath();
  for(let i=0;i<pts;i++){ const a=i/pts*TAU, rr=r*0.48*(0.7+h3(seed,i,11)*0.5);
    const px=cx-r*0.16+Math.cos(a)*rr, py=cy-r*0.20+Math.sin(a)*rr*0.6;
    i?x.lineTo(px,py):x.moveTo(px,py); }
  x.closePath(); x.fillStyle='rgba(255,238,205,0.14)'; x.fill();
  // contact shadow
  x.fillStyle='rgba(0,0,0,0.30)';
  x.beginPath(); x.ellipse(cx+r*0.28,cy+r*0.44,r*0.85,r*0.34,0,0,TAU); x.fill();
}

function bakeFloor(pal,seed,accent){
  const c=mk(RTW,RTH), x=c.getContext('2d');
  diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.save(); x.clip();
  x.fillStyle= accent? shade(pal.fA,0.10) : (seed%2?pal.fA:pal.fB);
  x.fillRect(0,0,RTW,RTH);
  grainPass(x,RTW,RTH,seed*31,0.62,9);
  // cut-stone slabs inside the diamond
  x.strokeStyle='rgba(18,12,8,0.38)'; x.lineWidth=1.4*RS;
  const slabs=2+((h3(seed,2,4)*2)|0);
  for(let k=0;k<slabs;k++){
    const t=0.22+k*0.22; x.beginPath();
    x.moveTo(RTW*t, RTH*0.5); x.lineTo(RTW*0.5, RTH*t*0.55); x.stroke();
  }
  // dirt pooling in the low corners
  const dg=x.createRadialGradient(RTW/2,RTH*0.22,3,RTW/2,RTH*0.55,RTW*0.58);
  dg.addColorStop(0,'rgba(255,236,205,0.12)'); dg.addColorStop(0.55,'rgba(0,0,0,0.08)'); dg.addColorStop(1,'rgba(0,0,0,0.42)');
  x.fillStyle=dg; x.fillRect(0,0,RTW,RTH);
  // deep cracks across the flagstone
  const nc=2+((h3(seed,5,2)*3)|0);
  for(let k=0;k<nc;k++){
    x.strokeStyle='rgba(12,8,5,0.72)'; x.lineWidth=(1.4+h3(seed,k,4)*2.2)*RS; x.lineCap='round';
    x.beginPath();
    let px=h3(seed,k,7)*RTW, py=h3(seed,k,8)*RTH; x.moveTo(px,py);
    for(let i=0;i<5;i++){ px+=(h3(seed,k*9+i,3)-0.5)*RTW*0.28; py+=(h3(seed,k*7+i,6)-0.5)*RTH*0.32; x.lineTo(px,py); }
    x.stroke();
    x.strokeStyle='rgba(255,228,190,0.08)'; x.lineWidth=1*RS; x.stroke();
  }
  // moss / spore in the grout for fungal chambers
  if(pal.key && pal.key[1]==='b' || pal.amb==='#080614'){
    for(let k=0;k<5;k++){
      x.fillStyle='rgba(120,70,200,'+(0.08+h3(seed,k,88)*0.12)+')';
      x.beginPath(); x.ellipse(RTW*(0.2+h3(seed,k,89)*0.6), RTH*(0.25+h3(seed,k,90)*0.5),
        (2+h3(seed,k,91)*5)*RS,(1+h3(seed,k,92)*3)*RS,0,0,TAU); x.fill();
    }
  }
  // scattered rock
  const nr= accent?2:3+((h3(seed,1,9)*3)|0);
  for(let k=0;k<nr;k++){
    const cx=RTW*(0.18+h3(seed,k,21)*0.64), cy=RTH*(0.20+h3(seed,k,22)*0.60);
    rockChunk(x,cx,cy,(4+h3(seed,k,23)*9)*RS,pal.rock,seed*7+k);
  }
  x.restore();
  // ambient occlusion hugging the tile seams
  x.save(); diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.clip();
  x.strokeStyle='rgba(0,0,0,0.52)'; x.lineWidth=8*RS;
  diamond(x,c,RTW/2,RTH/2,RTW-2,RTH-2); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.28)'; x.lineWidth=3.4*RS; x.stroke();
  x.restore();
  // lit upper edges
  x.strokeStyle= accent?'rgba(255,214,140,0.38)':'rgba(255,236,200,0.18)'; x.lineWidth=2*RS;
  x.beginPath(); x.moveTo(2,RTH/2); x.lineTo(RTW/2,2); x.lineTo(RTW-2,RTH/2); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.45)'; x.lineWidth=2.2*RS;
  x.beginPath(); x.moveTo(2,RTH/2); x.lineTo(RTW/2,RTH-2); x.lineTo(RTW-2,RTH/2); x.stroke();
  return c;
}

function bakeWall(pal,seed,vein){
  const H=RWH+RTH, c=mk(RTW,H), x=c.getContext('2d');
  const cyTop=RWH+RTH/2-RWH;                    // centre of the top diamond
  // ---- left face
  x.save();
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2);
  x.lineTo(0,RWH); x.closePath();
  x.clip();
  x.fillStyle=pal.wL; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13+3,0.5,9);
  for(let i=0;i<5;i++){ x.fillStyle='rgba(0,0,0,'+(0.10+h3(seed,i,2)*0.14)+')';
    x.fillRect(0,RWH-RTH/2+i*RTH*0.34+h3(seed,i,5)*6, RTW/2, (2+h3(seed,i,8)*5)*RS); }
  for(let i=0;i<7;i++){ x.strokeStyle='rgba(255,240,210,0.055)'; x.lineWidth=1.4*RS;
    const px=h3(seed,i,31)*RTW*0.5, py=RWH-RTH/2+h3(seed,i,32)*RTH*1.1;
    x.beginPath(); x.moveTo(px,py); x.lineTo(px+7*RS,py+5*RS); x.stroke(); }
  x.fillStyle='rgba(0,0,0,0.34)'; x.fillRect(0,RWH+RTH*0.10,RTW/2,RTH*0.5);
  x.restore();
  // ---- right face (away from key light, darkest)
  x.save();
  x.beginPath(); x.moveTo(RTW,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2);
  x.lineTo(RTW,RWH); x.closePath(); x.clip();
  x.fillStyle=pal.wR; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13+9,0.5,9);
  for(let i=0;i<5;i++){ x.fillStyle='rgba(0,0,0,'+(0.12+h3(seed,i,12)*0.14)+')';
    x.fillRect(RTW/2,RWH-RTH/2+i*RTH*0.34+h3(seed,i,15)*6, RTW/2, (2+h3(seed,i,18)*5)*RS); }
  x.fillStyle='rgba(0,0,0,0.40)'; x.fillRect(RTW/2,RWH+RTH*0.10,RTW/2,RTH*0.5);
  x.restore();
  // ---- top cap
  x.save(); diamond(x,c,RTW/2,RWH-RTH/2,RTW-2,RTH-2); x.clip();
  x.fillStyle=pal.wT; x.fillRect(0,0,RTW,H);
  grainPass(x,RTW,H,seed*13,0.52,10);
  for(let k=0;k<3;k++){ const cx=RTW*(0.24+h3(seed,k,41)*0.52), cy=(RWH-RTH/2)+(h3(seed,k,42)-0.5)*RTH*0.5;
    rockChunk(x,cx,cy,(3.5+h3(seed,k,43)*6)*RS,pal.rock,seed*5+k); }
  const tg=x.createLinearGradient(0,RWH-RTH,0,RWH);
  tg.addColorStop(0,'rgba(255,242,214,0.16)'); tg.addColorStop(1,'rgba(0,0,0,0.12)');
  x.fillStyle=tg; x.fillRect(0,RWH-RTH,RTW,RTH);
  x.restore();
  // silhouette ink
  x.strokeStyle='rgba(0,0,0,0.5)'; x.lineWidth=1.6*RS;
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH-RTH); x.lineTo(RTW,RWH-RTH/2);
  x.lineTo(RTW,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.lineTo(0,RWH); x.closePath(); x.stroke();
  x.strokeStyle='rgba(0,0,0,0.35)'; x.lineWidth=1.3*RS;
  x.beginPath(); x.moveTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.stroke();
  // top-edge rim
  x.strokeStyle='rgba(255,244,220,0.20)'; x.lineWidth=1.8*RS;
  x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH-RTH); x.lineTo(RTW,RWH-RTH/2); x.stroke();
  if(vein){
    x.save();
    x.beginPath(); x.moveTo(0,RWH-RTH/2); x.lineTo(RTW/2,RWH); x.lineTo(RTW/2,RWH+RTH/2); x.lineTo(0,RWH); x.closePath(); x.clip();
    x.strokeStyle=hexA(pal.key,0.5); x.lineWidth=2.6*RS; x.lineCap='round';
    x.beginPath(); x.moveTo(RTW*0.06,RWH-RTH*0.30);
    x.lineTo(RTW*0.20,RWH-RTH*0.02); x.lineTo(RTW*0.13,RWH+RTH*0.22); x.stroke();
    x.strokeStyle=hexA(pal.key,0.22); x.lineWidth=6*RS; x.stroke();
    for(let i=0;i<5;i++){ x.fillStyle=hexA(pal.key,0.55+h3(seed,i,61)*0.4);
      x.beginPath(); x.arc(RTW*(0.07+h3(seed,i,62)*0.16), RWH-RTH*0.28+h3(seed,i,63)*RTH*0.5, (1.2+h3(seed,i,64)*1.8)*RS,0,TAU); x.fill(); }
    x.restore();
  }
  return c;
}

function bakeBlood(seed){
  const c=mk(60*RS,32*RS), x=c.getContext('2d');
  const base= seed%3===0? '#3a0d10' : '#4d1013';
  for(let i=0;i<7;i++){
    const cx=30*RS+(h3(seed,i,71)-0.5)*40*RS, cy=16*RS+(h3(seed,i,72)-0.5)*18*RS;
    const r=(3+h3(seed,i,73)*10)*RS;
    const g=x.createRadialGradient(cx,cy,1,cx,cy,r);
    g.addColorStop(0,hexA(base,0.85)); g.addColorStop(0.6,hexA(base,0.5)); g.addColorStop(1,hexA(base,0));
    x.fillStyle=g; x.beginPath(); x.ellipse(cx,cy,r,r*0.55,0,0,TAU); x.fill();
  }
  for(let i=0;i<9;i++){ const cx=30*RS+(h3(seed,i,74)-0.5)*54*RS, cy=16*RS+(h3(seed,i,75)-0.5)*24*RS;
    x.fillStyle=hexA(base,0.5+h3(seed,i,76)*0.35);
    x.beginPath(); x.ellipse(cx,cy,(0.8+h3(seed,i,77)*2.4)*RS,(0.5+h3(seed,i,78)*1.4)*RS,0,0,TAU); x.fill(); }
  return c;
}

function bakeGrain(){
  const S=140, c=mk(S,S), x=c.getContext('2d');
  const img=x.createImageData(S,S), d=img.data;
  for(let i=0;i<S*S;i++){ const v=(Math.random()*255)|0; const o=i*4;
    d[o]=d[o+1]=d[o+2]=v; d[o+3]=26; }
  x.putImageData(img,0,0); return c;
}

function bakeTextures(pal){
  TEX.ready=false;
  TEX.floor=[]; TEX.floorA=[]; TEX.wall=[]; TEX.wallVein=[];
  for(let i=0;i<6;i++) TEX.floor.push(bakeFloor(pal,i+1,false));
  for(let i=0;i<2;i++) TEX.floorA.push(bakeFloor(pal,i+31,true));
  for(let i=0;i<4;i++) TEX.wall.push(bakeWall(pal,i+1,false));
  for(let i=0;i<2;i++) TEX.wallVein.push(bakeWall(pal,i+11,true));
  if(!TEX.blood.length) for(let i=0;i<4;i++) TEX.blood.push(bakeBlood(i+1));
  if(!TEX.grain) TEX.grain=bakeGrain();
  TEX.ready=true;
}

function burst(x,y,c,n,spd){ spd=spd||3;
  for(let i=0;i<n;i++){ const a=rnd(TAU);
    G.parts.push({x,y,z:rnd(.5,.1),vx:Math.cos(a)*rnd(spd,.3),vy:Math.sin(a)*rnd(spd,.3),vz:rnd(3.6,.6),
      life:rnd(.85,.35),max:.85,c,s:rnd(4,1.6)}); } }
function ftext(x,y,txt,c,big){ G.texts.push({x,y,txt,c,life:.95,big:!!big}); }

/* ---------------------------- combat ---------------------------- */
function damage(e,amt,col){
  if(e.dead) return;
  if(e.guard) amt*=.5;
  if(e.team==='party'){ amt*=(1-armCut(e)); wear(e.gear,0,0.7); }
  amt=Math.round(amt); e.hp-=amt; e.flash=.18;
  ftext(e.x,e.y,'-'+amt,col||(e.team==='party'?'#ff6a5a':'#ffe6a8'),e.boss);
  burst(e.x,e.y, e.glow||(e.kind==='statue'?'#b8b0a0':e.kind==='undead'?'#7cff9c':e.kind==='spider'?'#9a6bff':'#a3241f'),7,2.2);
  if(e.hero) G.hurt=Math.min(1,G.hurt+amt/70);
  if(e.hp<=0){ e.dead=1; e.deadT=0;
    if(e.team==='foe'){ G.kills++; burst(e.x,e.y,'#c2452e',18,3.5);
      foeDrop(e);
      addDecal(e.x,e.y,(e.boss?2.6:1)*rnd(1.5,.9));
      if(e.boss) for(let i=0;i<5;i++) addDecal(e.x+rnd(1.6,-1.6),e.y+rnd(1.6,-1.6),rnd(2,1.2));
      if(e.boss){ shake(26); G.flash={c:'#fff',a:.45}; say(e.name+' is broken.','#ffd27a'); G.hitstop=.12; }
    } else { say(e.name+' goes down!','#ff6a5a'); if(e.hero) G.scene='dead'; } }
}
function meleeSwing(e,arc,reach,dmg,col){
  dmg*=wepMult(e);
  const fa=ang(e.fdx,e.fdy); let hit=0;
  for(const o of G.ents){ if(o.dead||o.team===e.team) continue;
    const d=dist(e,o); if(d>reach+o.r) continue;
    const a=ang(o.x-e.x,o.y-e.y); const df=Math.abs(((a-fa+Math.PI*3)%TAU)-Math.PI);
    if(df<=arc/2){ damage(o,dmg*rnd(1.15,.88),col);
      wear(e.gear,0.35,0);
      const k=.5/(d+.4); o.kx+=Math.cos(a)*k*2.4; o.ky+=Math.sin(a)*k*2.4; hit=1; } }
  const L=G.lvl;
  if(e.hero&&L&&L.plug&&!L.flags.broke&&dist(e,L.plug)<reach+.95){
    L.plug.hp-=dmg; hit=1; burst(L.plug.x,L.plug.y-.2,'#7a6045',9,2.4); ftext(L.plug.x,L.plug.y,'crack','#d8c49a'); }
  if(!hit && e.hero && digSwing(e,dmg)) hit=1;
  if(hit){ shake(4); G.hitstop=Math.max(G.hitstop,.035); }
  return hit;
}
function shoot(from,tx,ty,dmg,kind,col,spd){
  const a=ang(tx-from.x,ty-from.y);
  G.shots.push({x:from.x,y:from.y,vx:Math.cos(a)*(spd||9),vy:Math.sin(a)*(spd||9),dmg,team:from.team,kind,col,life:2.2,spin:0});
}
function nearestFoe(e,maxd){ let b=null,bd=maxd||99;
  for(const o of G.ents){ if(o.team!=='foe'||o.dead) continue; const d=dist(e,o); if(d<bd){bd=d;b=o;} } return b; }
function nearestAlly(e,maxd,hurt){ let b=null,bd=maxd||99;
  for(const o of G.ents){ if(o.team!=='party'||o.dead) continue; if(hurt&&o.hp>=o.maxhp*.7) continue;
    const d=dist(e,o); if(d<bd){bd=d;b=o;} } return b; }

/* ---------------------------- movement ---------------------------- */
function walk(x,y){ const L=G.lvl; if(!L) return false;
  const i=x|0,j=y|0; if(j<0||j>=L.h||i<0||i>=L.w) return false;
  const t=L.grid[j][i]; return t===0||t===3; }
function canBe(x,y,r){
  return walk(x+r,y)&&walk(x-r,y)&&walk(x,y+r)&&walk(x,y-r)&&
         walk(x+r*.7,y+r*.7)&&walk(x-r*.7,y-r*.7)&&walk(x+r*.7,y-r*.7)&&walk(x-r*.7,y+r*.7); }
function move(e,dx,dy,dt){
  const nx=e.x+dx*dt, ny=e.y+dy*dt; let moved=0;
  if(canBe(nx,e.y,e.r)){ e.x=nx; moved=1; }
  if(canBe(e.x,ny,e.r)){ e.y=ny; moved=1; }
  return moved;
}

function layoutUI(){
  UIBTN.length=0;
  const s=UIS;
  const slot = PORT ? Math.max(28, 38*s) : Math.max(34, 46*s);
  const gap = PORT? 5*s : 7*s;
  const n=BARSLOTS.length;
  const barW = n*slot + (n-1)*gap;
  const orbR = PORT? Math.max(26, 32*s) : Math.max(32, 40*s);
  const extraW = slot*0.78*2 + gap + 12*s;
  const totalW = orbR*2 + 14*s + barW + extraW;
  const by = VH - (PORT? 44*s : 42*s) - slot/2;
  let left = VW/2 - totalW/2;
  const stickReserve = (PORT? 108*s : 128*s);
  if(left < stickReserve) left = stickReserve;
  if(left + totalW > VW - 8*s) left = Math.max(8*s, VW - totalW - 8*s);

  UI.orb = { r:orbR, x: left + orbR, y: by };
  UI.attack={x:0,y:0,r:slot/2};
  BARSLOTS.forEach((b,i)=>{
    const x = left + orbR*2 + 14*s + i*(slot+gap) + slot/2;
    const btn={x, y:by, r:slot/2, key:b.key, ico:b.ico, num:b.num, slot:1};
    if(b.key==='attack') UI.attack=btn;
    UIBTN.push(btn);
  });
  EXTRASLOTS.forEach((b,i)=>{
    const x = left + orbR*2 + 14*s + barW + 12*s + i*(slot*0.78+gap) + slot*0.36;
    UIBTN.push({x, y:by, r:slot*0.36, key:b.key, ico:b.ico, small:1});
  });
  UIBTN.push({x:VW-(PORT?88*s:118*s)-28*s, y:22*s, r:14*s, key:'pause'});
  UI.stickHome={ x: (PORT? 56*s : 78*s), y: VH - (PORT? 128*s : 112*s), r: (PORT?38*s:46*s) };
}
function btnAt(x,y){ for(const b of UIBTN) if(Math.hypot(x-b.x,y-b.y)<b.r*1.25) return b; return null; }

const pressed={};
function onDown(id,x,y){
  if(G.scene!=='play'||G.paused){ IN.taps.push({x,y}); return; }
  const b=btnAt(x,y);
  if(b){ pressed[id]={btn:b}; b.hold=1; fire(b.key); return; }
  // left half OR anywhere near the stick home = virtual stick
  const nearHome = Math.hypot(x-UI.stickHome.x,y-UI.stickHome.y) < UI.stickHome.r*2.2;
  if(G.aim && !(x<VW*0.5||nearHome)){ aimDrag=id; }
  if(x < VW*0.5 || nearHome){ IN.stick={id,ox:x,oy:y,x,y,moved:0}; return; }
  IN.taps.push({x,y});
}
function onMove(id,x,y){ const k=IN.stick; if(k&&k.id===id){ k.x=x;k.y=y;
  if(Math.hypot(x-k.ox,y-k.oy)>10) k.moved=1; return; }
  if(G.aim&&aimDrag===id){ const p=player(); if(p){ const w=s2w(x,y+22*ZOOM), d=dist(p,w), R=8;
    G.aim = d>R ? {x:p.x+(w.x-p.x)/d*R, y:p.y+(w.y-p.y)/d*R} : {x:w.x,y:w.y}; } } }
let aimDrag=null;
function onUp(id,x,y){
  if(aimDrag===id) aimDrag=null;
  const k=IN.stick;
  if(k&&k.id===id){ if(!k.moved) IN.taps.push({x:k.ox,y:k.oy}); IN.stick=null; }
  if(pressed[id]){ pressed[id].btn.hold=0; delete pressed[id]; }
}
cv.addEventListener('pointerdown',e=>{ try{cv.setPointerCapture(e.pointerId);}catch(_){}
  onDown(e.pointerId,e.clientX,e.clientY); e.preventDefault(); });
cv.addEventListener('pointermove',e=>onMove(e.pointerId,e.clientX,e.clientY));
cv.addEventListener('pointerup',e=>onUp(e.pointerId,e.clientX,e.clientY));
cv.addEventListener('pointercancel',e=>onUp(e.pointerId,e.clientX,e.clientY));
cv.addEventListener('contextmenu',e=>e.preventDefault());

window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase(); IN.keys[k]=1;
  if(G.scene!=='play'){ IN.taps.push({x:VW/2,y:VH/2}); return; }
  if(e.key===' '){ fire('attack'); e.preventDefault(); }
  if(e.key==='e'||e.key==='Enter') fire('use');
  if(e.key==='1') fire('attack');
  if(e.key==='2') fire('ale');
  if(e.key==='3') fire('wall');
  if(e.key==='4') fire('bomb');
  if(e.key==='5') fire('rally');
  if(k==='q') fire('swing');
  if(k==='r') fire('throw');
  if(k==='b') fire('bomb');
  if(e.key==='Escape') G.paused=!G.paused;
});
window.addEventListener('keyup',e=>{ IN.keys[e.key.toLowerCase()]=0; });

/* ---------------------------- abilities ---------------------------- */
function fire(key){
  if(G.scene!=='play') return;
  if(key==='pause'){ G.paused=!G.paused; return; }
  if(G.paused) return;
  const p=player(); if(!p) return;
  if(key==='attack'){ if(p.ct<=0){ p.atk=p.atkMax; p.ct=p.cd; p.swung=0; } return; }
  if(key==='use'){ if(PROMPT){ const f=PROMPT.fn; PROMPT=null; f(); } return; }
  if(key==='bomb'){
    if(G.aim){ G.aim=null; return; }
    if(G.bombs<=0){ hint('No bombs. Pack more at the bench.',2.6); return; }
    if(cds.bomb>0) return;
    const t=nearestFoe(p,8);
    G.aim = t? {x:t.x,y:t.y} : {x:p.x+p.fdx*4.5, y:p.y+p.fdy*4.5};
    p.dest=null; hint('Drag to aim, then press THROW',3.2);
    return;
  }
  const a=ABIL.find(z=>z.key===key); if(!a||cds[key]>0) return;
  cds[key]=a.cd; p.dest=null;
  if(key==='swing'){ p.atk=p.atkMax*1.5; p.swung=1; meleeSwing(p,TAU,2.6,44,'#ffd27a');
    burst(p.x,p.y,'#ffcf5c',28,4.6); shake(12); ftext(p.x,p.y-.6,'HAMMER ARC','#ffd27a',1);
    say('MACAR preparing special hammer attack!','#ff6a5a'); }
  if(key==='ale'){
    if(G.ales<=0){ cds[key]=0; hint('No ale left. Brew more at camp.',2.6); return; }
    G.ales--; const heal=40+skillLvl('ale')*12; let n=0;
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead&&dist(e,p)<6.5){
      e.hp=Math.min(e.maxhp,e.hp+heal); burst(e.x,e.y,'#c9a24a',14,2.2);
      ftext(e.x,e.y,'+'+heal,'#e0c169',e.hero); n++; } });
    learn('ale',3); say('The flask goes round. '+n+' dwarves the better for it.','#d2bd63');
  }
  if(key==='wall'){ p.guardT=5; burst(p.x,p.y,'#cfe3ff',18,2.4); ftext(p.x,p.y-.5,'GUARD','#cfe3ff'); }
  if(key==='throw'){ const t=nearestFoe(p,10); const a2=t?ang(t.x-p.x,t.y-p.y):ang(p.fdx,p.fdy);
    p.fdx=Math.cos(a2); p.fdy=Math.sin(a2);
    G.shots.push({x:p.x,y:p.y,vx:Math.cos(a2)*12,vy:Math.sin(a2)*12,dmg:36,team:'party',kind:'pick',col:'#cfd6de',life:1.5,spin:0});
    say('Allied Dwarf pickstrike!','#ffb45c'); }
  if(key==='rally'){ G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead){ e.buff=8; e.hp=Math.min(e.maxhp,e.hp+30);
      burst(e.x,e.y,'#ffd27a',10,2);} }); ftext(p.x,p.y-.8,'RALLY','#ffd27a',1);
    say('MACAR raises the hammer. The kin answer.','#ffd27a'); }
}

/* ==========================================================================
   UPDATE
   ========================================================================== */
function update(dt){
  if(G.scene!=='play'||G.paused) return;
  G.elapsed+=dt;
  const L=G.lvl; if(!L) return;
  PROMPT=null;
  ABIL.forEach(a=>{ if(cds[a.key]>0) cds[a.key]=Math.max(0,cds[a.key]-dt); });
  if(G.hint){ G.hint.life-=dt; if(G.hint.life<=0) G.hint=null; }
  G.hurt=Math.max(0,G.hurt-dt*1.4);

  const p=player();
  if(p){
    let dx=0,dy=0;
    if(IN.stick && IN.stick.moved){
      const ox=IN.stick.x-IN.stick.ox, oy=IN.stick.y-IN.stick.oy, m=Math.hypot(ox,oy);
      const dead=6*UIS;
      if(m>dead){
        const f=clamp((m-dead)/(46*UIS),0,1);
        const sx=ox/m, sy=oy/m;
        let wx=sy/(TH/2)+sx/(TW/2), wy=sy/(TH/2)-sx/(TW/2);
        const wm=Math.hypot(wx,wy)||1; dx=wx/wm*f; dy=wy/wm*f; p.dest=null;
      }
    }
    const K=IN.keys; let kx=0,ky=0;
    if(K['w']||K['arrowup']){kx-=1;ky-=1;} if(K['s']||K['arrowdown']){kx+=1;ky+=1;}
    if(K['a']||K['arrowleft']){kx-=1;ky+=1;} if(K['d']||K['arrowright']){kx+=1;ky-=1;}
    if(kx||ky){ const m=Math.hypot(kx,ky); dx=kx/m; dy=ky/m; p.dest=null; }

    // tap-to-move steering
    if(!dx&&!dy&&p.dest){
      const d=dist(p,p.dest);
      if(d<.35){ p.dest=null; }
      else { const a=ang(p.dest.x-p.x,p.dest.y-p.y); dx=Math.cos(a); dy=Math.sin(a);
        p.stuck=(p.stuck||0)+dt;
        if(p.lastD!==undefined && p.lastD-d>0.01) p.stuck=0;
        p.lastD=d; if(p.stuck>0.7){ p.dest=null; p.stuck=0; } }
    }

    p.moving = !!(dx||dy);
    if(p.moving){ p.fdx=dx; p.fdy=dy; move(p,dx*p.sp,dy*p.sp,dt); }
    p.guard = (p.guardT=Math.max(0,(p.guardT||0)-dt))>0;

    // auto-attack: always swing at anything in reach
    const t=nearestFoe(p,p.range+.75);
    if(t&&p.ct<=0){ const a=ang(t.x-p.x,t.y-p.y); p.fdx=Math.cos(a); p.fdy=Math.sin(a);
      p.atk=p.atkMax; p.ct=p.cd; p.swung=0; p.aim=t; }
    if(!t) p.aim=null;

    G.cam.x=lerp(G.cam.x,p.x,1-Math.pow(.0015,dt));
    G.cam.y=lerp(G.cam.y,p.y,1-Math.pow(.0015,dt));
    const ci=p.x|0,cj=p.y|0;
    for(let j=cj-10;j<=cj+10;j++) for(let i=ci-10;i<=ci+10;i++)
      if(L.seen[j]&&L.seen[j][i]!==undefined&&(i-p.x)*(i-p.x)+(j-p.y)*(j-p.y)<100) L.seen[j][i]=1;
    for(const pr of G.props){
      if(pr.k!=='trap') continue;
      pr.cd=(pr.cd||0)-dt;
      if(pr.cd>0) continue;
      for(const e of G.ents){
        if(e.dead||e.team!=='party') continue;
        if(dist(e,pr)<0.72){
          const pit=pr.trap==='trap_pit', rune=pr.trap==='trap_runes';
          damage(e, pit?16:rune?13:11, rune?'#c07bff':'#ff6a4a');
          burst(pr.x,pr.y, rune?'#c07bff':'#c2452e', 12, 2.4);
          say((e.name||'Kin')+' hits a trap.','#ff6a6a');
          pr.cd=pit?2.8:rune?1.6:2.2; shake(8); break;
        }
      }
    }
  }

  for(const e of G.ents){
    if(e.dead){ e.deadT=(e.deadT||0)+dt; continue; }
    e.anim+=dt*(e.moving?1:.35);
    if(e.flash>0) e.flash-=dt;
    if(e.stun>0){ e.stun-=dt; continue; }
    if(e.buff>0) e.buff-=dt;
    if(e.ct>0) e.ct-=dt;
    if(e.atk>0){
      e.atk-=dt;
      if(!e.swung&&e.atk<e.atkMax*.55){ e.swung=1; const bo=e.buff>0?1.5:1;
        if(e.ranged){ const t=e.team==='party'?nearestFoe(e,e.range+2):player();
          if(t){ const st=shotStyle(e); shoot(e,t.x,t.y,e.dmg*bo, st[0], st[1], st[2]); }
        } else meleeSwing(e,e.hero?2.3:1.9,e.range+.35,e.dmg*bo); }
      if(e.atk<=0) e.swung=0;
    }
    if(e.kx||e.ky){ move(e,e.kx*6,e.ky*6,dt); e.kx*=Math.pow(.02,dt); e.ky*=Math.pow(.02,dt);
      if(Math.abs(e.kx)<.01)e.kx=0; if(Math.abs(e.ky)<.01)e.ky=0; }
    if(e.hero) continue;

    let tgt=null, want=e.range;
    if(e.team==='party'){
      const foe=nearestFoe(e, e.ranged?9:7.2);
      if(e.heals){ const hu=nearestAlly(e,12,1);
        if(hu&&hu.hp<hu.maxhp*.6&&e.ct<=0){ hu.hp=Math.min(hu.maxhp,hu.hp+24);
          burst(hu.x,hu.y,'#ffe9a8',10,2); ftext(hu.x,hu.y,'+24','#ffe9a8'); e.ct=4.5; } }
      if(foe){ tgt=foe; want=e.ranged?e.range*.7:e.range; }
      else if(p){ const i=G.ents.indexOf(e); const a=i*1.35+Math.sin(G.elapsed*.3)*.2;
        tgt={x:p.x+Math.cos(a)*1.8,y:p.y+Math.sin(a)*1.8}; want=.4; }
    } else {
      tgt=nearestAlly(e,999);
      if(tgt){ const d=dist(e,tgt);
        if(d>e.aggro&&!e.boss&&!e.engaged) tgt=null; else e.engaged=1; }
      want=e.ranged?e.range*.75:e.range;
    }
    if(tgt){
      const d=dist(e,tgt), a=ang(tgt.x-e.x,tgt.y-e.y);
      if(d>want){
        let vx=Math.cos(a),vy=Math.sin(a);
        for(const o of G.ents){ if(o===e||o.dead) continue; const dd=dist(e,o);
          if(dd<(e.r+o.r)*1.55&&dd>.001){ vx+=(e.x-o.x)/dd*.55; vy+=(e.y-o.y)/dd*.55; } }
        const m=Math.hypot(vx,vy)||1; e.fdx=Math.cos(a); e.fdy=Math.sin(a); e.moving=1;
        move(e,vx/m*e.sp,vy/m*e.sp,dt);
      } else { e.moving=0; e.fdx=Math.cos(a); e.fdy=Math.sin(a);
        if(e.ct<=0&&tgt.hp!==undefined){ e.atk=e.atkMax; e.ct=e.cd; e.swung=0; } }
    } else e.moving=0;
  }

  for(const s of G.shots){
    s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; s.spin+=dt*14;
    if(!walk(s.x,s.y)){ s.life=0; burst(s.x,s.y,s.col,8,2); continue; }
    for(const o of G.ents){ if(o.dead||o.team===s.team) continue;
      if(dist(s,o)<o.r+.35){ damage(o,s.dmg,s.col); s.life=0; burst(s.x,s.y,s.col,9,2.5); break; } }
  }
  G.shots=G.shots.filter(s=>s.life>0);
  for(const q of G.parts){ q.x+=q.vx*dt;q.y+=q.vy*dt;q.z+=q.vz*dt;q.vz-=11*dt;
    if(q.z<0){q.z=0;q.vz*=-.35;q.vx*=.6;q.vy*=.6;} q.life-=dt; }
  G.parts=G.parts.filter(q=>q.life>0);
  for(const t of G.texts){ t.y-=dt*.9; t.life-=dt; }
  G.texts=G.texts.filter(t=>t.life>0);
  for(const l of G.log) l.a=Math.max(.35,l.a-dt*.03);
  if(G.shake>0) G.shake=Math.max(0,G.shake-dt*46);
  if(G.flash){ G.flash.a-=dt*1.8; if(G.flash.a<=0) G.flash=null; }
  if(Math.random()<dt*15&&p){ const a=rnd(TAU),r=rnd(12,3);
    G.parts.push({x:p.x+Math.cos(a)*r,y:p.y+Math.sin(a)*r,z:rnd(2.8,.3),vx:rnd(.16,-.16),vy:rnd(.16,-.16),
      vz:rnd(.3,-.05),life:rnd(3.6,1.8),max:3.6,c:L.pal.dust,s:rnd(2.3,.9),amb:1}); }
  updateBombs(dt);
  if(G.songBuff>0 && p){ const rg=G.songBuff*0.5*dt;
    G.ents.forEach(e=>{ if(e.team==='party'&&!e.dead) e.hp=Math.min(e.maxhp,e.hp+rg); }); }
  if(L.tick) L.tick(dt);
  if(G.ents.length>44) G.ents=G.ents.filter(e=>!(e.dead&&e.team==='foe'&&(e.deadT||0)>2.2));
}


/* ---------------------------- projection ---------------------------- */
function w2s(x,y){ return {
  x:(x-y)*(TW/2)-(G.cam.x-G.cam.y)*(TW/2)+VW/2,
  y:(x+y)*(TH/2)-(G.cam.x+G.cam.y)*(TH/2)+VH*(PORT?.46:.52) }; }
function s2w(sx,sy){
  const ix=sx-VW/2+(G.cam.x-G.cam.y)*(TW/2), iy=sy-VH*(PORT?.46:.52)+(G.cam.x+G.cam.y)*(TH/2);
  return {x:(iy/(TH/2)+ix/(TW/2))/2, y:(iy/(TH/2)-ix/(TW/2))/2}; }

/* emissive registrations, consumed by the bloom pass each frame */
let EMIT=[], RAYS=[];
function emit(sx,sy,r,c,i){ if(QUALITY&&EMIT.length<110) EMIT.push({x:sx,y:sy,r,c,i:i===undefined?1:i}); }
function ray(sx,sy,r,c,i){ if(QUALITY) RAYS.push({x:sx,y:sy,r,c,i}); }

/* ==========================================================================
   RENDER
   ========================================================================== */
function render(){
  const g=ctx; EMIT=[]; RAYS=[];
  try{
  g.save();
  if(G.shake>0) g.translate(rnd(G.shake,-G.shake)*.3,rnd(G.shake,-G.shake)*.3);
  const L=G.lvl;
  g.fillStyle=L?L.pal.fogTop:'#07060a'; g.fillRect(-40,-40,VW+80,VH+80);
  const inWorld = L && G.scene!=='title' && G.scene!=='chapters';
  if(inWorld){ drawWorld(g,L); applyLighting(g,L); drawGodRays(g); drawBloom(g); drawAtmosphere(g,L); drawFloaters(g); }
  g.restore();
  if(G.flash){ g.globalAlpha=clamp(G.flash.a,0,1); g.fillStyle=G.flash.c; g.fillRect(0,0,VW,VH); g.globalAlpha=1; }
  if(G.hurt>0.02){ const v=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.25,VW/2,VH/2,Math.max(VW,VH)*.62);
    v.addColorStop(0,'rgba(160,0,0,0)'); v.addColorStop(1,'rgba(150,0,0,'+(G.hurt*.55)+')');
    g.fillStyle=v; g.fillRect(0,0,VW,VH); }
  if(inWorld && QUALITY) drawGrain(g);
  if(G.scene==='play') drawHUD(g);
  if(G.scene==='title') drawTitle(g);
  if(G.scene==='chapters') drawChapterSelect(g);
  if(G.scene==='intro') drawIntro(g);
  if(G.scene==='camp') drawCamp(g);
  if(G.scene==='dead') drawDead(g);
  if(G.scene==='win') drawWin(g);
  if(G.paused&&G.scene==='play') drawPause(g);
  }catch(err){
    try{
      g.setTransform(DPR,0,0,DPR,0,0);
      g.fillStyle='#1a0808'; g.fillRect(0,0,VW,VH);
      g.fillStyle='#ffd27a'; g.font='14px sans-serif'; g.textAlign='left';
      String(err&&err.stack||err).split('\n').slice(0,12).forEach((ln,i)=>g.fillText(ln,16,28+i*18));
    }catch(_){}
  }
}

let DIGT=null;
function drawWorld(g,L){
  const pal=L.pal;
  { const pl=player(); DIGT = pl? digTarget(pl) : null; }
  const c=[s2w(-TW,-TH*5),s2w(VW+TW,-TH*5),s2w(-TW,VH+TH*5),s2w(VW+TW,VH+TH*5)];
  const minx=Math.max(0,Math.floor(Math.min(c[0].x,c[1].x,c[2].x,c[3].x))-1);
  const maxx=Math.min(L.w-1,Math.ceil(Math.max(c[0].x,c[1].x,c[2].x,c[3].x))+1);
  const miny=Math.max(0,Math.floor(Math.min(c[0].y,c[1].y,c[2].y,c[3].y))-1);
  const maxy=Math.min(L.h-1,Math.ceil(Math.max(c[0].y,c[1].y,c[2].y,c[3].y))+1);

  const B={}, push=(k,f)=>{(B[k]||(B[k]=[])).push(f);};
  const M=TW*2, near=o=>{const s=w2s(o.x,o.y); return s.x>-M&&s.x<VW+M&&s.y>-M*2.6&&s.y<VH+M;};
  for(const d of G.decals) if(near(d)) push((d.x+d.y)|0,()=>drawDecal(g,d));
  for(const p of G.props) if(near(p)) push((p.x+p.y)|0,()=>drawProp(g,p,pal));
  for(const e of G.ents)  if(near(e)) push((e.x+e.y)|0,()=>drawEnt(g,e));
  for(const s of G.shots) if(near(s)) push((s.x+s.y)|0,()=>drawShot(g,s));
  for(const q of G.parts) if(near(q)) push((q.x+q.y)|0,()=>drawPart(g,q));
  for(const b of G.thrown) if(near(b)) push((b.x+b.y)|0,()=>drawThrown(g,b));
  if(G.aim) push(((G.aim.x+G.aim.y)|0)-1,()=>drawAim(g));
  if(L.plug&&!L.flags.broke) push((L.plug.x+L.plug.y)|0,()=>drawPlug(g,L));

  const k=TW/RTW, WH=RWH*k, FH=RTH*k, SH=(RWH+RTH)*k;
  const p=player(), pd=p?p.x+p.y:0, ps=p?w2s(p.x,p.y):null;
  const okTex=TEX.ready;

  for(let d=minx+miny; d<=maxx+maxy; d++){
    const x0=Math.max(minx,d-maxy), x1=Math.min(maxx,d-miny);
    for(let x=x0;x<=x1;x++){
      const y=d-x, t=L.grid[y][x];
      if(t===2||!L.seen[y][x]) continue;
      const s=w2s(x,y);
      if(t===1){
        const oS=L.grid[y+1]&&(L.grid[y+1][x]===0||L.grid[y+1][x]===3);
        const oE=L.grid[y]&&(L.grid[y][x+1]===0||L.grid[y][x+1]===3);
        if(!oS&&!oE) continue;
        // fade walls that stand between the camera and Macar
        let a=1;
        if(ps && d>pd+0.6 && Math.abs(ps.x-s.x)<TW*0.62 && ps.y>s.y-WH*1.15 && ps.y<s.y+TH*0.9) a=0.34;
        if(a<1) g.globalAlpha=a;
        if(okTex){
          const vein = h2(x*3,y*7)>0.86;
          const arr = vein?TEX.wallVein:TEX.wall;
          g.drawImage(arr[(h2(x,y)*arr.length)|0], s.x-TW/2, s.y-WH-FH/2, TW, SH);
          if(SPR.wall_cave){
            g.save(); g.globalAlpha=0.42;
            g.drawImage(SPR.wall_cave, s.x-TW/2, s.y-WH-FH/2, TW, SH);
            g.restore(); g.globalAlpha=1;
          }
          if(vein) emit(s.x, s.y-WH*0.35, TW*0.30, pal.key, 0.5);
          const rk=L.wallHP[x+','+y];
          if(rk && rk.hp<rk.max) drawCracks(g,s.x,s.y,WH,1-rk.hp/rk.max);
          if(DIGT && DIGT.i===x && DIGT.j===y) drawDigMark(g,s.x,s.y,WH);
        } else { g.fillStyle=pal.wT; g.fillRect(s.x-TW/2,s.y-WH,TW,WH); }
        if(a<1) g.globalAlpha=1;
      } else {
        if(okTex){
          const arr = t===3?TEX.floorA:TEX.floor;
          g.drawImage(arr[(h2(x,y)*arr.length)|0], s.x-TW/2, s.y-FH/2, TW, FH);
        } else { g.fillStyle=pal.fA; diamondPath(g,s.x,s.y); g.fill(); }
        const fl=SPR[palFloorKey(pal)];
        if(fl){
          g.save(); diamondPath(g,s.x,s.y); g.clip();
          g.globalAlpha=0.78;
          g.drawImage(fl, s.x-TW/2, s.y-TH/2, TW, TH);
          g.restore(); g.globalAlpha=1;
        }
      }
    }
    const b=B[d]; if(b) for(const f of b) f();
  }
}
function drawCracks(g,sx,sy,WH,f){
  g.save(); g.globalAlpha=clamp(f*1.15,0,1);
  g.strokeStyle='rgba(14,9,6,0.95)'; g.lineCap='round';
  for(let k=0;k<3;k++){
    if(k/3>f) break;
    g.lineWidth=(1.4+f*2.6)*ZOOM;
    let px=sx+(h2(k,7)-0.5)*TW*0.34, py=sy-WH*(0.25+h2(k,3)*0.5);
    g.beginPath(); g.moveTo(px,py);
    for(let i=0;i<3;i++){ px+=(h2(k*5+i,9)-0.5)*TW*0.26; py+=(h2(k*3+i,4)-0.2)*WH*0.30; g.lineTo(px,py); }
    g.stroke();
  }
  if(f>0.55){ g.fillStyle='rgba(255,150,80,'+((f-0.55)*0.5)+')';
    g.beginPath(); g.ellipse(sx,sy-WH*0.5,TW*0.20,WH*0.28,0,0,TAU); g.fill(); }
  g.restore(); g.globalAlpha=1;
}
function drawDigMark(g,sx,sy,WH){
  const b=0.5+Math.sin(G.elapsed*8)*0.25;

  g.beginPath();
  g.moveTo(sx-TW*0.30,sy-WH*0.62); g.lineTo(sx-TW*0.30,sy-WH*0.80); g.lineTo(sx-TW*0.12,sy-WH*0.80);
  g.moveTo(sx+TW*0.30,sy-WH*0.62); g.lineTo(sx+TW*0.30,sy-WH*0.80); g.lineTo(sx+TW*0.12,sy-WH*0.80);
  g.stroke();
}
function drawAim(g){
  const p=player(); if(!p||!G.aim) return;
  const a=w2s(G.aim.x,G.aim.y), ps=w2s(p.x,p.y);
  const R=bombRadius();
  const b=0.55+Math.sin(G.elapsed*5)*0.2;
  // lobbed trajectory
  g.strokeStyle='rgba(255,200,120,0.4)'; g.lineWidth=2*ZOOM; g.setLineDash([6*ZOOM,7*ZOOM]);
  g.beginPath();
  for(let i=0;i<=16;i++){ const f=i/16;
    const wx=lerp(p.x,G.aim.x,f), wy=lerp(p.y,G.aim.y,f);
    const sp=w2s(wx,wy); const yy=sp.y-30*ZOOM-Math.sin(f*Math.PI)*54*ZOOM;
    i?g.lineTo(sp.x,yy):g.moveTo(sp.x,yy); }
  g.stroke(); g.setLineDash([]);
  // blast footprint
  g.save(); g.translate(a.x,a.y); g.scale(1,TH/TW);
  g.fillStyle='rgba(255,120,60,'+(0.10+b*0.06)+')';
  g.beginPath(); g.arc(0,0,R*TW/2,0,TAU); g.fill();
  g.strokeStyle='rgba(255,170,90,'+b+')'; g.lineWidth=3*ZOOM;
  g.beginPath(); g.arc(0,0,R*TW/2,0,TAU); g.stroke();
  g.strokeStyle='rgba(255,220,160,'+(b*0.6)+')'; g.lineWidth=1.6*ZOOM;
  g.beginPath(); g.arc(0,0,R*TW/2*0.55,0,TAU); g.stroke();
  g.restore();
  g.strokeStyle='rgba(255,220,160,'+b+')'; g.lineWidth=2.4*ZOOM;
  for(let i=0;i<4;i++){ const th=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(a.x+Math.cos(th)*10*ZOOM,a.y+Math.sin(th)*5*ZOOM);
    g.lineTo(a.x+Math.cos(th)*20*ZOOM,a.y+Math.sin(th)*10*ZOOM); g.stroke(); }
  emit(a.x,a.y,60*ZOOM,'#ff9a44',0.5);
}
function drawThrown(g,b){

/* ---------------------------- lighting ---------------------------- */
function gatherLights(L){
  const out=L.lights.map(l=>({x:l.x,y:l.y,c:l.c,r:l.r,f:l.f||1,fl:1}));
  const p=player();
  if(p) out.push({x:p.x,y:p.y,c:'#ffd6a0',r:6.6,f:1.05,fl:0});
  for(const e of G.ents) if(!e.dead&&e.boss&&e.glow) out.push({x:e.x,y:e.y,c:e.glow,r:7,f:1.3,fl:1});
  for(const s of G.shots) out.push({x:s.x,y:s.y,c:s.col,r:2.6,f:1.1,fl:0});
  for(const pr of G.props){
    if(pr.k==='shroom') out.push({x:pr.x,y:pr.y,c:'#b06cff',r:3.4,f:0.72,fl:1});
    if(pr.k==='rubywall'||pr.k==='rubydoor') out.push({x:pr.x,y:pr.y,c:'#ff2a3c',r:8.2,f:1.35,fl:1});
    if(pr.k==='brazier') out.push({x:pr.x,y:pr.y,c:'#ff8a3a',r:5.5,f:1.1,fl:1});
    if(pr.k==='trap'&&pr.trap==='trap_runes') out.push({x:pr.x,y:pr.y,c:'#c07bff',r:2.6,f:0.7,fl:1});
    if(pr.k==='gate') out.push({x:pr.x,y:pr.y,c:'#6fd0ff',r:4.2,f:0.8,fl:1});
  }
  return out;
}
/* scene * (ambient + sum of coloured lights) */
function applyLighting(g,L){
  const x=lmx, w=LM.width, h=LM.height;
  x.setTransform(1,0,0,1,0,0);
  x.globalCompositeOperation='source-over';
  x.fillStyle=L.pal.amb; x.fillRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  for(const li of gatherLights(L)){
    const s=w2s(li.x,li.y), cx=s.x/2, cy=(s.y-TH*.8)/2;
    const flick = li.fl? (0.90+Math.sin(G.elapsed*7.3+li.x*3.1)*0.06+Math.sin(G.elapsed*17+li.y)*0.035) : 1;
    const rad=li.r*TW*0.27*li.f*flick;
    if(cx<-rad||cy<-rad||cx>w+rad||cy>h+rad) continue;
    const c=rgbOf(li.c);
    const gr=x.createRadialGradient(cx,cy,1,cx,cy,rad);
    gr.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+',1)');
    gr.addColorStop(0.34,'rgba('+c[0]+','+c[1]+','+c[2]+',0.62)');
    gr.addColorStop(0.68,'rgba('+Math.round(c[0]*0.6)+','+Math.round(c[1]*0.5)+','+Math.round(c[2]*0.5)+',0.24)');
    gr.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';
  g.globalCompositeOperation='multiply';
  g.drawImage(LM,0,0,VW,VH);
  g.globalCompositeOperation='source-over';
}

/* cone of dust hanging under each lantern */
function drawGodRays(g){
  if(!RAYS.length) return;
  g.globalCompositeOperation='lighter';
  for(const r of RAYS){
    const gr=g.createLinearGradient(r.x,r.y-r.r*0.2,r.x,r.y+r.r*1.5);
    gr.addColorStop(0,hexA(r.c,0.16*r.i)); gr.addColorStop(1,hexA(r.c,0));
    g.fillStyle=gr;
    g.beginPath(); g.moveTo(r.x-r.r*0.18,r.y); g.lineTo(r.x+r.r*0.18,r.y);
    g.lineTo(r.x+r.r*0.95,r.y+r.r*1.5); g.lineTo(r.x-r.r*0.95,r.y+r.r*1.5); g.closePath(); g.fill();
  }
  g.globalCompositeOperation='source-over';
}

function drawBloom(g){
  if(!QUALITY||!EMIT.length) return;
  const x=blx, w=BL.width, h=BL.height;
  x.setTransform(1,0,0,1,0,0);
  x.clearRect(0,0,w,h);
  x.globalCompositeOperation='lighter';
  for(const e of EMIT){
    const cx=e.x/4, cy=e.y/4, rad=Math.max(2,e.r/4);
    if(cx<-rad||cy<-rad||cx>w+rad||cy>h+rad) continue;
    const c=rgbOf(e.c);
    const gr=x.createRadialGradient(cx,cy,0.5,cx,cy,rad);
    gr.addColorStop(0,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.95*e.i)+')');
    gr.addColorStop(0.45,'rgba('+c[0]+','+c[1]+','+c[2]+','+(0.34*e.i)+')');
    gr.addColorStop(1,'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    x.fillStyle=gr; x.beginPath(); x.arc(cx,cy,rad,0,TAU); x.fill();
  }
  x.globalCompositeOperation='source-over';
  g.save();
  g.globalCompositeOperation='lighter';
  if(CAN_BLUR){ g.filter='blur('+(3.2*Math.max(1,ZOOM))+'px)'; }
  g.globalAlpha=0.95; g.drawImage(BL,0,0,VW,VH);
  if(CAN_BLUR) g.filter='blur('+(10*Math.max(1,ZOOM))+'px)';
  g.globalAlpha=0.62; g.drawImage(BL,0,0,VW,VH);
  g.filter='none'; g.globalAlpha=1; g.globalCompositeOperation='source-over';
  g.restore();
}

function drawGrain(g){

function drawPlug(g,L){
  const s=w2s(L.plug.x,L.plug.y), z=ZOOM, dmg=1-L.plug.hp/70;

    g.beginPath(); g.moveTo(hx,hy-sz*.6); g.lineTo(hx+sz,hy); g.lineTo(hx+sz*.2,hy+sz*.7); g.lineTo(hx-sz,hy+sz*.1); g.closePath();
    const gr=g.createLinearGradient(hx-sz,hy-sz,hx+sz,hy+sz);
    gr.addColorStop(0,i%2?'#8a6f4c':'#6d5537'); gr.addColorStop(1,i%2?'#3f3020':'#2c2116');
    g.fillStyle=gr; g.fill(); g.strokeStyle=OL; g.lineWidth=1.3*z; g.stroke();
  }
  if(dmg>.2){ emit(s.x,s.y-36*z,44*z*dmg,'#ff6a3a',dmg*0.8); }

/* ---------------------------- shading helpers ---------------------------- */
function softShadow(g,x,y,rx,ry,a){
  const gr=g.createRadialGradient(x,y,1,x,y,Math.max(rx,ry));
  gr.addColorStop(0,'rgba(0,0,0,'+(a||0.5)+')');
  gr.addColorStop(0.55,'rgba(0,0,0,'+((a||0.5)*0.55)+')');
  gr.addColorStop(1,'rgba(0,0,0,0)');
  g.save(); g.translate(x,y); g.scale(1,ry/Math.max(rx,ry)); g.translate(-x,-y);
  g.fillStyle=gr; g.beginPath(); g.arc(x,y,Math.max(rx,ry),0,TAU); g.fill(); g.restore();
}
/* fill current path with vertical form-shading + ink outline (+ optional rim) */
function sc(g,base,y0,y1,lw,rim){
  const gr=g.createLinearGradient(0,y0,0,y1);
  gr.addColorStop(0,shade(base,0.26)); gr.addColorStop(0.48,base); gr.addColorStop(1,shade(base,-0.34));
  g.fillStyle=gr; g.fill();
  g.strokeStyle=OL; g.lineWidth=(lw||1.7)*ZOOM; g.stroke();
  if(rim){ g.save(); g.clip(); g.strokeStyle='rgba(255,236,198,'+(rim)+')'; g.lineWidth=2.2*ZOOM;
    g.stroke(); g.restore(); }
}
function flat(g,base,lw){ g.fillStyle=base; g.fill(); g.strokeStyle=OL; g.lineWidth=(lw||1.6)*ZOOM; g.stroke(); }
function drawFacetGem(g,x,y,w,h,on,z){
  const b=on?(.72+Math.sin(G.elapsed*2.8+x*0.01)*.28):.08;
  g.beginPath();
  g.moveTo(x, y-h);
  g.lineTo(x+w*0.62, y-h*0.42);
  g.lineTo(x+w*0.38, y+h*0.08);
  g.lineTo(x, y+h);
  g.lineTo(x-w*0.38, y+h*0.08);
  g.lineTo(x-w*0.62, y-h*0.42);
  g.closePath();
  const gr=g.createLinearGradient(x-w,y-h,x+w,y+h);
  gr.addColorStop(0,on?'#ff8a96':'#4a1a20');
  gr.addColorStop(0.35,on?'#e01828':'#3a1218');
  gr.addColorStop(0.7,on?'#8a0c18':'#2a0c12');
  gr.addColorStop(1,on?'#ff4050':'#3a1218');
  g.fillStyle=gr; g.fill();
  g.strokeStyle=on?'rgba(255,200,210,0.85)':'rgba(80,30,36,0.7)'; g.lineWidth=1.8*z; g.stroke();
  // inner facets
  g.strokeStyle=on?'rgba(255,230,235,0.35)':'rgba(255,255,255,0.06)'; g.lineWidth=1.1*z;
  g.beginPath(); g.moveTo(x,y-h); g.lineTo(x,y+h); g.moveTo(x-w*0.62,y-h*0.42); g.lineTo(x+w*0.38,y+h*0.08);
  g.moveTo(x+w*0.62,y-h*0.42); g.lineTo(x-w*0.38,y+h*0.08); g.stroke();
  if(on){
    g.fillStyle='rgba(255,210,220,'+(0.35+b*0.25)+')';
    g.beginPath(); g.moveTo(x-w*0.12,y-h*0.72); g.lineTo(x+w*0.22,y-h*0.28); g.lineTo(x-w*0.04,y-h*0.12); g.closePath(); g.fill();
    g.fillStyle='rgba(255,255,255,0.45)';
    g.beginPath(); g.ellipse(x-w*0.14,y-h*0.42,w*0.10,h*0.08, -0.5,0,TAU); g.fill();
  }
  return b;
}

function drawCarvedArch(g,z,W,H,stone){
  // stepped stone doorway: outer, mid, inner
  const tiers=[{w:W,h:H,c:stone},{w:W*0.82,h:H*0.86,c:shade(stone,-0.08)},{w:W*0.64,h:H*0.72,c:shade(stone,-0.16)}];
  for(const t of tiers){
    g.beginPath();
    g.moveTo(-t.w,-8*z); g.lineTo(-t.w,-t.h*0.62); g.quadraticCurveTo(-t.w*0.15,-t.h*1.08,0,-t.h);
    g.quadraticCurveTo(t.w*0.15,-t.h*1.08,t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath();
    sc(g,t.c,-t.h,-8*z,2.4);
    g.fillStyle='rgba(0,0,0,0.22)';
    g.beginPath(); g.moveTo(2*z,-8*z); g.lineTo(2*z,-t.h*0.9); g.lineTo(t.w,-t.h*0.62); g.lineTo(t.w,-8*z); g.closePath(); g.fill();
  }
  // block courses
  g.strokeStyle='rgba(12,8,6,0.45)'; g.lineWidth=1.5*z;
  for(let i=1;i<6;i++){
    const yy=-8*z-i*(H/7);
    g.beginPath(); g.moveTo(-W*0.92,yy); g.lineTo(W*0.92,yy); g.stroke();
  }
  // carved runes along the inner arch
  g.strokeStyle='rgba(220,190,140,0.22)'; g.lineWidth=1.3*z;
  for(let i=0;i<9;i++){
    const a=Math.PI+ i/8*Math.PI, rx=W*0.52, ry=H*0.72;
    const px=Math.cos(a)*rx, py=-H*0.28+Math.sin(a)*ry;
    g.beginPath(); g.arc(px,py,2.4*z,0,TAU); g.stroke();
  }
  // rim light on the crown of the arch
  g.strokeStyle='rgba(255,236,200,0.22)'; g.lineWidth=2.6*z;
  g.beginPath(); g.moveTo(-W,-H*0.62); g.quadraticCurveTo(0,-H*1.08,W,-H*0.62); g.stroke();
}

/* ---------------------------- props ---------------------------- */
function drawProp(g,p,pal){
  const s=w2s(p.x,p.y), z=ZOOM;
  g.save(); g.translate(s.x,s.y);

    g.beginPath(); g.ellipse(0,0,24*z,12*z,0,0,TAU); g.stroke();
  }
  if(!e.dead&&e.hero){
    g.strokeStyle='rgba(255,214,140,0.55)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,18*z,9*z,0,0,TAU); g.stroke();

  }
  // contact shadow, offset away from the key light

  const sw=e.atk>0?Math.sin((1-e.atk/e.atkMax)*Math.PI):0;
  const img=entAnimImg(e);
  const squash=img?1:(1+sw*0.06);
  g.save(); g.translate(0,-bob0); g.scale(left?-1:1,1); g.scale(1/squash,squash);
  if(!(img && drawBillboard(g,img,entSpriteH(e,z)))){
    if(e.kind==='dwarf') drawDwarf(g,e,z,sw);
    else if(e.kind==='statue') drawStatue(g,e,z,sw);
    else if(e.kind==='spider') drawSpider(g,e,z,sw);

    else if(e.kind==='undead') drawUndead(g,e,z,sw,null);
    else if(e.kind==='warden') drawWarden(g,e,z,sw);
    else if(e.kind==='king') drawKing(g,e,z,sw);
    else drawStatue(g,e,z,sw);
  }
  g.restore();

  if(e.flash>0){ g.globalCompositeOperation='lighter'; g.globalAlpha=clamp(e.flash*3,0,1);
    g.fillStyle='#ffb894'; g.beginPath(); g.ellipse(0,-27*z,19*z,29*z,0,0,TAU); g.fill();
    g.globalCompositeOperation='source-over'; g.globalAlpha=e.dead?clamp(1-(e.deadT||0)/1.3,0,1):1; }
  if(e.guard){ const b=.4+Math.sin(G.elapsed*8)*.2;
    g.strokeStyle='rgba(180,215,255,'+b+')'; g.lineWidth=2.8*ZOOM;
    g.beginPath(); g.ellipse(0,-27*z,24*z,32*z,0,0,TAU); g.stroke();
    emit(s.x,s.y-27*z,48*z,'#9fd0ff',0.5); }
  if(e.buff>0){ g.strokeStyle='rgba(255,205,110,0.6)'; g.lineWidth=2.4*ZOOM;
    g.beginPath(); g.ellipse(0,0,19*z,9*z,0,0,TAU); g.stroke(); }
  g.restore();

  if(!e.dead&&e.glow&&(e.boss||e.kind==='undead'||e.kind==='statue'||e.kind==='wraith'||e.kind==='fungi'||e.kind==='horror'||e.kind==='drake'||e.kind==='spider'||e.kind==='golem'||e.kind==='drow'||e.kind==='duergar'||e.kind==='gnome'||e.kind==='umberhulk'||e.kind==='hookedhorror'||e.kind==='beholder'))

  if(!e.dead&&e.ally&&e.hp<e.maxhp){

    ctx.fillStyle='#6ecf6a'; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
  }

  if(!e.dead&&e.team==='foe'&&(e.hp<e.maxhp||e.boss)){
    const w=(e.boss?122:38)*ZOOM,h=(e.boss?8:4.4)*ZOOM, yy=s.y-(e.boss?106:62)*ZOOM*e.scale;

    ctx.fillStyle=bg; ctx.fillRect(s.x-w/2,yy,w*clamp(e.hp/e.maxhp,0,1),h);
    ctx.strokeStyle='rgba(255,220,180,0.4)'; ctx.lineWidth=1; ctx.strokeRect(s.x-w/2,yy,w,h);

  }
}

}
function drawPart(g,q){
  const p=w2s(q.x,q.y), z=ZOOM, a=clamp(q.life/(q.max||.85),0,1);

  else g.globalAlpha=a;
  g.fillStyle=q.c;
  g.beginPath(); g.arc(sx,sy,q.s*z*(q.amb?1:a+.3),0,TAU); g.fill();
  g.globalAlpha=1; g.globalCompositeOperation='source-over';
  if(q.amb) emit(sx,sy,q.s*z*4,q.c,a*0.35);
}

   ECONOMY  -  ore, skills, gear, consumables. Persists across chapters.
   ========================================================================== */
const RESMETA={
  ironstone :{n:'Ironstone',  c:'#c2ad91', s:'I'},
  deepsilver:{n:'Deepsilver', c:'#d6e6f0', s:'D'},
  starmetal :{n:'Starmetal',  c:'#a6dcff', s:'S'},
  powder    :{n:'Blackpowder',c:'#9aa0b2', s:'P'},
  barley    :{n:'Cave Barley',c:'#d2bd63', s:'B'},
  silk      :{n:'Spider Silk',c:'#e0d2ff', s:'K'},
};
const RES=Object.keys(RESMETA);
const SKILLS=[
  {k:'weapon',n:'Weapon Smithing',who:'MACAR'},
  {k:'armour',n:'Armour Smithing',who:'ORBO'},
  {k:'bomb',  n:'Bomb Making',    who:'FENDUR'},
  {k:'ale',   n:'Ale Making',     who:'PORDOOM'},
  {k:'cloth', n:'Clothing Tailor',who:'TALPOR'},
  {k:'song',  n:'Singing',        who:'TALPOR'},
  {k:'mining',n:'Mining',         who:'MACAR'},
];
function skillLvl(k){ return clamp(1+Math.floor(Math.sqrt((G.xp[k]||0)/7)),1,10); }
function skillNext(k){ const l=skillLvl(k); return l>=10?1:clamp(((G.xp[k]||0)-7*(l-1)*(l-1))/(7*(l*l-(l-1)*(l-1))),0,1); }
function learn(k,n){ G.xp[k]=(G.xp[k]||0)+n;
  const before=G.skillSnap[k]||1, now=skillLvl(k);
  if(now>before){ G.skillSnap[k]=now;
    say(SKILLS.find(s=>s.k===k).n+' is now rank '+now+'.','#ffd27a'); } }
function gain(r,n){ G.res[r]=(G.res[r]||0)+n; }
function afford(cost){ for(const k in cost) if((G.res[k]||0)<cost[k]) return false; return true; }
function spend(cost){ for(const k in cost) G.res[k]-=cost[k]; }
function costText(cost){ const p=[]; for(const k in cost) p.push(cost[k]+' '+RESMETA[k].n); return p.length?p.join(' + '):'free'; }

function foeDrop(e){
  const table={
    rat:['ironstone',0.25], bat:['silk',0.30], spider:['silk',0.55], beetle:['ironstone',0.40],
    fungi:['barley',0.55], crawler:['silk',0.50], undead:['ironstone',0.40], statue:['ironstone',0.45],
    troll:['ironstone',0.55], construct:['ironstone',0.50], wraith:['deepsilver',0.22],
    burrower:['ironstone',0.55], champion:['starmetal',0.35], horror:['starmetal',0.40],
    drake:['starmetal',0.45], warden:['starmetal',1], king:['starmetal',1],
    golem:['starmetal',0.40], drow:['silk',0.50], duergar:['ironstone',0.50], gnome:['powder',0.45],
    umberhulk:['ironstone',0.55], hookedhorror:['silk',0.45], beholder:['starmetal',1]
  };
  const t=table[e.kind]; if(!t) return;
  if(e.boss){ gain(t[0],3); gain('ironstone',6); gain('powder',4);
    ftext(e.x,e.y-1,'+3 '+RESMETA[t[0]].n,RESMETA[t[0]].c,1); return; }
  if(Math.random()<t[1]){ const n=1+(Math.random()<0.25?1:0); gain(t[0],n);
    ftext(e.x,e.y,'+'+n+' '+RESMETA[t[0]].n,RESMETA[t[0]].c); }
  if(Math.random()<0.10){ gain('powder',1); ftext(e.x,e.y-0.4,'+1 Blackpowder',RESMETA.powder.c); }
}

function initEconomy(){
  G.res={}; RES.forEach(r=>G.res[r]=0);
  G.xp={}; G.skillSnap={}; SKILLS.forEach(s=>{G.xp[s.k]=0;G.skillSnap[s.k]=1;});
  G.gear={}; ROSTER.forEach(r=>G.gear[r.key]=newGear());
  G.bombs=2; G.ales=2; G.songBuff=0;
}
function wepMult(e){ const g=e.gear; if(!g) return 1;
  let m=1+g.wt*0.18+(g.rune?0.12:0); if(g.wd<=0) m*=0.6; return m; }
function armCut(e){ const g=e.gear; if(!g) return 0;
  let c=g.at*0.065 + (g.cd>55?0.05:0); if(g.ad<=0) c*=0.3; return clamp(c,0,0.45); }
function wear(g,w,a){ if(!g) return; if(w) g.wd=Math.max(0,g.wd-w); if(a) g.ad=Math.max(0,g.ad-a); }

/* ==========================================================================
   MINING  -  hammers and picks break rock; rock pays out
   ========================================================================== */
function isVein(i,j){ return h2(i*3,j*7)>0.86; }
function rockAt(L,i,j){
  const k=i+','+j;
  if(!L.wallHP[k]) L.wallHP[k]={hp:isVein(i,j)?48:120, max:isVein(i,j)?48:120};
  return L.wallHP[k];
}
function diggable(L,i,j){
  return i>=1 && j>=1 && i<L.w-1 && j<L.h-1 && L.grid[j] && L.grid[j][i]===1;
}
function digTarget(e){
  const L=G.lvl; if(!L) return null;
  for(const reach of [0.85,1.15]){
    const i=(e.x+e.fdx*reach)|0, j=(e.y+e.fdy*reach)|0;
    if(diggable(L,i,j)) return {i,j};
  }
  return null;
}
function oreDrop(i,j,vein){
  const got={};
  const add=(r,n)=>{ got[r]=(got[r]||0)+n; gain(r,n); };
  add('ironstone', 1+ri(0,1)+(vein?2:0));
  if(Math.random() < (vein?0.12:0.05)) add(Math.random()<0.62?'deepsilver':'starmetal',1);
  if(Math.random() < 0.10) add('powder',1);
  if(G.lvl && G.lvl.n===2 && Math.random()<0.20) add('barley',1);
  const keys=Object.keys(got);
  let off=0;
  for(const r of keys){
    ftext(i+0.5,j+0.5-off*0.35,'+'+got[r]+' '+RESMETA[r].n, RESMETA[r].c, r==='starmetal'||r==='deepsilver');
    off++;
    if(r==='starmetal'||r==='deepsilver'){ shake(9); burst(i+0.5,j+0.5,RESMETA[r].c,22,3.4);
      say('A rare seam! '+RESMETA[r].n+'.', RESMETA[r].c); }
  }
  return got;
}
function breakRock(L,i,j){
  if(!diggable(L,i,j)) return false;
  const vein=isVein(i,j);
  L.grid[j][i]=0; L.seen[j][i]=1; delete L.wallHP[i+','+j];
  burst(i+0.5,j+0.5, vein?'#d8b46a':'#9a8163', 22, 3.6);
  addDecal(i+0.5,j+0.5,rnd(1.4,0.8));
  oreDrop(i,j,vein);
  learn('mining', vein?6:3);
  shake(7);
  return true;
}
/* returns true if the swing was spent on rock */
function digSwing(e,dmg){
  const L=G.lvl; if(!L||!e.hero) return false;
  const t=digTarget(e); if(!t) return false;
  const r=rockAt(L,t.i,t.j);
  const power=dmg*(1+skillLvl('mining')*0.14);
  r.hp-=power;
  burst(t.i+0.5,t.j+0.5,'#8f7757',7,2.2);
  ftext(t.i+0.5,t.j+0.5,'-'+Math.round(power),'#d8c49a');
  wear(e.gear,0.5,0);
  if(r.hp<=0) breakRock(L,t.i,t.j);
  return true;
}

/* ==========================================================================
   BOMBS  -  select, aim, throw. 10d10 in a radius, and it opens rock.
   ========================================================================== */
function bombDamage(){ let d=0; for(let i=0;i<10;i++) d+=ri(1,10);
  return Math.round(d*(1+skillLvl('bomb')*0.10)); }
function bombRadius(){ return 2.7+skillLvl('bomb')*0.06; }
function throwBomb(){
  const p=player(); if(!p||!G.aim||G.bombs<=0) return;
  G.bombs--;
  G.thrown.push({sx:p.x,sy:p.y,tx:G.aim.x,ty:G.aim.y,x:p.x,y:p.y,t:0,dur:0.62,fuse:0.55,state:0,spin:0});
  say('MACAR lights a bomb.','#ffb45c');
  G.aim=null;
  learn('bomb',2);
}
function explode(x,y){
  const dmg=bombDamage(), R=bombRadius();
  shake(30); G.flash={c:'#ffd9a0',a:0.55};
  burst(x,y,'#ffd27a',60,7); burst(x,y,'#ff7a3a',44,5);
  for(let i=0;i<8;i++) addDecal(x+rnd(1.8,-1.8),y+rnd(1.8,-1.8),rnd(1.8,1));
  ftext(x,y-0.6,'10d10 = '+dmg,'#ffd27a',1);
  for(const e of G.ents){
    if(e.dead) continue;
    const d=dist(e,{x,y}); if(d>R+e.r) continue;
    const f=clamp(1-(d/R)*0.5,0.5,1);
    const own=e.team==='party'?0.5:1;
    damage(e, dmg*f*own, '#ffcf7a');
    const a=ang(e.x-x,e.y-y); e.kx+=Math.cos(a)*3.2; e.ky+=Math.sin(a)*3.2;
  }
  const L=G.lvl;
  if(L){ const R2=Math.ceil(R)-0.4;
    for(let j=(y-R2)|0;j<=(y+R2);j++) for(let i=(x-R2)|0;i<=(x+R2);i++){
      if(Math.hypot(i+0.5-x,j+0.5-y)>R2) continue;
      if(diggable(L,i,j)){ const r=rockAt(L,i,j); r.hp-=dmg*0.9; if(r.hp<=0) breakRock(L,i,j); } } }
}
function updateBombs(dt){
  for(const b of G.thrown){
    b.spin+=dt*9;
    if(b.state===0){
      b.t+=dt/b.dur;
      const f=clamp(b.t,0,1);
      b.x=lerp(b.sx,b.tx,f); b.y=lerp(b.sy,b.ty,f);
      b.arc=Math.sin(f*Math.PI)*2.6;
      if(b.t>=1){ b.state=1; b.arc=0; }
    } else { b.fuse-=dt;
      if(b.fuse<=0 && !b.done){ b.done=1; explode(b.x,b.y); } }
  }
  G.thrown=G.thrown.filter(b=>!b.done);
}

/* ==========================================================================
   HUD
   ========================================================================== */
function roundPath(g,x,y,w,h,r){ r=Math.min(r,w/2,h/2);
  g.beginPath(); g.moveTo(x+r,y); g.lineTo(x+w-r,y); g.quadraticCurveTo(x+w,y,x+w,y+r);
  g.lineTo(x+w,y+h-r); g.quadraticCurveTo(x+w,y+h,x+w-r,y+h); g.lineTo(x+r,y+h);
  g.quadraticCurveTo(x,y+h,x,y+h-r); g.lineTo(x,y+r); g.quadraticCurveTo(x,y,x+r,y); g.closePath(); }
function carveFrame(g,x,y,w,h,r,a){
  r=Math.min(r||7,w/2,h/2);
  g.fillStyle='rgba(8,6,5,'+(a===undefined?0.84:a)+')'; roundPath(g,x,y,w,h,r); g.fill();
  const ig=g.createLinearGradient(x,y,x,y+h);
  ig.addColorStop(0,'rgba(48,36,24,0.55)'); ig.addColorStop(1,'rgba(14,10,8,0.35)');
  g.fillStyle=ig; roundPath(g,x+3,y+3,w-6,h-6,Math.max(2,r-2)); g.fill();
  g.strokeStyle='rgba(214,176,112,0.62)'; g.lineWidth=1.8; roundPath(g,x+1,y+1,w-2,h-2,r); g.stroke();
  g.strokeStyle='rgba(0,0,0,0.55)'; g.lineWidth=1.15; roundPath(g,x+4.5,y+4.5,w-9,h-9,Math.max(1,r-3)); g.stroke();
  g.fillStyle='rgba(196,158,88,0.75)';
  const d=5.5;
  [[x+d,y+d],[x+w-d,y+d],[x+d,y+h-d],[x+w-d,y+h-d]].forEach(p=>{
    g.beginPath(); g.arc(p[0],p[1],2.05,0,TAU); g.fill();
  });
}
function plate(g,x,y,w,h,r,a){ carveFrame(g,x,y,w,h,r,a); }
function banner(g,x,y,w,h){ g.beginPath(); g.moveTo(x,y); g.lineTo(x+w,y);
  g.lineTo(x+w-h*.55,y+h); g.lineTo(x,y+h); g.closePath(); }
function face(g,cx,cy,rr,c,dead){
  const img=c&&SPR[c.key];
  g.save();
  roundPath(g,cx-rr,cy-rr,rr*2,rr*2,3); g.clip();
  g.fillStyle=dead?'#1a120c':'#2a1c14'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2);
  if(img){
    const h=rr*3.15, w=h*(img.width/Math.max(1,img.height));
    g.drawImage(img, cx-w/2, cy-rr*0.55, w, h);
  } else {
  const u=rr/20;
  g.fillStyle=c.skin; g.beginPath(); g.ellipse(cx,cy+2*u,12.4*u,13.4*u,0,0,TAU); g.fill();
  g.fillStyle=c.beard; g.beginPath(); g.moveTo(cx-11*u,cy+1*u);
  g.quadraticCurveTo(cx-14*u,cy+17*u,cx,cy+22*u); g.quadraticCurveTo(cx+14*u,cy+17*u,cx+11*u,cy+1*u); g.closePath(); g.fill();
  g.fillStyle=c.beardD; g.fillRect(cx-1.3*u,cy+2*u,2.6*u,18*u);
  g.fillStyle=c.trim;
  g.beginPath(); g.ellipse(cx-6.4*u,cy+16*u,2.4*u,1.5*u,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(cx+6.4*u,cy+16*u,2.4*u,1.5*u,0,0,TAU); g.fill();
  g.fillStyle='#1d1410'; g.beginPath(); g.arc(cx-4.6*u,cy-1.6*u,2*u,0,TAU); g.fill();
  g.beginPath(); g.arc(cx+4.6*u,cy-1.6*u,2*u,0,TAU); g.fill();
  g.fillStyle='rgba(255,255,255,0.45)';
  g.beginPath(); g.arc(cx-5.2*u,cy-2.4*u,0.7*u,0,TAU); g.fill();
  g.beginPath(); g.arc(cx+4*u,cy-2.4*u,0.7*u,0,TAU); g.fill();
  g.fillStyle=c.hair; g.fillRect(cx-12*u,cy-12*u,24*u,5.5*u);
  if(c.cap){ g.fillStyle=c.cap; g.beginPath(); g.moveTo(cx-13*u,cy-8*u);
    g.quadraticCurveTo(cx,cy-21*u,cx+13*u,cy-8*u); g.closePath(); g.fill(); }
  else { g.fillStyle=c.metal; g.beginPath(); g.arc(cx,cy-8*u,12.4*u,Math.PI,0); g.fill();
    g.fillStyle=c.trim; g.fillRect(cx-2.1*u,cy-19*u,4.2*u,12*u);
    g.fillStyle='rgba(255,246,220,0.28)'; g.fillRect(cx-10*u,cy-14*u,6*u,3*u); }
  }
  if(dead){ g.fillStyle='rgba(0,0,0,0.65)'; g.fillRect(cx-rr,cy-rr,rr*2,rr*2); }
  g.restore();
  g.strokeStyle='rgba(40,28,16,0.9)'; g.lineWidth=1.6;
  roundPath(g,cx-rr,cy-rr,rr*2,rr*2,3); g.stroke();
}

function drawHUD(g){
  const s=UIS;
  drawPortraitStack(g,s);
  drawMinimap(g,s);
  drawObjectives(g,s);
  if(!PORT) drawLog(g,s);
  drawGuideArrow(g,s);
  drawOre(g,s);
  drawOrb(g,s);
  drawStickBase(g,s);
  drawButtons(g,s);
  drawPromptBtn(g,s);
  drawThrowBtn(g,s);
  drawHint(g,s);
}

function drawPortraitStack(g,s){
  const party=ROSTER.map(r=>G.ents.find(e=>e.team==='party'&&e.col&&e.col.key===r.key)).filter(Boolean);
  const x=8*s, y=8*s, w=PORT?152*s:188*s, gap=3*s;
  const avail=Math.max(160, VH-(PORT?130*s:110*s));
  const h=Math.min(PORT?42*s:46*s, (avail-y)/Math.max(1,party.length)-gap);
  party.forEach((e,i)=>{
    const yy=y+i*(h+gap);
    carveFrame(g,x,yy,w,h,6,.88);
    if(e.hero){ g.strokeStyle='rgba(255,210,130,0.7)'; g.lineWidth=1.6; roundPath(g,x+1,yy+1,w-2,h-2,6); g.stroke(); }
    const rr=PORT?15*s:17*s, cx=x+rr+8*s, cy=yy+h/2;
    face(g,cx,cy,rr,e.col,e.dead);
    const tx=cx+rr+8*s;
    g.font='800 '+(PORT?11*s:12.5*s)+'px '+FONT_UI;
    g.fillStyle=e.dead?'#6b5b48':'#f2e0b6';
    g.fillText(e.col.name, tx, yy+16*s);
    g.font='700 '+(PORT?8*s:8.5*s)+'px '+FONT_UI;
    g.fillStyle='rgba(200,170,120,0.78)';
    g.fillText('INIT '+e.col.init+(e.hero?'  ·  YOU':''), tx, yy+27*s);
    const bx=tx, by=yy+h-14*s, bw=w-(tx-x)-12*s, bh=7*s, f=clamp(e.hp/e.maxhp,0,1);
    g.fillStyle='rgba(0,0,0,0.72)'; g.fillRect(bx,by,bw,bh);
    const gr=g.createLinearGradient(bx,by,bx,by+bh);
    gr.addColorStop(0,e.dead?'#4a4a4a':(f<.3?'#e0644a':'#7ad45a'));
    gr.addColorStop(1,e.dead?'#2a2a2a':(f<.3?'#8a1f14':'#2f7a28'));
    g.fillStyle=gr; g.fillRect(bx,by,bw*f,bh);
    g.strokeStyle='rgba(220,190,130,0.4)'; g.lineWidth=1; g.strokeRect(bx,by,bw,bh);
  });
}

function drawMinimap(g,s){
  const L=G.lvl; if(!L) return;
  const sz=PORT?88*s:118*s, x=VW-sz-10*s, y=8*s;
  carveFrame(g,x,y,sz,sz,6,.88);
  const p=player(); if(!p) return;
  const pad=7*s, inner=sz-pad*2, cell=inner/28, ox=x+sz/2-p.x*cell, oy=y+sz/2-p.y*cell;
  g.save(); g.beginPath(); g.rect(x+pad,y+pad,inner,inner); g.clip();
  g.fillStyle='rgba(6,5,8,0.92)'; g.fillRect(x+pad,y+pad,inner,inner);
  for(let j=Math.max(0,(p.y-16)|0);j<Math.min(L.h,p.y+16);j++)
    for(let i=Math.max(0,(p.x-16)|0);i<Math.min(L.w,p.x+16);i++){
      if(!L.seen[j][i]) continue; const t=L.grid[j][i]; if(t===1||t===2) continue;
      g.fillStyle=t===3?'rgba(200,168,104,0.7)':'rgba(110,98,82,0.55)';
      g.fillRect(ox+i*cell,oy+j*cell,cell+.7,cell+.7); }
  const MAPC={macar:'#ffe08a',pordoom:'#ff8a4a',fendur:'#8ec8ff',orbo:'#d4b06a',talpor:'#d0d4e8'};
  g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='center';
  for(const e of G.ents){ if(e.dead) continue;
    const mx=ox+e.x*cell, my=oy+e.y*cell;
    if(e.team==='foe'){
      g.fillStyle=e.boss?'#ff3a3a':'#e04840';
      g.fillText('E', mx, my+3.2*s);
    } else {
      g.fillStyle=MAPC[e.col&&e.col.key]||'#fff2cf';
      g.fillText((e.col&&e.col.name||'M')[0], mx, my+3.2*s);
    } }
  const gd=L.guide&&L.guide();
  if(gd){ g.fillStyle='#ffd24a'; g.beginPath();
    g.moveTo(ox+gd.x*cell,oy+gd.y*cell-4); g.lineTo(ox+gd.x*cell+3.4,oy+gd.y*cell+2);
    g.lineTo(ox+gd.x*cell-3.4,oy+gd.y*cell+2); g.closePath(); g.fill(); }
  g.textAlign='left';
  g.restore();
}

function drawObjectives(g,s){
  const L=G.lvl; if(!L) return;
  const w=PORT?150*s:216*s, x=VW-w-10*s, y=(PORT?108*s:136*s);
  const row=PORT?18*s:20*s;
  const h=22*s + L.objs.length*row + 8*s;
  carveFrame(g,x,y,w,h,6,.82);
  // diamond title mark
  g.fillStyle='#e8c36a';
  g.beginPath(); g.moveTo(x+16*s,y+16*s); g.lineTo(x+22*s,y+10*s); g.lineTo(x+28*s,y+16*s); g.lineTo(x+22*s,y+22*s); g.closePath(); g.fill();
  g.font='800 '+(PORT?9.5*s:11*s)+'px '+FONT_TITLE;
  g.fillStyle='#f0dcb0'; g.fillText('OBJECTIVES', x+34*s, y+20*s);
  g.font='700 '+(PORT?10*s:11.5*s)+'px '+FONT_UI;
  L.objs.forEach((o,i)=>{
    const yy=y+38*s+i*row;
    const active = !o.d && L.objs.slice(0,i).every(z=>z.d);
    g.fillStyle=o.d?'rgba(140,180,120,0.7)':(active?'#f4e2b8':'rgba(210,193,158,0.7)');
    g.fillText(o.t, x+14*s, yy);
    if(o.d){ const m=g.measureText(o.t).width; g.strokeStyle='rgba(140,180,120,0.55)'; g.lineWidth=1.4;
      g.beginPath(); g.moveTo(x+14*s,yy-4*s); g.lineTo(x+14*s+m,yy-4*s); g.stroke(); }
  });
  UI.questBottom = y+h;
}

function drawLog(g,s){
  const w=236*s,h=108*s,x=VW-w-10*s,y=VH-h-(PORT?96*s:94*s);
  carveFrame(g,x,y,w,h,6,.8);
  g.font='800 '+(10*s)+'px '+FONT_TITLE; g.fillStyle='rgba(232,217,184,0.9)';
  g.fillText('COMBAT LOG',x+12*s,y+16*s);
  g.strokeStyle='rgba(190,150,90,0.3)'; g.lineWidth=1;
  g.beginPath(); g.moveTo(x+10*s,y+22*s); g.lineTo(x+w-10*s,y+22*s); g.stroke();
  g.font='600 '+(10*s)+'px '+FONT_UI;
  const lines=[];
  for(const l of G.log){
    const tag=l.k==='combat'?'[COMBAT] ':'[LOG] ';
    const words=(tag+l.t).split(' '); let cur='';
    for(const wd of words){ const t=cur?cur+' '+wd:wd;
      if(g.measureText(t).width>w-22*s){ lines.push({t:cur,c:l.c,a:l.a,k:l.k}); cur=wd; } else cur=t; }
    if(cur) lines.push({t:cur,c:l.c,a:l.a,k:l.k}); }
  lines.slice(-6).forEach((l,i)=>{
    g.globalAlpha=l.a;
    const combat=l.t.indexOf('[COMBAT]')===0 || l.k==='combat';
    g.fillStyle=combat?'#ff6a5a':(l.t.indexOf('[LOG]')===0?'#ffb45c':l.c);

  });

}

// on-screen compass to the next objective - the single biggest nav win
function drawGuideArrow(g,s){
  const L=G.lvl,p=player(); if(!L||!p||!L.guide) return;
  const gd=L.guide(); if(!gd) return;
  if(dist(p,gd)<3.2) return;
  const ps=w2s(p.x,p.y), ts=w2s(gd.x,gd.y);
  const a=Math.atan2(ts.y-ps.y,ts.x-ps.x);
  const rad=(PORT?64:78)*s;
  const cx=ps.x+Math.cos(a)*rad, cy=ps.y-46*ZOOM+Math.sin(a)*rad*.85;
  const pulse=.55+Math.sin(G.elapsed*3.4)*.25;
  g.save(); g.translate(cx,cy); g.rotate(a);
  g.fillStyle='rgba(255,206,110,'+pulse+')';
  g.beginPath(); g.moveTo(15*s,0); g.lineTo(-7*s,-9*s); g.lineTo(-3*s,0); g.lineTo(-7*s,9*s); g.closePath(); g.fill();
  g.strokeStyle='rgba(60,36,10,0.7)'; g.lineWidth=1.4; g.stroke();
  g.restore();
}

function drawOrb(g,s){
  const p=player(); if(!p) return;
  const r=UI.orb.r, cx=UI.orb.x, cy=UI.orb.y;
  const f=clamp(p.hp/p.maxhp,0,1);
  // metal bezel
  g.beginPath(); g.arc(cx,cy,r+5*s,0,TAU);
  const bezel=g.createLinearGradient(cx-r,cy-r,cx+r,cy+r);
  bezel.addColorStop(0,'#c4a060'); bezel.addColorStop(0.45,'#5a4024'); bezel.addColorStop(1,'#d4b070');
  g.fillStyle=bezel; g.fill();
  g.strokeStyle='rgba(20,12,6,0.9)'; g.lineWidth=2*s; g.stroke();
  g.save(); g.beginPath(); g.arc(cx,cy,r,0,TAU); g.clip();
  g.fillStyle='#2a0d0c'; g.fillRect(cx-r,cy-r,r*2,r*2);
  const lv=cy+r-f*r*2;
  const gr=g.createLinearGradient(0,lv,0,cy+r);
  gr.addColorStop(0,'#ff6a52'); gr.addColorStop(0.55,'#c01818'); gr.addColorStop(1,'#6a080c');
  g.fillStyle=gr; g.fillRect(cx-r,lv,r*2,r*2);
  g.fillStyle='rgba(255,160,130,0.38)'; g.beginPath(); g.moveTo(cx-r,lv);
  for(let i=0;i<=10;i++) g.lineTo(cx-r+i*(r*2/10), lv+Math.sin(G.elapsed*3+i*.7)*3*s);
  g.lineTo(cx+r,lv+9*s); g.lineTo(cx-r,lv+9*s); g.closePath(); g.fill();
  const sg=g.createRadialGradient(cx-r*.35,cy-r*.42,1,cx,cy,r);
  sg.addColorStop(0,'rgba(255,255,255,0.34)'); sg.addColorStop(.5,'rgba(255,255,255,0)');
  sg.addColorStop(1,'rgba(0,0,0,0.55)'); g.fillStyle=sg; g.fillRect(cx-r,cy-r,r*2,r*2);
  g.restore();
  g.strokeStyle='rgba(255,220,160,0.45)'; g.lineWidth=1.4*s; g.beginPath(); g.arc(cx,cy,r-1.2*s,0,TAU); g.stroke();
  g.textAlign='center';
  g.font='800 '+(r*.42)+'px '+FONT_UI; g.fillStyle='#fff2de';
  g.fillText(Math.max(0,Math.ceil(p.hp)),cx,cy+r*.06);
  g.font='700 '+(r*.22)+'px '+FONT_UI; g.fillStyle='rgba(255,228,196,0.8)';
  g.fillText('HP',cx,cy+r*.38); g.textAlign='left';
}

function drawStickBase(g,s){
  const home=UI.stickHome;
  const k=IN.stick;
  const ox=(k&&k.moved)?k.ox:home.x, oy=(k&&k.moved)?k.oy:home.y, R=home.r;
  const active=!!(k&&k.moved);
  g.globalAlpha=active?1:.42;
  g.fillStyle='rgba(16,11,7,0.45)'; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.fill();
  g.strokeStyle='rgba(214,180,120,0.55)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox,oy,R,0,TAU); g.stroke();
  // 4 iso direction ticks
  g.strokeStyle='rgba(214,180,120,0.30)'; g.lineWidth=2*s;
  for(let i=0;i<4;i++){ const a=i*TAU/4+Math.PI/4;
    g.beginPath(); g.moveTo(ox+Math.cos(a)*R*.6,oy+Math.sin(a)*R*.6);
    g.lineTo(ox+Math.cos(a)*R*.85,oy+Math.sin(a)*R*.85); g.stroke(); }
  let dx=0,dy=0;
  if(active){ dx=k.x-k.ox; dy=k.y-k.oy; const m=Math.hypot(dx,dy);
    if(m>R*.72){ dx=dx/m*R*.72; dy=dy/m*R*.72; } }
  g.fillStyle='rgba(236,214,168,0.62)'; g.beginPath(); g.arc(ox+dx,oy+dy,R*.42,0,TAU); g.fill();
  g.strokeStyle='rgba(255,236,192,0.85)'; g.lineWidth=2.2*s; g.beginPath(); g.arc(ox+dx,oy+dy,R*.42,0,TAU); g.stroke();
  g.globalAlpha=1;
}

function icon(g,kind,x,y,s,col){
  g.save(); g.translate(x,y); g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle=col; g.fillStyle=col; g.lineWidth=2.3*s;
  if(kind==='hammer'){ g.beginPath(); g.moveTo(-8*s,9*s); g.lineTo(3*s,-3*s); g.stroke();
    g.fillRect(0,-12*s,12*s,10*s); }
  if(kind==='flask'){ g.beginPath(); g.moveTo(-3*s,-10*s); g.lineTo(-3*s,-3*s); g.lineTo(-7*s,7*s);
    g.quadraticCurveTo(-7*s,11*s,-3*s,11*s); g.lineTo(3*s,11*s); g.quadraticCurveTo(7*s,11*s,7*s,7*s);
    g.lineTo(3*s,-3*s); g.lineTo(3*s,-10*s); g.closePath(); g.stroke(); g.fillRect(-5*s,2*s,10*s,7*s); }
  if(kind==='shield'){ g.beginPath(); g.moveTo(0,-11*s); g.lineTo(9*s,-7*s); g.lineTo(9*s,3*s);
    g.quadraticCurveTo(9*s,10*s,0,12*s); g.quadraticCurveTo(-9*s,10*s,-9*s,3*s); g.lineTo(-9*s,-7*s); g.closePath(); g.stroke(); }
  if(kind==='pick'){ g.beginPath(); g.moveTo(-9*s,10*s); g.lineTo(6*s,-5*s); g.stroke();
    g.beginPath(); g.moveTo(-3*s,-10*s); g.quadraticCurveTo(5*s,-12*s,11*s,-2*s); g.stroke(); }
  if(kind==='horn'){ g.beginPath(); g.moveTo(-10*s,7*s); g.quadraticCurveTo(2*s,9*s,10*s,-7*s);
    g.quadraticCurveTo(2*s,-1*s,-10*s,2*s); g.closePath(); g.stroke(); }
  if(kind==='sword'){ g.beginPath(); g.moveTo(-7*s,11*s); g.lineTo(8*s,-10*s); g.stroke();
    g.beginPath(); g.moveTo(-3*s,3*s); g.lineTo(4*s,9*s); g.stroke();
    g.beginPath(); g.moveTo(6*s,-12*s); g.lineTo(11*s,-7*s); g.lineTo(4*s,-6*s); g.closePath(); g.fill(); }
  if(kind==='bomb'){ g.beginPath(); g.arc(-1*s,3*s,8*s,0,TAU); g.stroke();
    g.beginPath(); g.moveTo(3*s,-3*s); g.lineTo(6*s,-8*s); g.stroke();
    g.beginPath(); g.arc(7.6*s,-9.6*s,2*s,0,TAU); g.fill(); }
  if(kind==='pack'){ g.beginPath(); g.moveTo(-9*s,-2*s); g.lineTo(-9*s,10*s); g.lineTo(9*s,10*s); g.lineTo(9*s,-2*s);
    g.quadraticCurveTo(9*s,-10*s,0,-11*s); g.quadraticCurveTo(-9*s,-10*s,-9*s,-2*s); g.closePath(); g.stroke();
    g.beginPath(); g.moveTo(0,-11*s); g.lineTo(0,10*s); g.stroke(); }
  if(kind==='cross'){ g.beginPath(); g.arc(0,0,11*s,0,TAU); g.stroke();
    g.fillRect(-2.2*s,-8*s,4.4*s,16*s); g.fillRect(-8*s,-2.2*s,16*s,4.4*s); }
  g.restore();
}

function drawSlot(g,b,s){
  const R=b.r, x=b.x-R, y=b.y-R, w=R*2, h=R*2;
  const ab=ABIL.find(a=>a.key===b.key);
  const cd=ab?cds[ab.key]/ab.cd:0, ready=cd<=0;
  const ico=b.ico||(b.key==='attack'?'sword':(ab&&ab.ico));
  carveFrame(g,x,y,w,h,5,.92);
  if(b.hold){ g.strokeStyle='rgba(255,220,150,0.95)'; g.lineWidth=2.2*s; roundPath(g,x+1,y+1,w-2,h-2,5); g.stroke(); }
  const col=ready?(b.key==='rally'?'#ff8a7a':'#e9d5a6'):'rgba(160,140,110,0.42)';
  icon(g, ico, b.x, b.y-(b.num?2*s:0), b.small?0.78*s:1.05*s, col);
  if(b.num){
    g.font='800 '+(9*s)+'px '+FONT_UI; g.textAlign='left';
    g.fillStyle='rgba(232,212,172,0.85)'; g.fillText(String(b.num), x+5*s, y+12*s);
  }
  if(!ready && ab){
    g.fillStyle='rgba(6,4,2,0.66)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill();
    g.font='800 '+(12*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle='rgba(244,226,186,0.92)'; g.fillText(Math.ceil(cds[ab.key]),b.x,b.y+4*s); g.textAlign='left';
  }
  if(ab&&(ab.key==='bomb'||ab.key==='ale')){
    const n=ab.key==='bomb'?G.bombs:G.ales;
    if(!n){ g.fillStyle='rgba(8,5,3,0.5)'; roundPath(g,x+3,y+3,w-6,h-6,3); g.fill(); }
    const px=b.x+R*0.72, py=b.y-R*0.72;
    g.fillStyle=n?'rgba(20,14,8,0.92)':'rgba(50,14,8,0.92)';
    g.beginPath(); g.arc(px,py,8.4*s,0,TAU); g.fill();
    g.strokeStyle=n?'rgba(214,176,104,0.85)':'rgba(190,80,60,0.8)'; g.lineWidth=1.4*s; g.stroke();
    g.font='800 '+(9.5*s)+'px '+FONT_UI; g.textAlign='center';
    g.fillStyle=n?'#f2dfb6':'#ff9a86'; g.fillText(String(n),px,py+3.4*s); g.textAlign='left';
  }
  if(ab&&ab.key==='bomb'&&G.aim){
    g.strokeStyle='rgba(255,170,90,'+(0.6+Math.sin(G.elapsed*6)*0.3)+')'; g.lineWidth=2.4*s;
    roundPath(g,x-3*s,y-3*s,w+6*s,h+6*s,6); g.stroke(); }
}

function drawTitleCavern(g){
  const cx=VW/2, cy=VH*0.46, z=Math.min(VW,VH)/780;
  // cracked floor
  g.save(); g.translate(cx, cy+40*z);
  for(let i=-6;i<=6;i++) for(let j=-4;j<=5;j++){
    const x=(i-j)*36*z, y=(i+j)*18*z;
    g.strokeStyle='rgba(90,70,50,0.28)'; g.lineWidth=1.4;
    g.beginPath(); g.moveTo(x,y-18*z); g.lineTo(x+36*z,y); g.lineTo(x,y+18*z); g.lineTo(x-36*z,y); g.closePath(); g.stroke();
  }
  g.restore();

  if(SPR.rubydoor){
    drawBillboard(g, SPR.rubydoor, 240*z);
    const pulse=.7+Math.sin(G.t*2.4)*.3;

    g.fillStyle=glow; g.beginPath(); g.arc(0,-88*z,120*z,0,TAU); g.fill();
  } else {
  g.beginPath(); g.moveTo(-90*z,80*z); g.lineTo(-90*z,-70*z); g.quadraticCurveTo(0,-150*z,90*z,-70*z); g.lineTo(90*z,80*z); g.closePath();
  const st=g.createLinearGradient(-90*z,-140*z,90*z,80*z);
  st.addColorStop(0,'#4a3c30'); st.addColorStop(1,'#1c1612');
  g.fillStyle=st; g.fill(); g.strokeStyle='rgba(210,170,110,0.35)'; g.lineWidth=3*z; g.stroke();
  g.beginPath(); g.moveTo(-54*z,70*z); g.lineTo(-54*z,-50*z); g.quadraticCurveTo(0,-110*z,54*z,-50*z); g.lineTo(54*z,70*z); g.closePath();
  g.fillStyle='#120e0c'; g.fill();
  // ruby
  const pulse=.7+Math.sin(G.t*2.4)*.3;
  g.beginPath(); g.moveTo(0,-48*z); g.lineTo(22*z,-18*z); g.lineTo(0,14*z); g.lineTo(-22*z,-18*z); g.closePath();
  const rg=g.createLinearGradient(-22*z,-48*z,22*z,14*z);
  rg.addColorStop(0,'#ff8a96'); rg.addColorStop(0.45,'#e01828'); rg.addColorStop(1,'#6a0810');

  g.fillStyle='rgba(255,220,230,0.45)'; g.beginPath(); g.moveTo(-6*z,-38*z); g.lineTo(8*z,-20*z); g.lineTo(-2*z,-14*z); g.closePath(); g.fill();
  const glow=g.createRadialGradient(0,-18*z,4,0,-18*z,90*z);
  glow.addColorStop(0,'rgba(255,40,50,'+(0.28*pulse)+')'); glow.addColorStop(1,'rgba(255,40,50,0)');
  g.fillStyle=glow; g.beginPath(); g.arc(0,-18*z,90*z,0,TAU); g.fill();
  }
  g.restore();
  // mushrooms
  function mush(mx,my,sc){
